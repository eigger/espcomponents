name: lvgl_fx Config Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'components/lvgl_fx/**'
      - 'tests/native/lvgl_fx_config/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'components/lvgl_fx/**'
      - 'tests/native/lvgl_fx_config/**'
  workflow_dispatch:

jobs:
  lvgl-fx-config-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install ESPHome
        run: pip install esphome

      - name: Run config validation tests
        run: python tests/native/lvgl_fx_config/test_invalid_configs.py
