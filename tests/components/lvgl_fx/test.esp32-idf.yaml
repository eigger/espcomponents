          static const fx::PropTransition dec_zero = {.duration = 0, .style = fx::Style::DECODE};
          static const fx::PropTransition pace = {.char_time = 12};   // style from the defaults
          static const fx::TransitionDef t_type_a = {{nullptr, nullptr, nullptr, &type_a, nullptr, nullptr, nullptr},
                                                     nullptr};
          static const fx::TransitionDef t_type_b = {{nullptr, nullptr, nullptr, &type_b, nullptr, nullptr, nullptr},
