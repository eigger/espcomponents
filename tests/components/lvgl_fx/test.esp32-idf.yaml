# Compile test for lvgl_fx: the full YAML schema (transitions, presets, effects, effect_defaults), every YAML action,
# and the C++ API from lambdas (P1-P3: every function, every transition style, the const-table format).
# No real hardware needed: an SPI ILI9341 with dummy pins gives LVGL a display to build widgets on.
# Rejected configurations are tested by tests/native/lvgl_fx_config/test_invalid_configs.py, not compiled here.
esphome:
  name: test-lvgl-fx
  on_boot:
    - priority: -100
      then:
        # Policy row 2: nothing animates before this.
        - lvgl_fx.start:

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../../components
    components: [ lvgl_fx ]

logger:

script:
  - id: started_script
    then:
      - logger.log: "an effect started"

globals:
  - id: popup_open
    type: bool
    initial_value: "false"

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

display:
  - platform: mipi_spi
    id: main_display
    model: ILI9341
    cs_pin: GPIO15
    dc_pin: GPIO27
    reset_pin: GPIO33
    invert_colors: false
    update_interval: never

image:
  - platform: file
    file: test.png
    id: test_image
    type: RGB565
    resize: 16x16

color:
  - id: fx_red
    red: 100%
    green: 0%
    blue: 0%

lvgl_fx:
  id: fx_main
  motion:
    fast: 100ms
    normal: 180ms
    slow: 400ms
    intensity: 0.8
  max_targets: 8
  slots_in_psram: true
  max_text_runs: 6
  max_text_length: 160
  max_line_runs: 3
  max_line_points: 12
  suppress_when: !lambda return id(popup_open);

  transitions:
    # Per-property defaults: every field of every property, or only some.
    defaults:
      visible: { style: fade, duration: normal, curve: ease_out, delay: 0ms }
      opacity: { duration: normal, curve: linear }
      value: { duration: 250ms, curve: ease_in_out }
      text: { style: fade, duration: fast, from: 85%, format: "%.0f" }
      color: { duration: normal }
      position: { duration: normal, curve: ease_out }
      rotation:
      draw: { duration: 250ms, curve: ease_in_out, delay: 0ms }
    custom:
      - id: gauge_slow
        policy: always
        value: { duration: slow }
      # `then`: an effect of this file, played when the transition is done
      - id: prnd_move
        position: { duration: 160ms }
        then: prnd_confirm
      # a built-in effect works as `then` too; the transition may be about every property at once
      - id: everything
        visible: { style: zoom, from: 80%, duration: 300ms, delay: 20ms, curve: ease_in }
        opacity: { duration: 0ms }
        value: { duration: 1s, curve: linear }
        text: { style: roll, distance: 14, from: 70%, duration: 140ms }
        color: { duration: slow, curve: ease_in_out }
        position: { duration: fast }
        rotation: { duration: 500ms, curve: ease_out }
        then: pulse
      # visible: separate show and hide styles
      - id: card
        visible: { show: slide_up, hide: fade, distance: 12 }
      - id: card_left
        visible: { show: slide_left, hide: slide_right, distance: 30 }
      - id: card_down
        visible: { style: slide_down }
      - id: card_right
        visible: { style: slide_right }
      - id: card_none
        visible: { show: none, hide: zoom, from: 60% }
      - id: hide_only
        visible: { hide: slide_down }
      - id: gear_roll
        text: { style: roll, distance: 14, duration: 140ms }
      - id: counter
        text: { style: count, format: "%.1f%%", duration: 600ms, curve: ease_in_out }
      - id: text_plain
        text: { style: none, format: "%5.2f" }
      # typewriter / decode: `duration` times the whole text, `char_time` makes it follow the text length
      - id: type_plain
        text: { style: typewriter, duration: 400ms, curve: ease_out, delay: 20ms }
      - id: type_chars
        text: { style: typewriter, char_time: 20ms, jitter: true }
      - id: type_even
        text: { style: typewriter, char_time: 1ms, jitter: false }
      - id: decode_plain
        text: { style: decode, duration: fast }
      - id: decode_full
        text: { style: decode, char_time: 40ms, noise: "#%&*+<>/=0123456789", noise_period: 50ms, curve: ease_in_out }
      - id: decode_small
        text: { style: decode, char_time: 5s, noise: "01", noise_period: 1s, delay: 100ms, format: "%.1f" }
      # only the pace: the style comes from the defaults (a named entry overrides the defaults per field)
      - id: pace_only
        text: { char_time: 15ms, jitter: true, noise: "x.", noise_period: 10ms }
      - id: type_then
        text: { style: typewriter, char_time: 10ms }
        then: pulse
        on_start:
          - logger.log: { format: "typing on %p", args: [ x ] }
      - id: text_flags
        text: { format: "[%-+8.3f] %%" }
      # an id equal to the name of the generated defaults tables must not clash with them
      - id: defaults
        visible: { style: fade }
        text: { style: roll }
      # on_start: once per set call that animates (`x` is the target lv_obj_t *)
      - id: announce_set
        visible: { show: slide_up, hide: fade }
        text: { style: roll }
        on_start:
          - logger.log:
              format: "transition started on %p"
              args: [ x ]
          - lambda: |-
              fx::play(x, fx::PULSE);

      # line draw: a named transition per direction (the draw timing is one entry, the direction picks the transition)
      - id: trace_in
        draw: { duration: 200ms, curve: linear }
      - id: trace_out
        draw: { duration: 120ms, curve: linear, delay: 10ms }
        then: line_hide             # the old workaround: still valid, but an effect `then` is dropped by effect policy
      - id: trace_slow
        policy: always
        draw: { duration: slow, curve: ease_out }
        on_start:
          - logger.log: { format: "line draw started on %p", args: [ x ] }
      - id: trace_instant
        draw: { duration: 0ms }
      # on_end: exactly when `then` would play, also when the change is applied at once (`x` is the target lv_obj_t *)
      - id: trace_erase
        draw: { duration: 120ms, curve: linear }
        on_end:
          - lambda: lv_obj_set_hidden(x, true);
      - id: ended_set
        visible: { show: fade, hide: fade }
        text: { style: fade }
        then: ended_chained
        on_end:
          - logger.log: { format: "transition ended on %p", args: [ x ] }
          - lambda: |-
              fx::set_text(x, "re-entrant", {.instant = true});
          - script.execute: started_script

    bindings:
      - { id: fx_bar, value: gauge_slow }
      - { id: fx_line, draw: trace_in }
      - { id: fx_label, text: gear_roll }
      - { id: fx_obj, position: prnd_move, visible: card }

  # Built-in effects, magnitudes only
  presets:
    pulse: { scale: 112%, duration: slow, curve: ease_out }
    shake: { distance: 3, cycles: 3, axis: x, duration: 150ms }
    nudge_up: { distance: 6 }
    nudge_down: { distance: 5, duration: fast }
    nudge_left: { distance: 7, curve: ease_in }
    nudge_right: { distance: 3 }
    flash: { property: bg_color, color: white, amount: 80%, duration: normal }
    glow: { opacity: 60% }
    blink: { opacity: 25%, duration: 0.3s }

  effect_defaults:
    retrigger: restart
    when_suppressed: skip
    policy: normal
    repeat: 1
    repeat_delay: 50ms
    cooldown: 100ms
    cooldown_scope: effect
    defer_timeout: 2s

  effects:
    # the second half of "erase, then hide": a 1 ms effect whose hook does the hiding on the line it is played on
    - id: line_hide
      on_start:
        - lambda: |-
            fx::set_visible(x, false, {.instant = true});
      tracks:
        - blink: { duration: 1ms }
    - id: image_pulse_test
      tracks:
        - image_pulse: { amount: 30%, duration: 220ms, curve: ease_out }
        - flash: { property: image_recolor, profile: triangle, amount: 29%, duration: 220ms }
    - id: prnd_confirm
      tracks:
        - flash: { property: bg_color, color: white, duration: 340ms, curve: ease_in }
    # every track, every option
    - id: heat_up
      cooldown: 2500ms
      retrigger: ignore
      when_suppressed: defer
      defer_timeout: 1500ms
      policy: normal
      repeat: 3
      repeat_delay: 100ms
      then: prnd_confirm
      tracks:
        - nudge: { y: -2, duration: 220ms }
        - nudge: { x: 3, y: 1, delay: 20ms, curve: linear }
        - flash: { property: image_recolor, color: 0xFF8800, amount: 25%, duration: normal, delay: 60ms }
        - flash: { property: text_color, color: fx_red, curve: ease_in }
        - flash:
        - pulse: { scale: 105%, delay: 20ms, curve: ease_out }
        - shake: { distance: 3, cycles: 3, axis: y, duration: fast }
        - shake: { duration: slow }
        - glow: { opacity: 80%, duration: slow }
        - blink: { opacity: 40%, curve: ease_in_out, duration: 1.5s }
    # a loop: on until stopped
    - id: warning_blink
      repeat: infinite
      repeat_delay: 400ms
      policy: always
      tracks:
        - blink: { opacity: 35%, duration: slow }
    - id: loop_with_defaults
      repeat: infinite
      tracks:
        - glow:
    # then chains: built-in effect, effect declared later, effect declared earlier
    - id: chain_first
      then: chain_second
      tracks:
        - pulse: { scale: 120% }
    - id: chain_second
      then: pulse
      repeat: 2
      tracks:
        - nudge: { x: -4 }
    - id: chain_third
      then: chain_first
      tracks:
        - flash: { amount: 50% }
    - id: delayed
      tracks:
        - blink: { delay: 60s, duration: 5s }
    # on_start: once per play (not per repeat), the target is `x`; also fires for an effect played through `then`
    - id: started_hook
      repeat: 2
      cooldown: 300ms
      cooldown_scope: widget
      then: started_chained
      on_start:
        - logger.log:
            format: "effect started on %p"
            args: [ x ]
        - lambda: |-
            ESP_LOGD("test", "play result %d", static_cast<int>(fx::play(x, fx::BLINK)));
      tracks:
        - pulse: { scale: 106% }
    # a `then` chain under a widget-scope cooldown: the follow-up is not rate-limited by its predecessor
    - id: chain_widget_cd
      cooldown: 2s
      cooldown_scope: widget
      then: chain_widget_cd_next
      tracks:
        - pulse:
    - id: chain_widget_cd_next
      cooldown: 2s
      cooldown_scope: widget
      tracks:
        - blink:
    # on_end: when a one-shot has ended after all its repeats, just before its `then`; `x` is the target
    - id: ended_hook
      repeat: 2
      then: started_chained
      on_end:
        - logger.log:
            format: "effect ended on %p"
            args: [ x ]
        - lambda: |-
            fx::play(x, fx::BLINK);  // re-entrant: the runner is consistent when the hook runs
      tracks:
        - pulse: { scale: 106% }
    - id: ended_chained
      on_end:
        - script.execute: started_script
      tracks:
        - blink:
    - id: started_chained
      cooldown_scope: effect
      on_start:
        - script.execute: started_script
      tracks:
        - blink:

lvgl:
  displays: [ main_display ]
  pages:
    - id: main_page
      widgets:
        - obj:
            id: fx_obj
            x: 10
            y: 10
            width: 120
            height: 60
            widgets:
              - label:
                  id: fx_label
                  text: "0"
        - label:
            id: fx_number
            y: 40
            x: 150
            text: "0"
        - obj:
            id: fx_card
            x: 150
            y: 60
            width: 60
            height: 40
        - bar:
            id: fx_bar
            y: 80
            width: 100
            height: 12
            min_value: 0
            max_value: 100
            value: 10
        - arc:
            id: fx_arc
            y: 100
            width: 60
            height: 60
            min_value: 0
            max_value: 200
        - slider:
            id: fx_slider
            y: 170
            width: 100
            min_value: 0
            max_value: 50
        - image:
            id: fx_image
            src: test_image
            x: 150
            y: 10
        # A line with YAML points: ESPHome keeps the points array in the widget (LvLineType::points_) and tells LVGL.
        - line:
            id: fx_line
            x: 150
            y: 130
            line_width: 3
            line_rounded: true
            points:
              - { x: 0, y: 0 }
              - { x: 40, y: 0 }
              - { x: 40, y: 30 }
              - { x: 80, y: 30 }
        - line:
            id: fx_line_pct
            x: 150
            y: 170
            width: 60
            height: 20
            points:
              - { x: 0, y: 0 }
              - { x: 50%, y: 100% }
              - { x: 100%, y: 0 }
        # A compound widget: its id is an esphome::lvgl::LvCompound-derived object, accepted by the overloads.
        - dropdown:
            id: fx_dropdown
            y: 200
            options:
              - one
              - two

interval:
  - interval: 1s
    then:
      - lvgl_fx.play: { id: fx_obj, effect: started_hook }
      - lvgl_fx.play: { id: fx_obj, effect: chain_widget_cd }
      - lvgl_fx.set: { id: fx_label, text: "9", transition: announce_set }
      - lvgl_fx.set: { id: fx_label, text: "typed line", transition: type_chars }
      - lvgl_fx.set: { id: fx_label, text: "DECODED TITLE", transition: decode_full }
      - lvgl_fx.stop: fx_label
      - lambda: |-
          // visibility, opacity and the hide/show reversal rules
          fx::set_visible(id(fx_obj), false);
          fx::set_visible(id(fx_obj), true);
          fx::set_visible(id(fx_obj), false, fx::Opt{nullptr, true});
          fx::set_visible(id(fx_obj), true, {.transition = nullptr, .force = true});
          fx::set_opacity(id(fx_obj), 128);
          fx::set_opacity(id(fx_obj), LV_OPA_COVER);

          // Interrupt same-target transitions without canceling unrelated effects or running then.
          fx::set_visible(id(fx_obj), true, {.instant = true});
          fx::set_opacity(id(fx_obj), 128, {.instant = true});
          fx::set_value(id(fx_bar), 42, {.instant = true});
          fx::set_value(id(fx_image), 45, {.instant = true});
          fx::set_value(id(fx_label), 42, {.instant = true});
          fx::set_text(id(fx_label), "42", {.instant = true});
          fx::set_color(id(fx_label), lv_color_hex(0xff0000), {.instant = true});
          fx::set_x(id(fx_obj), 10, {.instant = true});
          fx::set_y(id(fx_obj), 10, {.instant = true});
          fx::set_rotation(id(fx_obj), 0, {.instant = true});

          // value for every widget kind, including NaN -> minimum
          fx::set_value(id(fx_bar), 42.0f);
          fx::set_value(id(fx_bar), NAN);
          fx::set_value(id(fx_arc), 120);
          fx::set_value(id(fx_slider), 25.5f);
          fx::set_value(id(fx_image), 45.0f);
          fx::set_value(id(fx_image), -15.0f);

          // text, color (label -> text color, image -> recolor, obj -> bg color)
          fx::set_text(id(fx_label), "42");
          fx::set_text(id(fx_label), nullptr);
          fx::set_color(id(fx_label), lv_color_hex(0xff0000));
          fx::set_color(id(fx_image), lv_color_hex(0x00ff00));
          fx::set_color(id(fx_obj), lv_color_hex(0x0000ff));

          // position and transform rotation
          fx::set_x(id(fx_obj), 20);
          fx::set_y(id(fx_obj), 30);
          fx::set_rotation(id(fx_obj), 90.0f);
          fx::set_rotation(id(fx_obj), NAN);

          // ESPHome compound widget overloads
          fx::set_visible(id(fx_dropdown), true);
          fx::set_opacity(id(fx_dropdown), 200);
          fx::set_value(id(fx_dropdown), 1.0f);  // not a ranged widget: logged once, no effect
          fx::set_text(id(fx_dropdown), "x");    // not a label: logged once, no effect
          fx::set_color(id(fx_dropdown), lv_color_hex(0x123456));
          fx::set_x(id(fx_dropdown), 5);
          fx::set_y(id(fx_dropdown), 205);
          fx::set_rotation(id(fx_dropdown), 0.0f);
          fx::stop(id(fx_dropdown));

          // stop snaps everything to its final state
          fx::stop(id(fx_obj));
          fx::stop(id(fx_bar));

          // policy switches and tokens
          fx::set_enabled(false);
          fx::set_value(id(fx_bar), 7.0f);  // applied instantly
          fx::set_enabled(true);
          fx::set_reduced_motion(true);
          fx::set_value(id(fx_bar), 8.0f);
          fx::set_reduced_motion(false);

          // user-defined transition table: the format the codegen of a later phase emits
          static const fx::PropTransition slow_value = {.duration = fx::DUR_SLOW, .curve = fx::Curve::EASE_IN_OUT};
          static const fx::PropTransition quick_text = {.duration = 60, .delay = 10, .style = fx::Style::FADE,
                                                        .from = 50};
          static const fx::TransitionDef gauge_slow = {{nullptr, nullptr, &slow_value, &quick_text, nullptr, nullptr,
                                                        nullptr},
                                                       nullptr};
          fx::set_value(id(fx_bar), 60.0f, fx::Opt{&gauge_slow});
          fx::set_text(id(fx_label), "7", fx::Opt{&gauge_slow, false});
          fx::detail::core().defaults = &gauge_slow;  // per-property defaults override
          fx::set_value(id(fx_arc), 10.0f);
          fx::detail::core().defaults = nullptr;
          fx::motion().intensity = 0.8f;

          // user channel with every option
          fx::TweenOpt opt;
          opt.duration = 250;
          opt.curve = fx::Curve::EASE_IN_OUT;
          opt.delay = 20;
          opt.target = id(fx_bar);
          opt.on_done = [](void *var) { ESP_LOGD("test", "tween done %p", var); };
          fx::tween(id(fx_bar),
                    [](void *var, int32_t v) {
                      lv_bar_set_value(static_cast<lv_obj_t *>(var), v, LV_ANIM_OFF);
                    },
                    0, 100, opt);
          fx::tween(id(fx_bar), [](void *, int32_t) {}, 0, 1);
          fx::cancel_tween(id(fx_bar), [](void *, int32_t) {});

          // curve helpers used by later phases
          (void) fx::curve_step(fx::Curve::EASE_OUT, 512);
          (void) fx::curve_path(fx::Curve::EASE_IN);
  - interval: 2s
    then:
      - lambda: |-
          // ---- P2: built-in effects on every kind of target (lv_obj_t * and compound widgets) ----
          fx::play(id(fx_obj), fx::PULSE);
          fx::play(id(fx_obj), fx::SHAKE);
          fx::play(id(fx_obj), fx::NUDGE_UP);
          fx::play(id(fx_obj), fx::NUDGE_DOWN);
          fx::play(id(fx_obj), fx::NUDGE_LEFT);
          fx::play(id(fx_obj), fx::NUDGE_RIGHT);
          fx::play(id(fx_label), fx::FLASH);   // label: text color
          fx::play(id(fx_image), fx::FLASH);   // image: recolor
          fx::play(id(fx_obj), fx::FLASH);     // anything else: background
          fx::play(id(fx_obj), fx::GLOW);
          fx::play(id(fx_label), fx::BLINK);
          fx::play(id(fx_dropdown), fx::PULSE);
          fx::play(id(fx_obj), fx::PULSE, fx::Opt{nullptr, true});  // force
          fx::play(id(fx_obj), fx::PULSE, {.transition = nullptr, .force = true});
          fx::stop(id(fx_obj), fx::PULSE);
          fx::stop(id(fx_dropdown), fx::PULSE);
          fx::stop(id(fx_obj));
          fx::stop(id(fx_dropdown));

          // ---- user effects: the const-table format a later phase generates ----
          // Multi-track with delays, curves and a flash property; partial overrides only list what they change.
          static const fx::Track heat_tracks[] = {
              {.kind = fx::TrackKind::NUDGE, .duration = 220, .y = -2},
              {.kind = fx::TrackKind::FLASH, .curve = fx::Curve::EASE_IN, .delay = 60, .duration = fx::DUR_NORMAL,
               .property = fx::FlashProp::BG_COLOR, .color = 0xFF8800, .amount = 25},
              {.kind = fx::TrackKind::PULSE, .delay = 20, .scale = 105},
              {.kind = fx::TrackKind::SHAKE, .distance = 3, .cycles = 3, .axis = fx::Axis::Y},
              {.kind = fx::TrackKind::GLOW, .opacity = 80},
              {.kind = fx::TrackKind::BLINK, .curve = fx::Curve::EASE_IN_OUT, .opacity = 40},
          };
          // repeat N, cooldown, defer, retrigger ignore
          static const fx::EffectDef heat = {.tracks = heat_tracks, .track_count = 6,
                                             .retrigger = fx::Retrigger::IGNORE,
                                             .when_suppressed = fx::WhenSuppressed::DEFER,
                                             .repeat = 3, .repeat_delay = 100, .cooldown = 2500,
                                             .defer_timeout = 1500};
          // infinite loop (an "on" state), policy always
          static const fx::Track warn_tracks[] = {{.kind = fx::TrackKind::BLINK, .duration = fx::DUR_SLOW,
                                                   .opacity = 35}};
          static const fx::EffectDef warning_blink = {.tracks = warn_tracks, .track_count = 1,
                                                      .policy = fx::EffectPolicy::ALWAYS,
                                                      .repeat = fx::REPEAT_INFINITE, .repeat_delay = 400};
          // effect-level then (not for loops)
          static const fx::Track confirm_tracks[] = {{.kind = fx::TrackKind::FLASH, .duration = 340}};
          static const fx::EffectDef confirm = {.tracks = confirm_tracks, .track_count = 1, .then = &heat};
          // a loop as `then` is refused at run time
          static const fx::EffectDef bad_then = {.tracks = confirm_tracks, .track_count = 1, .then = &warning_blink};

          fx::play(id(fx_obj), &heat);
          fx::play(id(fx_obj), &heat);                       // retrigger ignore, cooldown
          fx::play(id(fx_obj), &heat, {.force = true});
          fx::play(id(fx_obj), &warning_blink);              // loop on
          fx::play(id(fx_obj), &warning_blink);              // already on: no-op
          fx::play(id(fx_dropdown), &warning_blink, {.force = true});
          fx::play(id(fx_obj), &confirm);
          fx::play(id(fx_obj), &bad_then);
          fx::stop(id(fx_obj), &warning_blink);              // loop off, offsets back to rest
          fx::stop(id(fx_obj), &heat);
          fx::stop(id(fx_obj));                              // everything, including a deferred effect

          // ---- presets (built-in magnitudes) and effect defaults (option defaults) ----
          static const fx::Track strong_pulse = {.kind = fx::TrackKind::PULSE, .duration = 300, .scale = 125};
          static const fx::Track red_flash = {.kind = fx::TrackKind::FLASH, .color = 0xFF0000};
          fx::set_preset(fx::PULSE, &strong_pulse);
          fx::set_preset(fx::FLASH, &red_flash);
          fx::play(id(fx_obj), fx::PULSE);
          fx::set_preset(fx::PULSE, nullptr);
          fx::set_preset(fx::FLASH, nullptr);
          fx::effect_defaults().cooldown = 500;
          fx::effect_defaults().when_suppressed = fx::WhenSuppressed::DEFER;
          fx::effect_defaults().retrigger = fx::Retrigger::IGNORE;
          fx::effect_defaults().policy = fx::EffectPolicy::NORMAL;
          fx::effect_defaults().defer_timeout = 2000;
          fx::effect_defaults().repeat = 1;
          fx::effect_defaults().repeat_delay = 50;
          fx::play(id(fx_obj), fx::BLINK);
          fx::effect_defaults() = fx::EffectOptions{};
          fx::motion().intensity = 0.5f;
          fx::play(id(fx_obj), fx::SHAKE);
          fx::motion().intensity = 0.8f;
          fx::stop(id(fx_obj));

          // ---- play() result, is_ready(), cooldown_scope, on_start in a const table ----
          static void (*const log_start)(lv_obj_t *) = [](lv_obj_t *target) {
            ESP_LOGD("test", "started %p", target);
            fx::play(target, fx::BLINK);  // re-entrant play from the hook
          };
          static const fx::Track hook_tracks[] = {{.kind = fx::TrackKind::PULSE, .duration = 100}};
          static const fx::EffectDef hooked = {.tracks = hook_tracks, .track_count = 1, .cooldown = 400,
                                               .cooldown_scope = fx::CooldownScope::WIDGET, .on_start = log_start};
          static const fx::EffectDef per_effect = {.tracks = hook_tracks, .track_count = 1, .cooldown = 400,
                                                   .cooldown_scope = fx::CooldownScope::EFFECT};
          static const fx::PropTransition hook_prop = {.duration = 100};
          static const fx::TransitionDef hooked_transition = {{nullptr, nullptr, &hook_prop}, nullptr,
                                                              fx::EffectPolicy::NORMAL, log_start};
          // on_end in const tables: an effect, and a transition (a draw transition too) whose hook sets re-entrantly
          static void (*const log_end)(lv_obj_t *) = [](lv_obj_t *target) {
            ESP_LOGD("test", "ended %p", target);
            fx::play(target, fx::BLINK);
            fx::set_value(target, 5, {.instant = true});  // a set on the same widget from inside on_end
          };
          static const fx::EffectDef ended = {.tracks = hook_tracks, .track_count = 1, .on_start = log_start,
                                              .on_end = log_end};
          static const fx::PropTransition end_prop = {.duration = 100};
          static const fx::TransitionDef ended_transition = {{nullptr, nullptr, &end_prop}, nullptr,
                                                             fx::EffectPolicy::NORMAL, nullptr, log_end};
          static const fx::PropTransition end_draw_prop = {.duration = 80};
          static const fx::TransitionDef ended_draw = {{nullptr, nullptr, nullptr, nullptr, nullptr, nullptr, nullptr,
                                                        &end_draw_prop},
                                                       nullptr, fx::EffectPolicy::NORMAL, nullptr, log_end};
          if (fx::is_ready()) {
            fx::PlayResult r = fx::play(id(fx_obj), &hooked);
            switch (r) {
              case fx::PlayResult::STARTED:
              case fx::PlayResult::DEFERRED:
              case fx::PlayResult::REMEMBERED:
              case fx::PlayResult::IGNORED:
              case fx::PlayResult::DROPPED:
              case fx::PlayResult::COOLDOWN:
              case fx::PlayResult::NO_SLOT:
              case fx::PlayResult::INVALID:
                break;
            }
            if (fx::play(id(fx_obj), &per_effect) == fx::PlayResult::COOLDOWN) fx::stop(id(fx_obj));
            if (fx::play(id(fx_dropdown), &hooked, {.force = true}) != fx::PlayResult::STARTED)  // LvCompound overload
              fx::stop(id(fx_dropdown));
            if (fx::play(static_cast<lv_obj_t *>(nullptr), &hooked) != fx::PlayResult::INVALID) fx::stop(id(fx_obj));
            fx::set_value(id(fx_bar), 77, {.transition = &hooked_transition});
            fx::play(id(fx_obj), &ended);                           // on_end after the one repeat, re-entrant play
            fx::set_value(id(fx_bar), 78, {.transition = &ended_transition});
            fx::set_value(id(fx_bar), 78, {.transition = &ended_transition});  // no-op: no on_end
            fx::set_value(id(fx_bar), 79, {.transition = &ended_transition, .instant = true});  // instant: none
            fx::set_draw(id(fx_line)->obj, 0.0f, {.transition = &ended_draw});  // a draw transition
          }
          fx::effect_defaults().cooldown_scope = fx::CooldownScope::WIDGET;
          fx::effect_defaults() = fx::EffectOptions{};
          fx::play(id(fx_obj), id(started_hook));
          fx::set_text(id(fx_label), "7", {.transition = id(announce_set)});
          fx::play(id(fx_obj), id(ended_hook));
          fx::set_text(id(fx_label), "8", {.transition = id(ended_set)});
          fx::set_visible(id(fx_label), false, {.transition = id(ended_set)});
          fx::set_visible(id(fx_label), true, {.transition = id(ended_set), .instant = true});
          fx::stop(id(fx_obj));

          // ---- transition `then`: every kind of transition ends by playing an effect on the same target ----
          static const fx::PropTransition quick = {.duration = 60, .curve = fx::Curve::LINEAR,
                                                   .style = fx::Style::FADE, .from = 50};
          static const fx::TransitionDef with_then = {{&quick, &quick, &quick, &quick, &quick, &quick, &quick},
                                                      &confirm};
          fx::set_visible(id(fx_obj), false, fx::Opt{&with_then});    // hide, then
          fx::set_visible(id(fx_obj), true, fx::Opt{&with_then});     // show, then
          fx::set_opacity(id(fx_obj), 100, fx::Opt{&with_then});      // opacity, then
          fx::set_color(id(fx_obj), lv_color_hex(0x336699), fx::Opt{&with_then});
          fx::set_rotation(id(fx_obj), 45.0f, fx::Opt{&with_then});
          fx::set_x(id(fx_obj), 40, fx::Opt{&with_then});             // slot-less
          fx::set_y(id(fx_obj), 40, fx::Opt{&with_then});
          fx::set_value(id(fx_bar), 90.0f, fx::Opt{&with_then});
          fx::set_text(id(fx_label), "then", fx::Opt{&with_then});    // text fade
          fx::stop(id(fx_obj));  // finishes the transitions without playing `then`

          // ---- color channel rules ----
          fx::set_color(id(fx_image), lv_color_hex(0x00ff00));
          fx::play(id(fx_image), fx::FLASH);                    // the tint survives the flash
          fx::set_color(id(fx_image), lv_color_hex(0x00ff00));
          static const fx::Track bg_flash_tracks[] = {{.kind = fx::TrackKind::FLASH,
                                                       .property = fx::FlashProp::BG_COLOR}};
          static const fx::EffectDef bg_flash = {.tracks = bg_flash_tracks, .track_count = 1};
          fx::play(id(fx_label), &bg_flash);                    // label flash through bg_color ...
          fx::set_color(id(fx_label), lv_color_hex(0xff0000));  // ... set_color still means text color
          static const fx::Track text_flash_tracks[] = {{.kind = fx::TrackKind::FLASH,
                                                         .property = fx::FlashProp::TEXT_COLOR}};
          static const fx::EffectDef text_flash = {.tracks = text_flash_tracks, .track_count = 1};
          static const fx::Track img_flash_tracks[] = {{.kind = fx::TrackKind::FLASH,
                                                        .property = fx::FlashProp::IMAGE_RECOLOR}};
          static const fx::EffectDef img_flash = {.tracks = img_flash_tracks, .track_count = 1};
          static const fx::Track shake_x_tracks[] = {{.kind = fx::TrackKind::SHAKE, .axis = fx::Axis::X}};
          static const fx::EffectDef shake_x = {.tracks = shake_x_tracks, .track_count = 1};
          fx::play(id(fx_label), &text_flash);
          fx::play(id(fx_image), &img_flash);
          fx::play(id(fx_obj), &shake_x);
          fx::stop(id(fx_label));
          fx::stop(id(fx_image));
          fx::stop(id(fx_obj));

  # ---- line draw: the C++ API, re-capture, pool limits and the completion options of every set_* ----
  - interval: 2200ms
    then:
      - lambda: |-
          lv_obj_t *line = id(fx_line)->obj;
          fx::set_draw(id(fx_line), 100.0f);                     // LvCompound overload; already complete: nothing
          fx::set_draw(line, 0.0f);                              // erase: draws nothing, the line stays visible
          fx::set_draw(line, 33.3f);                             // float percent
          fx::set_draw(line, 33.3f);                             // same target: nothing
          fx::set_draw(line, 100.0f, fx::Opt{id(trace_in)});     // named transition; a retarget continues from there
          fx::set_draw(line, 150.0f);                            // clamped to 100
          fx::set_draw(line, -5.0f);                             // clamped to 0
          fx::set_draw(line, 50.0f, {.transition = id(trace_slow), .force = true});
          fx::set_draw(line, 75.0f, {.always = true});
          fx::set_draw(line, 20.0f, {.instant = true});          // cancels the motion, no then
          fx::set_draw(line, NAN);                               // non-finite: instantly 0
          fx::set_draw(line, 100.0f, {.instant = true});
          fx::stop(line);                                        // snaps to the target percent
          fx::set_draw(line, 60.0f);
          fx::stop(line);                                        // the line rests at 60 %: a partially drawn line
          fx::set_draw(line, 100.0f, fx::Opt{id(trace_instant)});  // duration 0: instant, then plays at once

          // draw and visible are independent: erase, then hide with the transition's `then`
          fx::set_draw(line, 0.0f, {.transition = id(trace_out), .instant = true});
          fx::set_visible(line, true, {.instant = true});
          fx::set_draw(line, 100.0f, fx::Opt{id(trace_in)});
          fx::set_draw(line, 0.0f, fx::Opt{id(trace_out)});      // `then` = line_hide hides it when the erase is done
          fx::stop(line);
          fx::set_visible(line, true, {.instant = true});
          fx::set_draw(line, 100.0f, fx::Opt{id(trace_in)});
          fx::set_draw(line, 0.0f, fx::Opt{id(trace_erase)});    // on_end hides the line exactly when the erase is over
          fx::stop(line);                                        // (no on_end after stop)
          fx::set_visible(line, true, {.instant = true});
          fx::set_draw(line, 100.0f, {.instant = true});

          // a line with percentage coordinates
          fx::set_draw(id(fx_line_pct), 40.0f);
          fx::set_draw(id(fx_line_pct), 100.0f);

          // re-capture: the app gives the line another array (it must outlive the line)
          static const lv_point_precise_t other[] = {{0, 0}, {30, 0}, {30, 30}, {0, 30}, {0, 0}};
          static const lv_point_precise_t single[] = {{0, 0}};
          fx::set_draw(line, 50.0f);                             // partial: the line shows fx's buffer
          lv_line_set_points(line, other, 5);                    // the app takes the line over mid-way
          fx::set_draw(line, 30.0f);                             // captured as the new full array
          fx::set_draw(line, 100.0f);
          lv_line_set_points(line, other, 5);
          fx::set_draw(line, 0.0f);                              // erased: the line shows `other` with one point
          lv_line_set_points(line, other, 3);                    // a different count: re-captured, not erased any more
          fx::set_draw(line, 100.0f);
          lv_line_set_points(line, single, 1);                   // fewer than 2 points: logged once, nothing to draw
          fx::set_draw(line, 50.0f);
          lv_line_set_points(line, other, 5);
          fx::set_draw(line, 100.0f, {.instant = true});

          // wrong targets: logged once, no effect
          fx::set_draw(id(fx_label), 50.0f);
          fx::set_draw(id(fx_dropdown), 50.0f);
          fx::set_draw(static_cast<lv_obj_t *>(nullptr), 50.0f);

          // pool limits (3 runs of 12 points): more partial lines than runs apply whole segments, logged once
          static const lv_point_precise_t longer[] = {{0, 0}, {5, 0}, {10, 0}, {15, 0}, {20, 0}, {25, 0}, {30, 0},
                                                      {35, 0}, {40, 0}, {45, 0}, {50, 0}, {55, 0}, {60, 0}};
          lv_obj_t *crowd[5];
          for (lv_obj_t *&l : crowd) {
            l = lv_line_create(lv_screen_active());
            lv_line_set_points(l, longer, 13);               // 13 points: more than max_line_points
            fx::set_draw(l, 50.0f);                          // no buffer fits: whole segments, final state at once
            fx::set_draw(l, 0.0f);
            fx::set_draw(l, 100.0f);
          }
          static const lv_point_precise_t small[] = {{0, 0}, {10, 10}, {20, 0}};
          for (lv_obj_t *&l : crowd) {
            lv_line_set_points(l, small, 3);
            fx::set_draw(l, 50.0f);                          // 3 runs bound, the 4th and 5th line find the pool busy
          }
          for (lv_obj_t *&l : crowd) {
            fx::set_draw(l, 100.0f, {.instant = true});
            lv_obj_delete(l);                                // deleting a line frees its run and slot
          }

          // cross-widget completion on every set_*: the effect plays on the target when the transition completes
          lv_obj_t *target = id(fx_image);
          const fx::Opt done_pulse = {.completion_effect = fx::PULSE, .completion_target = target};
          fx::set_draw(line, 0.0f, {.transition = id(trace_in), .completion_effect = id(prnd_confirm),
                                    .completion_target = target});
          fx::set_draw(line, 100.0f, done_pulse);
          fx::set_draw(line, 100.0f, {.instant = true, .completion_effect = fx::PULSE, .completion_target = target});
          fx::set_value(id(fx_bar), 20.0f, done_pulse);
          fx::set_value(id(fx_image), 90.0f, done_pulse);
          fx::set_value(id(fx_label), 21.0f, done_pulse);
          fx::set_text(id(fx_label), "done", done_pulse);
          fx::set_visible(id(fx_card), false, done_pulse);
          fx::set_visible(id(fx_card), true, done_pulse);
          fx::set_opacity(id(fx_card), 90, done_pulse);
          fx::set_color(id(fx_card), lv_color_hex(0x112233), done_pulse);
          fx::set_x(id(fx_card), 160, done_pulse);
          fx::set_y(id(fx_card), 70, done_pulse);
          fx::set_rotation(id(fx_card), 15.0f, done_pulse);
          fx::set_x(id(fx_card), 150, {.transition = id(prnd_move), .completion_effect = fx::BLINK,
                                       .completion_target = id(fx_obj)});  // then first, then the completion effect
          fx::set_value(id(fx_bar), 30.0f, {.force = true, .completion_effect = fx::PULSE, .completion_target = line});
          fx::set_value(id(fx_bar), 0.0f, {.instant = true, .completion_effect = fx::PULSE, .completion_target = target});
          fx::set_value(id(fx_bar), 50.0f, done_pulse);
          fx::stop(id(fx_bar));                                  // stop: no completion effect
          fx::set_value(id(fx_bar), 60.0f, done_pulse);
          fx::set_value(id(fx_bar), 70.0f);                      // replaced by a call without completion: no effect
          fx::set_value(id(fx_bar), 80.0f, {.completion_effect = fx::PULSE});  // no target: ignored
          fx::set_value(id(fx_bar), 90.0f, {.completion_target = target});     // no effect: ignored
          fx::cancel_tween_effect(target);                       // also disarms Opt completions (same records)
          fx::stop(id(fx_bar));
          fx::stop(id(fx_card));
          fx::stop(id(fx_label));
          fx::stop(id(fx_image));
          fx::stop(line);

  # ---- P3: transition styles ----
  - interval: 2500ms
    then:
      - lambda: |-
          // Entries list only what they say; everything else resolves against the defaults and the built-ins.
          static const fx::PropTransition up = {.style = fx::Style::SLIDE_UP};
          static const fx::PropTransition down = {.style = fx::Style::SLIDE_DOWN, .distance = 20};
          static const fx::PropTransition left = {.duration = 300, .delay = 20, .curve = fx::Curve::EASE_IN_OUT,
                                                  .style = fx::Style::SLIDE_LEFT, .distance = 30};
          static const fx::PropTransition right = {.style = fx::Style::SLIDE_RIGHT};
          static const fx::PropTransition zoom = {.style = fx::Style::ZOOM};
          static const fx::PropTransition zoom_far = {.style = fx::Style::ZOOM, .from = 60};
          static const fx::PropTransition none = {.style = fx::Style::NONE};
          static const fx::PropTransition split = {.style = fx::Style::SLIDE_UP, .hide_style = fx::Style::FADE};
          static const fx::PropTransition split_rev = {.style = fx::Style::FADE, .hide_style = fx::Style::ZOOM};
          static const fx::PropTransition instant = {.duration = 0, .style = fx::Style::SLIDE_UP};
          static const fx::TransitionDef t_up = {{&up, nullptr, nullptr, nullptr, nullptr, nullptr, nullptr}, nullptr};
          static const fx::TransitionDef t_down = {{&down, nullptr, nullptr, nullptr, nullptr, nullptr, nullptr},
                                                   nullptr};
          static const fx::TransitionDef t_left = {{&left, nullptr, nullptr, nullptr, nullptr, nullptr, nullptr},
                                                   nullptr};
          static const fx::TransitionDef t_right = {{&right, nullptr, nullptr, nullptr, nullptr, nullptr, nullptr},
                                                    nullptr};
          static const fx::TransitionDef t_zoom = {{&zoom, nullptr, nullptr, nullptr, nullptr, nullptr, nullptr},
                                                   nullptr};
          static const fx::TransitionDef t_zoom_far = {{&zoom_far, nullptr, nullptr, nullptr, nullptr, nullptr,
                                                        nullptr}, nullptr};
          static const fx::TransitionDef t_none = {{&none, nullptr, nullptr, nullptr, nullptr, nullptr, nullptr},
                                                   nullptr};
          static const fx::TransitionDef t_split = {{&split, nullptr, nullptr, nullptr, nullptr, nullptr, nullptr},
                                                    nullptr};
          static const fx::TransitionDef t_split_rev = {{&split_rev, nullptr, nullptr, nullptr, nullptr, nullptr,
                                                         nullptr}, nullptr};
          static const fx::TransitionDef t_instant = {{&instant, nullptr, nullptr, nullptr, nullptr, nullptr,
                                                       nullptr}, nullptr};
          lv_obj_t *card = id(fx_card);

          // every visible style, hide then show
          const fx::TransitionRef styles[] = {&t_up, &t_down, &t_left, &t_right, &t_zoom, &t_zoom_far, &t_none,
                                              &t_split, &t_split_rev, &t_instant};
          for (fx::TransitionRef t : styles) {
            fx::set_visible(card, false, fx::Opt{t});
            fx::set_visible(card, true, fx::Opt{t});
          }

          // show/hide split with a reversal in the middle of the hide and of the show
          fx::set_visible(card, false, fx::Opt{&t_split});
          fx::set_visible(card, true, fx::Opt{&t_split});
          fx::set_visible(card, false, fx::Opt{&t_split_rev});
          fx::set_visible(card, true, fx::Opt{&t_split_rev});
          fx::set_visible(card, false, fx::Opt{&t_down});    // hide mid-show of another style: keeps the running style
          fx::set_visible(card, true, fx::Opt{&t_zoom});
          fx::set_opacity(card, 120, fx::Opt{&t_up});        // set_opacity inside a slide entry ends its offsets
          fx::set_opacity(card, LV_OPA_COVER);
          fx::stop(card);                                    // snaps: offsets 0, shown

