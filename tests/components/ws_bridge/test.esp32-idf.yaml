esphome:
  name: test-ws-bridge

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../../components
    components: [ ws_bridge ]

wifi:
  ssid: "test_ssid"
  password: "test_password"

logger:

ws_bridge:
  id: my_ws_bridge
  host: 192.168.0.10
  token: "test_token"
  gateway_id: my_esp
  name: "My ESP"
  keep_last_state_on_disconnect: true
  sync_entities: true
  on_connected:
    - logger.log: "ws_bridge connected"
  on_disconnected:
    - logger.log: "ws_bridge disconnected"
  on_declare:
    - logger.log: "ws_bridge (re)declaring entities"
  # GPS device_tracker — ESPHome has no device_tracker: domain, so these are
  # configured inline under the hub instead of as `platform: ws_bridge`.
  trackers:
    - unique_id: car_location
      name: "Car Location"
      icon: mdi:car
      latitude: !lambda return 37.5665;
      longitude: !lambda return 126.9780;
      gps_accuracy: 8
      update_interval: 30s
  # Exposes existing, locally-declared entities (below) without a parallel
  # `platform: ws_bridge` entity per value — see the README's "Exposing
  # existing entities" section. unique_id/name default to the source's own
  # id/name when omitted (uptime_sensor and my_update below have neither set
  # here, so both fall back at runtime).
  #
  # Several of these sources are *also* wrapped via `*_id:` below. That is
  # intentional dual-path compile coverage (wrapping + entities:); dump_config
  # warns about the double exposure at runtime. Don't copy this overlap into
  # a real device.
  entities:
    - source_id: uptime_sensor
    - source_id: local_motion
      unique_id: motion_ref
      name: "Local Motion (bridged)"
    - source_id: local_status
    - source_id: local_relay
    - source_id: local_number
    - source_id: local_select
    - source_id: local_button2
    - source_id: my_update
      unique_id: firmware_ref
    - source_id: local_light
    - source_id: local_cover
    - source_id: local_climate
    - source_id: local_fan
    - source_id: local_text
    - source_id: local_lock
    - source_id: local_valve
    - source_id: local_event
    - source_id: local_date
    - source_id: local_time
    - source_id: local_datetime

sensor:
  - platform: ws_bridge
    unique_id: temp1
    name: "Temperature"
    device_class: temperature
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 1
    ws_device_id: sensor_hub_1
    ws_device_name: "Sensor Hub"
  - platform: uptime
    id: uptime_sensor
  - platform: template
    id: climate_temp
    name: "Climate Temp"
    unit_of_measurement: "°C"
    lambda: "return 22.0;"
    update_interval: 60s
  # sensor_id: wraps an existing sensor via a `platform: ws_bridge` entity
  # instead of the hub's entities: list. accuracy_decimals: 0 is an explicit
  # override (0 is also the unset default — codegen must pass a flag).
  - platform: ws_bridge
    unique_id: temp_bridged
    name: "Uptime (bridged)"
    sensor_id: uptime_sensor
    accuracy_decimals: 0

binary_sensor:
  - platform: ws_bridge
    unique_id: motion1
    name: "Motion"
    device_class: motion
  - platform: template
    id: local_motion
    name: "Local Motion"
    device_class: motion
  - platform: ws_bridge
    unique_id: motion_bridged
    name: "Motion (bridged)"
    binary_sensor_id: local_motion

text_sensor:
  - platform: ws_bridge
    unique_id: status1
    name: "Status"
  - platform: template
    id: local_status
    name: "Local Status"
  - platform: ws_bridge
    unique_id: status_bridged
    name: "Status (bridged)"
    text_sensor_id: local_status

switch:
  - platform: ws_bridge
    unique_id: relay1
    name: "Relay"
  - platform: template
    id: local_relay
    name: "Local Relay"
    optimistic: true
  - platform: ws_bridge
    unique_id: relay_bridged
    name: "Relay (bridged)"
    switch_id: local_relay

number:
  - platform: ws_bridge
    unique_id: setpoint1
    name: "Setpoint"
    min_value: 0
    max_value: 100
    step: 0.5
  - platform: template
    id: local_number
    name: "Local Number"
    optimistic: true
    min_value: 0
    max_value: 10
    step: 1
  # min_value/max_value omitted on purpose — wrapping inherits the source's
  # range (schema-relaxation compile path).
  - platform: ws_bridge
    unique_id: number_bridged
    name: "Number (bridged)"
    number_id: local_number
  # Overrides one range field only: min/max/step resolve per field, so this
  # keeps local_number's min/max. local_number is exposed several times here
  # on purpose, to exercise the dump_config() double-exposure warning.
  - platform: ws_bridge
    unique_id: number_step_bridged
    name: "Number (finer step)"
    number_id: local_number
    step: 0.1

select:
  - platform: ws_bridge
    unique_id: mode1
    name: "Mode"
    options:
      - "Auto"
      - "Manual"
  - platform: template
    id: local_select
    name: "Local Select"
    optimistic: true
    options:
      - "One"
      - "Two"
  # options omitted on purpose — wrapping inherits the source's list.
  - platform: ws_bridge
    unique_id: select_bridged
    name: "Select (bridged)"
    select_id: local_select

button:
  - platform: template
    id: ota_flash_button
    name: "Local Flash"
    on_press:
      - logger.log: "flash"
  - platform: template
    id: local_button2
    name: "Local Button 2"
    on_press:
      - logger.log: "pressed"
  - platform: ws_bridge
    unique_id: restart1
    name: "Restart"
  - platform: ws_bridge
    unique_id: ota_update_button
    name: "Update"
    icon: mdi:update
    button_id: ota_flash_button

# Remote OTA over the outbound-only ws_bridge connection: http_request pulls
# the firmware (no inbound port needed), update.http_request checks the
# manifest periodically, and update.ws_bridge exposes it to Home Assistant.
# safe_mode: auto-rolls-back a bad flash.
http_request:

ota:
  - platform: http_request
    id: my_ota

update:
  - platform: http_request
    id: my_update
    source: https://example.com/manifest.json
  - platform: ws_bridge
    unique_id: firmware
    name: "Firmware"
    update_id: my_update

safe_mode:

output:
  - platform: gpio
    pin: GPIO2
    id: local_led_out

light:
  - platform: binary
    id: local_light
    name: "Local Light"
    output: local_led_out
  - platform: ws_bridge
    unique_id: light_bridged
    name: "Light (bridged)"
    light_id: local_light

cover:
  - platform: ws_bridge
    unique_id: cover1
    name: "Cover"
  - platform: template
    id: local_cover
    name: "Local Cover"
    optimistic: true
    assumed_state: true
  - platform: ws_bridge
    unique_id: cover_bridged
    name: "Cover (bridged)"
    cover_id: local_cover

# No template climate in ESPHome — bang_bang covers wrap + entities: paths.
climate:
  - platform: ws_bridge
    unique_id: climate1
    name: "Climate"
  - platform: bang_bang
    id: local_climate
    name: "Local Climate"
    sensor: climate_temp
    default_target_temperature_low: 18
    default_target_temperature_high: 24
    heat_action:
      - logger.log: "climate heat"
    cool_action:
      - logger.log: "climate cool"
    idle_action:
      - logger.log: "climate idle"
  - platform: ws_bridge
    unique_id: climate_bridged
    name: "Climate (bridged)"
    climate_id: local_climate

fan:
  - platform: ws_bridge
    unique_id: fan1
    name: "Fan"
  - platform: template
    id: local_fan
    name: "Local Fan"
    speed_count: 100
  - platform: ws_bridge
    unique_id: fan_bridged
    name: "Fan (bridged)"
    fan_id: local_fan

# text is HA's writable text domain — unrelated to text_sensor above.
# min_length/max_length are string lengths, not a value range.
text:
  - platform: ws_bridge
    unique_id: note1
    name: "Note"
    min_length: 0
    max_length: 64
    pattern: "[A-Za-z0-9 ]*"
  - platform: ws_bridge
    unique_id: secret1
    name: "Secret"
    mode: password
  - platform: template
    id: local_text
    name: "Local Text"
    mode: text
    optimistic: true
  # min_length/max_length/pattern/mode omitted on purpose — wrapping reports
  # the wrapped text's own limits.
  - platform: ws_bridge
    unique_id: text_bridged
    name: "Text (bridged)"
    text_id: local_text

lock:
  - platform: ws_bridge
    unique_id: lock1
    name: "Front Door"
    code_format: '^\d{4}$'
  - platform: template
    id: local_lock
    name: "Local Lock"
    optimistic: true
  - platform: ws_bridge
    unique_id: lock_bridged
    name: "Lock (bridged)"
    lock_id: local_lock

valve:
  - platform: ws_bridge
    unique_id: valve1
    name: "Main Valve"
  - platform: template
    id: local_valve
    name: "Local Valve"
    optimistic: true
    has_position: true
  - platform: ws_bridge
    unique_id: valve_bridged
    name: "Valve (bridged)"
    valve_id: local_valve

event:
  - platform: ws_bridge
    unique_id: doorbell1
    name: "Doorbell"
    device_class: doorbell
    event_types:
      - "single"
      - "double"
  - platform: template
    id: local_event
    name: "Local Event"
    event_types:
      - "ping"
  # event_types omitted on purpose — wrapping declares the wrapped event's list.
  - platform: ws_bridge
    unique_id: event_bridged
    name: "Event (bridged)"
    event_id: local_event

# date / time / datetime all live in ESPHome's single datetime: domain, chosen
# by type:. There is no time: entity domain — that name is the clock source.
datetime:
  - platform: ws_bridge
    type: date
    unique_id: date1
    name: "Date"
  - platform: ws_bridge
    type: time
    unique_id: time1
    name: "Time"
  - platform: ws_bridge
    type: datetime
    unique_id: datetime1
    name: "DateTime"
  - platform: template
    id: local_date
    type: date
    name: "Local Date"
    optimistic: true
  - platform: template
    id: local_time
    type: time
    name: "Local Time"
    optimistic: true
  - platform: template
    id: local_datetime
    type: datetime
    name: "Local DateTime"
    optimistic: true
  - platform: ws_bridge
    type: date
    unique_id: date_bridged
    name: "Date (bridged)"
    datetime_id: local_date
  - platform: ws_bridge
    type: time
    unique_id: time_bridged
    name: "Time (bridged)"
    datetime_id: local_time
  - platform: ws_bridge
    type: datetime
    unique_id: datetime_bridged
    name: "DateTime (bridged)"
    datetime_id: local_datetime
