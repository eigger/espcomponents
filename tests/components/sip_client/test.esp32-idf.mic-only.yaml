esphome:
  name: test-sip-client-mic-only

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../../components
    components: [ sip_client ]

wifi:
  ssid: "test_ssid"
  password: "test_password"

logger:

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO26

microphone:
  - platform: i2s_audio
    id: mic_id
    i2s_audio_id: i2s_in
    adc_type: external
    i2s_din_pin: GPIO33
    pdm: false

# Send-only: no speaker → SDP a=sendonly
sip_client:
  id: my_sip
  microphone: mic_id
  server: 192.168.0.10
  username: "1001"
  password: "secret"
  domain: "192.168.0.10"

  on_incoming_call:
    - sip_client.answer: my_sip
