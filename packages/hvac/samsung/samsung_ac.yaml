# ------------------------------------------------------------------------------
# 2. 삼성 HVAC 메인 통신 컴포넌트 불러오기
# ------------------------------------------------------------------------------
external_components:
  - source: github://omerfaruk-aran/esphome_samsung_hvac_bus@main
    components: [samsung_ac]

samsung_ac:
  non_nasa_keepalive: true
  debug_log_undefined_messages: false
  debug_log_messages: false

  devices:
    # ==========================================================================
    # 1. 거실 에어컨 (Living AC) - NASA 주소: "20.00.03"
    # ==========================================================================
    - address: "20.00.03"
      map_auto_to_heat_cool: false   # false: Home Assistant에서 Auto 선택 시 삼성 AI Auto(0x4001=0) 패킷 전송
      capabilities:
        horizontal_swing: true
        vertical_swing: true
        presets:
          windfree:
            name: "Windfree"
            enabled: true            # 무풍 프리셋 활성화
          longreach:
            name: "Longreach"
            enabled: true            # 롱파워/롱리치 프리셋 활성화
          sleep:
            name: "Sleep"
            enabled: false
          quiet:
            name: "Quiet"
            enabled: false
          fast:
            name: "Fast"
            enabled: false
          eco:
            name: "Eco"
            enabled: false
      climate:
        name: "Living AC"
        visual:
          temperature_step:
            target_temperature: 0.5
            current_temperature: 0.1
        device_id: device_livingroom
      room_temperature:
        name: "Living AC Temperature"
        device_id: device_livingroom
      room_humidity:
        name: "Living AC Humidity"
        device_id: device_livingroom
      target_temperature:
        name: "Living AC Target Temperature"
        device_id: device_livingroom
      power:
        name: "Living AC Power"
        device_id: device_livingroom
      mode:
        name: "Living AC Mode"
        device_id: device_livingroom
      automatic_cleaning:
        name: "Living AC Auto Clean"
        device_id: device_livingroom
      indoor_eva_in_temperature:
        name: "Living AC Eva In Temp"
        device_id: device_livingroom
      indoor_eva_out_temperature:
        name: "Living AC Eva Out Temp"
        device_id: device_livingroom
      room_temperature_offset: 0

      custom_sensor:
        # 실제 가동 모드 피드백 수신 (0x4002) - Auto/Cool/Dry/Fan/Heat/Off
        - id: living_ac_real_mode_raw
          internal: true
          message: 0x4002
          filters:
            - filter_out: 254
            - filter_out: 255
            - filter_out: 65535
          on_value:
            then:
              - lambda: |-
                  int val = (int) x;
                  std::string text = "Unknown";
                  switch(val) {
                    case 0: text = "Auto"; break;
                    case 1: text = "Cool"; break;
                    case 2: text = "Dry"; break;
                    case 3: text = "Fan"; break;
                    case 4: text = "Heat"; break;
                    case 254: case 255: text = "Off"; break;
                    default: text = "Mode " + to_string(val); break;
                  }
                  id(living_ac_real_mode_text).publish_state(text);

        # 실제 바람 세기 단계 수신 (0x4007) - Auto/Low/Mid/High/Turbo/Windfree/Off
        - id: living_ac_real_fan_speed_raw
          internal: true
          message: 0x4007
          filters:
            - filter_out: 254
            - filter_out: 255
            - filter_out: 65535
          on_value:
            then:
              - lambda: |-
                  int val = (int) x;
                  std::string text = "Unknown";
                  switch(val) {
                    case 0: text = "Auto"; break;
                    case 1: text = "Low"; break;
                    case 2: text = "Mid"; break;
                    case 3: text = "High"; break;
                    case 4: text = "Turbo"; break;
                    case 9: text = "Windfree"; break;
                    case 254: case 255: text = "Off"; break;
                    default: text = "Speed " + to_string(val); break;
                  }
                  id(living_ac_real_fan_speed_text).publish_state(text);

        # 서브 특수 운전 모드 수신 (0x4060) - Normal/Sleep/Quiet/Fast/Longreach/Windfree/Off
        - id: living_ac_alt_mode_raw
          internal: true
          message: 0x4060
          filters:
            - filter_out: 254
            - filter_out: 255
            - filter_out: 65535
          on_value:
            then:
              - lambda: |-
                  int val = (int) x;
                  std::string text = "Normal";
                  switch(val) {
                    case 0: text = "Normal"; break;
                    case 1: text = "Sleep"; break;
                    case 2: text = "Quiet"; break;
                    case 3: text = "Fast"; break;
                    case 6: text = "Longreach"; break;
                    case 9: text = "Windfree"; break;
                    case 254: case 255: text = "Off"; break;
                    default: text = "AltMode " + to_string(val); break;
                  }
                  id(living_ac_alt_mode_text).publish_state(text);

        # 미세먼지 수치 센서 (PM10: 0x42D1, PM2.5: 0x42D2, PM1.0: 0x42D3) - 미설치 시 65535 예외 필터링
        - name: "Living AC PM10 Dust"
          message: 0x42D1
          unit_of_measurement: "µg/m³"
          device_class: pm10
          state_class: measurement
          icon: "mdi:blur"
          filters:
            - filter_out: 65535
          device_id: device_livingroom
        - name: "Living AC PM2.5 Dust"
          message: 0x42D2
          unit_of_measurement: "µg/m³"
          device_class: pm25
          state_class: measurement
          icon: "mdi:blur"
          filters:
            - filter_out: 65535
          device_id: device_livingroom
        - name: "Living AC PM1.0 Dust"
          message: 0x42D3
          unit_of_measurement: "µg/m³"
          state_class: measurement
          icon: "mdi:blur"
          filters:
            - filter_out: 65535
          device_id: device_livingroom

        # 실내기 요구 용량 부하 비율 (0x4211) - 퍼센트(%) 단위
        - name: "Living AC Capacity Request"
          message: 0x4211
          unit_of_measurement: "%"
          state_class: measurement
          icon: "mdi:gauge"
          filters:
            - filter_out: 65535
          device_id: device_livingroom

