    - address: "10.00.00"
      error_code:
        name: "Outdoor Unit Error Code"
        device_id: device_mechanical
      outdoor_instantaneous_power:
        name: "Outdoor Unit Power"
        device_id: device_mechanical
      outdoor_cumulative_energy:
        name: "Outdoor Unit Energy"
        device_id: device_mechanical
      outdoor_current:
        name: "Outdoor Unit Current"
        device_id: device_mechanical
      outdoor_voltage:
        name: "Outdoor Unit Voltage"
        device_id: device_mechanical
      outdoor_temperature: 
        name: "Outdoor Unit Temperature"
        device_id: device_mechanical
      outdoor_operation_odu_mode:
        name: "Outdoor Unit Operation Mode"
        device_id: device_mechanical
      outdoor_operation_heatcool:
        name: "Outdoor Unit Heat-Cool Mode"
        device_id: device_mechanical

      custom_sensor:
        # 실외기 사방밸브 인가 상태 수신 (0x801A) - 1: Heating (On) / 0: Cooling (Off)
        - id: outdoor_4way_valve_raw
          internal: true
          message: 0x801A
          filters:
            - filter_out: 254
            - filter_out: 255
            - filter_out: 65535
          on_value:
            then:
              - lambda: |-
                  int val = (int) x;
                  std::string text = (val == 1) ? "Heating (On)" : "Cooling (Off)";
                  id(outdoor_4way_valve_text).publish_state(text);

        # 토출 압축기 상부 온도 (0x8280) - Raw Integer x10 데이터를 0.1 배율 스케일링하여 소수점 1자리로 변환
        - name: "Outdoor Unit Compressor Top Temp"
          message: 0x8280
          unit_of_measurement: "°C"
          accuracy_decimals: 1
          device_class: temperature
          state_class: measurement
          icon: "mdi:thermometer-lines"
          filters:
            - filter_out: 32767
            - filter_out: 65535
            - multiply: 0.1
          device_id: device_mechanical

        # 실외기 동관 배관 출구 온도 1 (0x8264) - 0.1 배율 스케일링
        - name: "Outdoor Unit Pipe Out 1 Temp"
          message: 0x8264
          unit_of_measurement: "°C"
          accuracy_decimals: 1
          device_class: temperature
          state_class: measurement
          icon: "mdi:thermometer"
          filters:
            - filter_out: 32767
            - filter_out: 65535
            - multiply: 0.1
          device_id: device_mechanical

        # 실외기 동관 배관 출구 온도 2 (0x8265) - 0.1 배율 스케일링
