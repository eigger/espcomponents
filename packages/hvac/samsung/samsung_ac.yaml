# ==============================================================================
# ESPHome 삼성 시스템 에어컨 (NASA 프로토콜) 패키지
# Repository: https://github.com/eigger/espcomponents
# Package: packages/hvac/samsung/samsung_ac.yaml
# Hardware: M5Stack AtomS3 Lite (ESP32-S3) + Tail485 (Atom Tail RS485)
# ==============================================================================

# ESP32-S3 타겟 및 ESP-IDF 프레임워크 설정
esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# Home Assistant 구역(Area) 및 기기 그룹화 정의
esphome:
  areas:
    - id: area_livingroom
      name: ""
    - id: area_bedroom
      name: ""
    - id: area_room_1
      name: ""
    - id: area_room_2
      name: ""
    - id: area_mechanical
      name: ""
      
  devices:
    - id: device_livingroom
      area_id: area_livingroom
      name: "${friendly_name} Livingroom"
    - id: device_livingroom_2
      area_id: area_livingroom
      name: "${friendly_name} Livingroom 2"
    - id: device_bedroom
      area_id: area_bedroom
      name: "${friendly_name} Bedroom"
    - id: device_room_1
      area_id: area_room_1
      name: "${friendly_name} Room 1"
    - id: device_room_2
      area_id: area_room_2
      name: "${friendly_name} Room 2"
    - id: device_mechanical
      area_id: area_mechanical
      name: "${friendly_name} Mechanical"

# ------------------------------------------------------------------------------
# M5Stack AtomS3 Lite + Tail485 통신 핀 및 UART 프로토콜 설정
# - RX Pin: GPIO01 (Groove/Bottom RX)
# - TX Pin: GPIO02 (Groove/Bottom TX)
# - Baud: 9600 bps / Parity: EVEN (삼성 NASA 프로토콜 RS-485 8E1 규격)
# ------------------------------------------------------------------------------
uart:
  rx_pin: GPIO01
  tx_pin: GPIO02
  baud_rate: 9600
  parity: EVEN

# ------------------------------------------------------------------------------
# 삼성 HVAC 메인 통신 컴포넌트 불러오기 (eigger/esphome_samsung_hvac_bus)
# ------------------------------------------------------------------------------
external_components:
  - source: github://eigger/esphome_samsung_hvac_bus
    components: [samsung_ac]
    refresh: always

samsung_ac:
  # NonNASA 장치의 경우, 유휴 상태에서도 절전 모드 진입을 방지
  non_nasa_keepalive: true
  debug_log_undefined_messages: false
  debug_log_messages: false

  devices:
    # 1. 거실 (Living)
    - address: "20.00.03"
      map_auto_to_heat_cool: false
      capabilities:
        horizontal_swing: true
        vertical_swing: true
        heat_mode: false
        presets:
          windfree:
            name: "Windfree"
            enabled: true
          longreach:
            name: "Longreach"
            enabled: true
          sleep:
            name: "Sleep"
            enabled: false
          quiet:
            name: "Quiet"
            enabled: false
          fast:
            name: "Fast"
            enabled: false
          eco:
            name: "Eco"
            enabled: false
      climate:
        name: "Living AC"
        visual:
          temperature_step:
            target_temperature: 0.5
            current_temperature: 0.1
        device_id: device_livingroom
      room_temperature:
        name: "Living AC Temperature"
        device_id: device_livingroom
      room_humidity:
        name: "Living AC Humidity"
        device_id: device_livingroom
      target_temperature:
        name: "Living AC Target Temperature"
        device_id: device_livingroom
        step: 0.5
      power:
        name: "Living AC Power"
        device_id: device_livingroom
      mode:
        name: "Living AC Mode"
        device_id: device_livingroom
      automatic_cleaning:
        name: "Living AC Auto Clean"
        device_id: device_livingroom
      indoor_eva_in_temperature:
        name: "Living AC Eva In Temp"
        device_id: device_livingroom
      indoor_eva_out_temperature:
        name: "Living AC Eva Out Temp"
        device_id: device_livingroom
      room_temperature_offset: 0
      
      # 신규 내장 텍스트 센서
      indoor_real_mode:
        name: "Living AC Real Mode"
        device_id: device_livingroom
      indoor_real_fan_speed:
        name: "Living AC Real Fan Speed"
        device_id: device_livingroom
      indoor_real_alt_mode:
        name: "Living AC Alt Mode"
        device_id: device_livingroom

      # 신규 내장 먼지 & 용량 요구 센서
      pm10:
        name: "Living AC PM10 Dust"
        device_id: device_livingroom
      pm25:
        name: "Living AC PM2.5 Dust"
        device_id: device_livingroom
      pm1_0:
