    name: "Room 2 AC Real Mode"
    id: room_2_ac_real_mode_text
    icon: "mdi:state-machine"
    device_id: device_room_2
  - platform: template
    name: "Room 2 AC Real Fan Speed"
    id: room_2_ac_real_fan_speed_text
    icon: "mdi:fan-clock"
    device_id: device_room_2
  - platform: template
    name: "Room 2 AC Alt Mode"
    id: room_2_ac_alt_mode_text
    icon: "mdi:cog"
    device_id: device_room_2

  # 5) 거실2 (Living 2 AC)
  - platform: template
    name: "Living 2 AC Real Mode"
    id: living_2_ac_real_mode_text
    icon: "mdi:state-machine"
    device_id: device_livingroom
  - platform: template
    name: "Living 2 AC Real Fan Speed"
