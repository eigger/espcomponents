          accuracy_decimals: 1
          device_class: temperature
          state_class: measurement
          icon: "mdi:thermometer"
          filters:
            - filter_out: 32767
            - filter_out: 65535
            - multiply: 0.1
          device_id: device_mechanical

        # 실외기 동관 배관 입구 온도 3 (0x8261) - 0.1 배율 스케일링
