    icon: "mdi:state-machine"
    device_id: device_room_1
  - platform: template
    name: "Room 1 AC Real Fan Speed"
    id: room_1_ac_real_fan_speed_text
    icon: "mdi:fan-clock"
    device_id: device_room_1
  - platform: template
    name: "Room 1 AC Alt Mode"
    id: room_1_ac_alt_mode_text
    icon: "mdi:cog"
    device_id: device_room_1

  # 4) 방2 (Room 2 AC)
