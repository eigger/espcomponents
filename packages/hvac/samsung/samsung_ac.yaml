# ==============================================================================
# ESPHome 삼성 시스템 에어컨 (NASA 프로토콜) 패키지
# Repository: https://github.com/eigger/espcomponents
# Package: packages/hvac/samsung/samsung_ac.yaml
# Hardware: M5Stack AtomS3 Lite (ESP32-S3) + Tail485 (Atom Tail RS485)
# ==============================================================================

# ESP32-S3 타겟 및 ESP-IDF 프레임워크 설정
esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# Home Assistant 구역(Area) 및 기기 그룹화 정의
esphome:
  areas:
    - id: area_livingroom
      name: ""
    - id: area_bedroom
      name: ""
    - id: area_room_1
      name: ""
    - id: area_room_2
      name: ""
    - id: area_mechanical
      name: ""
      
  devices:
    - id: device_livingroom
      area_id: area_livingroom
      name: "${friendly_name} Livingroom"
    - id: device_bedroom
      area_id: area_bedroom
      name: "${friendly_name} Bedroom"
    - id: device_room_1
      area_id: area_room_1
      name: "${friendly_name} Room 1"
    - id: device_room_2
      area_id: area_room_2
      name: "${friendly_name} Room 2"
    - id: device_mechanical
      area_id: area_mechanical
      name: "${friendly_name} Mechanical"

# ------------------------------------------------------------------------------
# M5Stack AtomS3 Lite + Tail485 통신 핀 및 UART 프로토콜 설정
# - RX Pin: GPIO01 (Groove/Bottom RX)
# - TX Pin: GPIO02 (Groove/Bottom TX)
# - Baud: 9600 bps / Parity: EVEN (삼성 NASA 프로토콜 RS-485 8E1 규격)
# ------------------------------------------------------------------------------
uart:
  rx_pin: GPIO01
  tx_pin: GPIO02
  baud_rate: 9600
  parity: EVEN

# ------------------------------------------------------------------------------
# 1. 텍스트 상태 표기를 위한 템플릿 텍스트 센서 (읽기 전용 상태 변환용)
# - raw 수치 메시지를 가독성 있는 문자열(Auto, Cool, Windfree 등)로 표기
# ------------------------------------------------------------------------------
text_sensor:
  # 1) 거실 (Living AC)
  - platform: template
    name: "Living AC Real Mode"
    id: living_ac_real_mode_text
    icon: "mdi:state-machine"
    device_id: device_livingroom
  - platform: template
    name: "Living AC Real Fan Speed"
    id: living_ac_real_fan_speed_text
    icon: "mdi:fan-clock"
    device_id: device_livingroom
  - platform: template
    name: "Living AC Alt Mode"
    id: living_ac_alt_mode_text
    icon: "mdi:cog"
    device_id: device_livingroom

  # 2) 안방 (Master AC)
  - platform: template
    name: "Master AC Real Mode"
    id: master_ac_real_mode_text
    icon: "mdi:state-machine"
    device_id: device_bedroom
  - platform: template
    name: "Master AC Real Fan Speed"
    id: master_ac_real_fan_speed_text
    icon: "mdi:fan-clock"
    device_id: device_bedroom
  - platform: template
    name: "Master AC Alt Mode"
    id: master_ac_alt_mode_text
    icon: "mdi:cog"
    device_id: device_bedroom

  # 3) 방1 (Room 1 AC)
  - platform: template
