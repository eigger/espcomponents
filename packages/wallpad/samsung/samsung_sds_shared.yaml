packages:
  samsung_sds_wallpad: !include samsung_sds.yaml

uart:
  id: samsung_sds_uart

uartex:
  id: samsung_sds_bus
  uart_id: samsung_sds_uart
  rx_priority: loop
  tx_delay: 5ms
  rx_header:
    - [0xA4]
  rx_length: !lambda |-
    if (len < 2) return 0;
    if (data[0] == 0xA4) return 4;
    switch (data[1]) {
      case 0x01: case 0x08: case 0x09: case 0x0A: case 0x0C:
      case 0x10: case 0x12: case 0x13: case 0x1C:
      case 0x79: case 0x7A: return 5;
      case 0x4E: case 0x4F: return 6;
      case 0x6F: return 7;
      case 0x7C: case 0x7D: case 0x7F: return 8;
      case 0x4A: case 0x4B: case 0x6E: return 10;
      default: return 4;
    }
  rx_checksum: !lambda |-
    uint8_t checksum = header[0];
    for (size_t i = 0; i < len; ++i) checksum ^= data[i];
    return checksum & 0x7F;
  tx_checksum: !lambda |-
    uint8_t checksum = 0;
    for (size_t i = 0; i < len; ++i) checksum ^= data[i];
    return checksum & 0x7F;
  on_read:
    then:
      - lambda: |-
          if (len != 4 || data[0] != 0xA4) return;
          switch (data[1]) {
            case 0x5A:
            case 0x41:
              if (data[2] == 0) id(samsung_sds_bus).write_immediate_reply({0xB0, data[1], 0x00});
              break;
            case 0x31:
            case 0x32:
              if (data[2] != 0) break;
              id(samsung_sds_bus).write_immediate_reply({0xB0, data[1], 0x00});
              if (data[1] == 0x31) id(samsung_sds_bell_private).publish_state(true);
              else id(samsung_sds_bell_public).publish_state(true);
              break;
            case 0x3E:
              if (data[2] != 0x01 && data[2] != 0x06 && data[2] != 0x07) break;
              id(samsung_sds_bus).write_immediate_reply({0xB0, data[1], data[2]});
              if (data[2] & 0x01) id(samsung_sds_bell_private).publish_state(false);
              if (data[2] & 0x06) id(samsung_sds_bell_public).publish_state(false);
              break;
          }

binary_sensor:
  - platform: template
    id: samsung_sds_bell_private
    name: "Bell Private"
    icon: mdi:bell-ring
  - platform: template
    id: samsung_sds_bell_public
    name: "Bell Public"
    icon: mdi:bell-ring
