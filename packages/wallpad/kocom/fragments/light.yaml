# Kocom light — vars: room_num, light_num, light_name, device_id
# id: room_{room_num}_light_{light_num}, offset: 7 + light_num
platform: uartex
name: ${light_name}
id: room_${room_num}_light_${light_num}
state:
  data:
    - 0x30
    - 0xd0
    - 0x00
    - 0x0e
    - $room_num
    - 0x01
    - 0x00
    - 0x00
    - 0x00
    - 0x00
    - 0x00
  mask: [0xff, 0xf0, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0x00, 0x00, 0x00]
state_on:
  offset: ${ 7 + light_num | int }
  data: [0xff]
state_off:
  offset: ${ 7 + light_num | int }
  data: [0x00]
command_on:
  data: [0x30, 0xbc, 0x00, 0x0e, $room_num, 0x01, 0x00, 0x00, "${ '0xff' if (light_num | int) == 1 else '0x00' }", "${ '0xff' if (light_num | int) == 2 else '0x00' }", "${ '0xff' if (light_num | int) == 3 else '0x00' }", 0x00, 0x00, 0x00, 0x00, 0x00]
  ack: [0x30, 0xdc, 0x00, 0x0e, $room_num]
  preserve_state: ["${ 9 if (light_num | int) == 1 else 8 }", "${ 9 if (light_num | int) == 3 else 10 }"]
command_off:
  data: [0x30, 0xbc, 0x00, 0x0e, $room_num, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
  ack: [0x30, 0xdc, 0x00, 0x0e, $room_num]
  preserve_state: ["${ 9 if (light_num | int) == 1 else 8 }", "${ 9 if (light_num | int) == 3 else 10 }"]
device_id: ${device_id}
