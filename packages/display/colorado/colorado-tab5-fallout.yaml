  - id: script_render_scan_status
    parameters:
      color_mode: int
      color: lv_color_t
      label: lv_obj_t*
      focus: bool
    then:
      - lambda: |-
          // Ordered from the neutral silhouette to the highest severity.
          const lv_color_t colors[] = {
            lv_color_hex(${tab5_color_text_inactive}),
            lv_color_hex(${tab5_color_status_cool}),
            lv_color_hex(${tab5_color_status_cold}),
            lv_color_hex(${tab5_color_status_warm}),
            lv_color_hex(${tab5_color_status_hot}),
          };
          const lv_opa_t opacities[] = {LV_OPA_30, LV_OPA_40, LV_OPA_40, LV_OPA_50, LV_OPA_60};
          static uint8_t severity_by_mode[27]{};
          if (color_mode < 0 || color_mode >= 27) return;
          const uint8_t previous = severity_by_mode[color_mode];
          uint8_t severity = 0;
          for (uint8_t level = 1; level < sizeof(colors) / sizeof(colors[0]); ++level) {
            if (lv_color_eq(color, colors[level])) {
              severity = level;
              break;
            }
          }
          const bool visible = lv_obj_has_flag(id(obj_splash), LV_OBJ_FLAG_HIDDEN) && !id(g_logs_visible);
          constexpr uint32_t trace_duration = 200;
          uint32_t pulse_delay = 0;
          if (!focus) {
            if (previous == severity) return;
            severity_by_mode[color_mode] = severity;
            lv_obj_t *leader = nullptr;
            switch (color_mode) {
              case 5: leader = id(line_scan_coolant_leader)->obj; break;
              case 14: leader = id(line_scan_oil_pressure_leader)->obj; break;
              case 26: leader = id(line_scan_oil_temperature_leader)->obj; break;
              case 17: leader = id(line_scan_intake_leader)->obj; break;
              case 2: leader = id(line_scan_cabin_temp_leader)->obj; break;
              case 3: leader = id(line_scan_cabin_humidity_leader)->obj; break;
              case 15: leader = id(line_scan_bed_temp_leader)->obj; break;
              case 16: leader = id(line_scan_bed_humidity_leader)->obj; break;
              case 18: leader = id(line_scan_transmission_leader)->obj; break;
              case 7: leader = id(line_scan_voltage_leader)->obj; break;
              case 13: leader = id(line_scan_co2_leader)->obj; break;
              case 12: leader = id(line_scan_tvoc_leader)->obj; break;
            }
            if (leader) {
              // LVGL holds a pointer to the points, so keep each animated pair alive.
              struct LeaderTrace {
                lv_obj_t *line;
                const lv_point_precise_t *full;
                lv_point_precise_t partial[2];
                int32_t progress;
              };
              static LeaderTrace traces[27]{};
              auto &trace = traces[color_mode];
              const auto draw = +[](void *state, int32_t progress) {
                auto &trace = *static_cast<LeaderTrace *>(state);
                trace.progress = progress;
                if (progress == 100) {
                  lv_line_set_points(trace.line, trace.full, 2);
                  return;
                }
                const auto &start = trace.full[0];
                const auto &end = trace.full[1];
                trace.partial[0] = start;
                trace.partial[1].x = start.x + (end.x - start.x) * progress / 100;
                trace.partial[1].y = start.y + (end.y - start.y) * progress / 100;
                lv_line_set_points(trace.line, trace.partial, 2);
              };
              const bool warning = severity >= 3;
              if (warning) lv_obj_set_style_line_color(leader, colors[severity], LV_PART_MAIN);
              if (warning != (previous >= 3)) {
                if (!trace.full) trace = {leader, lv_line_get_points(leader), {}, 0};
                const bool interrupted = lv_anim_delete(&trace, draw);
                const int32_t from = interrupted ? trace.progress : (warning ? 0 : 100);
                const int32_t to = warning ? 100 : 0;
                if (visible && from != to) {
                  const uint32_t duration = warning ? trace_duration : 120;
                  lv_anim_t motion;
                  lv_anim_init(&motion);
                  lv_anim_set_var(&motion, &trace);
                  lv_anim_set_exec_cb(&motion, draw);
                  lv_anim_set_values(&motion, from, to);
                  lv_anim_set_duration(&motion, duration);
                  lv_anim_set_path_cb(&motion, lv_anim_path_linear);
                  if (!warning) {
                    lv_anim_set_completed_cb(&motion, +[](lv_anim_t *anim) {
                      auto &trace = *static_cast<LeaderTrace *>(anim->var);
                      lv_obj_add_flag(trace.line, LV_OBJ_FLAG_HIDDEN);
                      lv_line_set_points(trace.line, trace.full, 2);
                    });
                  }
                  lv_anim_start(&motion);
                  if (warning) {
                    id(tab5_motion_visible)(leader, true, 0);
                    pulse_delay = duration;
                  }
                } else {
                  id(tab5_motion_visible)(leader, warning, 0);
                  lv_line_set_points(leader, trace.full, 2);
                }
              }
            }
          }

          const bool new_warning = !focus && label && severity >= 3 && severity > previous;
          const auto image_opacity = +[](void *object, int32_t opacity) {
            lv_obj_set_style_image_opa(static_cast<lv_obj_t *>(object), opacity, LV_PART_MAIN);
          };
          const auto label_glow = +[](void *object, int32_t opacity) {
            lv_obj_set_style_bg_opa(static_cast<lv_obj_t *>(object), opacity, LV_PART_MAIN);
          };
          const auto pulse = [](lv_obj_t *object, lv_anim_exec_xcb_t apply, int32_t peak, int32_t rest,
                                uint32_t duration, uint32_t delay = 0) {
            lv_anim_delete(object, apply);
            lv_anim_t animation;
            lv_anim_init(&animation);
            lv_anim_set_var(&animation, object);
            lv_anim_set_exec_cb(&animation, apply);
            lv_anim_set_values(&animation, peak, rest);
            lv_anim_set_duration(&animation, duration);
            lv_anim_set_delay(&animation, delay);
            lv_anim_set_early_apply(&animation, delay == 0);
            lv_anim_set_path_cb(&animation, lv_anim_path_ease_out);
            lv_anim_start(&animation);
          };

          const struct {
            lv_obj_t *object;
            std::initializer_list<int> modes;
          } areas[] = {
            {id(widget_img_scan_coolant), {5}},
            {id(widget_img_scan_engine), {8, 9, 14, 17, 26}},
            {id(widget_img_scan_battery), {7, 20}},
            {id(widget_img_scan_transmission), {18, 24}},
            {id(widget_img_scan_cabin), {2, 3}},
            {id(widget_img_scan_cabin_windows), {12, 13}},
            {id(widget_img_scan_fuel), {6}},
            {id(widget_img_scan_bed), {15, 16}},
          };
          for (const auto &area : areas) {
            if (std::find(area.modes.begin(), area.modes.end(), color_mode) == area.modes.end()) continue;
            uint8_t highest = 0, old_highest = 0;
            for (const int mode : area.modes) {
              highest = std::max(highest, severity_by_mode[mode]);
              old_highest = std::max(old_highest, mode == color_mode ? previous : severity_by_mode[mode]);
            }
            if (highest != old_highest) {
              lv_anim_delete(area.object, image_opacity);
              lv_obj_set_style_image_recolor(area.object, colors[highest], LV_PART_MAIN);
              image_opacity(area.object, opacities[highest]);
            }
            if (visible && (focus || (new_warning && (pulse_delay || highest > old_highest)))) {
              image_opacity(area.object, opacities[highest]);
              pulse(area.object, image_opacity, opacities[highest] + LV_OPA_30, opacities[highest], 220, pulse_delay);
            }
            if (visible && new_warning && label) {
              lv_obj_set_style_bg_color(label, color, LV_PART_MAIN);
              pulse(label, label_glow, LV_OPA_10, LV_OPA_TRANSP, 200);
            } else if (!focus && label && severity < previous && lv_anim_delete(label, label_glow)) {
              label_glow(label, LV_OPA_TRANSP);
            }
            break;
          }

  - id: script_update_sensor_text
    parameters:
      label: lv_obj_t*
      text: string
      color: lv_color_t
      color_mode: int
      fade_ms: uint32_t
    then:
      - lambda: |-
          struct Recovery {
            lv_obj_t *seen_label;
            lv_color_t color;
          };
          static Recovery readouts[27]{};
          if (color_mode < 0 || color_mode >= 27) return;
          // Keep air-quality values large; fit the full five-digit sensor range.
          if (color_mode == 12 || color_mode == 13) {
            lv_obj_set_style_text_font(label, text.size() > 4
                ? id(notosans25).get_lv_font() : id(notosans30).get_lv_font(), LV_PART_MAIN);
          }
          // Preserve the existing trip/TCC boxes and units. Measure the full signed
          // value on one line, shrinking only when it exceeds the available width.
          // Start from the original font each time so short values regain their size.
          if (color_mode == 19 || color_mode == 24) {
            const lv_font_t *fonts[] = {
              color_mode == 19 ? id(font_terminal_trip).get_lv_font() : id(notosans30).get_lv_font(),
              id(notosans25).get_lv_font(), id(notosans20).get_lv_font(), id(notosans16).get_lv_font(),
            };
            const int32_t max_width = color_mode == 19 ? 117 : 92;
            const int32_t letter_space = lv_obj_get_style_text_letter_space(label, LV_PART_MAIN);
            const lv_font_t *selected = fonts[3];
            for (const auto *font : fonts) {
              lv_point_t measured;
              lv_text_get_size(&measured, text.c_str(), font, letter_space, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
              if (measured.x <= max_width) {
                selected = font;
                break;
              }
            }
            lv_obj_set_style_text_font(label, selected, LV_PART_MAIN);
          }
          auto &readout = readouts[color_mode];
          const auto tint = +[](void *state, int32_t strength) {
            const auto &readout = *static_cast<Recovery *>(state);
            const auto fill = lv_color_mix(lv_color_white(), readout.color, strength);
            lv_obj_set_style_text_color(readout.seen_label, fill, LV_PART_MAIN);
          };
          const auto missing = [](const char *value) {
            return std::strcmp(value, "--") == 0 || std::strcmp(value, "--:--") == 0;
          };
          const bool valid = !missing(text.c_str());
          const bool recovered = valid && readout.seen_label && missing(lv_label_get_text(label));
          readout.color = color;
          if (valid) readout.seen_label = label;
          else lv_anim_delete(&readout, tint);
          if (!lv_anim_get(&readout, tint)) lv_obj_set_style_text_color(label, color, LV_PART_MAIN);
          id(tab5_motion_label_value)(label, text.c_str(), fade_ms);
          if (!recovered || !lv_obj_has_flag(id(obj_splash), LV_OBJ_FLAG_HIDDEN) ||
              id(g_logs_visible) || id(tab5_motion_notice_active)) return;
          lv_anim_t motion;
          lv_anim_init(&motion);
          lv_anim_set_var(&motion, &readout);
          lv_anim_set_exec_cb(&motion, tint);
          lv_anim_set_values(&motion, LV_OPA_COVER, LV_OPA_TRANSP);
          lv_anim_set_duration(&motion, 320);
          lv_anim_set_path_cb(&motion, lv_anim_path_ease_in);
          lv_anim_start(&motion);

  - id: script_render_readout
    parameters:
      label: lv_obj_t*
      icon: lv_obj_t*
      value: float
      color_mode: int
      decimals: int
      fade_ms: uint32_t
    then:
      - lambda: |-
          const auto color = id(fn_state_color)(value, color_mode);
          const auto text = id(fn_readout_text)(value, decimals);
          id(g_dashboard_samples)[color_mode] = std::isfinite(value) ? esphome::millis() : 0;
          id(script_render_scan_status).execute(color_mode, color, label, false);
          const bool accented = id(tab5_motion_icon)(icon, color, color_mode, false);
          id(script_update_sensor_text).execute(label, text, color, color_mode, accented ? 0 : fade_ms);

  - id: script_render_gauge
    parameters:
      label: lv_obj_t*
      bar: lv_obj_t*
      icon: lv_obj_t*
      value: float
      color_mode: int
      duration: uint32_t
      force_accent: bool
    then:
      - lambda: |-
          const auto color = id(fn_state_color)(value, color_mode);
          const auto text = id(fn_readout_text)(value, 0);
          id(g_dashboard_samples)[color_mode] = std::isfinite(value) ? esphome::millis() : 0;
          id(script_render_scan_status).execute(color_mode, color, label, false);
          id(script_update_sensor_text).execute(label, text, color, color_mode, 0);
          id(tab5_motion_bar)(bar, value, duration);
          lv_obj_set_style_bg_color(bar, color, LV_PART_INDICATOR);
          id(tab5_motion_icon)(icon, color, color_mode, force_accent);

  - id: script_calibrate_tilt
    parameters:
      offset: float*
      angle: float
      button: lv_obj_t*
      axis: string
    then:
      - lambda: |-
          if (std::abs(*offset) > 0.0001f) {
            id(script_confirm_tilt_zero).stop();
            *offset = 0.0f;
            id(script_logs).execute(axis + " calibration cleared");
          } else {
            if (!std::isfinite(angle)) return;
            *offset = angle;
            id(script_confirm_tilt_zero).execute(axis == "Pitch");
            char value[20];
            snprintf(value, sizeof(value), "%+.1f°", angle);
            id(script_logs).execute(axis + " calibrated to " + value);
          }
          id(tab5_motion_outline)(button, 205);

  - id: script_confirm_tilt_zero
    mode: restart
    parameters:
      pitch: bool
    then:
      - wait_until:
          condition:
            lambda: |-
              const float angle = pitch ? id(id_device_pitch).state : id(id_device_roll).state;
              auto *shape = pitch ? id(obj_pitch_shape) : id(obj_roll_shape);
              const int32_t position = lv_obj_get_style_transform_rotation(shape, LV_PART_MAIN);
              return std::isfinite(angle) && std::abs(angle) <= 0.5f && std::abs(position) <= 5;
          timeout: 1500ms
      - lambda: |-
          const float angle = pitch ? id(id_device_pitch).state : id(id_device_roll).state;
          if (!id(g_logs_visible) && std::isfinite(angle) && std::abs(angle) <= 0.5f) {
            id(tab5_motion_outline)(pitch ? id(btn_pitch) : id(btn_roll), 320);
          }

  - id: script_set_service_visible
    parameters:
      show: bool
    then:
      - lambda: |-
          if (show && !id(fn_service_allowed)()) return;
          id(g_logs_visible) = show;
          id(tab5_motion_visible)(id(obj_log), show, 175);
          lv_label_set_text(id(lbl_menu_toggle), show ? "BACK" : "MENU");
          if (show) {
            id(tab5_motion_visible)(id(obj_jaalee_detail), false, 0);
            id(script_refresh_logs).execute(true, false);
          } else {
            id(tab5_motion_visible)(id(obj_restart_backdrop), false, 0);
            id(tab5_motion_visible)(id(obj_restart_popup), false, 0);
          }

  - id: script_sync_service_ui
    then:
      - lambda: |-
          const bool allowed = id(fn_service_allowed)();
          auto *menu = id(btn_logs_toggle);
          if (allowed) {
            lv_obj_remove_state(menu, LV_STATE_DISABLED);
          } else {
            lv_obj_add_state(menu, LV_STATE_DISABLED);
            if (id(g_logs_visible)) id(script_set_service_visible).execute(false);
            id(tab5_motion_visible)(id(obj_jaalee_detail), false, 0);
          }


  - id: script_jaalee_detail
    mode: restart
    parameters:
      bed: bool
    then:
      - lambda: |-
          id(g_jaalee_detail_bed) = bed;
          const uint32_t last = id(g_jaalee_last_seen)[bed ? 1 : 0];
          const float battery = bed ? id(id_bed_battery_level).state : id(id_cabin_battery_level).state;
          lv_label_set_text(id(lbl_jaalee_name), bed ? "적재함 Jaalee" : "실내 Jaalee");
          if (battery >= 0.0f && battery <= 100.0f) {
            lv_label_set_text_fmt(id(lbl_jaalee_battery), "배터리 %u%%", static_cast<unsigned>(std::lround(battery)));
          } else {
            lv_label_set_text(id(lbl_jaalee_battery), "배터리 --");
          }
          if (last == 0) {
            lv_label_set_text(id(lbl_jaalee_age), "수신 기록 없음");
          } else {
            const uint32_t seconds = (esphome::millis() - last) / 1000;
            lv_label_set_text_fmt(id(lbl_jaalee_age), seconds < 60 ? "마지막 수신 %u초 전" : "마지막 수신 %u분 전",
                                  static_cast<unsigned>(seconds < 60 ? seconds : seconds / 60));
          }
          id(tab5_motion_visible)(id(obj_jaalee_detail), true, 130);
      - delay: 4s
      - lambda: id(tab5_motion_visible)(id(obj_jaalee_detail), false, 0);

  - id: script_logs
    parameters:
      log: string
    then:
      - lambda: |-
          auto &logs = id(g_logs);
          const auto time = id(sntp_time).now();
          char timestamp[16];
          snprintf(timestamp, sizeof(timestamp), "[%02d:%02d:%02d] ", time.hour, time.minute, time.second);
          const char *tag = "[INFO] ";
          if (log.starts_with("Wifi ") || log.starts_with("OBD BLE ") || log.starts_with("ws_bridge ") ||
              log == "NTP Time Synced") {
            tag = "[LINK] ";
          } else if (log.starts_with("Pitch") || log.starts_with("Roll") || log.starts_with("Jaalee ")) {
            tag = "[SENS] ";
          } else if (id(tab5_motion_notice_active) && log.starts_with("ALERT: ") && log != "ALERT: Dismissed") {
            tag = "[WARN] ";
          }
          size_t length = std::min(log.size(), 127 - std::strlen(timestamp));
          // Keep the existing message limit without cutting a UTF-8 character in half.
          while (length > 0 && length < log.size() &&
                 (static_cast<unsigned char>(log[length]) & 0xC0) == 0x80) {
            --length;
          }
          logs.emplace_back(std::string(timestamp) + tag + log.substr(0, length));
          if (logs.size() > 50) logs.erase(logs.begin());
          if (id(g_logs_visible)) {
            ++id(g_log_unread);
            id(script_refresh_logs).execute(false, false);
          }

  - id: script_refresh_logs
    parameters:
      follow: bool
      animate: bool
    then:
      - lambda: |-
          if (!id(g_logs_visible)) return;
          auto &unread = id(g_log_unread);
          if (!follow && unread == 0) return;
          auto *view = id(obj_log_scroll);
          auto *latest_button = id(lbl_log_latest_button);
          if (!follow && (lv_obj_is_scrolling(view) || lv_obj_get_scroll_bottom(view) > 8)) {
            // Keep the displayed snapshot stable even if the oldest buffered row was evicted.
            if (unread > 99) lv_label_set_text(latest_button, "새 로그 99+");
            else lv_label_set_text_fmt(latest_button, "새 로그 +%u", static_cast<unsigned>(unread));
            return;
          }
          unread = 0;
          if (follow) id(g_log_highlight_pending) = false;
          lv_label_set_text(latest_button, "> 최근으로");

          const auto &logs = id(g_logs);
          std::string text;
          for (size_t i = 0; i + 1 < logs.size(); ++i) {
            if (!text.empty()) text += '\n';
            text += logs[i];
          }
          lv_label_set_text(id(lbl_log_text), text.c_str());
          id(tab5_motion_visible)(id(lbl_log_text), !text.empty(), 0);
          auto *latest = id(lbl_log_latest_entry);
          lv_label_set_text(latest, logs.empty() ? "아직 기록이 없습니다." : logs.back().c_str());
          lv_label_set_text_fmt(id(lbl_log_count), "%u / 50", static_cast<unsigned>(logs.size()));

          lv_obj_update_layout(view);
          const int32_t bottom = lv_obj_get_scroll_bottom(view);
          const bool scroll_animated = animate && bottom > 0;
          if (scroll_animated) id(g_log_highlight_pending) = true;
          lv_obj_scroll_to_y(view, lv_obj_get_scroll_y(view) + bottom, scroll_animated ? LV_ANIM_ON : LV_ANIM_OFF);
          if (animate && !scroll_animated) id(tab5_motion_outline)(latest, 260);

packages:
  tab5_common:
    url: https://github.com/eigger/espcomponents.git
    file: packages/display/tab5_common.yaml
    ref: master
    refresh: 0s
