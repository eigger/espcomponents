    accuracy_decimals: 4
    internal: true
    on_value:
      - lambda: id(g_info_accel_at) = esphome::millis();
  - platform: motion
    motion_id: tab5_imu
    type: angular_rate_x
    name: "BMI270 Gyro X"
    accuracy_decimals: 3
    internal: true
  - platform: motion
    motion_id: tab5_imu
    type: angular_rate_y
    name: "BMI270 Gyro Y"
    accuracy_decimals: 3
    internal: true
  - platform: motion
    motion_id: tab5_imu
    type: angular_rate_z
    name: "BMI270 Gyro Z"
    accuracy_decimals: 3
    internal: true
  - platform: bmi270
    bmi270_id: tab5_imu
    name: "BMI270 Temperature"
    internal: true
  - platform: jaalee_jht
    mac_address: ${mac_cabin_jht}
    temperature:
      id: "id_cabin_temperature"
      name: "Cabin Temperature"
      internal: true
      on_value:
        then:
          - lambda: |-
              if (std::isfinite(x)) id(g_jaalee_last_seen)[0] = esphome::millis();
              id(script_render_readout).execute(id(lbl_cabin_temperature), id(widget_img_cabin_temp), x, 2, 1, 155);
          - script.execute: script_update_trip_report
    humidity:
      id: "id_cabin_humidity"
      name: "Cabin Humidity"
      internal: true
      on_value:
        then:
          - lambda: id(script_render_readout).execute(id(lbl_cabin_humidity), id(widget_img_cabin_humidity), x, 3, 1, 155);
          - script.execute: script_update_trip_report
    battery_level:
      id: "id_cabin_battery_level"
      name: "Cabin Battery Level"
      internal: true
  - platform: jaalee_jht
    mac_address: ${mac_bed_jht}
    temperature:
      id: "id_bed_temperature"
      name: "Bed Temperature"
      internal: true
      on_value:
        then:
          - lambda: |-
              if (std::isfinite(x)) id(g_jaalee_last_seen)[1] = esphome::millis();
              id(script_render_readout).execute(id(lbl_bed_temperature), id(widget_img_bed_temp), x, 15, 1, 155);
          - script.execute: script_update_trip_report
    humidity:
      id: "id_bed_humidity"
      name: "Bed Humidity"
      internal: true
      on_value:
        then:
          - lambda: id(script_render_readout).execute(id(lbl_bed_humidity), id(widget_img_bed_humidity), x, 16, 1, 155);
          - script.execute: script_update_trip_report
    battery_level:
      id: "id_bed_battery_level"
      name: "Bed Battery Level"
      internal: true
  - platform: ble_elm327
    reconnect_count:
      name: "ELM327 Reconnects"
      id: id_elm_reconnect_count
    timeout_count:
      name: "ELM327 Timeouts"
      id: id_elm_timeouts
    error_count:
      name: "ELM327 Error Responses"
      id: id_elm_error_responses
    no_data_count:
      name: "ELM327 NO DATA Responses"
      id: id_elm_no_data_responses
    write_failure_count:
      name: "ELM327 Write Failures"
      id: id_elm_write_failures
    response_time:
      name: "ELM327 Response Time"
      id: id_elm_response_time
  - platform: ble_elm327
    id: "engine_run_time"
    <<: &obd_sensor
      # Restore functional OBD addressing and automatic receive filtering after TPMS.
      pre_commands: ["ATSH 7DF", "ATCRA"]
      internal: true
    name: "Engine Run Time"
    preset: run_time
    update_interval: 5s
    on_value:
      then:
        - lambda: |-
            const bool valid = std::isfinite(x) && x >= 0.0f;
            id(g_dashboard_samples)[11] = valid ? esphome::millis() : 0;
            if (valid) {
              if (x < id(g_warmup_last_runtime) || x == 0.0f) id(g_warmup_completed).fill(false);
              id(g_warmup_last_runtime) = x;
            }
  - platform: ble_elm327
    id: "engine_coolant_temperature"
    <<: *obd_sensor
    name: "Engine Coolant Temperature"
    preset: coolant_temp
    update_interval: 10s
    on_value:
      then:
        - lambda: id(script_render_readout).execute(id(lbl_engine_coolant_temperature), id(widget_img_coolant), x, 5, 0, 0);
  - platform: ble_elm327
    id: "fuel_level"
    <<: *obd_sensor
    name: "Fuel Level"
    preset: fuel_level
    update_interval: 30s
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - delta: 0.5
    on_raw_value:
      then:
        - lambda: |-
            // A valid response can be suppressed by the delta filter.
            if (std::isfinite(x) && std::isfinite(id(fuel_level).state)) {
              if (id(g_dashboard_samples)[6] == 0) {
                id(script_render_gauge).execute(id(lbl_fuel_level), id(bar_fuel), id(widget_img_fuel),
                                                id(fuel_level).state, 6, 400, false);
              } else {
                id(g_dashboard_samples)[6] = esphome::millis();
              }
            }
    on_value:
      then:
        - lambda: |-
            id(script_render_gauge).execute(id(lbl_fuel_level), id(bar_fuel), id(widget_img_fuel), x, 6, 400, false);
  - platform: ble_elm327
    id: "gm_fuel_level_liters"
    <<: *obd_sensor
    name: "Fuel Level Liters"
    preset: gm_fuel_level_liters
    update_interval: 30s
  - platform: ble_elm327
    id: "throttle"
    <<: *obd_sensor
    name: "Throttle Position"
    preset: throttle
    update_interval: 1s
    on_value:
      - lambda: 'id(g_dashboard_samples)[25] = std::isfinite(x) ? esphome::millis() : 0;'
  - platform: ble_elm327
    id: "intake_air_temperature"
    <<: *obd_sensor
    name: "Intake Air Temperature"
    preset: intake_air_temp
    update_interval: 10s
    on_value:
      then:
        - lambda: id(script_render_readout).execute(id(lbl_intake_temp_display), id(widget_img_intake), x, 17, 0, 0);
  - platform: ble_elm327
    id: "ambient_air_temperature"
    <<: *obd_sensor
    name: "Ambient Air Temperature"
    preset: ambient_temp
    update_interval: 30s
    on_value:
      then:
        - lambda: |-
            id(g_ambient_sample_ms) = std::isfinite(x) && x >= -40.0f && x <= 60.0f
                ? esphome::millis() : 0;
  - platform: ble_elm327
    id: "car_battery"
    <<: *obd_sensor
    name: "Car Battery"
    preset: battery_voltage
    update_interval: 10s
    on_value:
      then:
        - lambda: |-
            id(script_render_readout).execute(id(lbl_car_battery), id(widget_img_battery),
                                              x <= 5.0f ? NAN : x, 7, 1, 0);
        - script.execute: script_refresh_engine_dependents

  - platform: template
    id: "car_battery_soc"
    name: "Car Battery SOC"
    icon: mdi:battery-charging
    unit_of_measurement: "%"
    state_class: "measurement"
    accuracy_decimals: 0
    internal: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            const float rpm = id(fn_sample_live)(8, id(engine_rpm).state, 8000);
            const bool engine_on = rpm >= 400.0f;
            const char *title = !std::isfinite(rpm) ? "배터리" : engine_on ? "충전율" : "잔량";
            const bool changed = std::strcmp(lv_label_get_text(id(lbl_battery_title)), title) != 0;
            if (changed) lv_label_set_text(id(lbl_battery_title), title);
            id(script_render_gauge).execute(id(lbl_battery_soc), id(bar_battery_soc), id(widget_img_battery_soc),
                                            x, 20, 375, changed && engine_on);
            // A derived value must retain the voltage sample's age, not this redraw's time.
            id(g_dashboard_samples)[20] = std::isfinite(x) ? id(g_dashboard_samples)[7] : 0;
  - platform: ble_elm327
    id: "engine_rpm"
    <<: *obd_sensor
    name: "Engine RPM"
    preset: rpm
    update_interval: 1s
    on_value:
      then:
        - lambda: |-
            if (std::isfinite(x) && x >= 0.0f) id(g_boot_obd_received) = true;
            id(script_render_gauge).execute(id(lbl_engine_rpm_left), id(bar_engine_rpm), id(widget_img_rpm), x, 8, 200, false);
        - script.execute: script_update_trip_report
        - script.execute: script_refresh_engine_dependents
  - platform: ble_elm327
    id: "engine_load"
    <<: *obd_sensor
    name: "Engine Load"
    preset: engine_load
    update_interval: 1s
    on_value:
      then:
        - lambda: |-
            id(script_render_gauge).execute(id(lbl_engine_load_left), id(bar_engine_load), id(widget_img_load), x, 9, 220, false);
  - platform: ble_elm327
    id: "car_speed"
    <<: *obd_sensor
    name: "Car Speed"
    preset: speed
    update_interval: 1s
    filters:
      - lambda: |-
          if (x >= 255) return {};
          return x;
    on_value:
      then:
        - lambda: |-
            if (!id(obd_client).connected()) return;
            id(script_render_speed).execute(x);
            if (std::isfinite(x)) {
              if (x >= 0.0f) id(g_boot_obd_received) = true;
              id(script_speed_expire).execute();
            } else {
              id(script_speed_expire).stop();
            }
        - lambda: id(script_update_acceleration).execute(x);
        - script.execute: script_tick_vehicle_scan

  - platform: template
    id: "car_acceleration"
    name: "Car Acceleration"
    icon: mdi:speedometer
    state_class: "measurement"
    unit_of_measurement: km/h/s
    update_interval: never
    internal: true

  - platform: ble_elm327
    id: "odometer"
    <<: *obd_sensor
    name: "Odometer"
    preset: odometer
    update_interval: 30s
    on_value:
      then:
        - lambda: |-
            if (!isnan(x) && x > 0) {
              if (id(g_initial_odometer) < 0) {
                id(g_initial_odometer) = x;
              }
              float trip = x - id(g_initial_odometer);
              id(trip_distance).publish_state(trip);
            }
  - platform: template
    id: "trip_distance"
    name: "Trip Distance"
    icon: mdi:map-marker-distance
    state_class: "measurement"
    unit_of_measurement: "km"
    device_class: "distance"
    accuracy_decimals: 0
    internal: true
    update_interval: never
    on_value:
      then:
        - lambda: id(script_render_readout).execute(id(lbl_trip_distance), id(widget_img_trip), x, 19, 0, 0);
        - script.execute: script_update_trip_report

  - platform: ble_elm327
    id: "gear_position"
    <<: *obd_sensor
    name: "Gear Position"
    preset: gm_current_gear
    update_interval: 1s
    on_value:
      then:
        - lambda: |-
            id(g_dashboard_gear) = x;
            id(g_dashboard_samples)[21] = std::isfinite(x) ? esphome::millis() : 0;
            id(script_render_gear).execute(true);

  - platform: ble_elm327
    id: "prnd_status_alt"
    <<: *obd_sensor
    name: "PRND Status"
    preset: gm_prnd_status_alt
    update_interval: 1s
    on_value:
      then:
        - lambda: |-
            const char *text = "-";
            id(g_dashboard_samples)[22] = std::isfinite(x) ? esphome::millis() : 0;
            if (std::isfinite(x)) {
              switch ((int)x) {
                case 8: text = "P"; break;
                case 7: text = "R"; break;
                case 6: text = "N"; break;
                case 18: text = "D"; break;
                default: text = "L"; break;
              }
            }
            id(script_render_prnd).execute(text);
        - script.execute: script_tick_vehicle_scan

  - platform: ble_elm327
    id: "engine_oil_pressure"
    <<: *obd_sensor
    name: "Engine Oil Pressure"
    preset: gm_oil_pressure_calculated
    update_interval: 2s
    on_value:
      then:
        - lambda: |-
            id(script_render_readout).execute(id(lbl_oil_pressure), id(widget_img_oil_pressure), x, 14, 0, 0);

  # GM calculated engine oil temperature, 7E0 / 22 1154 (A - 40).
  # An unsupported/no-data response remains unavailable; do not synthesize a value.
  - platform: ble_elm327
    id: engine_oil_temperature
    pre_commands: ["ATSH 7E0", "ATCRA 7E8"]
    name: "Engine Oil Temperature (Calculated)"
    preset: gm_oil_temp
    unit_of_measurement: "°C"
    update_interval: 10s
    internal: true
    filters:
      - lambda: |-
          return std::isfinite(x) && x > -40.0f && x <= 210.0f ? x : NAN;
    on_value:
      then:
        - lambda: id(script_render_readout).execute(id(lbl_oil_temperature), id(widget_img_oil_temperature), x, 26, 0, 0);

  - platform: ble_elm327
    id: "transmission_temperature"
    <<: *obd_sensor
    name: "Transmission Fluid Temperature"
    preset: gm_trans_temp
    update_interval: 10s
    on_value:
      then:
        - lambda: id(script_render_readout).execute(id(lbl_transmission_temperature), id(widget_img_trans_temp), x, 18, 0, 0);

  - platform: ble_elm327
    id: transmission_tcc_slip
    <<: *obd_sensor
    name: "Torque Converter Clutch Slip"
    preset: gm_tcc_slip
    update_interval: 1s
    on_value:
      - lambda: |-
          // Flag repeated excursions from near lockup for the diagram.
          const uint32_t now = esphome::millis();
          auto &samples = id(g_dashboard_samples);
          const auto fresh = [&](int mode, uint32_t limit) {
            return samples[mode] != 0 && now - samples[mode] < limit;
          };
          const bool continuous = fresh(24, 3000);
          samples[24] = std::isfinite(x) ? now : 0;
          if (!continuous || !std::isfinite(x)) id(g_tcc_slip_warning_at) = 0;

          const float speed = id(car_speed).state;
          const float rpm = id(engine_rpm).state;
          const float throttle_position = id(throttle).state;
          const float temperature = id(transmission_temperature).state;
          const float gear = fresh(21, 3000) ? id(g_dashboard_gear) : NAN;
          struct SlipWindow {
            float speed = NAN, rpm = NAN, throttle = NAN, gear = NAN;
            uint32_t last_peak = 0;
            bool near_lockup = false;
          };
          static SlipWindow window;
          if (!std::isfinite(x) || !fresh(10, 3000) || !fresh(8, 3000) || !fresh(25, 3000) ||
              !fresh(18, 35000) || !(speed >= 65 && speed <= 90) ||
              !(rpm >= 1100 && rpm <= 1800) || !(temperature >= 50 && temperature <= 120)) {
            window = {};
            return;
          }
          const bool shifted = std::isfinite(gear) && std::isfinite(window.gear) && gear != window.gear;
          if (!continuous || !std::isfinite(window.speed) || shifted ||
              std::fabs(speed - window.speed) > 2.0f ||
              std::fabs(rpm - window.rpm) > 150.0f ||
              std::fabs(throttle_position - window.throttle) > 3.0f) {
            window = {speed, rpm, throttle_position, gear};
          } else if (!std::isfinite(window.gear)) {
            window.gear = gear;
          }
          const float slip = std::fabs(x);
          if (slip <= 40.0f) window.near_lockup = true;
          if (slip < 100.0f || !window.near_lockup) return;
          window.near_lockup = false;
          if (window.last_peak != 0 && now - window.last_peak <= 15000) {
            id(g_tcc_slip_warning_at) = now;
          }
          window.last_peak = now;

