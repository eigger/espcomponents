ble_elm327:
  id: obd_elm
  ble_client_id: obd_client
  service_uuid: "18F0"
  rx_char_uuid: "2AF0"
  tx_char_uuid: "2AF1"
  init_commands:
    - "ATSP6"
    #- "ATCRA 7E8"
  tx_delay: 0

#DIP, CORE3, PIN, TAB5
#PPS
#2 - G10 - 2 - G16
#TXD
#2 - G13 - 23 - G47
#RXD
#3 - G14 - 26 - G51

uart:
#  - id: uart_pm25
#    rx_pin: GPIO7
#    tx_pin: GPIO6
#    baud_rate: 9600
  - id: uart_gps
    rx_pin: GPIO51
    tx_pin: GPIO47
    baud_rate: 38400
    debug:
      direction: RX
      after:
        delimiter: "\r"
      sequence:
        - lambda: |-
            // Observe the bytes read by the GPS component using the same NMEA parser.
            static TinyGPSPlus parser;
            static std::array<char, 150> sentence{};
            static size_t sentence_size = 0;
            const auto valid_coordinate = [](std::string_view field, size_t whole_digits, unsigned limit) {
              if (field.size() < whole_digits) return false;
              unsigned degrees_minutes = 0;
              for (const char digit : field.substr(0, whole_digits)) {
                if (digit < '0' || digit > '9') return false;
                degrees_minutes = degrees_minutes * 10 + (digit - '0');
              }
              bool fraction_nonzero = false;
              if (field.size() > whole_digits) {
                if (field[whole_digits] != '.' || field.size() == whole_digits + 1) return false;
                for (const char digit : field.substr(whole_digits + 1)) {
                  if (digit < '0' || digit > '9') return false;
                  fraction_nonzero |= digit != '0';
                }
              }
              const unsigned degrees = degrees_minutes / 100;
              const unsigned minutes = degrees_minutes % 100;
              return minutes < 60 && (degrees < limit ||
                  (degrees == limit && minutes == 0 && !fraction_nonzero));
            };
            const auto valid_position = [&](std::string_view message) {
              const auto checksum = message.find('*');
              if (checksum == std::string_view::npos) return false;
              message = message.substr(0, checksum);
              std::array<std::string_view, 7> fields{};
              for (auto &field : fields) {
                const auto comma = message.find(',');
                field = message.substr(0, comma);
                if (comma == std::string_view::npos) break;
                message.remove_prefix(comma + 1);
              }
              if (fields[0].size() != 6 || fields[0].front() != '$') return false;
              const auto type = fields[0].substr(3);
              if (type != "RMC" && type != "GGA") return false;
              const size_t latitude = type == "RMC" ? 3 : 2;
              const auto north_south = fields[latitude + 1];
              const auto east_west = fields[latitude + 3];
              return (north_south == "N" || north_south == "S") &&
                  (east_west == "E" || east_west == "W") &&
                  valid_coordinate(fields[latitude], 4, 90) &&
                  valid_coordinate(fields[latitude + 2], 5, 180);
            };
            const uint64_t now = esphome::millis_64();
            for (const uint8_t byte : bytes) {
              if (byte == '$') sentence_size = 0;
              if (sentence_size < sentence.size()) sentence[sentence_size++] = static_cast<char>(byte);
              const uint32_t previous_fix_count = parser.sentencesWithFix();
              if (!parser.encode(byte)) continue;
              if (!id(fn_gps_receiving)(now)) id(g_gps_latest_fix) = false;
              id(g_gps_nmea_at) = now;
              // RMC and GGA commit time even when they report no position.
              if (parser.time.isUpdated()) {
                parser.time.value();
                // The parser can commit cached coordinates when a fix sentence omits a field.
                id(g_gps_latest_fix) = parser.sentencesWithFix() != previous_fix_count &&
                    valid_position({sentence.data(), sentence_size});
              }
            }

