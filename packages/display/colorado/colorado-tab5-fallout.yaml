    name: "Car Battery"
    preset: battery_voltage
    update_interval: 10s
    internal: true
    on_value:
      then:
        - lambda: |-
            id(script_render_readout).execute(id(lbl_car_battery), id(widget_img_battery),
                                              x <= 5.0f ? NAN : x, 7, 1, 0);
        - lambda: |-
            if (isnan(x) || x <= 5.0f) {
              id(car_battery_soc).publish_state(NAN);
              return;
            }
            float soc = 0.0f;
            bool engine_on = !isnan(id(engine_rpm).state) && id(engine_rpm).state >= 400.0f;
            // 발전기 저전압 지속시간 추적: 시동 중 12.8V 미만이 시작된 시각을 기록, 벗어나면 리셋
            if (engine_on && x < 12.8f) {
              if (id(alt_low_since_ms) == 0) id(alt_low_since_ms) = esphome::millis();
            } else {
              id(alt_low_since_ms) = 0;
            }
            if (engine_on) {
              // 시동 중: 알터네이터 충전 강도/충전율 (12.8V ~ 15.0V -> 0% ~ 100%, mode 7 정상 상한과 정렬)
              if (x <= 12.8f) soc = 0.0f;
              else soc = (x - 12.8f) / 2.2f * 100.0f;
            } else {
              // 시동 전: 12V 배터리 자체 잔량 (11.7V ~ 12.7V -> 0% ~ 100%)
              if (x <= 11.7f) soc = 0.0f;
              else if (x <= 12.7f) soc = (x - 11.7f) / 1.0f * 100.0f;
              else if (x <= 13.5f) soc = 100.0f;
              else soc = 100.0f + (x - 13.5f) * 50.0f;
            }
            if (soc > 120.0f) soc = 120.0f;
            if (soc < 0.0f) soc = 0.0f;
            id(car_battery_soc).publish_state(soc);

