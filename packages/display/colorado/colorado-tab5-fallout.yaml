          else lv_label_set_text_static(id(lbl_report_average_speed), "평균속도 -- km/h");

  - id: script_render_trip_report
    then:
      - lambda: |-
          id(g_trip_replay_available) = false;
          id(script_trip_replay).execute(0);
          const bool live = id(g_trip_in_progress);
          const auto &summary = live ? id(g_live_trip_summary) : id(g_trip_report);
          const auto &[km, saved_elapsed, coolant, transmission, engine_oil, min_voltage, max_voltage] = summary;
          const bool available = live || (std::isfinite(km) && km >= ${trip_report_min_km} &&
              std::isfinite(saved_elapsed) && saved_elapsed >= 0.0f);
          auto &notes = id(g_trip_view_notes);
