              - label: { <<: *terminal_heading, text: "km/h", y: 197, width: 300, text_align: RIGHT }
              - bar:
                  id: bar_speed
                  align: top_left
                  y: 237
                  width: 300
                  height: 8
                  min_value: 0
                  max_value: 160
                  animated: false
                  <<: &terminal_bar
                    bg_color: "${tab5_color_gauge_track}"
                    bg_opa: COVER
                    radius: 0
                    border_width: 0
                    pad_all: 0
                    clickable: false
                    indicator: { bg_color: "${tab5_color_accent}", radius: 0 }
              - obj:
                  <<: *terminal_panel
                  align: top_left
                  y: 262
                  width: 216
