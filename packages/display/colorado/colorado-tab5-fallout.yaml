                        bg_image_opa: 4%
                        bg_image_recolor: "${tab5_color_accent}"
                        bg_image_recolor_opa: COVER
                        clickable: true
                        scrollable: true
                        scroll_dir: VER
                        scrollbar_mode: AUTO
                        layout: { type: flex, flex_flow: COLUMN, pad_row: 6 }
                        scrollbar: { bg_color: "${tab5_color_card_border}", bg_opa: COVER, width: 5, radius: 0 }
                        on_boot:
                          - lambda: |-
                              constexpr int width = 1224;
                              constexpr int height = 64;
                              static constexpr auto pixels = [] {
                                constexpr int stride = width / 8;
                                std::array<uint8_t, stride * height> mask{};
                                for (int row = 0; row < height; row += 4) {
                                  std::fill_n(mask.begin() + row * stride, stride, 0xFF);
                                }
                                return mask;
                              }();
                              static image::Image scanlines(pixels.data(), width, height, image::IMAGE_TYPE_BINARY,
                                                           image::TRANSPARENCY_OPAQUE);
                              lv_obj_set_style_bg_image_src(id(obj_log_scroll), scanlines.get_lv_image_dsc(), LV_PART_MAIN);
                        on_scroll_end:
                          - delay: 1ms
                          - lambda: |-
                              auto *view = id(obj_log_scroll);
                              if (!id(g_logs_visible) || id(g_service_setup) || lv_obj_is_scrolling(view)) return;
                              if (lv_obj_get_scroll_bottom(view) > 8) {
                                lv_label_set_text(id(lbl_log_follow), "FOLLOW: HOLD");
                                return;
                              }
                              lv_label_set_text(id(lbl_log_follow), "FOLLOW: ON");
                              id(script_refresh_logs).execute(false, false);
                              if (!id(g_log_highlight_pending)) return;
                              id(g_log_highlight_pending) = false;
                              fx::play(id(lbl_log_latest_entry), id(fx_glow_260));
