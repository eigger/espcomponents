          // Rebuild the SVG-derived 1-bit masks at compile time from filled rectangles.
          struct MaskRect { uint8_t x, y, width, height; };
          constexpr auto make_mask = [](auto pixels, int width, std::initializer_list<MaskRect> rectangles) constexpr {
            const int stride = (width + 7) / 8;
            for (const auto &rect : rectangles) {
              for (int y = rect.y; y < rect.y + rect.height; ++y) {
                for (int x = rect.x; x < rect.x + rect.width; ++x) {
                  pixels[y * stride + x / 8] |= 0x80 >> (x % 8);
