script:
  - id: script_render_speed
    parameters:
      speed: float
    then:
      - lambda: |-
          const bool valid = std::isfinite(speed);
          id(g_dashboard_samples)[10] = valid ? esphome::millis() : 0;
          const auto color = id(fn_state_color)(valid ? speed : NAN, 10);
          char text[12] = "--";
          if (valid) snprintf(text, sizeof(text), "%d", static_cast<int>(speed));
          id(script_update_sensor_text).execute(id(lbl_speed), text, color, 10, 0);
          auto *bar = id(bar_speed);
          lv_obj_set_style_bg_opa(bar, valid ? LV_OPA_COVER : LV_OPA_40, LV_PART_MAIN);
          lv_obj_set_style_bg_color(bar,
              valid && speed <= 110.0f ? lv_color_hex(${tab5_color_accent}) : color,
              LV_PART_INDICATOR);
          id(tab5_motion_bar)(bar, valid ? speed : NAN, speed < lv_bar_get_value(bar) ? 165 : 220);
          id(script_sync_service_ui).execute();

  - id: script_render_tpms
    then:
      - lambda: |-
          const uint32_t now = esphome::millis();
          const bool connected = id(obd_client).connected();
          constexpr float low_kpa = ${tpms_low_kpa};
          const struct {
            lv_obj_t *marker;
            lv_obj_t *label;
            float pressure;
          } tires[] = {
            {id(obj_tire_front_left), id(lbl_tpms_front_left), id(tire_pressure_front_left).state},
            {id(obj_tire_front_right), id(lbl_tpms_front_right), id(tire_pressure_front_right).state},
            {id(obj_tire_rear_left), id(lbl_tpms_rear_left), id(tire_pressure_rear_left).state},
            {id(obj_tire_rear_right), id(lbl_tpms_rear_right), id(tire_pressure_rear_right).state},
          };
          const uint8_t previous_low_tires = id(g_tpms_low_tires);
          uint8_t low_tires = 0;
          for (size_t i = 0; i < id(g_tpms_samples).size(); ++i) {
            const auto &tire = tires[i];
            const uint32_t sampled_at = id(g_tpms_samples)[i];
            const uint8_t bit = 1u << i;
            const bool was_low = (previous_low_tires & bit) != 0;
            const bool valid = connected && sampled_at != 0 && now - sampled_at < 75000 &&
                tire.pressure >= 0.0f && tire.pressure <= 600.0f;
            const bool low = valid && tire.pressure < low_kpa + (was_low ? 10.0f : 0.0f);
            if (low) low_tires |= bit;
            const bool show = low || id(g_tpms_show_all);
            if (show) {
              char text[16] = "-- kPa";
              if (valid) snprintf(text, sizeof(text), "%.0f kPa", tire.pressure);
              lv_label_set_text(tire.label, text);
              lv_obj_set_style_text_color(tire.label, lv_color_hex(low
                  ? ${tab5_color_status_warm} : ${tab5_color_text_muted}), LV_PART_MAIN);
              lv_obj_remove_flag(tire.label, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(tire.label, LV_OBJ_FLAG_HIDDEN);
            }
            if (low != was_low) {
              lv_obj_set_style_bg_color(tire.marker, lv_color_hex(low
                  ? ${tab5_color_status_warm} : ${tab5_color_text_inactive}), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(tire.marker, low ? LV_OPA_COVER : LV_OPA_30, LV_PART_MAIN);
            }
          }
          id(g_tpms_low_tires) = low_tires;

  - id: script_render_prnd
    parameters:
      position: string
    then:
      - lambda: |-
          auto *label = id(lbl_prnd);
          if (position == lv_label_get_text(label)) return;
          const char *positions = "PRNDL";
          const char *slot = position.size() == 1 ? std::strchr(positions, position[0]) : nullptr;
          auto *selection = id(obj_prnd_selection);
          const auto move_selection = +[](void *obj, int32_t x) {
            lv_obj_set_x(static_cast<lv_obj_t *>(obj), x);
          };
          static const auto flash = +[](void *obj, int32_t strength) {
            const auto fill = lv_color_mix(lv_color_white(), lv_color_hex(${tab5_color_accent}), strength);
            lv_obj_set_style_bg_color(static_cast<lv_obj_t *>(obj), fill, LV_PART_MAIN);
            lv_obj_set_style_bg_opa(id(obj_prnd_confirm), strength, LV_PART_MAIN);
          };
          lv_anim_delete(selection, move_selection);
          lv_anim_delete(selection, flash);
          flash(selection, LV_OPA_TRANSP);
          if (slot) {
            const int32_t target = 43 * (slot - positions);
            const bool animate = !lv_obj_has_flag(selection, LV_OBJ_FLAG_HIDDEN) &&
                                 lv_obj_has_flag(id(obj_splash), LV_OBJ_FLAG_HIDDEN) &&
                                 !id(tab5_motion_notice_active) && !id(g_logs_visible);
            lv_obj_remove_flag(selection, LV_OBJ_FLAG_HIDDEN);
            if (animate) {
              lv_obj_update_layout(selection);
              lv_anim_t motion;
              lv_anim_init(&motion);
              lv_anim_set_var(&motion, selection);
              lv_anim_set_exec_cb(&motion, move_selection);
              lv_anim_set_values(&motion, lv_obj_get_x(selection), target);
              lv_anim_set_duration(&motion, 160);
              lv_anim_set_path_cb(&motion, lv_anim_path_ease_out);
              lv_anim_set_completed_cb(&motion, +[](lv_anim_t *anim) {
                lv_anim_t confirmation;
                lv_anim_init(&confirmation);
                lv_anim_set_var(&confirmation, anim->var);
                lv_anim_set_exec_cb(&confirmation, flash);
                lv_anim_set_values(&confirmation, LV_OPA_COVER, LV_OPA_TRANSP);
                lv_anim_set_duration(&confirmation, 340);
                lv_anim_set_path_cb(&confirmation, lv_anim_path_ease_in);
                lv_anim_start(&confirmation);
              });
              lv_anim_start(&motion);
            } else {
              lv_obj_set_x(selection, target);
            }
          } else {
            id(tab5_motion_visible)(selection, false, 0);
          }
          id(tab5_motion_prnd)(label, id(lbl_gear), position.c_str());
          id(script_render_gear).execute(false);

  - id: script_render_gear
    parameters:
      animate: bool
    then:
      - lambda: |-
          auto *label = id(lbl_gear);
          const char position = lv_label_get_text(id(lbl_prnd))[0];
          const float gear = id(g_dashboard_gear);
          const bool valid = (position == 'D' || position == 'L') &&
                             std::isfinite(gear) && gear >= 1.0f && gear < 100.0f;
          char text[4] = "-";
          if (valid) snprintf(text, sizeof(text), "%d", static_cast<int>(gear));
          const char *previous = lv_label_get_text(label);
          const bool changed = std::strcmp(previous, text) != 0;
          if (animate && !changed) return;
          const int last = std::atoi(previous);
          const auto slide = +[](void *obj, int32_t offset) {
            lv_obj_set_style_translate_y(static_cast<lv_obj_t *>(obj), offset, LV_PART_MAIN);
          };
          lv_anim_delete(label, slide);
          slide(label, 0);
          if (!changed) return;
          lv_label_set_text(label, text);
          if (!animate || !valid || !last || id(tab5_motion_notice_active) ||
              !lv_obj_has_flag(id(obj_splash), LV_OBJ_FLAG_HIDDEN) || id(g_logs_visible)) return;
          lv_anim_t motion;
          lv_anim_init(&motion);
          lv_anim_set_var(&motion, label);
          lv_anim_set_exec_cb(&motion, slide);
          lv_anim_set_values(&motion, gear > last ? 14 : -14, 0);
          lv_anim_set_duration(&motion, 140);
          lv_anim_set_path_cb(&motion, lv_anim_path_ease_out);
          lv_anim_start(&motion);

  - id: script_render_pose
    then:
      - lambda: |-
          const auto rotate = +[](void *object, int32_t angle) {
            lv_obj_set_style_transform_rotation(static_cast<lv_obj_t *>(object), angle, LV_PART_MAIN);
          };
          const struct {
            lv_obj_t *shape;
            lv_obj_t *value;
            float angle;
            float direction;
            float offset;
          } axes[] = {
            {id(obj_pitch_shape), id(lbl_pitch_value), id(id_device_pitch).state, ${tab5_pitch_direction}, id(g_pitch_offset)},
            {id(obj_roll_shape), id(lbl_roll_value), id(id_device_roll).state, ${tab5_roll_direction}, id(g_roll_offset)},
          };
          for (const auto &axis : axes) {
            const bool valid = std::isfinite(axis.angle);
            const int32_t target = valid ? std::lround(std::clamp(axis.angle * axis.direction, -25.0f, 25.0f) * 10.0f) : 0;
            lv_obj_set_style_opa(axis.shape, valid ? LV_OPA_COVER : LV_OPA_30, LV_PART_MAIN);
            lv_obj_set_style_text_color(axis.value, lv_color_hex(valid && std::abs(axis.offset) > 0.0001f
                ? ${tab5_color_accent} : ${tab5_color_text_muted}), LV_PART_MAIN);
            const auto *active = lv_anim_get(axis.shape, rotate);
            const int32_t from = lv_obj_get_style_transform_rotation(axis.shape, LV_PART_MAIN);
            if ((active && active->end_value == target) || (!active && from == target)) continue;
            lv_anim_delete(axis.shape, rotate);
            if (!valid || !lv_obj_has_flag(id(obj_splash), LV_OBJ_FLAG_HIDDEN)) {
              rotate(axis.shape, target);
              continue;
            }
            lv_anim_t motion;
            lv_anim_init(&motion);
            lv_anim_set_var(&motion, axis.shape);
            lv_anim_set_exec_cb(&motion, rotate);
            lv_anim_set_values(&motion, from, target);
            lv_anim_set_duration(&motion, 165);
            lv_anim_set_path_cb(&motion, lv_anim_path_ease_out);
            lv_anim_start(&motion);
          }

  - id: script_speed_expire
    mode: restart
    then:
      # Keep the UI fresh even if BLE is connected and the ECU stops replying.
      - delay: 5s
      - lambda: id(script_render_speed).execute(NAN);

  - id: script_dashboard_watchdog
    parameters:
      install: bool
      disconnect: bool
    then:
      - lambda: |-
          constexpr uint32_t jaalee_timeout_ms = 300000;
          const struct {
            int mode;
            lv_obj_t *label;
            lv_obj_t *icon;
            lv_obj_t *bar;
            uint32_t timeout;
            bool obd;
          } readouts[] = {
            {2, id(lbl_cabin_temperature), id(widget_img_cabin_temp), nullptr, jaalee_timeout_ms, false},
            {3, id(lbl_cabin_humidity), id(widget_img_cabin_humidity), nullptr, jaalee_timeout_ms, false},
            {5, id(lbl_engine_coolant_temperature), id(widget_img_coolant), nullptr, 35000, true},
            {6, id(lbl_fuel_level), id(widget_img_fuel), id(bar_fuel), 100000, true},
            {7, id(lbl_car_battery), id(widget_img_battery), nullptr, 35000, true},
            {8, id(lbl_engine_rpm_left), id(widget_img_rpm), id(bar_engine_rpm), 8000, true},
            {9, id(lbl_engine_load_left), id(widget_img_load), id(bar_engine_load), 8000, true},
            {12, id(lbl_cabin_tvoc), id(widget_img_cabin_tvoc), nullptr, 8000, false},
            {13, id(lbl_cabin_co2), id(widget_img_cabin_co2), nullptr, 15000, false},
            {14, id(lbl_oil_pressure), id(widget_img_oil_pressure), nullptr, 10000, true},
            {15, id(lbl_bed_temperature), id(widget_img_bed_temp), nullptr, jaalee_timeout_ms, false},
            {16, id(lbl_bed_humidity), id(widget_img_bed_humidity), nullptr, jaalee_timeout_ms, false},
            {17, id(lbl_intake_temp_display), id(widget_img_intake), nullptr, 35000, true},
            {18, id(lbl_transmission_temperature), id(widget_img_trans_temp), nullptr, 35000, true},
            {19, id(lbl_trip_distance), id(widget_img_trip), nullptr, 100000, true},
            {20, id(lbl_battery_soc), id(widget_img_battery_soc), id(bar_battery_soc), 35000, true},
            {24, id(lbl_tcc_slip), id(widget_img_tcc_slip), id(bar_tcc_slip), 3000, true},
            {26, id(lbl_oil_temperature), id(widget_img_oil_temperature), nullptr, 35000, true},
          };
          if (install) {
            id(id_bmi270_accel_x).add_on_state_callback([](float value) {
              id(g_dashboard_samples)[23] = std::isfinite(value) ? esphome::millis() : 0;
            });
            esphome::sensor::Sensor *const tire_sensors[] = {
              id(tire_pressure_front_left), id(tire_pressure_front_right),
              id(tire_pressure_rear_left), id(tire_pressure_rear_right),
            };
            for (size_t i = 0; i < id(g_tpms_samples).size(); ++i) {
              tire_sensors[i]->add_on_state_callback([i](float value) {
                id(g_tpms_samples)[i] = std::isfinite(value) ? esphome::millis() : 0;
              });
            }
            const auto focus = +[](lv_event_t *event) {
              const auto mode = static_cast<int>(reinterpret_cast<intptr_t>(lv_event_get_user_data(event)));
              id(script_render_scan_status).execute(mode, lv_color_t{}, nullptr, true);
              const bool bed = mode == 15 || mode == 16;
              if ((!bed && mode != 2 && mode != 3) || !id(fn_service_allowed)()) return;
              auto *detail = id(obj_jaalee_detail);
              if (!lv_obj_has_flag(detail, LV_OBJ_FLAG_HIDDEN) && id(g_jaalee_detail_bed) == bed) {
                id(script_jaalee_detail).stop();
                id(tab5_motion_visible)(detail, false, 0);
                return;
              }
              id(script_jaalee_detail).execute(bed);
            };
            for (const auto &readout : readouts) {
              if (readout.mode == 19) continue;
              auto *card = lv_obj_get_parent(readout.label);
              lv_obj_add_flag(card, LV_OBJ_FLAG_CLICKABLE);
              lv_obj_add_event_cb(card, focus, LV_EVENT_CLICKED,
                                  reinterpret_cast<void *>(static_cast<intptr_t>(readout.mode)));
            }
            return;
          }

          auto &samples = id(g_dashboard_samples);
          if (disconnect) {
            id(alt_low_since_ms) = 0;
            samples[24] = samples[25] = 0;
            id(g_tcc_slip_warning_at) = 0;
            id(g_tpms_samples).fill(0);
          }
          const uint32_t now = esphome::millis();
          const auto expired = [&](int mode, uint32_t timeout) {
            return samples[mode] != 0 && now - samples[mode] >= timeout;
          };
          for (const auto &readout : readouts) {
            if (samples[readout.mode] == 0) continue;
            if (!(disconnect && readout.obd) && !expired(readout.mode, readout.timeout)) continue;
            if (readout.bar) {
              id(script_render_gauge).execute(readout.label, readout.bar, readout.icon, NAN, readout.mode, 0, false);
            } else {
              id(script_render_readout).execute(readout.label, readout.icon, NAN, readout.mode, 0, 0);
            }
          }
          if (disconnect || expired(11, 20000)) samples[11] = 0;
          if (disconnect || expired(21, 8000)) {
            samples[21] = 0;
            id(g_dashboard_gear) = NAN;
            id(script_render_gear).execute(false);
          }
          if (disconnect || expired(22, 8000)) {
            samples[22] = 0;
            id(script_render_prnd).execute("-");
          }

