# Public Fallout dashboard. Requires hass-esphome-ota and its locally managed package.
# Keep Wi-Fi, Home Assistant, and generated OTA secrets in local secrets.yaml.
substitutions:
  name: "esp-colorado-tab5"
  friendly_name: "ESP Colorado TAB5"
  tab5_panel: ili9881c  # ili9881c, st7123, or st7121; match the rear label.
  tab5_display_models:
    ili9881c: M5STACK-TAB5
    st7123: M5STACK-TAB5-ST7123
    st7121: M5STACK-TAB5-ST7121
  tab5_touch_profiles:
    gt911:
      platform: gt911
      update_interval: never
      reset_pin: {pi4ioe5v6408: pi4ioe1, number: 5}
      calibration: {x_min: 0, x_max: 720, y_min: 0, y_max: 1280}
    st7123:
      platform: st7123
      # The first poll initializes the controller before it attaches the interrupt.
      update_interval: 50ms

  tab5_color_shadow: 0x000000
  number: "00가 0000"
  splash_title: "COLORADO"
  # Boot identity: badge, trim name and powertrain (ASCII; shown in Share Tech Mono).
  splash_trim_badge: "Z71"
  splash_trim: "MIDNIGHT"
  splash_powertrain: "3.6L V6"
  ui_sound_base_url: "https://raw.githubusercontent.com/eigger/espcomponents/4378a8291c63775ae8e420bf97d3998537120baf/packages/display/colorado/sounds"
  tab5_motion_emphasis: 1
  # Local phosphor palette.
  tab5_color_background: 0x07100B
  tab5_color_panel_bg: 0x0B160E
  tab5_color_card_bg: 0x122218
  tab5_color_card_border: 0x35583C
  tab5_color_gauge_track: 0x284631
  tab5_color_text_primary: 0xD4FFCA
  tab5_color_text_secondary: 0xB9F3AE
  tab5_color_text_muted: 0x9DC598
  tab5_color_text_inactive: 0x608D63
  tab5_color_link_off: 0x68746C
  tab5_color_link_search: 0xD4C480
  tab5_color_accent: 0xAEF799
  tab5_color_status_cold: 0x9BB5DB
  tab5_color_status_cool: 0xA3CDDB
  tab5_color_status_warm: 0xFFD08A
  tab5_color_status_hot: 0xFF8C84
  tab5_color_humidity_dry: 0xB8A687
  tab5_color_humidity_very_dry: 0xDCC190
  tab5_color_humidity_humid: 0x83BEB0
  tab5_color_humidity_very_humid: 0x70E4C2
  tab5_color_status_ok: 0x83CC72
  tab5_color_alert_warning: 0x643B0D
  tab5_color_alert_danger: 0x792A25
  tab5_color_alert_notice: 0x254E31
  tab5_color_button_bg: 0x203C28
  tab5_color_button_pressed: 0x31573B
  tab5_color_danger_pressed: 0x792A25
  tab5_color_panel_pressed: 0x1D3525
  mac_vlinker: "02:00:00:00:00:01" #MC+
  #mac_vlinker: "02:00:00:00:00:04"  #ICAR PRO
  mac_cabin_jht: "02:00:00:00:00:02"
  mac_bed_jht: "02:00:00:00:00:03"
  oil_pressure_low_idle_kpa: 68.94757
  oil_pressure_warn_idle_kpa: 103.42135
  oil_pressure_low_above_idle_kpa: 124.10562
  oil_pressure_warn_above_idle_kpa: 172.36893
  oil_pressure_high_kpa: 551.58057
  tpms_low_kpa: "200"
  # Engine-off time before >13.5 V is treated as a fault; surface charge decays after shutdown.
  battery_rest_settle_s: "600"
  # Delays the boot typing timeline if the speaker starts later than the player state reports.
  boot_sync_offset_ms: "0"
  # C6 firmware manifest: {"versions": [{"version", "url", "sha256"}]}; firmware is downloaded from its url.
  c6_firmware_manifest_url: "https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json"
  # Configurable UI advisory thresholds; these are not GM diagnostic limits.
  # Display thresholds only; these do not determine driving readiness.
  oil_temperature_cold_c: "50"
  oil_temperature_cool_c: "60"
  oil_temperature_warn_c: "95"
  oil_temperature_hot_c: "110"
  # Colorado LGZ / 8L45: GM 21-NA-047 uses 50-70 C for a TCC road test,
  # not as a normal operating range or a minimum driving-ready temperature.
  transmission_warmup_reference_c: "48"  # User-selected display reference; not a GM limit.
  # Local UI advisories, NOT verified GM overheat / DTC thresholds.
  transmission_temperature_warn_c: "110"
  transmission_temperature_hot_c: "130"
  # Local warm-up display timing, NOT GM specifications. Ambient affects time only.
  warmup_ambient_reference_c: "20"
  warmup_ambient_span_c: "40"  # Full extension at -20 C or colder.
  coolant_warmup_base_s: "600"
  coolant_warmup_max_s: "1200"
  transmission_warmup_base_s: "900"
  transmission_warmup_max_s: "1800"
  # Invert an axis if the installed display/sensor orientation requires it.
  tab5_pitch_direction: "-1"  # Correct the nose-up/nose-down rotation for this installation.
  tab5_roll_direction: "1"
  # Visual inclination bands, not vehicle stability or rollover limits.
  tab5_tilt_warm_deg: "10"
  tab5_tilt_hot_deg: "20"

  ui_ascii: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
  # Shared by the warning popup and the log. Add characters from external parking text here.
  ui_alert_hangul: "가감경고과급기낮높능데동력료리미발방배버변부상새속스시압업엔연열오요위유음의이일장전족졸주진충치터트필하험환타어저앞뒤왼른쪽"
  ui_extra_glyphs: "패응답지연결사운드음량소거켜짐꺼재생테스트본체무선"

.helpers:
  ver: &version !lambda 'return std::string(ESPHOME_PROJECT_VERSION);'
  card_style: &card_style
    bg_color: "${tab5_color_card_bg}"
    border_width: 1
    border_color: "${tab5_color_card_border}"
    radius: 12
    pad_all: 0
  button_shape: &button_shape
    radius: 8
    border_width: 0
  neutral_button: &neutral_button
    <<: *button_shape
    bg_color: "${tab5_color_button_bg}"
    pressed:
      bg_color: "${tab5_color_button_pressed}"
  danger_button: &danger_button
    <<: *button_shape
    bg_color: "${tab5_color_status_hot}"
    pressed:
      bg_color: "${tab5_color_danger_pressed}"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.10.2
  # This config intentionally uses YAML anchors with per-instance key overrides
  # for the reusable terminal widget styles. ESPHome warns on valid overrides.
  merge_warnings: false
  on_boot:
    # Reset integrated panels after GPIO-expander setup and before display/touch setup.
    - priority: 850
      then:
        - lambda: |-
            if (std::strcmp("${ tab5_panel | lower }", "ili9881c") == 0) return;
            constexpr uint8_t lcd_reset = 4;
            constexpr uint8_t touch_reset = 5;
            auto *expander = id(pi4ioe1);
            expander->digital_write(lcd_reset, false);
            expander->digital_write(touch_reset, false);
            expander->pin_mode(lcd_reset, gpio::FLAG_OUTPUT);
            expander->pin_mode(touch_reset, gpio::FLAG_OUTPUT);
            delay(100);
            expander->digital_write(touch_reset, true);
            // Release LCD reset via pull-up, as the M5Stack factory firmware does.
            expander->pin_mode(lcd_reset, gpio::FLAG_INPUT | gpio::FLAG_PULLUP);
            delay(100);
    # Sound player and LVGL objects must exist before applying restored settings.
    - priority: -100
      then:
        - script.execute:
            id: script_logs
            log: *version
        # ES8388 setup alone leaves its analog outputs powered down.
        # Tab5's onboard amplifier is wired to LINE1.
        - lambda: |-
            if (!id(tab5_audio_dac).set_dac_output(es8388::DAC_OUTPUT_LINE1)) {
              ESP_LOGE("ui_sound", "Failed to enable ES8388 LINE1 speaker output");
            }
        - switch.turn_on: speaker_enable
        - script.execute: script_sound_apply
        - light.turn_on:
            id: backlight
            brightness: 40%
        # Cue 0 may play before normal UI/connection sounds are enabled.
        - script.execute: { id: script_sound_play, cue: 0 }
        # Align the visual sequence with actual player startup, or continue muted.
        - wait_until:
            condition:
              lambda: |-
                return id(g_sound_duration) == 0 ||
                    id(ui_sound_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING ||
                    id(ui_sound_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
            timeout: 1s
        # Terminal typing timeline keyed to the boot WAV's hits (see script_boot_typing).
        - script.execute: script_boot_typing
        # Total splash time is 3300ms, matching the selected boot WAV.
        - delay: !lambda return 3300 + ${boot_sync_offset_ms};
        - script.execute: script_init_scan_images
        - script.execute:
            id: script_dashboard_watchdog
            install: true
            disconnect: false
        - lvgl.page.show: main_page
        - lvgl.widget.show:
            id: obj_header
        # Before lvgl_fx.start nothing animates; the splash fade is a boot sequence, so it is forced.
        - lvgl_fx.set: { id: obj_splash, visible: false, force: true }
        - delay: 200ms
        - lvgl.widget.hide:
            id: obj_splash
        - lvgl_fx.start:
        - lambda: |-
            id(g_motion_ready) = true;
            id(g_sound_ready) = true;

# Required for this device: enable both PSRAM execution and hosted buffers in PSRAM.
esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      execute_from_psram: true
    sdkconfig_options:
      CONFIG_LWIP_TCPIP_TASK_STACK_SIZE: "6144"
      CONFIG_LWIP_CHECK_THREAD_SAFETY: y
      CONFIG_LWIP_TCPIP_CORE_LOCKING: n

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1
  use_psram: true

# ESP32-C6 co-processor (Wi-Fi/BLE over ESP-Hosted) firmware. The manifest lists ESPHome's
# builds; the component installs only versions not newer than the host esp_hosted library.
update:
  - platform: esp32_hosted
    id: c6_update
    name: "C6 Firmware"
    type: http
    source: ${c6_firmware_manifest_url}
    # Check once after networking is ready at boot; subsequent checks use the C6 button.
    update_interval: never


# Tab5 hardware and system services.
psram:
  mode: hex
  speed: 200MHz

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz
    scan: false
  - id: ext_bus
    sda: GPIO53
    scl: GPIO54
    scan: false

pi4ioe5v6408:
  - id: pi4ioe1
    i2c_id: bsp_bus
    address: 0x43
  - id: pi4ioe2
    i2c_id: bsp_bus
    address: 0x44

logger:
  level: DEBUG
  baud_rate: 921600

safe_mode:


switch:
  - platform: restart
    name: "Restart"
    id: sw_restart
  - platform: safe_mode
    name: "Restart Safemode"
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON
    internal: true
  - platform: gpio
    id: usb_5v_power
    name: "USB Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
    internal: true
  - platform: gpio
    id: quick_charge
    name: "Quick Charge"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 5
      inverted: true
    internal: true
  - platform: gpio
    id: charge_enable
    name: "Charge Enable"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 7
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: wifi_antenna_int_ext
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0
    internal: true
  - platform: gpio
    id: speaker_enable
    name: "Speaker Enable"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: external_5v_power
    name: "External 5V Power"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 2
    restore_mode: ALWAYS_ON
    internal: true

select:
  - platform: template
    id: wifi_antenna_select
    name: "WiFi Antenna"
    options:
      - "Internal"
      - "External"
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: return i == 0;
          then:
            - switch.turn_off: wifi_antenna_int_ext
          else:
            - switch.turn_on: wifi_antenna_int_ext
    internal: true

motion:
  - platform: bmi270
    id: tab5_imu
    i2c_id: bsp_bus
    address: 0x68
    update_interval: 200ms

touchscreen:
  - >-
    ${ dict(tab5_touch_profiles['gt911' if tab5_panel | lower == 'ili9881c' else 'st7123'],
            id='touch', i2c_id='bsp_bus', interrupt_pin='GPIO23') }

esp_ldo:
  - voltage: 2.5V
    channel: 3

display:
  - platform: mipi_dsi
    model: ${ tab5_display_models[tab5_panel | lower] }
    dimensions:
      height: 1280
      width: 720
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
      # The ST712x boot hook drives reset low; display setup keeps the pin released.
      mode: ${ 'OUTPUT' if tab5_panel | lower == 'ili9881c' else 'INPUT_PULLUP' }

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms
    internal: true

i2s_audio:
  - id: tab5_audio_bus
    i2s_lrclk_pin: GPIO29
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO30

audio_dac:
  - platform: es8388
    id: tab5_audio_dac
    i2c_id: bsp_bus
    address: 0x10

speaker:
  - platform: i2s_audio
    id: tab5_speaker
    i2s_audio_id: tab5_audio_bus
    i2s_dout_pin: GPIO26
    audio_dac: tab5_audio_dac
    dac_type: external
    channel: mono
    sample_rate: 48000
    bits_per_sample: 16bit
    buffer_duration: 100ms
    timeout: never

media_player:
  - platform: speaker
    id: ui_sound_player
    internal: true
    buffer_size: 32768
    volume_initial: 40%
    # ES8388 maps 0..100% to -96..0 dB. Use -48..0 dB for the UI range;
    # otherwise the default 40% is about -58 dB and barely audible.
    # The media player still passes an exact zero through for silence.
    volume_min: 50%
    announcement_pipeline:
      speaker: tab5_speaker
      format: WAV
      sample_rate: 48000
      num_channels: 1
    files:
      - id: sound_boot
        file: ${ui_sound_base_url}/boot_mechanical_terminal.wav
      - id: sound_menu_open
        file: ${ui_sound_base_url}/ui_menu_open_retro.wav
      - id: sound_menu_close
        file: ${ui_sound_base_url}/ui_menu_close_retro.wav
      - id: sound_click
        file: ${ui_sound_base_url}/ui_click_retro_chime.wav
      - id: sound_success
        file: ${ui_sound_base_url}/ui_success_retro_chime.wav
      - id: sound_warning
        file: ${ui_sound_base_url}/ui_warning_retro_chime_padded.wav
      - id: sound_danger
        file: ${ui_sound_base_url}/ui_danger_retro_chime_double_padded.wav
      - id: sound_failure
        file: ${ui_sound_base_url}/ui_failure_retro.wav
      - id: sound_notice
        file: ${ui_sound_base_url}/ui_notice_retro_chime.wav
      - id: sound_wifi_connected
        file: ${ui_sound_base_url}/link_wifi_connected_retro.wav
      - id: sound_wifi_disconnected
        file: ${ui_sound_base_url}/link_wifi_disconnected_retro.wav
      - id: sound_bluetooth_connected
        file: ${ui_sound_base_url}/link_bluetooth_connected_retro.wav
      - id: sound_bluetooth_disconnected
        file: ${ui_sound_base_url}/link_bluetooth_disconnected_retro.wav
      - id: sound_gps_connected
        file: ${ui_sound_base_url}/link_gps_connected_retro.wav
      - id: sound_gps_disconnected
        file: ${ui_sound_base_url}/link_gps_disconnected_retro.wav

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Seoul
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - lvgl.widget.show:
            id: lbl_date
        - lvgl.widget.show:
            id: lbl_time
        - lambda: id(script_logs).execute("NTP Time Synced");

ws_bridge:
  host: !secret ha_address
  port: 443
  ssl: true
  token: !secret ha_token
  gateway_id: "${name}"
  name: "${friendly_name}"
  model: "Tab5"
  manufacturer: "M5Stack"
  hw_version: *version
  keep_last_state_on_disconnect: true
  sync_entities: true
  on_connected:
    then:
      - lambda: |-
          id(script_logs).execute("ws_bridge Connected");
  on_disconnected:
    then:
      - lambda: id(script_logs).execute("ws_bridge Disconnected");
  trackers:
    - name: "${friendly_name} Tracker"
      unique_id: "${name}_tracker"
      report_unknown: false
      latitude: !lambda 'return id(id_gps_latitude).state;'
      longitude: !lambda 'return id(id_gps_longitude).state;'
      gps_accuracy: !lambda |-
        float h = id(id_gps_hdop).state;
        return isnan(h) ? 10.0f : (h * 2.5f);
      update_interval: 10s
      icon: "mdi:crosshairs-gps"
  entities:
    - source_id: wifi_sig
    - source_id: fuel_level
    #- source_id: throttle
    - source_id: engine_rpm
    #- source_id: engine_load
    - source_id: car_speed
    #- source_id: car_acceleration
    #- source_id: gear_position
    #- source_id: prnd_status_alt
    #- source_id: actual_torque
    #- source_id: car_battery_soc
    - source_id: engine_oil_pressure
    - source_id: transmission_temperature
    - source_id: transmission_tcc_slip
    - source_id: tire_pressure_front_left
    - source_id: tire_pressure_front_right
    - source_id: tire_pressure_rear_left
    - source_id: tire_pressure_rear_right
    - source_id: ambient_air_temperature
    - source_id: engine_coolant_temperature
    - source_id: car_battery
    - source_id: odometer
    - source_id: trip_distance
    - source_id: id_sgp30_eco2
    - source_id: id_sgp30_tvoc
    - source_id: id_scd40_co2
    - source_id: id_scd40_temperature
    - source_id: id_scd40_humidity
    - source_id: id_tab5_internal_temperature
    - source_id: id_cabin_temperature
    - source_id: id_cabin_humidity
    - source_id: id_cabin_battery_level
    - source_id: id_bed_temperature
    - source_id: id_bed_humidity
    - source_id: id_bed_battery_level
    - source_id: engine_run_time
    - source_id: gm_fuel_level_liters
    - source_id: ota_update
    - source_id: c6_update
    # - source_id: id_pm1_0
    # - source_id: id_pm2_5
    # - source_id: id_pm10_0
    - source_id: id_gps_speed
    - source_id: id_gps_altitude
    - source_id: id_gps_satellites
    #- source_id: id_gps_hdop
    - source_id: id_gnss_bmp280_temperature
    - source_id: id_gnss_bmp280_pressure
    - source_id: id_elm_reconnect_count
    - source_id: id_elm_last_error


    - source_id: id_elm_timeouts
    - source_id: id_elm_error_responses
    - source_id: id_elm_no_data_responses
    - source_id: id_elm_write_failures
    - source_id: id_elm_response_time

# api:
#   batch_delay: 1s
#   reboot_timeout: 0s

wifi:
  power_save_mode: none
  reboot_timeout: 0s
  fast_connect: true
  id: tab5_wifi
  networks:
    - ssid: !secret colorado_wifi_ssid
      password: !secret colorado_wifi_password
      priority: 10
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 5

  on_connect:
    then:
      - lambda: id(script_logs).execute("Wifi Connected");
  on_disconnect:
    then:
      - lambda: id(script_logs).execute("Wifi Disconnected");

external_components:
  - source: github://eigger/espcomponents@master
    components: [jaalee_jht, ble_elm327, ws_bridge, lvgl_fx]
    refresh: always

# Dashboard motion. Sizes are the tab5_motion_emphasis look; intensity scales them when it is 0.
# Decorative motion is suppressed before boot and while an urgent popup or service view is up.
lvgl_fx:
  id: motion_fx
  motion:
    fast: 100ms
    normal: 165ms
    slow: 320ms
    intensity: "${ 1.0 if tab5_motion_emphasis | int else 0.7 }"
  # About 70 animated widgets: 19 icons, 9 scan areas, ~21 readout labels, popups and links, PRND, poses.
  max_targets: 80
  slots_in_psram: true
  suppress_when: !lambda return id(g_notice_active) || id(g_logs_visible);

  transitions:
    defaults:
      visible: { show: fade, hide: none, duration: normal, curve: ease_out }   # fade in, hide at once
      value: { duration: 200ms, curve: ease_out }
      text: { style: fade, from: "${ 82 if tab5_motion_emphasis | int else 88 }%", duration: 155ms, curve: ease_out }
      color: { duration: 0ms }
      position: { duration: 160ms, curve: ease_out }
      rotation: { duration: 165ms, curve: ease_out }
    custom:
      - id: fx_show_130
        visible: { show: fade, hide: none, duration: 130ms }
      - id: fx_show_175
        visible: { show: fade, hide: none, duration: 175ms }
      - id: fx_show_185
        visible: { show: fade, hide: none, duration: 185ms }
      - id: fx_splash_out
        visible: { show: fade, hide: fade, duration: 200ms }
      # Gauge glides: the bars of the dashboard.
      - id: fx_bar_165
        policy: always
        value: { duration: 165ms }
      - id: fx_bar_220
        policy: always
        value: { duration: 220ms }
      - id: fx_bar_375
        policy: always
        value: { duration: 375ms }
      - id: fx_bar_400
        policy: always
        value: { duration: 400ms }
      - id: fx_instrument
        policy: always
        value: { duration: 200ms }
        rotation: { duration: 165ms, curve: ease_out }
      - id: fx_text_now
        text: { style: none }
      - id: fx_text_80
        text: { duration: 80ms }
      # The gear digit rolls in from below (up-shift) or above (down-shift) without fading.
      - id: fx_gear_roll
        text: { style: roll, distance: 14, from: 100%, duration: 140ms }
      # PRND selection bar: slides to the letter, then flashes.
      - id: fx_prnd_move
        position: { duration: 160ms, curve: ease_out }
        then: fx_prnd_confirm

    bindings:
      - { id: obj_splash, visible: fx_splash_out }
      - { id: popup_alert, visible: fx_show_185 }
      - { id: obj_restart_backdrop, visible: fx_show_185 }
      - { id: obj_restart_popup, visible: fx_show_185 }
      - { id: obj_log, visible: fx_show_175 }
      - { id: obj_jaalee_detail, visible: fx_show_130 }
      - { id: bar_tcc_slip, value: fx_bar_165 }
      - { id: obj_pitch_shape, rotation: fx_instrument }
      - { id: obj_roll_shape, rotation: fx_instrument }
      - { id: obj_prnd_selection, position: fx_prnd_move }
      - { id: lbl_gear, text: fx_gear_roll }

  effects:
    - id: fx_prnd_confirm
      tracks:
        - flash: { property: bg_color, color: white, duration: 340ms, curve: ease_in }
    # The dark bar under the letter fades into the selection once the move has ended (160 ms).
    - id: fx_prnd_bar
      tracks:
        - flash: { property: bg_color, color: "${tab5_color_background}", duration: 340ms, curve: ease_in, delay: 160ms }
    - id: fx_prnd_pulse
      tracks:
        - pulse: { scale: 120%, duration: 230ms, curve: ease_out }

    # Readout icon accents (which one a color earns is decided by fn_icon_accent).
    - id: fx_icon_light
      tracks:
        - flash: { property: image_recolor, amount: 29%, profile: triangle, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }
    - id: fx_icon_heat
      tracks:
        - flash: { property: image_recolor, amount: 29%, profile: triangle, duration: "${ 220 + 40 * (tab5_motion_emphasis | int) }ms" }
        - nudge: { y: -3, duration: "${ 220 + 40 * (tab5_motion_emphasis | int) }ms" }
    - id: fx_icon_cold
      tracks:
        - flash: { property: image_recolor, amount: 29%, profile: triangle, duration: "${ 160 + 40 * (tab5_motion_emphasis | int) }ms" }
        - shake: { distance: 2, cycles: 2, axis: x, duration: "${ 160 + 40 * (tab5_motion_emphasis | int) }ms" }
    - id: fx_icon_drop
      tracks:
        - flash: { property: image_recolor, amount: 29%, profile: triangle, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }
        - nudge: { y: 3, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }
    - id: fx_icon_dry
      tracks:
        - flash: { property: image_recolor, amount: 29%, profile: triangle, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }
        - pulse: { scale: 92%, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }
    - id: fx_icon_grow
      tracks:
        - flash: { property: image_recolor, amount: 29%, profile: triangle, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }
        - pulse: { scale: 106%, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }

    - id: fx_scan_pulse
      policy: always
      tracks:
        - image_pulse: { amount: 30%, duration: 220ms, curve: ease_out }

    # A readout that comes back from "--" flashes white into its color.
    - id: fx_recover
      tracks:
        - flash: { property: text_color, color: white, duration: 320ms, curve: ease_in }

    # Outline glows (calibrate, log highlight). They run even while a notice is up, like the old outline fade.
    - id: fx_glow_205
      policy: always
      tracks:
        - glow: { opacity: 70%, duration: 205ms, curve: ease_out }
    - id: fx_glow_260
      policy: always
      tracks:
        - glow: { opacity: 70%, duration: 260ms, curve: ease_out }
    - id: fx_glow_320
      policy: always
      tracks:
        - glow: { opacity: 70%, duration: 320ms, curve: ease_out }

