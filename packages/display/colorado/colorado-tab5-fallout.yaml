  - platform: ble_elm327
    id: transmission_tcc_slip
    pre_commands: *obd_default_pre_commands
    name: "Torque Converter Clutch Slip"
    preset: gm_tcc_slip
    update_interval: 1s
    internal: true
    on_value:
      - lambda: |-
          // Flag repeated excursions from near lockup for the diagram.
          const uint32_t now = esphome::millis();
          auto &samples = id(g_dashboard_samples);
          const auto fresh = [&](int mode, uint32_t limit) {
            return samples[mode] != 0 && now - samples[mode] < limit;
          };
          const bool continuous = fresh(24, 3000);
          samples[24] = std::isfinite(x) ? now : 0;
          if (!continuous || !std::isfinite(x)) id(g_tcc_slip_warning_at) = 0;

          const float speed = id(car_speed).state;
          const float rpm = id(engine_rpm).state;
          const float throttle_position = id(throttle).state;
          const float temperature = id(transmission_temperature).state;
          const float gear = fresh(21, 3000) ? id(g_dashboard_gear) : NAN;
          struct SlipWindow {
            float speed = NAN, rpm = NAN, throttle = NAN, gear = NAN;
            uint32_t last_peak = 0;
            bool near_lockup = false;
          };
          static SlipWindow window;
          if (!std::isfinite(x) || !fresh(10, 3000) || !fresh(8, 3000) || !fresh(25, 3000) ||
              !fresh(18, 35000) || !(speed >= 65 && speed <= 90) ||
              !(rpm >= 1100 && rpm <= 1800) || !(temperature >= 50 && temperature <= 120)) {
            window = {};
            return;
          }
          const bool shifted = std::isfinite(gear) && std::isfinite(window.gear) && gear != window.gear;
          if (!continuous || !std::isfinite(window.speed) || shifted ||
              std::fabs(speed - window.speed) > 2.0f ||
              std::fabs(rpm - window.rpm) > 150.0f ||
              std::fabs(throttle_position - window.throttle) > 3.0f) {
            window = {speed, rpm, throttle_position, gear};
          } else if (!std::isfinite(window.gear)) {
            window.gear = gear;
          }
          const float slip = std::fabs(x);
          if (slip <= 40.0f) window.near_lockup = true;
          if (slip < 100.0f || !window.near_lockup) return;
          window.near_lockup = false;
          if (window.last_peak != 0 && now - window.last_peak <= 15000) {
            id(g_tcc_slip_warning_at) = now;
          }
          window.last_peak = now;

