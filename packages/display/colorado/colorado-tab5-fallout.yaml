  - id: script_render_scan_status
    parameters:
      color_mode: int
      color: lv_color_t
      label: lv_obj_t*
      focus: bool
    then:
      - lambda: |-
          // Both palettes share the same severity and opacity levels.
          const lv_color_t status_colors[] = {
            lv_color_hex(${tab5_color_text_inactive}),
            lv_color_hex(${tab5_color_status_cool}),
            lv_color_hex(${tab5_color_status_cold}),
            lv_color_hex(${tab5_color_status_warm}),
            lv_color_hex(${tab5_color_status_hot}),
          };
          const lv_color_t humidity_colors[] = {
            status_colors[0],
            lv_color_hex(${tab5_color_humidity_humid}),
            lv_color_hex(${tab5_color_humidity_very_humid}),
            lv_color_hex(${tab5_color_humidity_dry}),
            lv_color_hex(${tab5_color_humidity_very_dry}),
          };
          const auto palette_for = [&](int mode) {
            return mode == 3 || mode == 16 ? humidity_colors : status_colors;
          };
          const lv_opa_t opacities[] = {LV_OPA_30, LV_OPA_40, LV_OPA_40, LV_OPA_50, LV_OPA_60};
          static uint8_t severity_by_mode[27]{};
          if (color_mode < 0 || color_mode >= 27) return;
          const uint8_t previous = severity_by_mode[color_mode];
          uint8_t severity = 0;
          const auto *palette = palette_for(color_mode);
          for (uint8_t level = 1; level < sizeof(status_colors) / sizeof(status_colors[0]); ++level) {
            if (lv_color_eq(color, palette[level])) {
              severity = level;
              break;
            }
          }
          const bool visible = lv_obj_is_hidden(id(obj_splash)) && !id(g_logs_visible);
          constexpr uint32_t trace_duration = 200;
          if (!focus && previous == severity) return;
          if (!focus) severity_by_mode[color_mode] = severity;
          const bool new_warning = !focus && label && severity >= 3 && severity > previous;
          // A label's background glow (opacity of its fill) has no lvgl_fx material, so it is a user tween.
          const auto label_glow = +[](void *object, int32_t opacity) {
            lv_obj_set_style_bg_opa(static_cast<lv_obj_t *>(object), opacity, LV_PART_MAIN);
          };

          const struct {
            lv_obj_t *object;
            std::initializer_list<int> modes;
          } areas[] = {
            {id(widget_img_scan_coolant), {5}},
            {id(widget_img_scan_engine), {8, 9, 14, 26}},
            {id(widget_img_scan_intake), {17}},
            {id(widget_img_scan_battery), {7, 20}},
            {id(widget_img_scan_transmission), {18, 24}},
            {id(widget_img_scan_cabin), {2, 3}},
            {id(widget_img_scan_cabin_windows), {12, 13}},
            {id(widget_img_scan_fuel), {6}},
            {id(widget_img_scan_bed), {15, 16}},
          };
          const auto update_area = [&](bool defer_to_trace) -> lv_obj_t * {
            for (const auto &area : areas) {
              if (std::find(area.modes.begin(), area.modes.end(), color_mode) == area.modes.end()) continue;
              uint8_t highest = 0, old_highest = 0;
              lv_color_t tint = status_colors[0], old_tint = status_colors[0];
              for (const int mode : area.modes) {
                const uint8_t level = severity_by_mode[mode];
                const uint8_t old_level = mode == color_mode ? previous : level;
                const auto *mode_palette = palette_for(mode);
                if (level > highest) {
                  highest = level;
                  tint = mode_palette[level];
                }
                if (old_level > old_highest) {
                  old_highest = old_level;
                  old_tint = mode_palette[old_level];
                }
              }
              const bool brighter_neutral = area.object == id(widget_img_scan_cabin) ||
                                            area.object == id(widget_img_scan_fuel);
              const lv_opa_t rest_opacity = highest == 0 && brighter_neutral
                  ? static_cast<lv_opa_t>(112) : opacities[highest];
              // A temperature and humidity tie can change the tint without changing severity.
              const bool changed = highest != old_highest || !lv_color_eq(tint, old_tint);
              const bool pulse = visible && (focus || (new_warning && (defer_to_trace || highest > old_highest)));
              if (changed || pulse) {
                fx::cancel_tween_effect(area.object);
                fx::stop(area.object);
                if (changed) fx::set_color(area.object, tint);
                fx::set_image_opa(area.object, rest_opacity);
              }
              if (pulse && !defer_to_trace) fx::play(area.object, id(fx_scan_pulse));
              if (visible && new_warning && label) {
                lv_obj_set_style_bg_color(label, color, LV_PART_MAIN);
                fx::TweenOpt glow;
                glow.duration = 200;
                glow.target = label;
                glow.always = true;
                fx::tween(label, label_glow, LV_OPA_10, LV_OPA_TRANSP, glow);
              } else if (!focus && label && severity < previous) {
                fx::cancel_tween(label, label_glow);
                label_glow(label, LV_OPA_TRANSP);
              }
              return pulse && defer_to_trace ? area.object : nullptr;
            }
            return nullptr;
          };
          bool area_updated = false;
          if (!focus) {
            lv_obj_t *leader = nullptr;
            uint8_t trace_index = 0;
            switch (color_mode) {
              case 5: trace_index = 0; leader = id(line_scan_coolant_leader)->obj; break;
              case 14: trace_index = 1; leader = id(line_scan_oil_pressure_leader)->obj; break;
              case 26: trace_index = 2; leader = id(line_scan_oil_temperature_leader)->obj; break;
              case 17: trace_index = 3; leader = id(line_scan_intake_leader)->obj; break;
              case 2: trace_index = 4; leader = id(line_scan_cabin_temp_leader)->obj; break;
              case 3: trace_index = 5; leader = id(line_scan_cabin_humidity_leader)->obj; break;
              case 15: trace_index = 6; leader = id(line_scan_bed_temp_leader)->obj; break;
              case 16: trace_index = 7; leader = id(line_scan_bed_humidity_leader)->obj; break;
              case 18: trace_index = 8; leader = id(line_scan_transmission_leader)->obj; break;
              case 7: trace_index = 9; leader = id(line_scan_voltage_leader)->obj; break;
              case 13: trace_index = 10; leader = id(line_scan_co2_leader)->obj; break;
              case 12: trace_index = 11; leader = id(line_scan_tvoc_leader)->obj; break;
            }
            if (leader) {
              // LVGL holds the point array; keep routed traces alive.
              struct LeaderTrace {
                lv_obj_t *line;
                const lv_point_precise_t *full;
                lv_point_precise_t partial[6];
                uint8_t progress;
                uint8_t count;
              };
              // Twelve leaders, at most six points each. Keep boot-time BSS below the old
              // 27-entry, two-point implementation without runtime allocation.
              static LeaderTrace traces[12]{};
              auto &trace = traces[trace_index];
              const auto draw = +[](void *state, int32_t progress) {
                auto &trace = *static_cast<LeaderTrace *>(state);
                trace.progress = progress;
                if (progress == 100) {
                  lv_line_set_points(trace.line, trace.full, trace.count);
                  return;
                }
                float total = 0.0f;
                for (uint32_t i = 1; i < trace.count; ++i) {
                  total += std::hypot(trace.full[i].x - trace.full[i - 1].x,
                                      trace.full[i].y - trace.full[i - 1].y);
                }
                float remaining = total * progress / 100.0f;
                trace.partial[0] = trace.full[0];
                for (uint32_t i = 1; i < trace.count; ++i) {
                  const auto &start = trace.full[i - 1];
                  const auto &end = trace.full[i];
                  const float length = std::hypot(end.x - start.x, end.y - start.y);
                  if (remaining >= length) {
                    trace.partial[i] = end;
                    remaining -= length;
                    continue;
                  }
                  const float fraction = length > 0.0f ? remaining / length : 0.0f;
                  trace.partial[i].x = start.x + (end.x - start.x) * fraction;
                  trace.partial[i].y = start.y + (end.y - start.y) * fraction;
                  lv_line_set_points(trace.line, trace.partial, i + 1);
                  return;
                }
                lv_line_set_points(trace.line, trace.partial, trace.count);
              };
              // Trace every colored status, including cool and cold.
              const bool show_leader = severity > 0;
              if (show_leader) {
                lv_obj_set_style_line_color(leader, color, LV_PART_MAIN);
                lv_obj_set_style_line_opa(leader, LV_OPA_COVER, LV_PART_MAIN);
              }
              if (!trace.full) {
                const auto *points = lv_line_get_points(leader);
                const auto count = lv_line_get_point_count(leader);
                if (!points || count < 2 || count > 6) {
                  ESP_LOGE("scan.trace", "Invalid route: mode=%d points=%u", color_mode,
                      static_cast<unsigned>(count));
                  severity_by_mode[color_mode] = previous;
                  return;
                }
                trace.line = leader;
                trace.full = points;
                trace.count = static_cast<uint8_t>(count);
                ESP_LOGD("scan.trace", "Trace storage=%u bytes for 12 routes",
                    static_cast<unsigned>(sizeof(traces)));
                // Center-reaching leaders must remain visible over the part masks.
                lv_obj_move_foreground(leader);
              }
              if (show_leader != (previous > 0)) {
                // The route is drawn (or erased) by a user tween: it runs from the progress on screen, and is
                // applied at once when motion is not allowed. Rest progress is 0 or 100.
                fx::TweenOpt tween;
                tween.duration = show_leader ? trace_duration : 120;
                tween.curve = fx::Curve::LINEAR;
                tween.target = leader;
                tween.always = visible;
                if (!show_leader) {
                  tween.on_done = +[](void *state) {
                    auto &trace = *static_cast<LeaderTrace *>(state);
                    lv_obj_set_hidden(trace.line, true);
                    lv_line_set_points(trace.line, trace.full, trace.count);
                  };
                } else {
                  lv_obj_set_hidden(leader, false);
                }
                const bool defer = show_leader && visible && trace.progress != 100;
                if (auto *image = update_area(defer)) {
                  tween.completion_effect = id(fx_scan_pulse);
                  tween.completion_target = image;
                }
                area_updated = true;
                fx::tween(&trace, draw, trace.progress, show_leader ? 100 : 0, tween);
              }
            }
          }
          if (!area_updated) update_area(false);

  - id: script_update_sensor_text
    parameters:
      label: lv_obj_t*
      text: string
      color: lv_color_t
      color_mode: int
      fade_ms: uint32_t
    then:
      - lambda: |-
          // Modes that have shown a real value since boot: only their next return from "--" flashes.
          static bool seen[27]{};
          if (color_mode < 0 || color_mode >= 27) return;
          // Start large on every update; fit air-quality and signed slip values
          // beside their units, while preserving the trip's fixed-width box.
          if (color_mode == 12 || color_mode == 13 || color_mode == 19 || color_mode == 24) {
            const lv_font_t *fonts[] = {
              id(font_terminal_trip).get_lv_font(), id(notosans35).get_lv_font(),
              id(notosans30).get_lv_font(), id(notosans25).get_lv_font(),
              id(notosans20).get_lv_font(), id(notosans16).get_lv_font(),
            };
            int32_t max_width = 117;
            if (color_mode != 19) {
              auto *row = lv_obj_get_parent(label);
              auto *unit = lv_obj_get_child(row, 1);
              lv_point_t unit_size;
              lv_text_get_size(&unit_size, lv_label_get_text(unit),
                  lv_obj_get_style_text_font(unit, LV_PART_MAIN), 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
              max_width = (color_mode == 24 ? 180 : 145) - unit_size.x - 3;
            }
            const int32_t letter_space = lv_obj_get_style_text_letter_space(label, LV_PART_MAIN);
            const lv_font_t *selected = fonts[5];
            for (const auto *font : fonts) {
              lv_point_t measured;
              lv_text_get_size(&measured, text.c_str(), font, letter_space, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
              if (measured.x <= max_width) {
                selected = font;
                break;
              }
            }
            lv_obj_set_style_text_font(label, selected, LV_PART_MAIN);
          }
          const auto missing = [](const char *value) {
            return std::strcmp(value, "--") == 0 || std::strcmp(value, "--:--") == 0;
          };
          const bool valid = !missing(text.c_str());
          const bool recovered = valid && seen[color_mode] && missing(lv_label_get_text(label));
          if (valid) seen[color_mode] = true;
          // The color changes at once; a recovery flash (below) rides on top of it.
          fx::set_color(label, color);
          // Only real values fade; a missing one ("--") is swapped in place. Callers pass 0 or 155 ms.
          const char *previous = lv_label_get_text(label);
          const bool both_valid = std::strcmp(previous, "--") != 0 && std::strcmp(text.c_str(), "--") != 0 &&
                                  std::strcmp(previous, "-") != 0 && std::strcmp(text.c_str(), "-") != 0;
          fx::set_text(label, text.c_str(), both_valid && fade_ms ? fx::Opt{} : fx::Opt{.transition = id(fx_text_now)});
          if (recovered) fx::play(label, id(fx_recover));

  - id: script_render_readout
    parameters:
      label: lv_obj_t*
      icon: lv_obj_t*
      value: float
      color_mode: int
      decimals: int
      fade_ms: uint32_t
    then:
      - lambda: |-
          const auto color = id(fn_state_color)(value, color_mode);
          const auto text = id(fn_readout_text)(value, decimals);
          id(g_dashboard_samples)[color_mode] = std::isfinite(value) ? esphome::millis() : 0;
          id(script_render_scan_status).execute(color_mode, color, label, false);
          const bool accented = id(fn_icon_accent)(icon, color, color_mode, false);
          id(script_update_sensor_text).execute(label, text, color, color_mode, accented ? 0 : fade_ms);

  - id: script_render_gauge
    parameters:
      label: lv_obj_t*
      bar: lv_obj_t*
      icon: lv_obj_t*
      value: float
      color_mode: int
      duration: uint32_t
      force_accent: bool
    then:
      - lambda: |-
          const auto color = id(fn_state_color)(value, color_mode);
          const auto text = id(fn_readout_text)(value, 0);
          id(g_dashboard_samples)[color_mode] = std::isfinite(value) ? esphome::millis() : 0;
          id(script_render_scan_status).execute(color_mode, color, label, false);
          id(script_update_sensor_text).execute(label, text, color, color_mode, 0);
          // Callers pass 200 (default glide), 220, 375, 400 ms or 0 (a missing value, which drops at once).
          fx::set_value(bar, std::isfinite(value) ? std::trunc(value) : value,
              {.transition = duration == 400 ? id(fx_bar_400) : duration == 375 ? id(fx_bar_375)
                  : duration == 220 ? id(fx_bar_220) : id(fx_instrument),
               .instant = !std::isfinite(value) || duration == 0});
          lv_obj_set_style_bg_color(bar, color, LV_PART_INDICATOR);
          id(fn_icon_accent)(icon, color, color_mode, force_accent);

  - id: script_calibrate_tilt
    parameters:
      offset: float*
      angle: float
      button: lv_obj_t*
      axis: string
    then:
      - lambda: |-
          if (std::abs(*offset) > 0.0001f) {
            id(script_confirm_tilt_zero).stop();
            *offset = 0.0f;
            id(script_logs).execute(axis + " calibration cleared");
          } else {
            if (!std::isfinite(angle)) return;
            *offset = angle;
            id(script_confirm_tilt_zero).execute(axis == "Pitch");
            char value[20];
            snprintf(value, sizeof(value), "%+.1f°", angle);
            id(script_logs).execute(axis + " calibrated to " + value);
          }
          fx::play(button, id(fx_glow_205));
          id(script_sound_play).execute(4);

  - id: script_confirm_tilt_zero
    mode: restart
    parameters:
      pitch: bool
    then:
      - wait_until:
          condition:
            lambda: |-
              const float angle = pitch ? id(id_device_pitch).state : id(id_device_roll).state;
              auto *shape = pitch ? id(obj_pitch_shape) : id(obj_roll_shape);
              const int32_t position = lv_obj_get_style_transform_rotation(shape, LV_PART_MAIN);
              return std::isfinite(angle) && std::abs(angle) <= 0.5f && std::abs(position) <= 5;
          timeout: 1500ms
      - lambda: |-
          const float angle = pitch ? id(id_device_pitch).state : id(id_device_roll).state;
          if (!id(g_logs_visible) && std::isfinite(angle) && std::abs(angle) <= 0.5f) {
            fx::play(pitch ? id(btn_pitch) : id(btn_roll), id(fx_glow_320));
          }

  - id: script_open_update_menu
    then:
      - lambda: |-
          if (!id(fn_service_allowed)()) return;
          id(script_sound_play).execute(1);
          id(g_update_alert_dismissed) = true;
          id(g_service_setup) = true;
          id(script_set_service_visible).execute(true);

  - id: script_select_service_tab
    parameters:
      setup: bool
    then:
      - lambda: |-
          if (!id(g_logs_visible) || !id(fn_service_allowed)()) return;
          id(g_service_setup) = setup;
          lv_obj_set_hidden(id(obj_service_logs), setup);
          lv_obj_set_hidden(id(obj_service_setup), !setup);
          lv_label_set_text(id(lbl_service_title), setup ? "SYSTEM SETUP" : "SYSTEM JOURNAL");
          lv_label_set_text(id(lbl_service_subtitle), setup ? "시스템 설정" : "시스템 로그");
          lv_label_set_text(id(lbl_service_status), setup ? "> READY / SYSTEM SETUP" : "> READY / EVENT LOG");
          const struct { lv_obj_t *button; lv_obj_t *label; bool active; const char *text; } tabs[] = {
            {id(btn_service_log_tab), id(lbl_service_log_tab), !setup, setup ? "LOG" : "[ LOG ]"},
            {id(btn_service_setup_tab), id(lbl_service_setup_tab), setup, setup ? "[ SETUP ]" : "SETUP"},
          };
          for (const auto &tab : tabs) {
            lv_label_set_text(tab.label, tab.text);
            lv_obj_set_style_bg_color(tab.button, lv_color_hex(${tab5_color_accent}), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(tab.button, tab.active ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_MAIN);
            lv_obj_set_style_text_color(tab.label, lv_color_hex(tab.active
                ? ${tab5_color_background} : ${tab5_color_accent}), LV_PART_MAIN);
          }
          if (!setup) id(script_refresh_logs).execute(true, false);
          else {
            lv_label_set_text_fmt(id(lbl_backlight_value), "%d%%",
                static_cast<int>(std::lround(id(backlight).remote_values.get_brightness() * 100.0f)));
            id(script_sound_apply).execute();
            lv_slider_set_value(id(slider_sound_volume),
                static_cast<int>(std::lround(id(g_sound_volume) * 100.0f)), LV_ANIM_OFF);
            lv_slider_set_value(id(slider_backlight),
                std::clamp(static_cast<int>(std::lround(id(backlight).remote_values.get_brightness() * 100.0f)), 10, 100), LV_ANIM_OFF);
          }

  - id: script_set_service_visible
    parameters:
      show: bool
    then:
      - lambda: |-
          if (show && !id(fn_service_allowed)()) return;
          id(g_logs_visible) = show;
          // g_logs_visible suppresses motion, so the journal's own fade is forced.
          fx::set_visible(id(obj_log), show, {.force = true});
          lv_obj_set_hidden(id(btn_service_log_tab), !show);
          lv_obj_set_hidden(id(btn_service_setup_tab), !show);
          lv_label_set_text(id(lbl_menu_toggle), show ? "BACK" : "MENU");
          if (show) {
            fx::set_visible(id(obj_jaalee_detail), false);
            id(script_select_service_tab).execute(true);
          } else {
            fx::set_visible(id(obj_restart_backdrop), false);
            fx::set_visible(id(obj_restart_popup), false);
          }

  - id: script_sync_service_ui
    then:
      - lambda: |-
          const bool allowed = id(fn_service_allowed)();
          auto *menu = id(btn_logs_toggle);
          if (allowed) {
            lv_obj_remove_state(menu, LV_STATE_DISABLED);
          } else {
            lv_obj_add_state(menu, LV_STATE_DISABLED);
            if (id(g_logs_visible)) id(script_set_service_visible).execute(false);
            if (id(g_alert_is_update)) fx::set_visible(id(popup_alert), false);
            fx::set_visible(id(obj_jaalee_detail), false);
          }

          lv_obj_set_hidden(id(lbl_update_badge), id(g_logs_visible) || !id(g_update_available));

  - id: script_jaalee_detail
    mode: restart
    parameters:
      bed: bool
    then:
      - lambda: |-
          id(g_jaalee_detail_bed) = bed;
          const uint32_t last = id(g_jaalee_last_seen)[bed ? 1 : 0];
          const float battery = bed ? id(id_bed_battery_level).state : id(id_cabin_battery_level).state;
          lv_label_set_text(id(lbl_jaalee_name), bed ? "적재함 Jaalee" : "실내 Jaalee");
          if (battery >= 0.0f && battery <= 100.0f) {
            lv_label_set_text_fmt(id(lbl_jaalee_battery), "배터리 %u%%", static_cast<unsigned>(std::lround(battery)));
          } else {
            lv_label_set_text(id(lbl_jaalee_battery), "배터리 --");
          }
          if (last == 0) {
            lv_label_set_text(id(lbl_jaalee_age), "수신 기록 없음");
          } else {
            const uint32_t seconds = (esphome::millis() - last) / 1000;
            lv_label_set_text_fmt(id(lbl_jaalee_age), seconds < 60 ? "마지막 수신 %u초 전" : "마지막 수신 %u분 전",
                                  static_cast<unsigned>(seconds < 60 ? seconds : seconds / 60));
          }
          fx::set_visible(id(obj_jaalee_detail), true);
      - delay: 4s
      - lambda: fx::set_visible(id(obj_jaalee_detail), false);

  - id: script_logs
    parameters:
      log: string
    then:
      - lambda: |-
          auto &logs = id(g_logs);
          const auto time = id(sntp_time).now();
          char timestamp[16];
          snprintf(timestamp, sizeof(timestamp), "[%02d:%02d:%02d] ", time.hour, time.minute, time.second);
          const char *tag = "[INFO] ";
          if (log.starts_with("Wifi ") || log.starts_with("OBD BLE ") || log.starts_with("ws_bridge ") ||
              log == "NTP Time Synced") {
            tag = "[LINK] ";
          } else if (log.starts_with("Pitch") || log.starts_with("Roll") || log.starts_with("Jaalee ")) {
            tag = "[SENS] ";
          } else if (id(g_notice_active) && log.starts_with("ALERT: ") && log != "ALERT: Dismissed") {
            tag = "[WARN] ";
          }
          size_t length = std::min(log.size(), 127 - std::strlen(timestamp));
          // Keep the existing message limit without cutting a UTF-8 character in half.
          while (length > 0 && length < log.size() &&
                 (static_cast<unsigned char>(log[length]) & 0xC0) == 0x80) {
            --length;
          }
          logs.emplace_back(std::string(timestamp) + tag + log.substr(0, length));
          if (logs.size() > 50) logs.erase(logs.begin());
          if (id(g_logs_visible)) {
            ++id(g_log_unread);
            id(script_refresh_logs).execute(false, false);
          }

  - id: script_refresh_logs
    parameters:
      follow: bool
      animate: bool
    then:
      - lambda: |-
          if (!id(g_logs_visible) || id(g_service_setup)) return;
          auto &unread = id(g_log_unread);
          if (!follow && unread == 0) return;
          auto *view = id(obj_log_scroll);
          auto *latest_button = id(lbl_log_latest_button);
          if (!follow && (lv_obj_is_scrolling(view) || lv_obj_get_scroll_bottom(view) > 8)) {
            lv_label_set_text(id(lbl_log_follow), "FOLLOW: HOLD");
            // Keep the displayed snapshot stable even if the oldest buffered row was evicted.
            if (unread > 99) lv_label_set_text(latest_button, "새 로그 99+");
            else lv_label_set_text_fmt(latest_button, "새 로그 +%u", static_cast<unsigned>(unread));
            return;
          }
          unread = 0;
          lv_label_set_text(id(lbl_log_follow), "FOLLOW: ON");
          if (follow) id(g_log_highlight_pending) = false;
          lv_label_set_text(latest_button, "> 최근으로");

          const auto &logs = id(g_logs);
          std::string text;
          for (size_t i = 0; i + 1 < logs.size(); ++i) {
            if (!text.empty()) text += '\n';
            char number[16];
            snprintf(number, sizeof(number), "%03u  ", static_cast<unsigned>(i + 1));
            text += number;
            text += logs[i];
          }
          lv_label_set_text(id(lbl_log_text), text.c_str());
          lv_obj_set_hidden(id(lbl_log_text), text.empty());
          auto *latest = id(lbl_log_latest_entry);
          if (logs.empty()) lv_label_set_text(latest, "아직 기록이 없습니다.");
          else lv_label_set_text_fmt(latest, "%03u  %s", static_cast<unsigned>(logs.size()), logs.back().c_str());
          lv_label_set_text_fmt(id(lbl_log_count), "BUFFER %03u / 050", static_cast<unsigned>(logs.size()));

          lv_obj_update_layout(view);
          const int32_t bottom = lv_obj_get_scroll_bottom(view);
          const bool scroll_animated = animate && bottom > 0;
          if (scroll_animated) id(g_log_highlight_pending) = true;
          lv_obj_scroll_to_y(view, lv_obj_get_scroll_y(view) + bottom, scroll_animated ? LV_ANIM_ON : LV_ANIM_OFF);
          if (animate && !scroll_animated) fx::play(latest, id(fx_glow_260));
  - id: script_check_update
    # Single mode keeps manual checks serialized until success, error or timeout.
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: |-
                id(g_checking) = true;
                id(ota_update).status_clear_error();
                lv_label_set_text(id(lbl_menu_latest_ver), "확인 중...");
                lv_obj_set_style_text_color(id(lbl_menu_latest_ver), lv_color_hex(${tab5_color_text_muted}), LV_PART_MAIN);
                id(script_logs).execute("Checking for update...");
            - lvgl.label.update:
                id: lbl_btn_menu_update
                text_color: "${tab5_color_text_muted}"
            - lvgl_fx.set: { id: lbl_btn_menu_update, text: "확인 중...", transition: fx_text_80 }
            - update.check: ota_update
            - wait_until:
                condition:
                  lambda: 'return !id(g_checking) || id(ota_update).status_has_error();'
                timeout: 65s
            - lambda: |-
                if (!id(g_checking)) return;
                id(script_update_check_failed).execute(id(ota_update).status_has_error()
                    ? "확인 실패" : "응답 지연");
          else:
            - script.execute:
                id: script_update_check_failed
                reason: "연결 없음"

  - id: script_update_check_failed
    parameters:
      reason: string
    then:
      - lambda: |-
          id(g_checking) = false;
          // Retain any previously known update, but never label a failed check as up to date.
          id(script_set_update_available).execute(id(g_latest_version), id(g_update_available));
          lv_label_set_text(id(lbl_menu_latest_ver), reason.c_str());
          lv_obj_set_style_text_color(id(lbl_menu_latest_ver), lv_color_hex(${tab5_color_status_warm}), LV_PART_MAIN);
          id(script_logs).execute("Update check failed: " + reason);
          id(script_sound_play).execute(7);

  - id: script_set_update_available
    parameters:
      latest_ver: string
      available: bool
    then:
      - lambda: |-
          if (available && (!id(g_update_available) || latest_ver != id(g_latest_version)) &&
              id(fn_service_allowed)()) id(script_sound_play).execute(8);
          if (latest_ver != id(g_latest_version)) {
            id(g_update_alert_dismissed) = false;
          }
          id(g_latest_version) = latest_ver;
          id(g_update_available) = available;
      - lvgl.label.update:
          id: lbl_menu_latest_ver
          text: !lambda |-
            if (!available) return id(ota_update).state == update::UPDATE_STATE_NO_UPDATE
                ? std::string("최신 버전") : std::string("미확인");
            return latest_ver.empty() ? std::string("새 버전 있음") : "새 버전 " + latest_ver;
          text_color: !lambda 'return lv_color_hex(available ? ${tab5_color_accent} : ${tab5_color_status_ok});'
      - lvgl.widget.update:
          id: btn_menu_update
          # The setup action style inherits a transparent background; fill it before using dark text.
          bg_opa: !lambda 'return available ? LV_OPA_COVER : LV_OPA_TRANSP;'
          bg_color: !lambda 'return lv_color_hex(available ? ${tab5_color_accent} : ${tab5_color_button_bg});'
          pressed:
            bg_opa: COVER
            bg_color: !lambda 'return lv_color_hex(available ? ${tab5_color_status_ok} : ${tab5_color_button_pressed});'
      - lvgl.label.update:
          id: lbl_btn_menu_update
          text_color: !lambda 'return lv_color_hex(available ? ${tab5_color_background} : ${tab5_color_text_primary});'
      - lambda: |-
          fx::set_text(id(lbl_btn_menu_update), available ? "업데이트 실행" : "업데이트 확인");
          if (available) id(script_logs).execute("Update Available: " + latest_ver);
  - id: script_ota_refresh
    then:
      - lambda: |-
          // OTA blocks the application loop. Update light outputs and render here,
          // rather than waiting for the ordinary LVGL/component loops to resume.
          id(backlight).loop();
          id(lvgl_ui).loop();
          lv_refr_now(nullptr);
          App.feed_wdt();

  - id: script_ota_prepare
    then:
      - lambda: |-
          if (!id(g_ota_ui_active)) {
            id(g_ota_backlight_was_on) = id(backlight).remote_values.is_on();
            id(g_ota_backlight_brightness) = id(backlight).remote_values.get_brightness();
            id(g_ota_lvgl_was_paused) = id(lvgl_ui).is_paused();
          }
          id(g_ota_ui_active) = true;
          id(g_updating) = true;
          id(script_sound_stop).execute();
          id(lvgl_ui).set_paused(false, false);
          auto light = id(backlight).turn_on();
          light.set_brightness(id(g_ota_backlight_was_on)
              ? std::max(id(g_ota_backlight_brightness), 0.1f) : 0.4f);
          light.set_transition_length(0);
          light.perform();
          lv_label_set_text(id(lbl_ota_title), "FIRMWARE UPDATE");
          lv_obj_set_style_text_color(id(lbl_ota_title), lv_color_hex(${tab5_color_accent}), LV_PART_MAIN);
          lv_label_set_text(id(lbl_ota_phase), "INITIALIZING LINK...");
          lv_label_set_text(id(lbl_ota_percent), "0%");
          lv_label_set_text(id(lbl_ota_hint), "DO NOT INTERRUPT POWER.");
          lv_bar_set_value(id(bar_ota_progress), 0, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(bar_ota_progress), lv_color_hex(${tab5_color_accent}), LV_PART_INDICATOR);
          lv_obj_set_hidden(id(btn_ota_close), true);
          lv_obj_set_hidden(id(obj_ota_overlay), false);
          lv_obj_move_foreground(id(obj_ota_overlay));
      - script.execute: script_ota_refresh

  - id: script_ota_failed
    parameters:
      reason: string
    then:
      # Cancel the pending fallback timer so a failed attempt can be retried immediately.
      - script.stop: script_perform_update
      - lambda: |-
          id(g_updating) = false;
          id(script_sound_play).execute(7);
          id(script_logs).execute(reason);
          lv_label_set_text(id(lbl_ota_title), "UPDATE FAILED");
          lv_obj_set_style_text_color(id(lbl_ota_title), lv_color_hex(${tab5_color_status_hot}), LV_PART_MAIN);
          lv_label_set_text(id(lbl_ota_phase), reason.c_str());
          lv_label_set_text(id(lbl_ota_hint), "LINK ERROR // RETURN AND RETRY");
          lv_obj_set_style_bg_color(id(bar_ota_progress), lv_color_hex(${tab5_color_status_hot}), LV_PART_INDICATOR);
          lv_obj_set_hidden(id(btn_ota_close), false);
          auto light = id(backlight).turn_on();
          light.set_brightness(id(g_ota_backlight_was_on)
              ? std::max(id(g_ota_backlight_brightness), 0.1f) : 0.4f);
          light.set_transition_length(0);
          light.perform();
      - script.execute:
          id: script_set_update_available
          latest_ver: !lambda 'return id(g_latest_version);'
          available: !lambda 'return id(g_update_available);'
      - script.execute: script_ota_refresh

  - id: script_ota_close
    then:
      - lambda: |-
          if (id(g_updating) || !id(g_ota_ui_active)) return;
          lv_obj_set_hidden(id(obj_ota_overlay), true);
          lv_refr_now(nullptr);
          auto light = id(backlight).make_call();
          light.set_state(id(g_ota_backlight_was_on));
          light.set_brightness(id(g_ota_backlight_brightness));
          light.set_transition_length(0);
          light.perform();
          id(backlight).loop();
          id(lvgl_ui).set_paused(id(g_ota_lvgl_was_paused), false);
          id(g_ota_ui_active) = false;

  # ESP32-C6 co-processor update. Reuses the firmware update overlay.
  - id: script_c6_check
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: |-
                lv_label_set_text(id(lbl_btn_c6_update), "확인 중...");
                lv_label_set_text(id(lbl_c6_latest_ver), "확인 중...");
                lv_obj_set_style_text_color(id(lbl_c6_latest_ver), lv_color_hex(${tab5_color_text_muted}), LV_PART_MAIN);
                id(script_logs).execute("Checking C6 firmware...");
            # Let the label draw before the manifest request blocks the loop.
            - delay: 50ms
            - update.check: c6_update
            - script.execute: script_c6_update_label
            - lambda: |-
                if (id(c6_update).status_has_error()) {
                  id(script_sound_play).execute(7);
                }
          else:
            - lambda: |-
                lv_label_set_text(id(lbl_c6_latest_ver), "연결 없음");
                lv_obj_set_style_text_color(id(lbl_c6_latest_ver), lv_color_hex(${tab5_color_status_warm}), LV_PART_MAIN);
                id(script_sound_play).execute(7);

  - id: script_c6_perform
    then:
      - if:
          condition:
            lambda: 'return id(c6_update).state == update::UPDATE_STATE_AVAILABLE;'
          then:
            - lambda: id(script_logs).execute("C6 Update Triggered...");
            - update.perform: c6_update
          else:
            - script.execute: script_c6_update_label

  - id: script_c6_update_label
    then:
      - lambda: |-
          const auto &u = *id(c6_update);
          const bool available = u.state == update::UPDATE_STATE_AVAILABLE;
          const auto &current = u.update_info.current_version;
          lv_label_set_text_fmt(id(lbl_c6_curr_ver), "현재 %s",
              current.empty() || current == "unknown" ? "--" : current.c_str());
          std::string status = "미확인";
          uint32_t status_color = ${tab5_color_text_muted};
          if (id(c6_update).status_has_error()) {
            status = "확인 실패";
            status_color = ${tab5_color_status_warm};
          } else if (available) {
            status = "새 버전 " + u.update_info.latest_version;
            status_color = ${tab5_color_accent};
          } else if (u.state == update::UPDATE_STATE_NO_UPDATE) {
            status = "최신 버전";
            status_color = ${tab5_color_status_ok};
          }
          lv_label_set_text(id(lbl_c6_latest_ver), status.c_str());
          lv_obj_set_style_text_color(id(lbl_c6_latest_ver), lv_color_hex(status_color), LV_PART_MAIN);
          lv_label_set_text(id(lbl_btn_c6_update), available ? "업데이트 실행" : "업데이트 확인");
          lv_obj_set_style_text_color(id(lbl_btn_c6_update),
              lv_color_hex(available ? ${tab5_color_background} : ${tab5_color_text_primary}), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_c6_update),
              lv_color_hex(available ? ${tab5_color_accent} : ${tab5_color_button_bg}), LV_PART_MAIN);
          lv_obj_set_style_bg_opa(id(btn_c6_update), available ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_c6_update),
              lv_color_hex(available ? ${tab5_color_status_ok} : ${tab5_color_button_pressed}), LV_PART_MAIN | LV_STATE_PRESSED);

  - id: script_c6_ota_begin
    then:
      - script.execute: script_ota_prepare
      - lambda: |-
          lv_label_set_text(id(lbl_ota_title), "CO-PROCESSOR UPDATE");
          lv_label_set_text(id(lbl_ota_phase), "DOWNLOADING + WRITING ESP32-C6...");
          lv_label_set_text(id(lbl_ota_percent), "C6");
          lv_label_set_text(id(lbl_ota_hint), "WI-FI / BLE PAUSED. DO NOT INTERRUPT POWER.");
          // No progress is reported during the install; show a full dim bar instead.
          lv_bar_set_value(id(bar_ota_progress), 100, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(bar_ota_progress), lv_color_hex(${tab5_color_gauge_track}), LV_PART_INDICATOR);
          id(script_logs).execute("C6 update started: " + id(c6_update).update_info.latest_version);
      - script.execute: script_ota_refresh

  - id: script_c6_ota_done
    then:
      - lambda: |-
          lv_obj_set_style_bg_color(id(bar_ota_progress), lv_color_hex(${tab5_color_accent}), LV_PART_INDICATOR);
          lv_label_set_text(id(lbl_ota_percent), "100%");
          lv_label_set_text(id(lbl_ota_phase), "C6 COMPLETE // RESTARTING...");
          lv_label_set_text(id(lbl_ota_hint), "SYSTEM RESTART IN PROGRESS...");
          id(script_logs).execute("C6 update complete; restarting");
      - script.execute: script_ota_refresh

  - id: script_perform_update
    then:
      - if:
          condition:
            lambda: 'return id(ota_update).state == update::UPDATE_STATE_AVAILABLE;'
          then:
            - lambda: id(script_logs).execute("OTA Update Triggered...");
            - script.execute: script_ota_prepare
            # Let the normal loop draw once before flash() runs in a deferred callback.
            - delay: 100ms
            - update.perform: ota_update
            # The fallback can run only after the blocking flash call returns.
            # Normal failures are handled immediately by on_error/on_abort below.
            - delay: 90s
            - if:
                condition:
                  lambda: 'return id(g_updating);'
                then:
                  - script.execute:
                      id: script_ota_failed
                      reason: "OTA did not complete. Retry."
          else:
            - lambda: id(script_logs).execute("OTA update is no longer available");
            - script.execute:
                id: script_set_update_available
                latest_ver: !lambda 'return id(g_latest_version);'
                available: !lambda 'return id(ota_update).state == update::UPDATE_STATE_AVAILABLE;'

# Extend the stable OTA ID generated by the external OTA tool.
# Keep lifecycle/UI callbacks outside its regenerated package.
ota:
  - id: !extend ota_http
    on_begin:
      then:
        - script.execute: script_ota_prepare
        - lambda: lv_label_set_text(id(lbl_ota_phase), "CONNECTING TO UPDATE HOST...");
        - script.execute: script_ota_refresh
    on_progress:
      then:
        - lambda: |-
            if (!std::isfinite(x)) return;
            const int progress = static_cast<int>(std::clamp(x, 0.0f, 100.0f));
            lv_bar_set_value(id(bar_ota_progress), progress, LV_ANIM_OFF);
            lv_label_set_text_fmt(id(lbl_ota_percent), "%d%%", progress);
            // 100% transferred still needs checksum/finalization; it is not success yet.
            lv_label_set_text(id(lbl_ota_phase), progress < 100 ? "WRITING FIRMWARE..." : "VERIFYING INTEGRITY...");
        - script.execute: script_ota_refresh
    on_end:
      then:
        - script.stop: script_perform_update
        - lambda: |-
            lv_bar_set_value(id(bar_ota_progress), 100, LV_ANIM_OFF);
            lv_label_set_text(id(lbl_ota_percent), "100%");
            lv_label_set_text(id(lbl_ota_phase), "COMPLETE // RESTARTING...");
            lv_label_set_text(id(lbl_ota_hint), "SYSTEM RESTART IN PROGRESS...");
            id(script_logs).execute("OTA update complete; restarting");
        - script.execute: script_ota_refresh
    on_error:
      then:
        - lambda: |-
            char reason[48];
            snprintf(reason, sizeof(reason), "OTA failed (0x%02X)", static_cast<unsigned>(x));
            id(script_ota_failed).execute(reason);
    on_abort:
      then:
        - script.execute:
            id: script_ota_failed
            reason: "OTA update aborted"


packages:
  esphome_ota:
    substitutions:
      ota_base_url: !secret esphome_ota_base_url
      ota_slug: !secret esphome_ota_cfg_example_device
    esphome:
      project:
        name: "eigger.esp-colorado-tab5-fallout"
        version: "261119.3"
    http_request:
      timeout: 60s

    ota:
      - platform: http_request
        id: ota_http

    safe_mode:

    update:
      - platform: http_request
        id: ota_update
        ota_id: ota_http
        name: "Firmware"
        source: "${ota_base_url}/local/esphome_ota/${ota_slug}.json"
        update_interval: 6h
