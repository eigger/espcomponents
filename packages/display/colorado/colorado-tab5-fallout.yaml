# Public ESPHome example. Put Wi-Fi and Home Assistant credentials in secrets.yaml.
substitutions:
  name: "esp-colorado-tab5"
  friendly_name: "ESP Colorado TAB5"
  tab5_panel: ili9881c  # ili9881c, st7123, or st7121; match the rear label.
  number: "00가 0000"  # Example plate shown at boot.
  splash_title: "COLORADO"
  tab5_motion_emphasis: 1
  # Local phosphor palette. The shared Tab5 package retains its default colors.
  tab5_color_background: 0x07100B
  tab5_color_panel_bg: 0x0B160E
  tab5_color_card_bg: 0x122218
  tab5_color_card_border: 0x35583C
  tab5_color_gauge_track: 0x284631
  tab5_color_text_primary: 0xD4FFCA
  tab5_color_text_secondary: 0xB9F3AE
  tab5_color_text_muted: 0x9DC598
  tab5_color_text_inactive: 0x608D63
  tab5_color_accent: 0xAEF799
  tab5_color_status_cold: 0x83D9C9
  tab5_color_status_cool: 0x97E2B9
  tab5_color_status_warm: 0xFFD08A
  tab5_color_status_hot: 0xFF8C84
  tab5_color_status_ok: 0x83CC72
  tab5_color_alert_warning: 0x643B0D
  tab5_color_alert_danger: 0x792A25
  tab5_color_alert_notice: 0x254E31
  tab5_color_button_bg: 0x203C28
  tab5_color_button_pressed: 0x31573B
  tab5_color_danger_pressed: 0x792A25
  tab5_color_panel_pressed: 0x1D3525
  # Replace the example addresses with your local BLE device addresses.
  mac_vlinker: "02:00:00:00:00:01"
  mac_cabin_jht: "02:00:00:00:00:02"
  mac_bed_jht: "02:00:00:00:00:03"

  ui_ascii: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
  # Shared by the warning popup and the log. Add characters from external parking text here.
  ui_alert_hangul: "가감경고과급기낮높능데동력료리미발방배버변부상새속스시압업엔연열오요위유음의이일장전족졸주진충치터트필하험환"
  ui_extra_glyphs: ""

.helpers:
  ver: &version !lambda 'return std::string(ESPHOME_PROJECT_VERSION);'
  card_style: &card_style
    bg_color: "${tab5_color_card_bg}"
    border_width: 1
    border_color: "${tab5_color_card_border}"
    radius: 12
    pad_all: 0
  button_shape: &button_shape
    radius: 8
    border_width: 0
  neutral_button: &neutral_button
    <<: *button_shape
    bg_color: "${tab5_color_button_bg}"
    pressed:
      bg_color: "${tab5_color_button_pressed}"
  danger_button: &danger_button
    <<: *button_shape
    bg_color: "${tab5_color_status_hot}"
    pressed:
      bg_color: "${tab5_color_danger_pressed}"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "eigger.esp-colorado-tab5-fallout"
    version: "261028.1"
  # This config intentionally uses YAML anchors with per-instance key overrides
  # for the reusable terminal widget styles. ESPHome warns on valid overrides.
  merge_warnings: false
  on_boot:
    - then:
        - script.execute:
            id: script_logs
            log: *version
        - light.turn_on:
            id: backlight
            brightness: 40%
        - lvgl.animation.start: anim_crt_beam
        - delay: 170ms
        - lvgl.animation.start:
            id: [anim_crt_raster, anim_splash_terminal, anim_crt_scan]
        - delay: 210ms
        - lambda: id(script_splash_stage).execute(18, id(obj_splash_stage_system));
        - delay: 650ms
        - lambda: id(script_splash_stage).execute(42, id(obj_splash_stage_network));
        - delay: 650ms
        - lambda: id(script_splash_stage).execute(76, id(obj_splash_stage_dash));
        - delay: 650ms
        - lambda: id(script_splash_stage).execute(100, id(obj_splash_stage_ready));
        - delay: 520ms
        - lvgl.page.show: main_page
        - lvgl.widget.show:
            id: obj_header
        - lambda: id(tab5_motion_fade)(id(obj_splash), LV_OPA_COVER, LV_OPA_0, 200);
        - delay: 200ms
        - lvgl.widget.hide:
            id: obj_splash
        - lambda: id(tab5_motion_start)();

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Seoul
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - lvgl.widget.show:
            id: lbl_date
        - lvgl.widget.show:
            id: lbl_time
        - lambda: id(script_logs).execute("NTP Time Synced");

ws_bridge:
  host: !secret ha_address
  port: 443
  ssl: true
  token: !secret ha_token
  gateway_id: "${name}"
  name: "${friendly_name}"
  model: "Tab5"
  manufacturer: "M5Stack"
  hw_version: *version
  keep_last_state_on_disconnect: true
  sync_entities: true
  on_connected:
    then:
      - lambda: |-
          id(script_logs).execute("ws_bridge Connected");
  on_disconnected:
    then:
      - lambda: id(script_logs).execute("ws_bridge Disconnected");
  trackers:
    - name: "${friendly_name} Tracker"
      unique_id: "${name}_tracker"
      report_unknown: false
      latitude: !lambda 'return id(id_gps_latitude).state;'
      longitude: !lambda 'return id(id_gps_longitude).state;'
      gps_accuracy: !lambda |-
        float h = id(id_gps_hdop).state;
        return isnan(h) ? 10.0f : (h * 2.5f);
      update_interval: 10s
      icon: "mdi:crosshairs-gps"
  entities:
    - source_id: wifi_sig
    - source_id: fuel_level
    #- source_id: throttle
    - source_id: engine_rpm
    #- source_id: engine_load
    - source_id: car_speed
    #- source_id: car_acceleration
    #- source_id: gear_position
    #- source_id: prnd_status_alt
    #- source_id: actual_torque
    #- source_id: car_battery_soc
    - source_id: engine_oil_pressure
    - source_id: transmission_temperature
    - source_id: ambient_air_temperature
    - source_id: engine_coolant_temperature
    - source_id: car_battery
    - source_id: odometer
    - source_id: trip_distance
    - source_id: id_sgp30_eco2
    - source_id: id_sgp30_tvoc
    - source_id: id_scd40_co2
    - source_id: id_scd40_temperature
    - source_id: id_scd40_humidity
    - source_id: id_tab5_internal_temperature
    - source_id: id_cabin_temperature
    - source_id: id_cabin_humidity
    - source_id: id_cabin_battery_level
    - source_id: id_bed_temperature
    - source_id: id_bed_humidity
    - source_id: id_bed_battery_level
    - source_id: engine_run_time
    - source_id: gm_fuel_level_liters
    # - source_id: id_pm1_0
    # - source_id: id_pm2_5
    # - source_id: id_pm10_0
    - source_id: id_gps_speed
    - source_id: id_gps_altitude
    - source_id: id_gps_satellites
    #- source_id: id_gps_hdop
    - source_id: id_gnss_bmp280_temperature
    - source_id: id_gnss_bmp280_pressure
    - source_id: id_elm_reconnect_count
    - source_id: id_elm_last_error


    - source_id: id_elm_timeouts
    - source_id: id_elm_error_responses
    - source_id: id_elm_no_data_responses
    - source_id: id_elm_write_failures
    - source_id: id_elm_response_time

# api:
#   batch_delay: 1s
#   reboot_timeout: 0s

wifi:
  networks:
    - ssid: !secret colorado_wifi_ssid
      password: !secret colorado_wifi_password
      priority: 10
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 5

  on_connect:
    then:
      - lambda: id(script_logs).execute("Wifi Connected");
      - lambda: id(tab5_motion_visible)(id(lbl_wifi), true, 165);
  on_disconnect:
    then:
      - lambda: id(script_logs).execute("Wifi Disconnected");
      - lambda: id(tab5_motion_visible)(id(lbl_wifi), false, 120);

external_components:
  - source: github://eigger/espcomponents
    components: [jaalee_jht, ble_elm327, ws_bridge]
    refresh: always

