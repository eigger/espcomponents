                  height: 77
                  widgets:
                    - image: { <<: *terminal_icon, id: widget_img_cabin_humidity, src: img_water_sm }
                    - label: { <<: *terminal_heading, x: 33, y: 3, text: "실내습도" }
                    - label: { <<: *terminal_number, id: lbl_cabin_humidity, width: 94 }
                    - label: { <<: *terminal_heading, text: "%", x: 97, y: 44, text_font: notosans16 }
              - obj:
