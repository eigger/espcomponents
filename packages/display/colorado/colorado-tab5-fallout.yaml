  - id: fn_trip_soundtrack_notes
    type: "std::array<uint16_t, ${trip_soundtrack_notes}> (*)(const std::array<uint16_t, 48> &, uint32_t, float)"
    initial_value: |-
      +[](const std::array<uint16_t, 48> &rpm, uint32_t step_s, float elapsed_s) {
        std::array<uint16_t, ${trip_soundtrack_notes}> notes{};
        if (step_s == 0 || !(elapsed_s > 0.0f) || !std::isfinite(elapsed_s)) return notes;
        size_t end_bucket = static_cast<size_t>(std::min(
            std::floor(elapsed_s / step_s) + 1.0f, static_cast<float>(rpm.size())));
        size_t first_bucket = 0;
        while (first_bucket < end_bucket && rpm[first_bucket] == 0) ++first_bucket;
        while (end_bucket > first_bucket && rpm[end_bucket - 1] == 0) --end_bucket;
        const size_t count = end_bucket - first_bucket;
        if (count == 0) return notes;
        constexpr uint16_t pitches[] = {262, 294, 330, 392, 440, 523, 587, 659};
        for (size_t i = 0; i < notes.size(); ++i) {
          const size_t first = i * count / notes.size();
          const size_t end = std::max(first + 1, (i + 1) * count / notes.size());
          unsigned total = 0, samples = 0;
          for (size_t bucket = first; bucket < end; ++bucket) {
            const uint16_t sample = rpm[first_bucket + bucket];
            if (!sample) continue;
            total += sample;
            ++samples;
          }
          if (!samples) continue;
          const unsigned average = total / samples;
          const size_t note = average <= 850 ? 0 : 1 + (average - 851) / 350;
          notes[i] = pitches[std::min(note, std::size(pitches) - 1)];
        }
        return notes;
      }
  - id: fn_write_trip_soundtrack_wav
    type: "void (*)(uint8_t *, const std::array<uint16_t, ${trip_soundtrack_notes}> &)"
    initial_value: |-
      +[](uint8_t *wav, const std::array<uint16_t, ${trip_soundtrack_notes}> &notes) {
        constexpr uint32_t rate = ${trip_soundtrack_rate};
        constexpr uint32_t note_frames = rate * ${trip_soundtrack_note_ms} / 1000;
        constexpr uint32_t pcm_size = 2 * note_frames * ${trip_soundtrack_notes};
        constexpr uint32_t fade_frames = rate / 100;
        constexpr uint32_t sound_frames = note_frames - rate / 50;
        const auto write_u16 = [](uint8_t *out, uint16_t value) {
          out[0] = value & 0xFF;
          out[1] = value >> 8;
        };
        const auto write_u32 = [&](uint8_t *out, uint32_t value) {
          write_u16(out, value & 0xFFFF);
          write_u16(out + 2, value >> 16);
        };
        std::memcpy(wav, "RIFF", 4);
        write_u32(wav + 4, pcm_size + 36);
        std::memcpy(wav + 8, "WAVEfmt ", 8);
        write_u32(wav + 16, 16);
        write_u16(wav + 20, 1);  // PCM
        write_u16(wav + 22, 1);  // mono
        write_u32(wav + 24, rate);
        write_u32(wav + 28, rate * 2);
        write_u16(wav + 32, 2);
        write_u16(wav + 34, 16);
        std::memcpy(wav + 36, "data", 4);
        write_u32(wav + 40, pcm_size);
        uint8_t *pcm = wav + 44;
        std::memset(pcm, 0, pcm_size);
        static const auto sine = [] {
          std::array<int16_t, 256> table{};
          for (size_t i = 0; i < table.size(); ++i)
            table[i] = std::lround(32767.0 * std::sin(6.283185307179586 * i / table.size()));
          return table;
        }();
        for (size_t i = 0; i < notes.size(); ++i) {
          if (!notes[i]) continue;
          uint32_t phase = 0;
          const uint32_t increment = (uint64_t{notes[i]} << 32) / rate;
          for (uint32_t frame = 0; frame < sound_frames; ++frame) {
            const uint32_t fade = std::min({frame, sound_frames - 1 - frame, fade_frames});
            const int32_t wave = 3 * sine[phase >> 24] + sine[(phase * 2u) >> 24];
            // Four weighted sine parts at full envelope stay within 80% of 16-bit PCM.
            const int32_t value = wave * static_cast<int32_t>(fade) / static_cast<int32_t>(5 * fade_frames);
            write_u16(pcm + 2 * (i * note_frames + frame), static_cast<uint16_t>(value));
            phase += increment;
          }
        }
      }
