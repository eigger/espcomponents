interval:
  - interval: 40ms
    then:
      - script.execute: { id: script_trip_replay, request: 0 }
      - if:
          condition:
            lambda: 'return id(g_vehicle_scan_markers_active);'
          then:
            - script.execute: { id: script_vehicle_scan_markers, phase: 1 }
  - interval: 250ms
    then:
      - script.execute: script_sound_links
      - script.execute: script_render_compass
      - script.execute: script_tick_vehicle_scan
      - script.execute: script_sync_trip_soundtrack
      - script.execute: script_tick_auto_ota
  # ── 경고 팝업 제어 (1초 주기) ──
  - interval: 1s
    then:
      - script.execute:
          id: script_dashboard_watchdog
          install: false
          disconnect: false
      - script.execute: script_sync_service_ui
      - script.execute: script_render_service_info
      - script.execute: script_render_tpms
      - lambda: |-
          constexpr uint32_t warning = ${tab5_color_alert_warning};
          constexpr uint32_t danger = ${tab5_color_alert_danger};
          constexpr uint32_t notice = ${tab5_color_alert_notice};
          std::string msg;
          uint32_t color_hex = warning;
          const uint32_t sound_now = esphome::millis();
          id(fn_sound_alert)("begin", 0, 0, 0);
          int popup_rank = -1;
          bool popup_acknowledged = false;
          const auto set_alert = [&](unsigned key, const std::string &text, uint32_t color) {
            id(fn_sound_alert)("observe", key, color == danger ? 2 : 1, sound_now);
            // Unconfirmed conditions outrank confirmed ones, so a new or escalated alert
            // re-shows the popup with its own text whenever it sounds.
            const bool acked = id(fn_sound_alert)("acknowledged", key, 0, 0) != 0;
            const int rank = (acked ? 0 : 10) + (color == danger ? 2 : 1);
            // First candidate wins ties; a danger always replaces a warning of equal state.
            if (msg.empty() || rank > popup_rank) {
              msg = text;
              color_hex = color;
              popup_rank = rank;
              popup_acknowledged = acked;
            }
          };

          const auto live = [&](int mode, float value) {
            return id(g_dashboard_samples)[mode] != 0 ? value : NAN;
          };
          const float bat = live(7, id(car_battery).state);
          const float rpm = live(8, id(engine_rpm).state);
          const float coolant = live(5, id(engine_coolant_temperature).state);
          const float transmission = live(18, id(transmission_temperature).state);
          const float oil = live(14, id(engine_oil_pressure).state);
          const float oil_low_kpa = rpm >= 1000.0f ? ${oil_pressure_low_above_idle_kpa}f : ${oil_pressure_low_idle_kpa}f;
          const float speed = live(10, id(car_speed).state);
          const float co2 = live(13, id(id_scd40_co2).state);
          const float tvoc = live(12, id(id_sgp30_tvoc).state);
          const uint32_t acceleration_at = id(g_acceleration_sample_ms);
          const float acceleration = acceleration_at && esphome::millis() - acceleration_at < 5000
              ? live(10, id(car_acceleration).state) : NAN;
          const float load = live(9, id(engine_load).state);
          const float fuel = live(6, id(fuel_level).state);
          const bool engine_on = rpm >= 400.0f;
          const bool bat_valid = std::isfinite(rpm) && bat > 5.0f;
          const uint32_t now = esphome::millis();
          const bool connected = id(obd_client).connected();
          const uint32_t last_slip = id(g_dashboard_samples)[24];
          const uint32_t tcc_warning_at = id(g_tcc_slip_warning_at);
          const bool tcc_warning = connected && speed >= 60.0f &&
              last_slip != 0 && now - last_slip < 3000 &&
              tcc_warning_at != 0 && now - tcc_warning_at < 10000;
          const bool tcc_valid = connected && last_slip != 0 && now - last_slip < 3000 &&
              std::isfinite(id(transmission_tcc_slip).state);
          const float slip = tcc_valid ? id(transmission_tcc_slip).state : NAN;
          const auto slip_color = lv_color_hex(!tcc_valid ? ${tab5_color_text_muted}
              : tcc_warning ? ${tab5_color_status_warm} : ${tab5_color_accent});
          id(script_update_sensor_text).execute(id(lbl_tcc_slip), id(fn_readout_text)(slip, 0), slip_color, 24, 0);
          if (std::isfinite(slip)) {
            fx::set_value(id(bar_tcc_slip), std::trunc(slip));
          } else {
            fx::set_value(id(bar_tcc_slip), 0, {.instant = true});
          }
          lv_obj_set_style_bg_color(id(bar_tcc_slip), slip_color, LV_PART_INDICATOR);
          id(fn_icon_accent)(id(widget_img_tcc_slip), slip_color, 24, false);
          id(script_render_scan_status).execute(24, lv_color_hex(tcc_warning
              ? ${tab5_color_status_warm} : ${tab5_color_text_inactive}), id(lbl_tcc_slip), false);

          const uint8_t low_tires = id(g_tpms_low_tires);

          // Preserve the existing tire-warning priority among warnings only.
          if (low_tires) {
            const char *positions[] = {"앞왼쪽", "앞오른쪽", "뒤왼쪽", "뒤오른쪽"};
            std::string tire_msg = "타이어 저압";
            for (size_t i = 0; i < id(g_tpms_samples).size(); ++i) {
              if (low_tires & (1u << i)) {
                tire_msg += " ";
                tire_msg += positions[i];
              }
            }
            set_alert(0, tire_msg, warning);
          }

          if (std::isfinite(coolant) && lv_color_eq(id(fn_state_color)(coolant, 5),
              lv_color_hex(${tab5_color_status_hot}))) {
            set_alert(1, "엔진 과열!", danger);
          }
          if (transmission > ${transmission_temperature_hot_c}) {
            set_alert(2, "변속기 과열!", danger);
          }
          if (engine_on && (oil < oil_low_kpa || oil > ${oil_pressure_high_kpa}f)) {
            set_alert(3, "오일 압력 위험!", danger);
          }
          if (speed > 120) {
            set_alert(4, "과속 위험!", danger);
          }
          if (speed > 110) {
            set_alert(4, "과속 주의!", warning);
          }
          if (co2 > 2500) {
            set_alert(6, "졸음 경고!", danger);
          }
          if (co2 > 1500) {
            set_alert(6, "졸음 주의!", warning);
          }
          if (tvoc > 5000) {
            set_alert(8, "가스 주의!", warning);
          }
          if (tvoc > 3333) {
            set_alert(8, "환기 필요!", warning);
          }
          if (acceleration > 9.0) {
            set_alert(10, "급가속!", danger);
          }
          if (acceleration < -9.0) {
            set_alert(11, "급감속!", danger);
          }
          if (load > 95) {
            set_alert(12, "엔진 과부하!", warning);
          }
          if (!isnan(id(id_tab5_internal_temperature).state) && id(id_tab5_internal_temperature).state > 70) {
            set_alert(13, "장치 과열!", danger);
          }
          if (bat_valid && engine_on && bat < 12.8f && id(alt_low_since_ms) != 0 && (esphome::millis() - id(alt_low_since_ms) >= 180000)) {
            set_alert(14, "발전기 미충전!", danger);
          }
          if (bat_valid && engine_on && bat > 15.0f) {
            set_alert(15, "배터리 과충전!", danger);
          }
          if (bat_valid && !engine_on && bat < 11.8f) {
            set_alert(16, "배터리 방전 위험!", danger);
          }
          if (bat_valid && !engine_on && bat > 13.5f && id(fn_battery_rested)()) {
            set_alert(17, "시동전 전압 이상!", danger);
          }
          if (bat_valid && engine_on && bat < 13.2f) {
            set_alert(14, "충전전압 낮음!", warning);
          }
          if (bat_valid && engine_on && bat > 14.85f) {
            set_alert(15, "충전전압 높음!", warning);
          }
          if (bat_valid && !engine_on && bat < 12.0f) {
            set_alert(16, "배터리 전압 낮음!", warning);
          }
          // Low fuel: caution, once per level (15%, then 8%) after each engine start.
          // Each shows for up to 30 s or until dismissed, and is not repeated that drive.
          static bool fuel_engine_was_on = false;
          static uint8_t fuel_done_level = 0, fuel_active_level = 0;
          static uint32_t fuel_shown_at = 0;
          if (std::isfinite(rpm)) {
            if (engine_on && !fuel_engine_was_on) fuel_done_level = 0;
            fuel_engine_was_on = engine_on;
          }
          const uint8_t fuel_level = !engine_on || !std::isfinite(fuel) ? 0 : fuel < 8 ? 2 : fuel < 15 ? 1 : 0;
          if (fuel_level > fuel_done_level) {
            if (fuel_active_level != fuel_level) {
              fuel_active_level = fuel_level;
              fuel_shown_at = now;
            }
            const unsigned fuel_key = fuel_level == 2 ? 22 : 21;
            set_alert(fuel_key, fuel_level == 2 ? "연료 부족 (주유 시급)!" : "주유 필요!", warning);
            if (now - fuel_shown_at >= 30000 || id(fn_sound_alert)("acknowledged", fuel_key, 0, 0))
              fuel_done_level = fuel_level;
          } else {
            fuel_active_level = 0;
          }
          if (msg.empty() && id(parking_info).has_state() && id(parking_info).state.length() > 0 && id(parking_info).state != "unknown" && id(parking_info).state != "off") {
            msg = id(parking_info).state;
            color_hex = notice;
          }

          const bool car_alert = !msg.empty();
          // 새 차량 경고 또는 주차 안내가 들어오면 다시 표시한다.
          static std::string last_car_msg = "";
          if (msg != last_car_msg) {
            // A change between already-confirmed conditions stays dismissed.
            if (car_alert && !popup_acknowledged) {
              id(alert_dismissed) = false;
              if (color_hex == notice) id(script_sound_play).execute(8);
            }
            last_car_msg = msg;
          }

          if (!car_alert) {
            // Keep the dismissal through a brief gap: a condition that returns within the
            // 5 s clearance stays confirmed; a new or re-armed one re-shows the popup itself.
            // 차량 경고가 없을 때만 독립된 플래그(g_update_alert_dismissed)로 업데이트 알림 검사
            if (id(g_update_available) && !id(g_update_alert_dismissed)) {
              if (!id(g_latest_version).empty()) {
                msg = "새 버전 " + id(g_latest_version) + " 업데이트 가능!";
              } else {
                msg = "새 업데이트 가능!";
              }
              color_hex = notice;
            }
          }

          id(fn_sound_alert)("end", 0, 0, sound_now);
          const int pending_sound = id(fn_sound_alert)("pending", 0, 0, sound_now);
          if (pending_sound >= 0) {
            id(script_sound_play).execute(id(fn_sound_alert)("severity", pending_sound, 0, 0) >= 2 ? 6 : 5);
          }
          id(g_alert_is_update) = !car_alert && !msg.empty();
          const bool dismissed = car_alert ? id(alert_dismissed) : id(g_update_alert_dismissed);
          // Confirmed conditions never re-appear on their own, even after another alert
          // re-showed the popup; only new or escalated conditions (unconfirmed) are shown.
          const bool show_popup = !msg.empty() && !dismissed && !(car_alert && popup_acknowledged) &&
              (car_alert || id(fn_service_allowed)());
          const bool urgent = show_popup && car_alert && color_hex != notice;
          id(g_notice_active) = urgent;
          const char *level = color_hex == danger ? "경고" : color_hex == notice ? "안내" : "주의";

          static uint32_t compass_notice_started = 0;
          auto *compass_notice = id(obj_compass_notice);
          if (compass_notice_started && now - compass_notice_started >= 4000) {
            id(g_compass_gps_notice_pending) = false;
            compass_notice_started = 0;
          }
          const bool show_compass_notice = id(g_compass_gps_notice_pending) && !show_popup &&
              fx::is_ready() && !id(g_logs_visible) && !id(g_ota_ui_active) && !id(g_updating);
          if (show_compass_notice && !compass_notice_started) compass_notice_started = now;
          if (lv_obj_is_hidden(compass_notice) == show_compass_notice)
            lv_obj_set_hidden(compass_notice, !show_compass_notice);

          static std::string last_logged_msg = "";
          if (msg != last_logged_msg) {
            if (!msg.empty()) {
              id(script_logs).execute("ALERT: " + msg);
            } else {
              id(script_logs).execute("ALERT: Cleared");
            }
            last_logged_msg = msg;
          }

          auto *popup = id(popup_alert);
          if (!show_popup) {
            fx::set_visible(popup, false);
            return;
          }

          const bool reopening = lv_obj_is_hidden(popup);
          const auto color = lv_color_hex(color_hex);
          if (!reopening && msg == lv_label_get_text(id(lbl_alert_msg)) &&
              std::strcmp(level, lv_label_get_text(id(lbl_alert_title))) == 0 &&
              lv_color_eq(color, lv_obj_get_style_bg_color(popup, LV_PART_MAIN))) return;

          lv_label_set_text(id(lbl_alert_title), level);
          lv_label_set_text(id(lbl_alert_msg), msg.c_str());
          lv_obj_set_style_bg_color(popup, color, LV_PART_MAIN);
          // An urgent popup appears at once; a notice fades in.
          fx::set_visible(popup, true, {.instant = urgent});
      - script.execute: script_update_trip_report

text_sensor:
