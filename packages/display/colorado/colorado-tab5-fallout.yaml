                x: 8
                y: 0
                width: 76
                height: 48
                bg_opa: 0%
                border_width: 0
                pad_all: 0
                outline_width: 0
                shadow_width: 0
                shadow_opa: 0%
                text_color: "${tab5_color_accent}"
                state:
