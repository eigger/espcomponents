                          - line: { <<: *tilt_trim, points: ["101, 66", "101, 74"] }
                    - label: { <<: *tilt_value, id: lbl_roll_value }
                    - label: { <<: *tilt_badge, id: lbl_roll_calibrated, text: "보정" }
                    - label: { <<: *tilt_badge, id: lbl_roll_range, x: 74, width: 54, text: ">25°", text_color: "${tab5_color_status_hot}" }

        - obj:
            <<: *terminal_panel
