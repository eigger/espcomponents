                      if (!id(g_logs_visible) || !id(fn_service_allowed)() || id(g_service_tab) == 0) return;
                      id(script_select_service_tab).execute(0);
                      id(script_sound_play).execute(3);
                widgets:
                  - label: { id: lbl_service_setup_tab, align: center, text: "SETUP", text_font: font_terminal_boot, text_color: "${tab5_color_accent}" }
            - button:
                <<: *service_tab
                id: btn_service_info_tab
                x: 608
