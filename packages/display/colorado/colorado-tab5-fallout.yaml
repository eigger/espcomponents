            id(script_render_speed).execute(x);
            if (std::isfinite(x)) id(script_speed_expire).execute();
            else id(script_speed_expire).stop();
        - lambda: |-
            if (!isnan(x)) {
              static float old_speed = 0.0f;
              static uint32_t timer = esphome::millis();
              if (esphome::millis() - timer > 1000) {
                float acc = x - old_speed;
                id(car_acceleration).publish_state(acc);
