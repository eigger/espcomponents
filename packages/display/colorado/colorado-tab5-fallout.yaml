  - id: script_render_scan_status
    parameters:
      color_mode: int
      color: lv_color_t
      label: lv_obj_t*
      focus: bool
    then:
      - lambda: |-
          // Both palettes share the same severity and opacity levels.
          const lv_color_t status_colors[] = {
            lv_color_hex(${tab5_color_text_inactive}),
            lv_color_hex(${tab5_color_status_cool}),
            lv_color_hex(${tab5_color_status_cold}),
            lv_color_hex(${tab5_color_status_warm}),
            lv_color_hex(${tab5_color_status_hot}),
          };
          const lv_color_t humidity_colors[] = {
            status_colors[0],
            lv_color_hex(${tab5_color_humidity_humid}),
            lv_color_hex(${tab5_color_humidity_very_humid}),
            lv_color_hex(${tab5_color_humidity_dry}),
            lv_color_hex(${tab5_color_humidity_very_dry}),
          };
          const auto palette_for = [&](int mode) {
            return mode == 3 || mode == 16 ? humidity_colors : status_colors;
          };
          const lv_opa_t opacities[] = {LV_OPA_30, LV_OPA_40, LV_OPA_40, LV_OPA_50, LV_OPA_60};
          static uint8_t severity_by_mode[27]{};
          if (color_mode < 0 || color_mode >= 27) return;
          const uint8_t previous = severity_by_mode[color_mode];
          uint8_t severity = 0;
          const auto *palette = palette_for(color_mode);
          for (uint8_t level = 1; level < sizeof(status_colors) / sizeof(status_colors[0]); ++level) {
            if (lv_color_eq(color, palette[level])) {
              severity = level;
              break;
            }
          }
          const bool visible = lv_obj_is_hidden(id(obj_splash)) && !id(g_logs_visible);
          if (!focus && previous == severity) return;
          if (!focus) severity_by_mode[color_mode] = severity;
          const bool new_warning = !focus && label && severity >= 3 && severity > previous;
          // A label's background glow (opacity of its fill) has no lvgl_fx material, so it is a user tween.
          const auto label_glow = +[](void *object, int32_t opacity) {
            lv_obj_set_style_bg_opa(static_cast<lv_obj_t *>(object), opacity, LV_PART_MAIN);
          };

          const struct {
            lv_obj_t *object;
            std::initializer_list<int> modes;
          } areas[] = {
            {id(widget_img_scan_coolant), {5}},
            {id(widget_img_scan_engine), {8, 9, 14, 26}},
            {id(widget_img_scan_intake), {17}},
            {id(widget_img_scan_battery), {7, 20}},
            {id(widget_img_scan_transmission), {18, 24}},
            {id(widget_img_scan_cabin), {2, 3}},
            {id(widget_img_scan_cabin_windows), {12, 13}},
            {id(widget_img_scan_fuel), {6}},
            {id(widget_img_scan_bed), {15, 16}},
          };
          const auto update_area = [&](bool defer_to_trace) -> lv_obj_t * {
            for (const auto &area : areas) {
              if (std::find(area.modes.begin(), area.modes.end(), color_mode) == area.modes.end()) continue;
              uint8_t highest = 0, old_highest = 0;
              lv_color_t tint = status_colors[0], old_tint = status_colors[0];
              for (const int mode : area.modes) {
                const uint8_t level = severity_by_mode[mode];
                const uint8_t old_level = mode == color_mode ? previous : level;
                const auto *mode_palette = palette_for(mode);
                if (level > highest) {
                  highest = level;
                  tint = mode_palette[level];
                }
                if (old_level > old_highest) {
                  old_highest = old_level;
                  old_tint = mode_palette[old_level];
                }
              }
              const bool brighter_neutral = area.object == id(widget_img_scan_cabin) ||
                                            area.object == id(widget_img_scan_fuel);
              const lv_opa_t rest_opacity = highest == 0 && brighter_neutral
                  ? static_cast<lv_opa_t>(112) : opacities[highest];
              // A temperature and humidity tie can change the tint without changing severity.
              const bool changed = highest != old_highest || !lv_color_eq(tint, old_tint);
              const bool pulse = visible && (focus || (new_warning && (defer_to_trace || highest > old_highest)));
              if (changed || pulse) {
                fx::cancel_tween_effect(area.object);
                fx::stop(area.object);
                if (changed) fx::set_color(area.object, tint);
                fx::set_image_opa(area.object, rest_opacity);
              }
              if (pulse && !defer_to_trace) fx::play(area.object, id(fx_scan_pulse));
              if (visible && new_warning && label) {
                lv_obj_set_style_bg_color(label, color, LV_PART_MAIN);
                fx::TweenOpt glow;
                glow.duration = 200;
                glow.target = label;
                glow.always = true;
                fx::tween(label, label_glow, LV_OPA_10, LV_OPA_TRANSP, glow);
              } else if (!focus && label && severity < previous) {
                fx::cancel_tween(label, label_glow);
                label_glow(label, LV_OPA_TRANSP);
              }
              return pulse && defer_to_trace ? area.object : nullptr;
            }
            return nullptr;
          };
          bool area_updated = false;
          if (!focus) {
            lv_obj_t *leader = nullptr;
            uint8_t trace_index = 0;
            switch (color_mode) {
              case 5: trace_index = 0; leader = id(line_scan_coolant_leader)->obj; break;
              case 14: trace_index = 1; leader = id(line_scan_oil_pressure_leader)->obj; break;
              case 26: trace_index = 2; leader = id(line_scan_oil_temperature_leader)->obj; break;
              case 17: trace_index = 3; leader = id(line_scan_intake_leader)->obj; break;
              case 2: trace_index = 4; leader = id(line_scan_cabin_temp_leader)->obj; break;
              case 3: trace_index = 5; leader = id(line_scan_cabin_humidity_leader)->obj; break;
              case 15: trace_index = 6; leader = id(line_scan_bed_temp_leader)->obj; break;
              case 16: trace_index = 7; leader = id(line_scan_bed_humidity_leader)->obj; break;
              case 18: trace_index = 8; leader = id(line_scan_transmission_leader)->obj; break;
              case 7: trace_index = 9; leader = id(line_scan_voltage_leader)->obj; break;
              case 13: trace_index = 10; leader = id(line_scan_co2_leader)->obj; break;
              case 12: trace_index = 11; leader = id(line_scan_tvoc_leader)->obj; break;
            }
            if (leader) {
              // Trace every colored status, including cool and cold.
              const bool show_leader = severity > 0;
              if (show_leader) {
                lv_obj_set_style_line_color(leader, color, LV_PART_MAIN);
                lv_obj_set_style_line_opa(leader, LV_OPA_COVER, LV_PART_MAIN);
              }
              static bool routed[12]{};
              if (!routed[trace_index]) {
                // lvgl_fx reads the route back from the line on first use, so check it before that.
                const auto *points = lv_line_get_points(leader);
                const auto count = lv_line_get_point_count(leader);
                if (!points || count < 2 || count > 6) {
                  ESP_LOGE("scan.trace", "Invalid route: mode=%d points=%u", color_mode,
                      static_cast<unsigned>(count));
                  severity_by_mode[color_mode] = previous;
                  return;
                }
                routed[trace_index] = true;
                // Center-reaching leaders must remain visible over the part masks.
                lv_obj_move_foreground(leader);
              }
              if (show_leader != (previous > 0)) {
                // The route is drawn (or erased) by lvgl_fx `draw`: it runs from the progress on screen, and is
                // applied at once when motion is not allowed. Rest progress is 0 or 100.
                // The erase transition (fx_leader_erase) hides the line in its on_end: when the erase ends or is
                // applied at once, and never when the leader is drawn again first (that supersedes the erase).
                fx::Opt draw;
                draw.always = visible;
                if (show_leader) {
                  if (lv_obj_is_hidden(leader)) {
                    // A hidden leader is at rest: start from nothing (the first time lvgl_fx still sees it whole).
                    fx::set_draw(leader, 0.0f, {.instant = true});
                    lv_obj_set_hidden(leader, false);
                  }
                  draw.transition = id(fx_leader_draw);
                  if (auto *image = update_area(visible)) {
                    draw.completion_effect = id(fx_scan_pulse);
                    draw.completion_target = image;
                  }
                  area_updated = true;
                  fx::set_draw(leader, 100.0f, draw);
                } else {
                  draw.transition = id(fx_leader_erase);
                  area_updated = true;
                  update_area(false);
                  fx::set_draw(leader, 0.0f, draw);
                }
              }
            }
          }
          if (!area_updated) update_area(false);

  - id: script_update_sensor_text
    parameters:
      label: lv_obj_t*
      text: string
      color: lv_color_t
      color_mode: int
      fade_ms: uint32_t
    then:
      - lambda: |-
          // Modes that have shown a real value since boot: only their next return from "--" flashes.
          static bool seen[27]{};
          if (color_mode < 0 || color_mode >= 27) return;
          // Start large on every update; fit air-quality and signed slip values
          // beside their units, while preserving the trip's fixed-width box.
          if (color_mode == 12 || color_mode == 13 || color_mode == 19 || color_mode == 24) {
            const lv_font_t *fonts[] = {
              id(font_terminal_trip).get_lv_font(), id(notosans35).get_lv_font(),
              id(notosans30).get_lv_font(), id(notosans25).get_lv_font(),
              id(notosans20).get_lv_font(), id(notosans16).get_lv_font(),
            };
            int32_t max_width = 117;
            if (color_mode != 19) {
              auto *row = lv_obj_get_parent(label);
              auto *unit = lv_obj_get_child(row, 1);
              lv_point_t unit_size;
              lv_text_get_size(&unit_size, lv_label_get_text(unit),
                  lv_obj_get_style_text_font(unit, LV_PART_MAIN), 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
              max_width = (color_mode == 24 ? 180 : 145) - unit_size.x - 3;
            }
            const int32_t letter_space = lv_obj_get_style_text_letter_space(label, LV_PART_MAIN);
            const lv_font_t *selected = fonts[5];
            for (const auto *font : fonts) {
              lv_point_t measured;
              lv_text_get_size(&measured, text.c_str(), font, letter_space, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
              if (measured.x <= max_width) {
                selected = font;
                break;
              }
            }
            lv_obj_set_style_text_font(label, selected, LV_PART_MAIN);
          }
          const auto missing = [](const char *value) {
            return std::strcmp(value, "--") == 0 || std::strcmp(value, "--:--") == 0;
          };
          const bool valid = !missing(text.c_str());
          const bool recovered = valid && seen[color_mode] && missing(lv_label_get_text(label));
          if (valid) seen[color_mode] = true;
          // The color changes at once; a recovery flash (below) rides on top of it.
          fx::set_color(label, color);
          // Only real values fade; a missing one ("--") is swapped in place. Callers pass 0 or 155 ms.
          const char *previous = lv_label_get_text(label);
          const bool both_valid = std::strcmp(previous, "--") != 0 && std::strcmp(text.c_str(), "--") != 0 &&
                                  std::strcmp(previous, "-") != 0 && std::strcmp(text.c_str(), "-") != 0;
          fx::set_text(label, text.c_str(), both_valid && fade_ms ? fx::Opt{} : fx::Opt{.transition = id(fx_text_now)});
          if (recovered) fx::play(label, id(fx_recover));

  - id: script_render_readout
    parameters:
      label: lv_obj_t*
      icon: lv_obj_t*
      value: float
      color_mode: int
      decimals: int
      fade_ms: uint32_t
    then:
      - lambda: |-
          const auto color = id(fn_state_color)(value, color_mode);
          const auto text = id(fn_readout_text)(value, decimals);
          id(g_dashboard_samples)[color_mode] = std::isfinite(value) ? esphome::millis() : 0;
          id(script_render_scan_status).execute(color_mode, color, label, false);
          const bool accented = id(fn_icon_accent)(icon, color, color_mode, false);
          id(script_update_sensor_text).execute(label, text, color, color_mode, accented ? 0 : fade_ms);

  - id: script_render_gauge
    parameters:
      label: lv_obj_t*
      bar: lv_obj_t*
      icon: lv_obj_t*
      value: float
      color_mode: int
      duration: uint32_t
      force_accent: bool
    then:
      - lambda: |-
          const auto color = id(fn_state_color)(value, color_mode);
          const auto text = id(fn_readout_text)(value, 0);
          id(g_dashboard_samples)[color_mode] = std::isfinite(value) ? esphome::millis() : 0;
          id(script_render_scan_status).execute(color_mode, color, label, false);
          id(script_update_sensor_text).execute(label, text, color, color_mode, 0);
          // Callers pass 200 (default glide), 220, 375, 400 ms or 0 (a missing value, which drops at once).
          fx::set_value(bar, std::isfinite(value) ? std::trunc(value) : value,
              {.transition = duration == 400 ? id(fx_bar_400) : duration == 375 ? id(fx_bar_375)
                  : duration == 220 ? id(fx_bar_220) : id(fx_instrument),
               .instant = !std::isfinite(value) || duration == 0});
          lv_obj_set_style_bg_color(bar, color, LV_PART_INDICATOR);
          id(fn_icon_accent)(icon, color, color_mode, force_accent);

  - id: script_render_compass
    then:
      - lambda: |-
          using esphome::gps_compass::Source;
          using esphome::gps_compass::Status;
          auto *compass = id(id_compass);
          static float last_heading = NAN;
          static Source last_source = Source::NONE;
          float heading = compass->heading();
          Source compass_source = compass->source();
          const bool live = std::isfinite(heading) &&
              (compass_source == Source::GPS || compass_source == Source::MAGNETIC);
          if (live || (!std::isfinite(last_heading) && std::isfinite(heading))) {
            last_heading = heading;
            last_source = compass_source;
          } else {
            // Keep the last live heading even if the component falls back to an older GPS course.
            heading = last_heading;
            compass_source = last_source;
          }
          const char *source = compass_source == Source::GPS ? (live ? "GPS" : "최근 GPS")
              : compass_source == Source::MAGNETIC ? (live ? "자기센서" : "최근 자기센서")
              : compass_source == Source::LAST_GPS ? "최근 GPS" : "";
          const auto &field = id(g_compass_field);
          const uint32_t field_at = id(g_compass_field_at);
          const bool sample_recent = field_at != 0 && esphome::millis() - field_at <= 1500;
          const bool sample_finite = std::isfinite(field[0]) && std::isfinite(field[1]) && std::isfinite(field[2]);
          const char *sensor_status = "BMM150 값 수신";
          if (id(gnss_imu).is_failed()) {
            sensor_status = "BMI270 0x69 초기화 실패";
          } else if (id(g_compass_init_error) != nullptr) {
            sensor_status = id(g_compass_init_error);
          } else if (field_at == 0) {
            sensor_status = "BMM150 샘플 미수신";
          } else if (!sample_recent) {
            sensor_status = "BMM150 수신 끊김";
          } else if (!sample_finite) {
            sensor_status = "BMM150 무효 샘플";
          } else if (!compass->field_fresh()) {
            sensor_status = "BMM150 보정 신호 부족";
          }
          auto *sensor_label = id(lbl_compass_sensor_status);
          if (std::strcmp(lv_label_get_text(sensor_label), sensor_status) != 0)
            lv_label_set_text_static(sensor_label, sensor_status);

          char field_text[64] = "X -- / Y -- / Z -- uT";
          if (sample_recent) {
            char axis_text[3][16] = {"--", "--", "--"};
            for (size_t axis = 0; axis < field.size(); ++axis) {
              if (std::isfinite(field[axis]))
                snprintf(axis_text[axis], sizeof(axis_text[axis]), "%+.0f", field[axis]);
            }
            snprintf(field_text, sizeof(field_text), "X %s / Y %s / Z %s uT", axis_text[0], axis_text[1], axis_text[2]);
          }
          auto *field_label = id(lbl_compass_field);
          if (std::strcmp(lv_label_get_text(field_label), field_text) != 0)
            lv_label_set_text(field_label, field_text);

          // Retain the furthest learning condition reached during motion, across stops.
          // The compass keeps its observations until reboot or a change in level offsets.
          enum class LearningCheck {
            NONE, NO_FIX, BELOW_SPEED, POOR_RECEPTION, NO_COURSE, REVERSE, NO_FIELD, NO_POSE, READY
          };
          static LearningCheck best_check = LearningCheck::NONE;
          static auto last_level = std::pair{compass->pitch_offset(), compass->roll_offset()};
          const auto level = std::pair{compass->pitch_offset(), compass->roll_offset()};
          if (level != last_level) {
            best_check = LearningCheck::NONE;
            last_level = level;
          }
          const bool observing_motion = (compass->has_fix() && compass->speed_kmh() >= 3.0f) ||
              id(fn_sample_live)(10, id(car_speed).state, 5000) > 0.0f;
          if (observing_motion) {
            LearningCheck check = LearningCheck::READY;
            if (!compass->has_fix() || !std::isfinite(compass->speed_kmh())) check = LearningCheck::NO_FIX;
            else if (compass->speed_kmh() < ${compass_learning_speed_kmh}) check = LearningCheck::BELOW_SPEED;
            else if (!compass->hdop_ok()) check = LearningCheck::POOR_RECEPTION;
            else if (!compass->is_moving()) check = LearningCheck::NO_COURSE;
            else if (compass->is_reverse()) check = LearningCheck::REVERSE;
            else if (!compass->field_fresh()) check = LearningCheck::NO_FIELD;
            else if (!compass->pose_valid()) check = LearningCheck::NO_POSE;
            best_check = std::max(best_check, check);
          }

          char progress[64];
          const char *calibration_status = "GPS 자동 보정 대기";
          const Status status = compass->status();
          const auto sectors = static_cast<unsigned>(compass->sector_count());
          const auto samples = static_cast<unsigned long>(compass->sample_count());
          if (!observing_motion && !compass->is_calibrated() && samples > 0) {
            const char *reason = sectors < ${compass_learning_min_sectors} ? "GPS 방향 부족" : "GPS 보정값 미확정";
            snprintf(progress, sizeof(progress), "%s %u/8 (%lu)", reason, sectors, samples);
            calibration_status = progress;
          } else if (!observing_motion && !compass->is_calibrated() && best_check != LearningCheck::NONE) {
            switch (best_check) {
              case LearningCheck::NONE: break;
              case LearningCheck::NO_FIX: calibration_status = "주행 중 GPS 신호 부족"; break;
              case LearningCheck::BELOW_SPEED: calibration_status = "GPS 속도 미달 (${compass_learning_speed_kmh} km/h)"; break;
              case LearningCheck::POOR_RECEPTION: calibration_status = "GPS 수신 품질 부족"; break;
              case LearningCheck::NO_COURSE: calibration_status = "GPS 방향 신호 미확인"; break;
              case LearningCheck::REVERSE: calibration_status = "후진 중 보정 대기"; break;
              case LearningCheck::NO_FIELD: calibration_status = "주행 중 자기센서 신호 부족"; break;
              case LearningCheck::NO_POSE: calibration_status = "주행 중 자세 신호 부족"; break;
              case LearningCheck::READY: calibration_status = "GPS 보정 표본 미수집"; break;
            }
          } else if (!compass->field_fresh()) {
            calibration_status = "GPS 보정 대기 / 자기센서";
          } else if (!compass->pose_valid()) {
            calibration_status = "자세 신호 대기";
          } else switch (status) {
            case Status::WAITING_FOR_FIX: calibration_status = "GPS 신호 대기"; break;
            case Status::WAITING_FOR_MOTION:
            case Status::COLLECTING:
              snprintf(progress, sizeof(progress), "%s %u/8 (%lu)",
                       status == Status::COLLECTING ? "GPS 방향 수집" : "GPS 주행 대기",
                       sectors, samples);
              calibration_status = progress;
              break;
            case Status::CHECK_RECEPTION: calibration_status = "GPS 수신 상태 확인"; break;
            case Status::WAITING_FOR_MAGNETOMETER: calibration_status = "자기센서 신호 대기"; break;
            case Status::SAVED_FIT: calibration_status = "GPS 보정값 유지"; break;
            case Status::CALIBRATED: calibration_status = "GPS 자동 보정 완료"; break;
          }
          auto *status_label = id(lbl_compass_gps_status);
          if (std::strcmp(lv_label_get_text(status_label), calibration_status) != 0)
            lv_label_set_text(status_label, calibration_status);
          const int bearing = std::isfinite(heading) ? (std::lround(heading) + 360) % 360 : -1;
          static int previous_bearing = -2;
          auto *source_label = id(lbl_compass_source);
          if (std::strcmp(lv_label_get_text(source_label), source) != 0) lv_label_set_text_static(source_label, source);
          if (bearing == previous_bearing) return;
          previous_bearing = bearing;

          const bool has_bearing = bearing >= 0;
          auto *needle = id(line_compass_dial_needle)->obj;
          lv_obj_set_hidden(id(obj_compass_pointer), !has_bearing);
          lv_obj_set_hidden(needle, !has_bearing);
          if (has_bearing) {
            lv_label_set_text_fmt(id(lbl_vehicle_heading), "%03d°", bearing);
            lv_obj_set_style_transform_rotation(needle, bearing * 10, LV_PART_MAIN);
          } else {
            lv_label_set_text_static(id(lbl_vehicle_heading), "---°");
          }
          constexpr const char *directions[] = {"북", "북동", "동", "남동", "남", "남서", "서", "북서"};
          struct TapeMark {
            lv_obj_t *label;
            lv_obj_t *tick;
          };
          // Keep labels beyond both edges so the tape clips the glyphs as they scroll.
          static std::array<TapeMark, 9> marks{};
          auto *tape = id(obj_compass_tape);
          const int tape_center = has_bearing ? bearing : 0;
          const int nearest_tick = (tape_center + 7) / 15;
          for (int index = 0; index < static_cast<int>(marks.size()); ++index) {
            auto &[label, notch] = marks[index];
            if (label == nullptr) {
              label = lv_label_create(tape);
              lv_obj_set_style_text_font(label, id(font_compass_tape).get_lv_font(), LV_PART_MAIN);
              lv_obj_set_style_text_align(label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN);
              lv_obj_set_style_text_color(label, lv_color_hex(${tab5_color_text_primary}), LV_PART_MAIN);
              lv_obj_set_width(label, 56);
              notch = lv_obj_create(tape);
              lv_obj_remove_style_all(notch);
              lv_obj_set_clickable(notch, false);
              lv_obj_set_scrollable(notch, false);
              lv_obj_set_style_bg_color(notch, lv_color_hex(${tab5_color_text_muted}), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(notch, LV_OPA_COVER, LV_PART_MAIN);
            }
            const int tick = nearest_tick + index - static_cast<int>(marks.size() / 2);
            const int wrapped_tick = (tick + 24) % 24;
            const bool major = wrapped_tick % 3 == 0;
            const int x = 80 + (tick * 15 - tape_center) * 11 / 5;
            const int height = major ? 8 : 4;
            const int width = major ? 2 : 1;
            lv_obj_set_size(notch, width, height);
            lv_obj_set_pos(notch, x - width / 2, 40 - height);
            lv_obj_set_hidden(label, !has_bearing || !major);
            if (!has_bearing || !major) continue;
            const char *text = directions[wrapped_tick / 3];
            if (std::strcmp(lv_label_get_text(label), text) != 0) lv_label_set_text_static(label, text);
            lv_obj_set_pos(label, x - 28, -3);
          }

  - id: script_calibrate_tilt
    parameters:
      button: lv_obj_t*
      axis: string
    then:
      - lambda: |-
          auto *compass = id(id_compass);
          const bool pitch = axis == "Pitch";
          const float direction = pitch ? ${tab5_pitch_direction} : ${tab5_roll_direction};
          const esphome::optional<float> keep{};
          if (std::abs(pitch ? compass->pitch_offset() : compass->roll_offset()) > 0.0001f) {
            id(script_confirm_tilt_zero).stop();
            if (pitch) compass->set_level_offsets(0.0f, keep);
            else compass->set_level_offsets(keep, 0.0f);
            id(script_logs).execute(axis + " calibration cleared");
          } else {
            // The offset is zero here, so the leveled angle is the raw angle that becomes the new level.
            const float angle = pitch ? compass->pitch() : compass->roll();
            if (!std::isfinite(angle)) return;
            if (pitch) compass->set_level_offsets(angle, keep);
            else compass->set_level_offsets(keep, angle);
            id(script_confirm_tilt_zero).execute(pitch);
            char value[20];
            snprintf(value, sizeof(value), "%+.1f°", angle * direction + 0.0f);
            id(script_logs).execute(axis + " calibrated to " + value);
          }
