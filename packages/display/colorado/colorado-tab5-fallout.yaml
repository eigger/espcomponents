                        - lambda: |-
                            id(g_auto_ota_handled_versions).push_back(id(g_auto_ota_popup_version));
                            if (id(g_update_available) && id(g_latest_version) == id(g_auto_ota_popup_version)) {
                              id(g_update_alert_dismissed) = true;
                              if (id(g_alert_is_update)) fx::set_visible(id(popup_alert), false);
