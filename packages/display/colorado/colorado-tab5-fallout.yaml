# Focus Drive dashboard, 1280 × 720 after rotation.
lvgl:
  animations:
    - id: anim_crt_beam
      duration: 170ms
      timing: ease_out
      widgets:
        - id: obj_splash_crt
          min_width: { from: 2, to: 1120 }
          opa: { from: 0%, to: 85% }
    - id: anim_crt_raster
      duration: 250ms
      timing: ease_out
      widgets:
        - id: obj_splash_crt
          min_height: { from: 2, to: 550 }
          opa: { from: 85%, to: 0% }
    - id: anim_splash_terminal
      start_delay: 60ms
      duration: 390ms
      timing: ease_out
      widgets:
        - id: obj_splash_terminal
          translate_y: { from: 9, to: 0 }
          opa: { from: 0%, to: 100% }
    - id: anim_crt_scan
      start_delay: 170ms
      duration: 650ms
      widgets:
        - id: obj_splash_scan
          translate_y: { from: 0, to: 504 }
          opa: { from: 85%, to: 0% }

  top_layer:
    widgets:
      # ── 재시작 팝업 백드롭 ──
      - obj:
          id: obj_restart_backdrop
          hidden: true
          align: center
          width: 1280
          height: 720
          bg_color: "${tab5_color_shadow}"
          bg_opa: 50%
          border_width: 0
          radius: 0
          clickable: true

      # ── 재시작 팝업 모달 ──
      - obj:
          id: obj_restart_popup
          hidden: true
          align: center
          width: 520
          height: 310
          bg_color: "${tab5_color_card_bg}"
          border_width: 1
          border_color: "${tab5_color_card_border}"
          radius: 16
          pad_all: 20
          shadow_width: 30
          shadow_color: "${tab5_color_shadow}"
          shadow_opa: 50%
          widgets:
            - label:
                text: "시스템 재시작"
                align: top_mid
                y: 10
                text_color: "${tab5_color_accent}"
                text_font: notosans35
            - label:
                text: "시스템을 재시작하시겠습니까?"
                align: center
                y: -10
                text_color: "${tab5_color_text_primary}"
                text_font: notosans30
            - button:
                id: btn_restart_yes
                align: bottom_left
                x: 30
                y: -10
                width: 190
                height: 65
                <<: *danger_button
                on_click:
                  then:
                    - switch.turn_on: sw_restart
                widgets:
                  - label:
                      text: "예"
                      align: center
                      text_color: "${tab5_color_text_primary}"
                      text_font: notosans30
            - button:
                id: btn_restart_no
                align: bottom_right
                x: -30
                y: -10
                width: 190
                height: 65
                <<: *neutral_button
                on_click:
                  then:
                    - lambda: |-
                        id(tab5_motion_visible)(id(obj_restart_backdrop), false, 0);
                        id(tab5_motion_visible)(id(obj_restart_popup), false, 0);
                widgets:
                  - label:
                      text: "아니오"
                      align: center
                      text_color: "${tab5_color_text_primary}"
                      text_font: notosans30

      # ── 상단 헤더 (경고는 헤더 내부 최상단 레이어) ──
      - obj:
          id: obj_header
          hidden: true
          bg_color: "${tab5_color_panel_bg}"
          border_width: 0
          border_color: "${tab5_color_card_border}"
          align: top_mid
          pad_all: 0
          width: 1280
          height: 72
          x: 0
          y: 0
          widgets:
            - button:
                id: btn_logs_toggle
                align: left_mid
                x: 8
                y: 0
                width: 68
                height: 48
                bg_opa: 0%
                border_width: 0
                pad_all: 0
                outline_width: 0
                shadow_width: 0
                shadow_opa: 0%
                pressed:
                  bg_color: "${tab5_color_panel_pressed}"
                  bg_opa: COVER
                on_click:
                  then:
                    - lambda: |-
                        id(g_logs_visible) = !id(g_logs_visible);
                        id(tab5_motion_visible)(id(obj_log), id(g_logs_visible), 175);
                widgets:
                  - label:
                      align: center
                      text: "LOG"
                      text_font: notosans20
                      text_color: "${tab5_color_accent}"
            - image:
                src: img_wifi
                <<: &status_icon
                  hidden: true
                  image_recolor: "${tab5_color_accent}"
                  image_recolor_opa: 100%
                  align: left_mid
                  y: 0
                id: lbl_wifi
                x: 95
            - image:
                src: img_bluetooth
                <<: *status_icon
                id: lbl_bluetooth
                x: 160
            - image:
                src: img_satellite
                <<: *status_icon
                id: lbl_satellite
                x: 225
            #- label:
            #    id: lbl_version
            #    text: *version
            #    align: left_mid
            #    x: 290
            #    y: 0
            #    text_color: "${tab5_color_text_muted}"
            #    text_font: notosans20
            - label:
                id: lbl_date
                hidden: true
                text: ""
                align: right_mid
                x: -135
                y: 0
                text_color: "${tab5_color_accent}"
                text_font: notosans35
            - label:
                id: lbl_time
                hidden: true
                text: ""
                align: right_mid
                x: -10
                y: 0
                text_color: "${tab5_color_text_secondary}"
                text_font: notosans45
            - button:
                id: popup_alert
                hidden: true
                align: center
                width: SIZE_CONTENT
                min_width: 480
                height: 72
                bg_color: "${tab5_color_alert_danger}"
                bg_opa: COVER
                radius: 14
                border_width: 1
                border_color: "${tab5_color_text_primary}"
                border_opa: 28%
                pad_all: 8
                shadow_width: 16
                shadow_offset_x: 0
                shadow_offset_y: 6
                shadow_spread: 0
                shadow_color: "${tab5_color_shadow}"
                shadow_opa: 42%
                outline_width: 1
                outline_color: "${tab5_color_text_primary}"
                outline_opa: 0%
                pressed:
                  shadow_width: 4
                  shadow_offset_y: 2
                  border_opa: 18%
                on_click:
                  then:
                    - lambda: |-
                        id(alert_dismissed) = true;
                        id(script_logs).execute("ALERT: Dismissed");
                        id(tab5_motion_notice_active) = false;
                        id(tab5_motion_visible)(id(popup_alert), false, 0);
                widgets:
                  - image:
                      id: widget_img_alert
                      src: img_alert
                      align: left_mid
                      x: 8
                      image_recolor: "${tab5_color_text_primary}"
                      image_recolor_opa: 100%
                  - label:
                      id: lbl_alert_title
                      text: ""
                      align: left_mid
                      x: 56
                      y: 0
                      text_color: "${tab5_color_text_primary}"
                      text_font: font_alert_title
                  - label:
                      id: lbl_alert_msg
                      text: ""
                      align: left_mid
                      x: 140
                      y: 0
                      text_color: "${tab5_color_text_primary}"
                      text_font: font_alert_msg

      # CRT power-on and a staged terminal log. The log describes UI startup stages.
      - obj:
          id: obj_splash
          bg_color: "${tab5_color_background}"
          border_width: 0
          pad_all: 0
          align: center
          width: 1280
          height: 720
          scrollable: false
          widgets:
            - obj:
                id: obj_splash_crt
                align: center
                width: 2
                height: 2
                radius: 0
                border_width: 0
                pad_all: 0
                bg_color: "${tab5_color_accent}"
                bg_grad_color: "${tab5_color_background}"
                bg_grad_dir: VER
                bg_opa: 58%
                opa: 0%
                clickable: false
            - obj:
                id: obj_splash_terminal
                align: center
                width: 1168
                height: 574
                radius: 5
                pad_all: 0
                border_width: 1
                border_color: "${tab5_color_card_border}"
                bg_color: "${tab5_color_panel_bg}"
                opa: 0%
                clickable: false
                scrollable: false
                widgets:
                  - label: { <<: &boot_text { align: top_left, text_color: "${tab5_color_text_muted}", text_font: font_terminal_boot }, x: 32, y: 25, text: "MOBILE SERVICE TERMINAL", text_letter_space: 2 }
                  - label: { <<: *boot_text, align: top_right, x: -32, y: 25, text: *version }
                  - line: { <<: &boot_rule { align: top_left, line_color: "${tab5_color_card_border}", line_width: 1, clickable: false }, x: 32, y: 67, points: ["0, 0", "1100, 0"] }
                  - line: { <<: *boot_rule, x: 560, y: 99, points: ["0, 0", "0, 304"] }

                  - label: { <<: *boot_text, x: 32, y: 109, text: "VEHICLE INTERFACE", text_letter_space: 2 }
                  - label:
                      id: lbl_splash_title
                      text: "${splash_title}"
                      align: top_left
                      x: 29
                      y: 146
                      width: 507
                      long_mode: CLIP
                      text_color: "${tab5_color_text_primary}"
                      text_font: font_terminal_title
                  - line: { <<: *boot_rule, x: 32, y: 259, points: ["0, 0", "476, 0"] }
                  - label: { <<: *boot_text, x: 32, y: 293, text: "VEHICLE ID", text_letter_space: 2 }
                  - label:
                      id: lbl_splash_plate
                      <<: *boot_text
                      text: "${number}"
                      x: 32
                      y: 329
                      text_color: "${tab5_color_text_secondary}"
                      text_font: font_splash_plate

                  - label: { <<: *boot_text, x: 605, y: 109, text: "BOOT SEQUENCE", text_letter_space: 2 }
                  - obj:
                      id: obj_splash_stage_system
                      <<: &boot_log_row
                        align: top_left
                        x: 605
                        width: 1
                        height: 39
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        radius: 0
                        hidden: true
                        clickable: false
                        scrollable: false
                      y: 156
                      widgets:
                        - label: { <<: &boot_log_text { <<: *boot_text, width: SIZE_CONTENT, long_mode: CLIP, text_color: "${tab5_color_text_primary}" }, text: "01  >  WAKE DISPLAY" }
                  - obj:
                      <<: *boot_log_row
                      id: obj_splash_stage_network
                      y: 217
                      widgets:
                        - label: { <<: *boot_log_text, text: "02  >  PREPARE INPUT" }
                  - obj:
                      <<: *boot_log_row
                      id: obj_splash_stage_dash
                      y: 278
                      widgets:
                        - label: { <<: *boot_log_text, text: "03  >  LOAD INSTRUMENTS" }
                  - obj:
                      <<: *boot_log_row
                      id: obj_splash_stage_ready
                      y: 339
                      widgets:
                        - label: { <<: *boot_log_text, text_color: "${tab5_color_accent}", text: "04  >  DISPLAY READY" }

                  - line: { <<: *boot_rule, x: 32, y: 436, points: ["0, 0", "1100, 0"] }
                  - label: { <<: *boot_text, x: 32, y: 467, text: "INITIALIZATION", text_letter_space: 2 }
                  - label:
                      id: lbl_splash_percent
                      <<: *boot_text
                      align: top_right
                      x: -32
                      y: 467
                      text: "000%"
                      text_color: "${tab5_color_accent}"
                  - bar:
                      id: bar_splash_progress
                      align: top_left
                      x: 32
                      y: 513
                      width: 1100
                      height: 12
                      min_value: 0
                      max_value: 100
                      value: 0
                      anim_duration: 320ms
                      bg_color: "${tab5_color_gauge_track}"
                      indicator: { bg_color: "${tab5_color_accent}", radius: 0 }
                      border_width: 0
                      radius: 0
                      clickable: false
                  - line: { <<: *boot_rule, x: 32, y: 518, line_color: "${tab5_color_panel_bg}", line_width: 12, line_dash_width: 3, line_dash_gap: 107, points: ["0, 0", "1099, 0"] }
            - obj:
                id: obj_splash_scan
                align: top_left
                x: 58
                y: 94
                width: 1164
                height: 27
                radius: 0
                border_width: 0
                pad_all: 0
                bg_color: "${tab5_color_accent}"
                bg_grad_color: "${tab5_color_background}"
                bg_grad_dir: VER
                bg_opa: 22%
                opa: 0%
                clickable: false
                scrollable: false

  pages:
    # =============================================================
    # MAIN PAGE: Fallout-inspired vehicle status terminal
    # =============================================================
    - id: main_page
      bg_color: "${tab5_color_background}"
      widgets:

        # Speed, selector and trip information
        - obj:
            <<: &terminal_panel
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              radius: 0
              scrollable: false
              clickable: false
            align: top_left
            x: 30
            y: 103
            width: 304
            height: 452
            widgets:
              - label: { <<: &terminal_heading { align: top_left, text_color: "${tab5_color_text_muted}", text_font: notosans20 }, text: "SPEED", text_letter_space: 4 }
              - label: { id: lbl_speed, text: "--", align: top_left, y: 32, text_color: "${tab5_color_text_muted}", text_font: font_terminal_speed }
              - label: { <<: *terminal_heading, text: "km/h", y: 197 }
              - bar:
                  id: bar_speed
                  align: top_left
                  y: 237
                  width: 300
                  height: 8
                  min_value: 0
                  max_value: 160
                  animated: false
                  <<: &terminal_bar
                    bg_color: "${tab5_color_gauge_track}"
                    bg_opa: COVER
                    radius: 0
                    border_width: 0
                    pad_all: 0
                    clickable: false
                    indicator: { bg_color: "${tab5_color_accent}", radius: 0 }
              - obj:
                  <<: *terminal_panel
                  align: top_left
                  y: 262
                  width: 216
                  height: 44
                  widgets:
                    - label: { <<: &shift_letter { align: top_left, width: 40, y: 2, text_align: CENTER, text_color: "${tab5_color_text_muted}", text_font: notosans30 }, text: "P" }
                    - label: { <<: *shift_letter, text: "R", x: 43 }
                    - label: { <<: *shift_letter, text: "N", x: 86 }
                    - label: { <<: *shift_letter, text: "D", x: 129 }
                    - label: { <<: *shift_letter, text: "L", x: 172 }
                    - obj:
                        id: obj_prnd_selection
                        <<: *terminal_panel
                        align: top_left
                        width: 40
                        height: 42
                        hidden: true
                        bg_color: "${tab5_color_accent}"
                        bg_opa: COVER
                        widgets:
                          - label: { id: lbl_prnd, text: "-", align: center, text_color: "${tab5_color_background}", text_font: notosans30 }
              - label: { <<: *terminal_heading, text: "GEAR", x: 217, y: 271 }
              - obj:
                  <<: *terminal_panel
                  align: top_left
                  x: 263
                  y: 255
                  width: 41
                  height: 55
                  widgets:
                    - label: { id: lbl_gear, text: "-", align: center, text_color: "${tab5_color_text_primary}", text_font: notosans35 }
              - line: { <<: &terminal_line { align: top_left, line_color: "${tab5_color_card_border}", line_width: 1, clickable: false }, y: 328, points: ["0, 0", "300, 0"] }
              - obj:
                  <<: *terminal_panel
                  align: top_left
                  y: 344
                  width: 145
                  height: 77
                  widgets:
                    - image: { <<: &terminal_icon { align: top_left, image_recolor: "${tab5_color_accent}", image_recolor_opa: COVER, clickable: false }, id: widget_img_timer, src: img_timer }
                    - label: { <<: *terminal_heading, x: 33, y: 3, text: "운행시간" }
                    - label: { <<: &terminal_number { align: top_left, y: 31, text: "--", text_font: notosans30, text_align: RIGHT, text_color: "${tab5_color_text_muted}" }, id: lbl_engine_run_time, width: 145, text_align: LEFT, text: "--:--" }
              - obj:
                  <<: *terminal_panel
                  align: top_left
                  x: 157
                  y: 344
                  width: 145
                  height: 77
                  widgets:
                    - image: { <<: *terminal_icon, id: widget_img_trip, src: img_odometer }
                    - label: { <<: *terminal_heading, x: 33, y: 3, text: "운행거리" }
                    - label: { <<: *terminal_number, id: lbl_trip_distance, width: 94 }
                    - label: { <<: *terminal_heading, text: "km", x: 97, y: 44, text_font: notosans16 }
        # Vehicle service diagram and sensor labels
        - obj:
            <<: *terminal_panel
            align: top_left
            x: 364
            y: 99
            width: 886
            height: 458
            widgets:
              - obj:
                  <<: *terminal_panel
                  align: top_left
                  x: 0
                  y: 0
                  width: 145
                  height: 77
                  widgets:
                    - image: { <<: *terminal_icon, id: widget_img_coolant, src: img_coolant }
                    - label: { <<: *terminal_heading, x: 33, y: 3, text: "냉각수" }
                    - label: { <<: *terminal_number, id: lbl_engine_coolant_temperature, width: 94 }
                    - label: { <<: *terminal_heading, text: "°C", x: 97, y: 44, text_font: notosans16 }
              - obj:
                  <<: *terminal_panel
                  align: top_left
                  x: 148
                  y: 0
                  width: 145
                  height: 77
                  widgets:
                    - image: { <<: *terminal_icon, id: widget_img_intake, src: img_thermometer_lines }
                    - label: { <<: *terminal_heading, x: 33, y: 3, text: "흡기온도" }
                    - label: { <<: *terminal_number, id: lbl_intake_temp_display, width: 94 }
                    - label: { <<: *terminal_heading, text: "°C", x: 97, y: 44, text_font: notosans16 }
              - obj:
                  <<: *terminal_panel
                  align: top_left
                  x: 296
                  y: 0
                  width: 145
                  height: 77
                  widgets:
                    - image: { <<: *terminal_icon, id: widget_img_cabin_temp, src: img_thermometer_sm }
                    - label: { <<: *terminal_heading, x: 33, y: 3, text: "실내온도" }
                    - label: { <<: *terminal_number, id: lbl_cabin_temperature, width: 94 }
                    - label: { <<: *terminal_heading, text: "°C", x: 97, y: 44, text_font: notosans16 }
              - obj:
