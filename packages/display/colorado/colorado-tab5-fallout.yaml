                  text_color: "${tab5_color_text_muted}"
                pressed:
                  bg_color: "${tab5_color_panel_pressed}"
                  bg_opa: COVER
                on_click:
                  then:
                    - lambda: |-
                        id(script_set_service_visible).execute(!id(g_logs_visible));
                widgets:
                  - label:
                      id: lbl_menu_toggle
                      align: center
                      text: "MENU"
                      text_font: notosans20
            - image:
                src: img_wifi
                <<: &status_icon
                  hidden: true
