# Dashboard motion. Sizes are the tab5_motion_emphasis look; intensity scales them when it is 0.
# Decorative motion is suppressed before boot and while an urgent popup or service view is up.
lvgl_fx:
  id: motion_fx
  motion:
    fast: 100ms
    normal: 165ms
    slow: 320ms
    intensity: "${ 1.0 if tab5_motion_emphasis | int else 0.7 }"
  # About 90 animated widgets: 19 icons, 9 scan areas, ~21 readout labels, popups and links, PRND, poses, the 8
  # boot terminal labels (typewriter/decode keep their slot for good; the splash is hidden, never deleted) and the
  # 12 scan leader lines (a drawn line keeps its slot for good).
  max_targets: 100
  # script_render_scan_status draws 12 leader lines of at most 6 points. All 12 can animate at once (every mode
  # changing in one sensor sweep), so 12 runs are never short: 12 x (16 + 8 x 6) = 768 bytes of BSS.
  max_line_runs: 12
  max_line_points: 6
  # script_boot_typing: at most 2 labels type/decode at once (title decode 415-735 ms with row1 700-1118 ms;
  # trim decode 1684-1892 ms with row3 1740-2085 ms; power decode 2140-2336 ms with row4 2240-2640 ms).
  # One spare run covers the 15 ms timer granularity.
  max_text_runs: 3
  slots_in_psram: true
  suppress_when: !lambda return id(g_notice_active) || id(g_logs_visible);

  transitions:
    defaults:
      visible: { show: fade, hide: none, duration: normal, curve: ease_out }   # fade in, hide at once
      value: { duration: 200ms, curve: ease_out }
      text: { style: fade, from: "${ 82 if tab5_motion_emphasis | int else 88 }%", duration: 155ms, curve: ease_out }
      color: { duration: 0ms }
      position: { duration: 160ms, curve: ease_out }
      rotation: { duration: 165ms, curve: ease_out }
    custom:
      - id: fx_show_130
        visible: { show: fade, hide: none, duration: 130ms }
      - id: fx_show_175
        visible: { show: fade, hide: none, duration: 175ms }
      - id: fx_show_185
        visible: { show: fade, hide: none, duration: 185ms }
      - id: fx_splash_out
        visible: { show: fade, hide: fade, duration: 200ms }
      # Boot terminal (script_boot_typing): typed lines per char_ms, decodes per locked-character step.
      - id: fx_type_13
        text: { style: typewriter, char_time: 13ms, jitter: true }
      - id: fx_type_22
        text: { style: typewriter, char_time: 22ms, jitter: true }
      - id: fx_type_18
        text: { style: typewriter, char_time: 18ms, jitter: true }
      - id: fx_type_15
        text: { style: typewriter, char_time: 15ms, jitter: true }
      - id: fx_type_20
        text: { style: typewriter, char_time: 20ms, jitter: true }
      - id: fx_decode_40
        text: { style: decode, char_time: 40ms, noise: "#%&*+<>/=0123456789", noise_period: 50ms }
      - id: fx_decode_26
        text: { style: decode, char_time: 26ms, noise: "#%&*+<>/=0123456789", noise_period: 50ms }
      - id: fx_decode_28
        text: { style: decode, char_time: 28ms, noise: "#%&*+<>/=0123456789", noise_period: 50ms }
      # Gauge glides: the bars of the dashboard.
      - id: fx_bar_165
        policy: always
        value: { duration: 165ms }
      - id: fx_bar_220
        policy: always
        value: { duration: 220ms }
      - id: fx_bar_375
        policy: always
        value: { duration: 375ms }
      - id: fx_bar_400
        policy: always
        value: { duration: 400ms }
      - id: fx_instrument
        policy: always
        value: { duration: 200ms }
        rotation: { duration: 165ms, curve: ease_out }
      - id: fx_text_now
        text: { style: none }
      - id: fx_text_80
        text: { duration: 80ms }
      # The gear digit rolls in from below (up-shift) or above (down-shift) without fading.
      - id: fx_gear_roll
        text: { style: roll, distance: 14, from: 100%, duration: 140ms }
      # Scan leaders (script_render_scan_status): the route draws in, and erases a little faster.
      # on_end hides the line once the erase has ended, or was applied at once (policy, duration 0). It does not run
      # when a draw-in supersedes the erase, so a leader drawn again mid-erase stays visible.
      - id: fx_leader_draw
        draw: { duration: 200ms, curve: linear }
      - id: fx_leader_erase
        draw: { duration: 120ms, curve: linear }
        on_end:
          - lambda: lv_obj_set_hidden(x, true);
      # PRND selection bar: slides to the letter, then flashes.
      - id: fx_prnd_move
        position: { duration: 160ms, curve: ease_out }
        then: fx_prnd_confirm
      - id: fx_vehicle_scan_sweep
        position: { duration: "${vehicle_scan_sweep_ms}ms", curve: linear }

    bindings:
      - { id: obj_splash, visible: fx_splash_out }
      - { id: popup_alert, visible: fx_show_185 }
      - { id: obj_restart_backdrop, visible: fx_show_185 }
      - { id: obj_restart_popup, visible: fx_show_185 }
      - { id: obj_log, visible: fx_show_175 }
      - { id: obj_jaalee_detail, visible: fx_show_130 }
      - { id: bar_tcc_slip, value: fx_bar_165 }
      - { id: obj_pitch_shape, rotation: fx_instrument }
      - { id: obj_roll_shape, rotation: fx_instrument }
      - { id: obj_prnd_selection, position: fx_prnd_move }
      - { id: lbl_gear, text: fx_gear_roll }

  effects:
    - id: fx_prnd_confirm
      tracks:
        - flash: { property: bg_color, color: white, duration: 340ms, curve: ease_in }
    # The dark bar under the letter fades into the selection once the move has ended (160 ms).
    - id: fx_prnd_bar
      tracks:
        - flash: { property: bg_color, color: "${tab5_color_background}", duration: 340ms, curve: ease_in, delay: 160ms }
    - id: fx_prnd_pulse
      tracks:
        - pulse: { scale: 120%, duration: 230ms, curve: ease_out }

    # Readout icon accents (which one a color earns is decided by fn_icon_accent).
    - id: fx_icon_light
      cooldown: 2500ms
      cooldown_scope: widget
      tracks:
        - flash: { property: image_recolor, amount: 29%, profile: triangle, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }
    - id: fx_icon_heat
      cooldown: 2500ms
      cooldown_scope: widget
      tracks:
        - flash: { property: image_recolor, amount: 29%, profile: triangle, duration: "${ 220 + 40 * (tab5_motion_emphasis | int) }ms" }
        - nudge: { y: -3, duration: "${ 220 + 40 * (tab5_motion_emphasis | int) }ms" }
    - id: fx_icon_cold
      cooldown: 2500ms
      cooldown_scope: widget
      tracks:
        - flash: { property: image_recolor, amount: 29%, profile: triangle, duration: "${ 160 + 40 * (tab5_motion_emphasis | int) }ms" }
        - shake: { distance: 2, cycles: 2, axis: x, duration: "${ 160 + 40 * (tab5_motion_emphasis | int) }ms" }
    - id: fx_icon_drop
      cooldown: 2500ms
      cooldown_scope: widget
      tracks:
        - flash: { property: image_recolor, amount: 29%, profile: triangle, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }
        - nudge: { y: 3, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }
    - id: fx_icon_dry
      cooldown: 2500ms
      cooldown_scope: widget
      tracks:
        - flash: { property: image_recolor, amount: 29%, profile: triangle, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }
        - pulse: { scale: 92%, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }
    - id: fx_icon_grow
      cooldown: 2500ms
      cooldown_scope: widget
      tracks:
        - flash: { property: image_recolor, amount: 29%, profile: triangle, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }
        - pulse: { scale: 106%, duration: "${ 180 + 40 * (tab5_motion_emphasis | int) }ms" }

    - id: fx_scan_pulse
      policy: always
      tracks:
        - image_pulse: { amount: 30%, duration: 220ms, curve: ease_out }

    # A readout that comes back from "--" flashes white into its color.
    - id: fx_recover
      tracks:
        - flash: { property: text_color, color: white, duration: 320ms, curve: ease_in }

    # Outline glows (calibrate, log highlight). They run even while a notice is up, like the old outline fade.
    - id: fx_glow_205
      policy: always
      tracks:
        - glow: { opacity: 70%, duration: 205ms, curve: ease_out }
    - id: fx_glow_260
      policy: always
      tracks:
        - glow: { opacity: 70%, duration: 260ms, curve: ease_out }
    - id: fx_glow_320
      policy: always
      tracks:
        - glow: { opacity: 70%, duration: 320ms, curve: ease_out }

