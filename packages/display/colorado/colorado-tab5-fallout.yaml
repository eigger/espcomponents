          height: 72
          x: 0
          y: 0
          widgets:
            - button:
                id: btn_logs_toggle
                align: left_mid
                x: 8
                y: 0
                width: 76
                height: 48
                bg_opa: 0%
                border_width: 0
                pad_all: 0
                outline_width: 0
                shadow_width: 0
                shadow_opa: 0%
                text_color: "${tab5_color_accent}"
                state:
                  disabled: false
                disabled:
                  text_color: "${tab5_color_text_muted}"
                pressed:
                  bg_color: "${tab5_color_panel_pressed}"
                  bg_opa: COVER
                on_click:
                  then:
                    - lambda: |-
                        if (!id(fn_service_allowed)()) return;
                        const bool opening = !id(g_logs_visible);
                        id(script_set_service_visible).execute(opening, 2);
                        id(script_sound_play).execute(opening ? 1 : 2);
                widgets:
                  - label:
