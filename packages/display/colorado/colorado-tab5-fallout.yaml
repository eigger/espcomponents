    type: bool
    initial_value: 'false'
  # An urgent alert popup is up (lvgl_fx suppress_when).
  - id: g_notice_active
    type: bool
    initial_value: 'false'
  # lvgl_fx.start has run (the dashboard may animate).
  - id: g_motion_ready
    type: bool
    initial_value: 'false'
  # Which accent a readout icon earns when its color changes is decided here; lvgl_fx plays it.
  # Returns true when an accent started (the readout text then skips its own fade).
  - id: fn_icon_accent
    type: "bool (*)(lv_obj_t *, lv_color_t, int, bool)"
    initial_value: |-
      +[](lv_obj_t *icon, lv_color_t color, int mode, bool force) -> bool {
        struct State {
          lv_obj_t *icon;
          lv_color_t color;
          uint32_t last_play;
          bool played;
        };
        static State states[32]{};
        static uint32_t last_icon = 0;
        State *state = nullptr;
        bool first = false;
        for (auto &entry : states) {
          if (entry.icon == icon) {
            state = &entry;
            break;
          }
        }
        if (!state) {
          for (auto &entry : states) {
            if (entry.icon) continue;
            state = &entry;
            state->icon = icon;
            first = true;
            break;
          }
        }
        if (!state) {
          lv_obj_set_style_image_recolor(icon, color, LV_PART_MAIN);
          return false;
        }
        if (!first && !force && lv_color_eq(state->color, color)) return false;
        fx::stop(icon);
        state->color = color;
        fx::set_color(icon, color);

        // Use the dashboard's existing color bands, including warm-up and warning thresholds.
        const uint32_t rgb = lv_color_to_u32(color) & 0xFFFFFF;
        const bool cool = rgb == ${tab5_color_status_cold} || rgb == ${tab5_color_status_cool};
        const bool warm = rgb == ${tab5_color_status_warm} || rgb == ${tab5_color_status_hot};
        fx::EffectRef effect = nullptr;
        if (force) {
          effect = &id(fx_icon_light);
        } else {
          switch (mode) {
            case 2: case 5: case 15: case 17: case 18:
              if (cool) effect = &id(fx_icon_cold);
              else if (warm || rgb == ${tab5_color_accent}) effect = &id(fx_icon_heat);
              break;
            case 3: case 16:
              if (cool) effect = &id(fx_icon_drop);
              else if (warm) effect = &id(fx_icon_dry);
              break;
            case 6:
              if (warm) effect = &id(fx_icon_drop);
              break;
            case 8: case 13:
              if (warm) effect = &id(fx_icon_grow);
              break;
            default:
              if (warm) effect = &id(fx_icon_light);
              break;
          }
        }
        if (!id(g_motion_ready) || id(g_notice_active) || id(g_logs_visible) || (first && !force) || !effect) return false;
        // At most one accent per icon every 2.5 s, and one anywhere every 230-275 ms.
        if (state->played && lv_tick_elaps(state->last_play) < 2500) return false;
        if (last_icon && lv_tick_elaps(last_icon) < (${tab5_motion_emphasis} != 0 ? 275 : 230)) return false;
        last_icon = state->last_play = lv_tick_get();
        state->played = true;
        fx::play(icon, effect);
        return true;
      }
  - id: g_service_setup
    type: bool
    initial_value: 'true'
  - id: g_log_unread
    type: uint32_t
    initial_value: '0'
  - id: g_log_highlight_pending
