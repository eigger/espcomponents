                    - line: { <<: *truck_detail, x: 412, y: 40, points: ["2, 2", "98, 2", "93, 22", "2, 22", "2, 2"] }
                    - line: { <<: *truck_detail, x: 412, y: 212, points: ["2, 22", "98, 22", "93, 2", "2, 2", "2, 22"] }
