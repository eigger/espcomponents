# The GNSS module's BMM150 feeds the compass through the gnss_imu callback (on_boot).
gps_compass:
  id: id_compass
  gps_id: id_gps
  min_learning_speed: ${compass_learning_speed_kmh} km/h
  min_sectors: ${compass_learning_min_sectors}
  accelerometer: { x: id_bmi270_accel_x, y: id_bmi270_accel_y, z: id_bmi270_accel_z }
  # With the default directions (pitch -1, roll +1) this is forward +Z, right +Y: pitch = atan2(-dir * az, ...) and
  # roll = atan2(-dir * ay, ...), so flipping a direction substitution flips the matching axis.
  forward_axis: "${ '+Z' if tab5_pitch_direction | int < 0 else '-Z' }"
  right_axis: "${ '+Y' if tab5_roll_direction | int > 0 else '-Y' }"
  # While in reverse the vehicle points 180 degrees away from its GPS course (the gear label must be fresh).
  reverse: !lambda |-
    const auto gear_at = id(g_dashboard_samples)[22];
    return id(obd_client).connected() && gear_at && esphome::millis() - gear_at < 3000 &&
        lv_label_get_text(id(lbl_prnd))[0] == 'R';
  # Leveled attitude in the component's frame (nose-up / right-side-down positive). The labels show the old
  # installation-frame value, i.e. multiplied by the direction substitution again.
  pitch:
    name: "Pitch"
    id: id_device_pitch
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_pitch_value
            text: !lambda |-
              if (isnan(x)) return std::string("--");
              char buf[12]; snprintf(buf, sizeof(buf), "%+.1f°", x * ${tab5_pitch_direction} + 0.0f); return std::string(buf);
        - script.execute: script_render_pose
  roll:
    name: "Roll"
    id: id_device_roll
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_roll_value
            text: !lambda |-
              if (isnan(x)) return std::string("--");
              char buf[12]; snprintf(buf, sizeof(buf), "%+.1f°", x * ${tab5_roll_direction} + 0.0f); return std::string(buf);
        - script.execute: script_render_pose
  on_calibrated:
    - lambda: |-
        if (!first) return;
        id(g_compass_gps_notice_pending) = true;
        id(script_logs).execute("Compass GPS / pitch-roll calibration saved");

globals:
  - id: g_gps_nmea_at
    type: uint64_t
    initial_value: '0'
  - id: g_gps_latest_fix
    type: bool
    initial_value: 'false'
  - id: fn_gps_receiving
    type: "bool (*)(uint64_t)"
    initial_value: |-
      +[](uint64_t now) {
        const uint64_t last_nmea = id(g_gps_nmea_at);
        return last_nmea != 0 && now - last_nmea <= 3000;
      }
  - id: g_info_wifi_error
    type: std::array<char, 96>
    initial_value: 'std::array<char, 96>{}'
  - id: g_info_accel_at
    type: uint32_t
    initial_value: '0'
  - id: g_compass_field
    type: std::array<float, 3>
    initial_value: "{0.0f, 0.0f, 0.0f}"
  - id: g_compass_field_at
    type: uint32_t
    initial_value: '0'
  - id: g_compass_init_error
    type: const char *
    initial_value: 'nullptr'
  - id: g_sound_volume
    type: float
    restore_value: yes
    initial_value: '0.4f'
  - id: g_sound_muted
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: g_sound_ready
    type: bool
    initial_value: 'false'
  - id: g_sound_priority
    type: int
    initial_value: '0'
  - id: g_trip_soundtrack_playing
    type: bool
    initial_value: 'false'
  - id: g_trip_soundtrack_started_at
    type: uint32_t
    initial_value: '0'
  - id: g_trip_replay_available
    type: bool
    initial_value: 'false'
  # Per-link debounce and announcement of the last stable state.
  # Links: 0 = Wi-Fi, 1 = OBD BLE, 2 = fresh GPS position fix.
  - id: fn_sound_link
    type: "int (*)(unsigned, bool, uint32_t, bool, bool)"
    initial_value: |-
      +[](unsigned link, bool connected, uint32_t now, bool enabled, bool can_play) -> int {
        struct Link {
          int stable = -1;
          int candidate = -1;
          int announced_state = -1;
          int pending = -1;
          uint32_t changed = 0;
          uint32_t queued = 0;
          uint32_t announced = 0;
        };
        static std::array<Link, 3> links{};
        if (link >= links.size()) return -1;
        auto &state = links[link];
        const int observed = connected ? 1 : 0;
        if (state.candidate != observed) {
          state.candidate = observed;
          state.changed = now;
          state.pending = -1;  // Never announce a connection that has already changed.
        }
        // GPS: a fix must hold 5 s and a loss 15 s (tunnels, garages, weak sky view).
        const uint32_t debounce = link == 2 ? (connected ? 5000 : 15000) : 750;
        if (state.stable != observed && now - state.changed >= debounce) state.stable = observed;
        // Muting/OTA updates the baseline without replaying old events later.
        if (!enabled) {
          state.announced_state = state.stable;
          state.pending = -1;
          return -1;
        }
        // GPS speaks at most once per minute. A change held back by the cooldown is
        // announced afterwards only if it still differs from what was last heard.
        const uint32_t cooldown = link == 2 ? 60000 : 0;
        const bool cooled = state.announced_state < 0 || now - state.announced >= cooldown;
        if (state.pending < 0 && state.stable >= 0 && state.candidate == state.stable &&
            state.stable != state.announced_state && cooled) {
          if (state.announced_state < 0 && state.stable == 0) {
            state.announced_state = 0;  // Starting disconnected is not an event.
          } else {
            state.pending = state.stable;
            state.queued = now;
          }
        }
        // A cue that could not play within 5 s is dropped rather than replayed late.
        if (state.pending >= 0 && now - state.queued > 5000) {
          state.announced_state = state.pending;
          state.announced = now;
          state.pending = -1;
        }
        if (!can_play || state.pending < 0) return -1;
        const int cue = 9 + static_cast<int>(link) * 2 + (state.pending ? 0 : 1);
        state.announced_state = state.pending;
        state.announced = now;
        state.pending = -1;
        return cue;
      }
  # Captureless function pointer keeps alert state local without an external header.
  - id: fn_sound_alert
    type: "int (*)(const char *, unsigned, uint8_t, uint32_t)"
    initial_value: |-
      +[](const char *operation, unsigned key, uint8_t severity, uint32_t now) -> int {
        // All state stays inside this YAML function; no custom include is needed.
        class SoundAlerts {
         public:
          constexpr void begin() { for (auto &s : states_) { s.seen = false; s.observed = 0; } }
          constexpr void observe(unsigned key, uint8_t severity, uint32_t now) {
            if (key >= states_.size()) return;
            auto &s = states_[key];
            if (!s.active) { s = {}; s.active = true; }
            if (severity > s.observed) s.observed = severity;
            // A brief danger/caution oscillation must not restart the sound each poll.
            // Only a previously unseen severity in this active episode bypasses cooldown.
            // Cleared here, not in end(), so the popup can show the escalation this poll.
            if (severity > s.peak_severity) {
              s.acknowledged = false; s.played = false; s.peak_severity = severity;
            }
            s.seen = true;
            s.last_seen = now;
          }
          constexpr void end(uint32_t now) {
            for (auto &s : states_) {
              if (s.seen) {
                s.severity = s.observed;
              } else if (s.active && uint32_t(now - s.last_seen) >= 5000) s = {};
            }
          }
          constexpr int pending(uint32_t now) const {
            int best = -1;
            for (unsigned i = 0; i < states_.size(); ++i) {
              const auto &s = states_[i];
              const uint32_t interval = s.severity >= 2 ? 20000 : 60000;
              if (!s.active || !s.seen || s.acknowledged ||
                  (s.played && uint32_t(now - s.last_played) < interval)) continue;
              if (best < 0 || s.severity > states_[best].severity ||
                  (s.severity == states_[best].severity && !s.played && states_[best].played)) best = i;
            }
            return best;
          }
          constexpr uint8_t severity(unsigned key) const { return key < states_.size() ? states_[key].severity : 0; }
          // One sound covers all currently pending conditions of equal/lower severity.
          // This avoids a sequence of redundant alarms when several sensors warn at once.
          constexpr void played(uint8_t severity, uint32_t now) {
            for (auto &s : states_) if (s.active && s.seen && s.severity <= severity) {
              s.played = true; s.last_played = now;
            }
          }
          constexpr void acknowledge(unsigned key) { if (key < states_.size()) states_[key].acknowledged = true; }
          // Dismissing the popup confirms every condition active at that moment.
          // New conditions and higher severities still sound and re-show the popup.
          constexpr void acknowledge_all() { for (auto &s : states_) if (s.active) s.acknowledged = true; }
          constexpr bool acknowledged(unsigned key) const {
            return key < states_.size() && states_[key].active && states_[key].acknowledged;
          }
         private:
          struct State {
            bool active{false}, seen{false}, played{false}, acknowledged{false};
            uint8_t severity{0}, observed{0}, peak_severity{0};
            uint32_t last_seen{0}, last_played{0};
          };
          std::array<State, 32> states_{};
        };
        static SoundAlerts alerts;
        if (std::strcmp(operation, "begin") == 0) alerts.begin();
        else if (std::strcmp(operation, "observe") == 0) alerts.observe(key, severity, now);
        else if (std::strcmp(operation, "end") == 0) alerts.end(now);
        else if (std::strcmp(operation, "pending") == 0) return alerts.pending(now);
        else if (std::strcmp(operation, "severity") == 0) return alerts.severity(key);
        else if (std::strcmp(operation, "played") == 0) alerts.played(severity, now);
        else if (std::strcmp(operation, "acknowledge_all") == 0) alerts.acknowledge_all();
        else if (std::strcmp(operation, "acknowledged") == 0) return alerts.acknowledged(key) ? 1 : 0;
        else if (std::strcmp(operation, "acknowledge") == 0) alerts.acknowledge(key);
        else return -1;
        return 0;
      }
