                on_click:
                  - lambda: |-
                      if (!id(g_logs_visible) || !id(fn_service_allowed)() || id(g_service_tab) == 3) return;
                      id(script_select_service_tab).execute(3);
                      id(script_sound_play).execute(3);
                widgets:
                  - label: { id: lbl_service_info_tab, align: center, text: "INFO", text_font: font_terminal_boot, text_color: "${tab5_color_accent}" }
            - button:
                <<: *service_tab
                id: btn_service_log_tab
                x: 744
                width: 120
                on_click:
                  - lambda: |-
                      if (!id(g_logs_visible) || !id(fn_service_allowed)() || id(g_service_tab) == 1) return;
                      id(script_select_service_tab).execute(1);
                      id(script_sound_play).execute(3);
                widgets:
                  - label: { id: lbl_service_log_tab, align: center, text: "LOG", text_font: font_terminal_boot, text_color: "${tab5_color_accent}" }
            - label:
