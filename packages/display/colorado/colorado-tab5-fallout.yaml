  - id: script_update_trip_report
    then:
      - lambda: |-
          auto &running_since = id(g_live_trip_started_at);
          auto &ended_at = id(g_live_trip_ended_at);
          static uint32_t last_rpm_at = 0;
          static bool completed = false;
          static bool final_distance_handled = false;
          static uint32_t pending_open_at = 0;
          static uint32_t first_tvoc_at = 0;
          static std::array<float, 3> peaks{NAN, NAN, NAN};
          static float min_voltage = NAN;
          static float max_voltage = NAN;
          constexpr uint16_t missing = UINT16_MAX;
          static std::array<uint16_t, 48> rpm_history{};
          static std::array<uint32_t, 10> last_sample_at{};
          auto &history = id(g_live_trip_history);
          auto &history_sample_s = id(g_live_trip_history_sample_s);
          auto &environment_ranges = id(g_live_trip_environment_ranges);
          auto &step_s = id(g_live_trip_step_s);
          const uint32_t now = esphome::millis();
          const auto &sample_times = id(g_dashboard_samples);
          const float rpm = id(fn_sample_live)(8, id(engine_rpm).state, 8000);
          const bool obd_connected = id(obd_client).connected();
          const bool rpm_available = obd_connected && std::isfinite(rpm);
          const bool new_rpm = rpm_available && sample_times[8] != last_rpm_at;
          if (new_rpm) last_rpm_at = sample_times[8];
          const bool engine_running = rpm_available && rpm > ${trip_report_off_rpm};
          const bool moving = id(fn_sample_live)(10, id(car_speed).state, 5000) > 0.0f;
          if (!first_tvoc_at) first_tvoc_at = sample_times[12];
          if (!completed) {
            if (rpm_available && rpm >= 400.0f && !running_since) {
              running_since = sample_times[8];
              for (auto &bucket : history) bucket.fill(missing);
              environment_ranges.fill({missing, missing});
              if (id(g_initial_odometer) < 0.0f) id(odometer).update();
            }
            if (engine_running || moving) {
              ended_at = 0;
            } else if (running_since && new_rpm && rpm >= 0.0f && !ended_at) {
              ended_at = sample_times[8];
              id(odometer).update();
            }
          }

          // Cabin and bed sensors keep reporting during a transient OBD outage.
          if (!completed && running_since && !ended_at) {
            if (engine_running) {
              const uint32_t voltage_at = sample_times[7];
              const float voltage = id(fn_sample_live)(7, id(car_battery).state, 35000);
              if (std::isfinite(voltage) && now - voltage_at <= now - running_since) {
                if (!std::isfinite(min_voltage) || voltage < min_voltage) min_voltage = voltage;
                if (!std::isfinite(max_voltage) || voltage > max_voltage) max_voltage = voltage;
              }
            }
            const struct { int mode; float value; uint32_t max_age; float low; float high; } sensors[] = {
              {5, id(engine_coolant_temperature).state, 35000, -100, 250},
              {18, id(transmission_temperature).state, 35000, -100, 250},
              {26, id(engine_oil_temperature).state, 35000, -100, 250},
              {2, id(id_cabin_temperature).state, 300000, -60, 100},
              {15, id(id_bed_temperature).state, 300000, -60, 100},
              {3, id(id_cabin_humidity).state, 300000, 0, 100},
              {16, id(id_bed_humidity).state, 300000, 0, 100},
              {13, id(id_scd40_co2).state, 15000, 1, 65000},
              {12, id(id_sgp30_tvoc).state, 8000, 0, 65000},
              {8, rpm, 8000, 1, 10000},
            };
            for (size_t series = 0; series < std::size(sensors); ++series) {
              const auto &sensor = sensors[series];
              const uint32_t sampled_at = sample_times[sensor.mode];
              const float value = id(fn_sample_live)(sensor.mode, sensor.value, sensor.max_age);
              if (sampled_at == last_sample_at[series] || !std::isfinite(value) ||
                  value < sensor.low || value > sensor.high) continue;
              const bool rpm_channel = sensor.mode == 8;
              const bool environment = !rpm_channel && series >= peaks.size();
              if ((rpm_channel && !engine_running) || (!environment && !obd_connected) ||
                  now - sampled_at > now - running_since) continue;
              // The SGP30 reports a fixed zero during its first 15 seconds after initialization.
              if (sensor.mode == 12 && sampled_at - first_tvoc_at < 15000) continue;
              last_sample_at[series] = sampled_at;
              const auto encoded = static_cast<uint16_t>(std::lround(value) + 100);
              if (environment) {
                auto &[low, high] = environment_ranges[series - peaks.size()];
                low = std::min(low, encoded);
                high = high == missing ? encoded : std::max(high, encoded);
              } else if (!rpm_channel && (!std::isfinite(peaks[series]) || value > peaks[series])) {
                peaks[series] = value;
              }
              const uint32_t seconds = (sampled_at - running_since) / 1000;
              while (seconds / step_s >= history.size()) {
                // Keep the latest available reading in each pair of older time buckets.
                for (size_t bucket = 0; bucket < history.size() / 2; ++bucket) {
                  const size_t earlier = 2 * bucket;
                  const size_t later = earlier + 1;
                  for (size_t channel = 0; channel < history[bucket].size(); ++channel) {
                    const size_t source = history[later][channel] != missing ? later : earlier;
                    history[bucket][channel] = history[source][channel];
                    history_sample_s[bucket][channel] = history_sample_s[source][channel];
                  }
                  const uint16_t later_rpm = rpm_history[2 * bucket + 1];
                  rpm_history[bucket] = later_rpm != 0 ? later_rpm : rpm_history[2 * bucket];
                }
                for (size_t bucket = history.size() / 2; bucket < history.size(); ++bucket)
                  history[bucket].fill(missing);
                std::fill(rpm_history.begin() + history.size() / 2, rpm_history.end(), 0);
                step_s *= 2;
              }
              const size_t bucket = seconds / step_s;
              if (rpm_channel) {
                rpm_history[bucket] = static_cast<uint16_t>(std::lround(value));
              } else {
                history[bucket][series] = encoded;
                history_sample_s[bucket][series] = seconds;
              }
            }
          }

          const float km = id(trip_distance).state;
          const uint32_t cutoff_age = now - ended_at;
          const bool cutoff_recent = ended_at && cutoff_age < 8000;
          const bool final_distance = sample_times[19] && now - sample_times[19] <= cutoff_age;
          const auto trip_summary = [&](uint32_t at) {
            return std::array<float, 7>{km, (at - running_since) / 1000.0f,
                                         peaks[0], peaks[1], peaks[2], min_voltage, max_voltage};
          };
          const bool was_completed = completed;
          const bool trip_visible = id(g_logs_visible) && id(g_service_tab) == 2;
          if (!completed && cutoff_recent && !moving &&
              std::isfinite(km) && km >= ${trip_report_min_km}) {
            completed = true;
            final_distance_handled = final_distance;
            if (id(g_trip_soundtrack_playing)) id(script_sound_stop).execute();
            id(g_trip_report) = trip_summary(ended_at);
            id(g_trip_history) = history;
            id(g_trip_history_sample_s) = history_sample_s;
            id(g_trip_history_step_s) = step_s;
            id(g_trip_rpm_history) = rpm_history;
            id(g_trip_environment_ranges) = environment_ranges;
            pending_open_at = std::max<uint32_t>(now, 1);
          } else if (completed && !final_distance_handled) {
            if (engine_running || moving || !cutoff_recent) {
              final_distance_handled = true;
            } else if (final_distance && std::isfinite(km)) {
              final_distance_handled = true;
              auto &report = id(g_trip_report);
              if (km > report[0]) {
                report[0] = km;
                if (trip_visible) id(script_render_trip_distance).execute(km, report[1]);
              }
            }
          }

          const bool was_in_progress = id(g_trip_in_progress);
          id(g_trip_in_progress) = running_since && !completed && (!ended_at || cutoff_recent);
          if (id(g_trip_in_progress)) id(g_live_trip_summary) = trip_summary(ended_at ? ended_at : now);
          if (trip_visible && (was_in_progress != id(g_trip_in_progress) || was_completed != completed))
            id(script_render_trip_report).execute();

          if (!pending_open_at || !final_distance_handled) return;
          if (rpm >= 400.0f || now - pending_open_at >= 15000) {
            pending_open_at = 0;
            return;
          }
          if (!fx::is_ready() || !id(fn_service_allowed)() || id(g_notice_active) ||
              id(g_ota_ui_active) || id(g_updating) || !lv_obj_is_hidden(id(obj_restart_popup))) return;
          pending_open_at = 0;
          if (id(g_logs_visible)) {
            if (id(g_service_tab) != 2) id(script_select_service_tab).execute(2);
          } else {
            id(script_set_service_visible).execute(true, 2);
          }

  - id: script_render_trip_distance
