# Public Fallout dashboard. Requires hass-esphome-ota and its locally managed package.
# Keep Wi-Fi, Home Assistant, and generated OTA secrets in local secrets.yaml.
substitutions:
  name: "esp-colorado-tab5"
  friendly_name: "ESP Colorado TAB5"
  tab5_panel: ili9881c  # ili9881c, st7123, or st7121; match the rear label.
  number: "00가 0000"
  splash_title: "COLORADO"
  ui_sound_base_url: "https://raw.githubusercontent.com/eigger/espcomponents/4d5388c1b858406db87b1cf697cda6eef154a7f7/packages/display/colorado/sounds"
  tab5_motion_emphasis: 1
  # Local phosphor palette. The shared Tab5 package retains its default colors.
  tab5_color_background: 0x07100B
  tab5_color_panel_bg: 0x0B160E
  tab5_color_card_bg: 0x122218
  tab5_color_card_border: 0x35583C
  tab5_color_gauge_track: 0x284631
  tab5_color_text_primary: 0xD4FFCA
  tab5_color_text_secondary: 0xB9F3AE
  tab5_color_text_muted: 0x9DC598
  tab5_color_text_inactive: 0x608D63
  tab5_color_accent: 0xAEF799
  tab5_color_status_cold: 0x9BB5DB
  tab5_color_status_cool: 0xA3CDDB
  tab5_color_status_warm: 0xFFD08A
  tab5_color_status_hot: 0xFF8C84
  tab5_color_status_ok: 0x83CC72
  tab5_color_alert_warning: 0x643B0D
  tab5_color_alert_danger: 0x792A25
  tab5_color_alert_notice: 0x254E31
  tab5_color_button_bg: 0x203C28
  tab5_color_button_pressed: 0x31573B
  tab5_color_danger_pressed: 0x792A25
  tab5_color_panel_pressed: 0x1D3525
  mac_vlinker: "02:00:00:00:00:01"
  mac_cabin_jht: "02:00:00:00:00:02"
  mac_bed_jht: "02:00:00:00:00:03"
  oil_pressure_low_idle_kpa: 68.94757
  oil_pressure_warn_idle_kpa: 103.42135
  oil_pressure_low_above_idle_kpa: 124.10562
  oil_pressure_warn_above_idle_kpa: 172.36893
  oil_pressure_high_kpa: 551.58057
  tpms_low_kpa: "200"
  # Configurable UI advisory thresholds; these are not GM diagnostic limits.
  # Display thresholds only; these do not determine driving readiness.
  oil_temperature_cold_c: "50"
  oil_temperature_cool_c: "60"
  oil_temperature_warn_c: "95"
  oil_temperature_hot_c: "110"
  # Colorado LGZ / 8L45: GM 21-NA-047 uses 50-70 C for a TCC road test,
  # not as a normal operating range or a minimum driving-ready temperature.
  transmission_warmup_reference_c: "48"  # User-selected display reference; not a GM limit.
  # Local UI advisories, NOT verified GM overheat / DTC thresholds.
  transmission_temperature_warn_c: "110"
  transmission_temperature_hot_c: "130"
  # Local warm-up display timing, NOT GM specifications. Ambient affects time only.
  warmup_ambient_reference_c: "20"
  warmup_ambient_span_c: "40"  # Full extension at -20 C or colder.
  coolant_warmup_base_s: "600"
  coolant_warmup_max_s: "1200"
  transmission_warmup_base_s: "900"
  transmission_warmup_max_s: "1800"
  # Invert an axis if the installed display/sensor orientation requires it.
  tab5_pitch_direction: "-1"  # Correct the nose-up/nose-down rotation for this installation.
  tab5_roll_direction: "1"
  # Visual inclination bands, not vehicle stability or rollover limits.
  tab5_tilt_warm_deg: "10"
  tab5_tilt_hot_deg: "20"

  ui_ascii: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'
  # Shared by the warning popup and the log. Add characters from external parking text here.
  ui_alert_hangul: "가감경고과급기낮높능데동력료리미발방배버변부상새속스시압업엔연열오요위유음의이일장전족졸주진충치터트필하험환타어저앞뒤왼른쪽"
  ui_extra_glyphs: "패응답지연결사운드음량소거켜짐꺼재생테스트"

.helpers:
  ver: &version !lambda 'return std::string(ESPHOME_PROJECT_VERSION);'
  card_style: &card_style
    bg_color: "${tab5_color_card_bg}"
    border_width: 1
    border_color: "${tab5_color_card_border}"
    radius: 12
    pad_all: 0
  button_shape: &button_shape
    radius: 8
    border_width: 0
  neutral_button: &neutral_button
    <<: *button_shape
    bg_color: "${tab5_color_button_bg}"
    pressed:
      bg_color: "${tab5_color_button_pressed}"
  danger_button: &danger_button
    <<: *button_shape
    bg_color: "${tab5_color_status_hot}"
    pressed:
      bg_color: "${tab5_color_danger_pressed}"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.10.2
  # This config intentionally uses YAML anchors with per-instance key overrides
  # for the reusable terminal widget styles. ESPHome warns on valid overrides.
  merge_warnings: false
  on_boot:
    # Sound player and LVGL objects must exist before applying restored settings.
    - priority: -100
      then:
        - script.execute:
            id: script_logs
            log: *version
        # ES8388 setup alone leaves its analog outputs powered down.
        # Tab5's onboard amplifier is wired to LINE1.
        - lambda: |-
            if (!id(tab5_audio_dac).set_dac_output(es8388::DAC_OUTPUT_LINE1)) {
              ESP_LOGE("ui_sound", "Failed to enable ES8388 LINE1 speaker output");
            }
        - switch.turn_on: speaker_enable
        - script.execute: script_sound_apply
        - light.turn_on:
            id: backlight
            brightness: 40%
        # Cue 0 may play before normal UI/connection sounds are enabled.
        - script.execute: { id: script_sound_play, cue: 0 }
        # Align the visual sequence with actual player startup, or continue muted.
        - wait_until:
            condition:
              lambda: |-
                return id(g_sound_duration) == 0 ||
                    id(ui_sound_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING ||
                    id(ui_sound_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
            timeout: 1s
        - lvgl.animation.start: anim_crt_beam
        - delay: 170ms
        - lvgl.animation.start:
            id: [anim_crt_raster, anim_splash_terminal, anim_crt_scan]
        - delay: 210ms
        - lambda: id(script_splash_stage).execute(18, id(obj_splash_stage_system));
        - delay: 650ms
        - lambda: id(script_splash_stage).execute(42, id(obj_splash_stage_network));
        - delay: 650ms
        - lambda: id(script_splash_stage).execute(76, id(obj_splash_stage_dash));
        - delay: 650ms
        - lambda: id(script_splash_stage).execute(100, id(obj_splash_stage_ready));
        # Total splash animation time is 3300ms, matching the selected boot WAV.
        - delay: 770ms
        - script.execute: script_init_scan_images
        - script.execute:
            id: script_dashboard_watchdog
            install: true
            disconnect: false
        - lvgl.page.show: main_page
        - lvgl.widget.show:
            id: obj_header
        - lambda: id(tab5_motion_fade)(id(obj_splash), LV_OPA_COVER, LV_OPA_0, 200);
        - delay: 200ms
        - lvgl.widget.hide:
            id: obj_splash
        - lambda: |-
            id(tab5_motion_start)();
            id(g_sound_ready) = true;

# Required for this device: enable both PSRAM execution and hosted buffers in PSRAM.
esp32:
  framework:
    advanced:
      execute_from_psram: true

esp32_hosted:
  use_psram: true

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Seoul
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - lvgl.widget.show:
            id: lbl_date
        - lvgl.widget.show:
            id: lbl_time
        - lambda: id(script_logs).execute("NTP Time Synced");

