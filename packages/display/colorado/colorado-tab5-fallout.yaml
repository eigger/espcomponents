      icon: mdi:ip-outline
  - platform: template
    name: "Time"
    internal: true
    update_interval: 1s
    lambda: |-
      char buf[20];
      auto time = id(sntp_time).now();
      sprintf(buf, "%02d:%02d", time.hour, time.minute);
      return std::string(buf);
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_time
            text: !lambda return x;
  - platform: template
    name: "Date"
    internal: true
    update_interval: 1s
    lambda: |-
      char buf[20];
      auto time = id(sntp_time).now();
      int weekday = time.day_of_week - 1;
      const char* weekdays[] = {"일", "월", "화", "수", "목", "금", "토"};
      sprintf(buf, "%02d월 %02d일 (%s)", time.month, time.day_of_month, weekdays[weekday]);
      return std::string(buf);
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_date
            text: !lambda return x;
  - platform: template
    name: "Manufacturer Data"
    id: manufacturer_data
    icon: "mdi:package-variant-closed"
    internal: true
  - platform: template
    name: "Parking Info"
    id: parking_info
    icon: "mdi:car"
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x.length() > 0 && x != "unknown" && x != "off") {
              id(alert_dismissed) = false;
            }
            //id(ws_parking_info).publish_state(x);
#  - platform: ws_bridge
#    id: ws_parking_info
#    unique_id: parking_info
#    name: "Parking Info"
#    icon: "mdi:car"

  - platform: template
    name: "Template Engine Run Time"
    internal: true
    update_interval: 1s
    lambda: |-
      if (id(g_dashboard_samples)[11] == 0 || !std::isfinite(id(engine_run_time).state)) {
        return std::string("--:--");
      }
      char buf[20];
      int seconds = (int)id(engine_run_time).state;
      int minutes = seconds / 60;
      int hours = minutes / 60;
      if (hours > 0) sprintf(buf, "%d:%02d:%02d", hours, minutes % 60, seconds % 60);
      else sprintf(buf, "%02d:%02d", minutes, seconds % 60);
      return std::string(buf);
    on_value:
      then:
        - lambda: |-
            const auto color = id(fn_state_color)(x == "--:--" ? NAN : id(engine_run_time).state, 11);
            id(script_update_sensor_text).execute(id(lbl_engine_run_time), x, color, 11, 0);
            id(fn_icon_accent)(id(widget_img_timer), color, 11, false);
  - platform: ble_elm327
    last_error:
      name: "ELM327 Last Error"
      id: id_elm_last_error

# Focus Drive dashboard, 1280 × 720 after rotation.
lvgl:
  byte_order: little_endian
  rotation: 270°
  id: lvgl_ui
  top_layer:
    widgets:
      # OTA callbacks refresh this overlay directly while the download blocks App.loop().
      - obj:
          id: obj_ota_overlay
          hidden: true
          align: center
          width: 1280
          height: 720
          bg_color: "${tab5_color_background}"
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          clickable: true
          scrollable: false
          widgets:
            - obj:
                align: center
                width: 960
                height: 420
                bg_color: "${tab5_color_panel_bg}"
                bg_opa: COVER
                border_width: 2
                border_color: "${tab5_color_accent}"
                border_opa: 60%
                radius: 0
                pad_all: 0
                clickable: false
                scrollable: false
                widgets:
                  - label: { x: 32, y: 18, width: 896, text: "COLORADO // SERVICE TERMINAL", text_letter_space: 2, text_font: font_terminal_boot, text_color: "${tab5_color_accent}", clickable: false }
                  - line: { <<: &ota_rule { align: top_left, line_color: "${tab5_color_card_border}", line_width: 1, clickable: false }, x: 32, y: 60, points: ["0, 0", "895, 0"] }
                  - label: { id: lbl_ota_title, x: 32, y: 82, width: 700, text: "FIRMWARE UPDATE", text_font: notosans35, text_color: "${tab5_color_accent}", clickable: false }
                  - label: { id: lbl_ota_phase, x: 32, y: 148, width: 700, text: "INITIALIZING LINK...", text_font: font_terminal_boot, text_color: "${tab5_color_text_secondary}", clickable: false }
                  - label: { id: lbl_ota_percent, x: 760, y: 92, width: 160, text_align: RIGHT, text: "0%", text_font: notosans45, text_color: "${tab5_color_text_primary}", clickable: false }
                  - bar:
                      id: bar_ota_progress
                      x: 32
                      y: 224
                      width: 896
                      height: 18
                      min_value: 0
                      max_value: 100
                      value: 0
                      animated: false
                      bg_color: "${tab5_color_gauge_track}"
                      bg_opa: COVER
                      radius: 0
                      border_width: 0
                      pad_all: 0
                      clickable: false
                      indicator: { bg_color: "${tab5_color_accent}", radius: 0 }
                  # Mask narrow gaps into the real progress bar for terminal-style segments.
                  - line: { <<: *ota_rule, x: 32, y: 233, line_color: "${tab5_color_panel_bg}", line_width: 18, line_dash_width: 3, line_dash_gap: 25, points: ["0, 0", "895, 0"] }
                  - label: { id: lbl_ota_hint, x: 32, y: 282, width: 896, text: "DO NOT INTERRUPT POWER.", text_font: font_terminal_boot, text_color: "${tab5_color_text_muted}", clickable: false }
                  - line: { <<: *ota_rule, x: 32, y: 336, points: ["0, 0", "895, 0"] }
                  - label: { x: 32, y: 366, text: "COLORADO // OTA", text_font: font_terminal_boot, text_color: "${tab5_color_text_inactive}", clickable: false }
                  - button:
                      <<: *neutral_button
                      id: btn_ota_close
                      hidden: true
                      x: 768
                      y: 350
                      width: 160
                      height: 48
                      radius: 0
                      pad_all: 0
                      on_click:
                        - script.execute: script_ota_close
                      widgets:
                        - label: { align: center, text: "[ BACK ]", text_font: font_terminal_boot, text_color: "${tab5_color_text_primary}", clickable: false }
      # ── 재시작 팝업 백드롭 ──
      - obj:
          id: obj_restart_backdrop
          hidden: true
          align: center
          width: 1280
          height: 720
          bg_color: "${tab5_color_shadow}"
          bg_opa: 50%
          border_width: 0
          radius: 0
          clickable: true

      # ── 재시작 팝업 모달 ──
      - obj:
          id: obj_restart_popup
          hidden: true
          align: center
          width: 520
          height: 310
          bg_color: "${tab5_color_card_bg}"
          border_width: 1
          border_color: "${tab5_color_card_border}"
          radius: 16
          pad_all: 20
          shadow_width: 30
          shadow_color: "${tab5_color_shadow}"
          shadow_opa: 50%
          widgets:
            - label:
                text: "시스템 재시작"
                align: top_mid
                y: 10
                text_color: "${tab5_color_accent}"
                text_font: notosans35
            - label:
                text: "시스템을 재시작하시겠습니까?"
                align: center
                y: -10
                text_color: "${tab5_color_text_primary}"
                text_font: notosans30
            - button:
                id: btn_restart_yes
                align: bottom_left
                x: 30
                y: -10
                width: 190
                height: 65
                <<: *danger_button
                on_click:
                  then:
                    - if:
                        condition:
                          lambda: 'return id(fn_service_allowed)();'
                        then:
                          - switch.turn_on: sw_restart
                widgets:
                  - label:
                      text: "예"
                      align: center
                      text_color: "${tab5_color_text_primary}"
                      text_font: notosans30
            - button:
                id: btn_restart_no
                align: bottom_right
                x: -30
                y: -10
                width: 190
                height: 65
                <<: *neutral_button
                on_click:
                  then:
                    - lambda: |-
                        fx::set_visible(id(obj_restart_backdrop), false);
                        fx::set_visible(id(obj_restart_popup), false);
                widgets:
                  - label:
                      text: "아니오"
                      align: center
                      text_color: "${tab5_color_text_primary}"
                      text_font: notosans30

      # ── 상단 헤더 (경고는 헤더 내부 최상단 레이어) ──
      - obj:
          id: obj_header
          hidden: true
          bg_color: "${tab5_color_panel_bg}"
          border_width: 0
          border_color: "${tab5_color_card_border}"
          align: top_mid
          pad_all: 0
          width: 1280
          height: 72
          x: 0
          y: 0
          widgets:
            - button:
                id: btn_logs_toggle
                align: left_mid
                x: 8
                y: 0
                width: 76
                height: 48
                bg_opa: 0%
                border_width: 0
                pad_all: 0
                outline_width: 0
                shadow_width: 0
                shadow_opa: 0%
                text_color: "${tab5_color_accent}"
                state:
                  disabled: false
                disabled:
                  text_color: "${tab5_color_text_muted}"
                pressed:
                  bg_color: "${tab5_color_panel_pressed}"
                  bg_opa: COVER
                on_click:
                  then:
                    - lambda: |-
                        if (!id(fn_service_allowed)()) return;
                        id(script_sound_play).execute(id(g_logs_visible) ? 2 : 1);
                        id(script_set_service_visible).execute(!id(g_logs_visible));
                widgets:
                  - label:
                      id: lbl_menu_toggle
                      align: center
                      text: "MENU"
                      text_font: notosans20
            - image:
                src: img_wifi_off
                <<: &status_icon
                  image_recolor: "${tab5_color_link_off}"
                  image_recolor_opa: 100%
                  align: left_mid
                  y: 0
                id: lbl_wifi
                x: 95
            - image:
                src: img_bluetooth_off
                <<: *status_icon
                id: lbl_bluetooth
                x: 160
            - image:
                src: img_gps_searching
                <<: *status_icon
                id: lbl_satellite
                x: 225
            - button:
                <<: &service_tab { <<: *neutral_button, align: left_mid, height: 48, pad_all: 0, radius: 0, border_width: 0, shadow_width: 0, bg_opa: TRANSP, hidden: true }
                id: btn_service_setup_tab
                x: 300
                width: 156
                on_click:
                  - lambda: |-
                      if (!id(g_logs_visible) || !id(fn_service_allowed)() || id(g_service_setup)) return;
                      id(script_sound_play).execute(3);
                      id(script_select_service_tab).execute(true);
                widgets:
                  - label: { id: lbl_service_setup_tab, align: center, text: "[ SETUP ]", text_font: font_terminal_boot, text_color: "${tab5_color_background}" }
            - button:
                <<: *service_tab
                id: btn_service_log_tab
                x: 472
                width: 120
                on_click:
                  - lambda: |-
                      if (!id(g_logs_visible) || !id(fn_service_allowed)() || !id(g_service_setup)) return;
                      id(script_sound_play).execute(3);
                      id(script_select_service_tab).execute(false);
                widgets:
                  - label: { id: lbl_service_log_tab, align: center, text: "LOG", text_font: font_terminal_boot, text_color: "${tab5_color_accent}" }
            - label:
                id: lbl_update_badge
                clickable: true
                on_click:
                  - script.execute: script_open_update_menu
                align: left_mid
                x: 280
                y: 13
                hidden: true
                text: "새 버전 있음"
                text_font: notosans20
                text_color: "${tab5_color_accent}"
            - label:
                id: lbl_date
                hidden: true
                text: ""
                align: right_mid
                x: -135
                y: 0
                text_color: "${tab5_color_accent}"
                text_font: notosans35
            - label:
                id: lbl_time
                hidden: true
                text: ""
                align: right_mid
                x: -10
                y: 0
                text_color: "${tab5_color_text_secondary}"
                text_font: notosans45
            - button:
                id: popup_alert
                hidden: true
                align: center
                width: SIZE_CONTENT
                min_width: 480
                height: 72
                bg_color: "${tab5_color_alert_danger}"
                bg_opa: COVER
                radius: 14
                border_width: 0
                pad_all: 8
                shadow_width: 8
                shadow_offset_x: 0
                shadow_offset_y: 3
                shadow_spread: 0
                shadow_color: "${tab5_color_shadow}"
                shadow_opa: 24%
                outline_width: 0
                outline_opa: 0%
                pressed:
                  shadow_width: 4
                  shadow_offset_y: 2
                on_click:
                  then:
                    - lambda: |-
                        if (id(g_alert_is_update)) {
                          if (!id(fn_service_allowed)()) return;
                          id(script_open_update_menu).execute();
                        } else {
                          id(alert_dismissed) = true;
                          // Confirm every active condition, not only the one shown.
                          id(fn_sound_alert)("acknowledge_all", 0, 0, 0);
                          if (id(g_sound_priority) >= 3) id(script_sound_stop).execute();
                        }
                        id(script_logs).execute("ALERT: Dismissed");
                        id(g_notice_active) = false;
                        fx::set_visible(id(popup_alert), false);
                widgets:
                  - image:
                      id: widget_img_alert
                      src: img_alert
                      align: left_mid
                      x: 8
                      image_recolor: "${tab5_color_text_primary}"
                      image_recolor_opa: 100%
                  - label:
                      id: lbl_alert_title
                      text: ""
                      align: left_mid
                      x: 56
                      y: 0
                      text_color: "${tab5_color_text_primary}"
                      text_font: font_alert_title
                  - label:
                      id: lbl_alert_msg
                      text: ""
                      align: left_mid
                      x: 140
                      y: 0
                      text_color: "${tab5_color_text_primary}"
                      text_font: font_alert_msg

      # Terminal boot screen. script_boot_typing types the text in time with the boot WAV.
      # Only small label areas change per frame, so the effect stays smooth at full resolution.
      - obj:
          id: obj_splash
          bg_color: "${tab5_color_background}"
          border_width: 0
          pad_all: 0
          align: center
          width: 1280
          height: 720
          scrollable: false
          widgets:
            - obj:
                id: obj_splash_terminal
                align: center
                width: 1168
                height: 574
                radius: 0
                pad_all: 0
                border_width: 0
                bg_opa: TRANSP
                clickable: false
                scrollable: false
                widgets:
                  # Frame, rules and captions appear together on the first tape-deck click.
                  - obj:
                      id: obj_boot_frame
                      hidden: true
                      align: top_left
                      width: 1168
                      height: 574
                      radius: 5
                      pad_all: 0
                      border_width: 1
                      border_color: "${tab5_color_card_border}"
                      bg_color: "${tab5_color_panel_bg}"
                      clickable: false
                      scrollable: false
                      widgets:
                        - label: { <<: &boot_text { align: top_left, text_color: "${tab5_color_text_muted}", text_font: font_terminal_boot }, x: 32, y: 109, text: "VEHICLE INTERFACE", text_letter_space: 2 }
                        - line: { <<: &boot_rule { align: top_left, line_color: "${tab5_color_card_border}", line_width: 1, clickable: false }, x: 32, y: 67, points: ["0, 0", "1100, 0"] }
                        - line: { <<: *boot_rule, x: 560, y: 99, points: ["0, 0", "0, 304"] }
                        - label: { <<: *boot_text, x: 32, y: 293, text: "TRIM / POWERTRAIN", text_letter_space: 2 }
                        - label: { <<: *boot_text, x: 605, y: 109, text: "BOOT SEQUENCE", text_letter_space: 2 }
                        - line: { <<: *boot_rule, x: 32, y: 436, points: ["0, 0", "1100, 0"] }
                        - label: { <<: *boot_text, x: 32, y: 467, text: "INITIALIZATION", text_letter_space: 2 }
                        - label:
                            id: lbl_splash_percent
                            <<: *boot_text
                            align: top_right
                            x: -32
                            y: 467
                            text: "000%"
                            text_color: "${tab5_color_accent}"
                        - bar:
                            id: bar_splash_progress
                            align: top_left
                            x: 32
                            y: 513
                            width: 1100
                            height: 12
                            min_value: 0
                            max_value: 100
                            value: 0
                            bg_color: "${tab5_color_gauge_track}"
                            indicator: { bg_color: "${tab5_color_accent}", radius: 0 }
                            border_width: 0
                            radius: 0
                            clickable: false
                        - line: { <<: *boot_rule, x: 32, y: 518, line_color: "${tab5_color_panel_bg}", line_width: 12, line_dash_width: 3, line_dash_gap: 107, points: ["0, 0", "1099, 0"] }

                  # Typed and decoded text. Labels start empty; script_boot_typing fills them.
                  - label: { <<: *boot_text, id: lbl_boot_header, x: 33, y: 26, text: "", text_letter_space: 2 }
                  - label: { <<: *boot_text, id: lbl_boot_version, hidden: true, align: top_right, x: -33, y: 26, text: *version }
                  - label:
                      id: lbl_splash_title
                      text: ""
                      align: top_left
                      x: 30
                      y: 147
                      width: 507
                      long_mode: CLIP
                      text_color: "${tab5_color_text_primary}"
                      text_font: font_terminal_title
                  # Underline drawn left to right after the title lands.
                  - obj:
                      id: obj_boot_title_rule
                      align: top_left
                      x: 33
                      y: 260
                      width: 0
                      height: 1
                      radius: 0
                      pad_all: 0
                      border_width: 0
                      bg_color: "${tab5_color_card_border}"
                      clickable: false
                      scrollable: false
                  # Trim badge stamps in on the first drive seek; trim and powertrain decode on the next two.
                  - obj:
                      id: obj_boot_badge
                      hidden: true
                      align: top_left
                      x: 33
                      y: 324
                      width: SIZE_CONTENT
                      height: SIZE_CONTENT
                      radius: 3
                      pad_left: 10
                      pad_right: 10
                      pad_top: 0
                      pad_bottom: 0
                      border_width: 2
                      border_color: "${tab5_color_accent}"
                      bg_color: "${tab5_color_accent}"
                      bg_opa: TRANSP
                      clickable: false
                      scrollable: false
                      widgets:
                        - label:
                            id: lbl_boot_badge
                            text: "${splash_trim_badge}"
                            text_font: font_service_title
                            text_color: "${tab5_color_accent}"
                  - label:
                      id: lbl_boot_trim
                      <<: *boot_text
                      text: ""
                      x: 140
                      y: 326
                      text_letter_space: 4
                      text_color: "${tab5_color_text_primary}"
                      text_font: font_service_title
                  - label: { <<: *boot_text, id: lbl_boot_power, x: 33, y: 390, text: "", text_letter_space: 3, text_color: "${tab5_color_text_secondary}" }
                  - label: { <<: &boot_row { <<: *boot_text, x: 606, text: "", text_color: "${tab5_color_text_primary}" }, id: lbl_boot_row1, y: 157 }
                  - label: { <<: *boot_row, id: lbl_boot_row2, y: 218 }
                  - label: { <<: *boot_row, id: lbl_boot_row3, y: 279 }
                  - label: { <<: *boot_row, id: lbl_boot_row4, y: 340 }
                  - label: { <<: &boot_ok { <<: *boot_text, hidden: true, align: top_right, x: -33, text: "[ OK ]", text_color: "${tab5_color_text_secondary}" }, id: lbl_boot_ok1, y: 157 }
                  - label: { <<: *boot_ok, id: lbl_boot_ok2, y: 218 }
                  - label: { <<: *boot_ok, id: lbl_boot_ok3, y: 279 }
                  - label: { <<: *boot_ok, id: lbl_boot_ok4, y: 340, text: "[ READY ]", text_color: "${tab5_color_accent}" }
                  # Block cursor. Solid while typing, blinks while waiting for the next hit.
                  - obj:
                      id: obj_boot_cursor
                      hidden: true
                      align: top_left
                      width: 12
                      height: 24
                      radius: 0
                      pad_all: 0
                      border_width: 0
                      bg_color: "${tab5_color_accent}"
                      clickable: false
                      scrollable: false

  pages:
    # =============================================================
    # MAIN PAGE: Fallout-inspired vehicle status terminal
    # =============================================================
    - id: main_page
      bg_color: "${tab5_color_background}"
      widgets:

        # Speed, selector and trip information
        - obj:
            <<: &terminal_panel
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              radius: 0
              scrollable: false
              clickable: false
            align: top_left
            x: 30
            y: 103
            width: 304
            height: 452
            widgets:
              - label: { <<: &terminal_heading { align: top_left, text_color: "${tab5_color_text_muted}", text_font: notosans20 }, text: "SPEED", text_letter_space: 4 }
              - label: { id: lbl_speed, text: "--", align: top_left, y: 26, width: 300, text_align: RIGHT, text_color: "${tab5_color_text_muted}", text_font: font_terminal_speed }
              - label: { <<: *terminal_heading, text: "km/h", y: 197, width: 300, text_align: RIGHT }
              - bar:
                  id: bar_speed
                  align: top_left
                  y: 237
                  width: 300
                  height: 8
                  min_value: 0
                  max_value: 160
                  animated: false
                  <<: &terminal_bar
                    bg_color: "${tab5_color_gauge_track}"
                    bg_opa: COVER
                    radius: 0
                    border_width: 0
                    pad_all: 0
                    clickable: false
                    indicator: { bg_color: "${tab5_color_accent}", radius: 0 }
              - obj:
                  <<: *terminal_panel
                  align: top_left
                  y: 262
                  width: 216
                  height: 44
                  widgets:
                    - label: { <<: &shift_letter { align: top_left, width: 40, y: -7, text_align: CENTER, text_color: "${tab5_color_text_muted}", text_font: notosans35 }, text: "P" }
                    - label: { <<: *shift_letter, text: "R", x: 43 }
                    - label: { <<: *shift_letter, text: "N", x: 86 }
                    - label: { <<: *shift_letter, text: "D", x: 129 }
                    - label: { <<: *shift_letter, text: "L", x: 172 }
                    - obj:
                        id: obj_prnd_selection
                        <<: *terminal_panel
                        align: top_left
                        width: 40
                        height: 42
                        hidden: true
                        bg_color: "${tab5_color_accent}"
                        bg_opa: COVER
                        widgets:
                          - label: { id: lbl_prnd, text: "-", align: top_mid, y: -7, text_color: "${tab5_color_background}", text_font: notosans35 }
                          - obj:
                              id: obj_prnd_confirm
                              <<: *terminal_panel
                              align: top_mid
                              y: 37
                              width: 28
                              height: 3
                              # Same fill as the selection (invisible at rest); fx_prnd_bar flashes it dark.
                              bg_color: "${tab5_color_accent}"
                              bg_opa: COVER
              - label: { <<: *terminal_heading, text: "GEAR", x: 213, y: 273, text_font: notosans16 }
              - obj:
                  <<: *terminal_panel
                  align: top_left
                  x: 254
                  # Optical alignment with the smaller PRNDL letters.
                  y: 238
                  width: 50
                  height: 82
                  widgets:
                    - label: { id: lbl_gear, text: "-", align: center, text_color: "${tab5_color_text_primary}", text_font: notosans45 }
              - line: { <<: &terminal_line { align: top_left, line_color: "${tab5_color_card_border}", line_width: 1, clickable: false }, y: 328, points: ["0, 0", "300, 0"] }
              - obj:
                  <<: *terminal_panel
                  align: top_left
                  y: 344
                  width: 155
