script:
  # Cue IDs: boot/open/close/click/success/warning/danger/failure/notice.
  - id: script_sound_stop
    then:
      - lambda: |-
          // UiSound drops ownership at max_busy; the media player may still have the track queued.
          if (id(g_trip_soundtrack_playing) && !id(ui_sounds).is_playing()) {
            id(ui_sound_player).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_STOP)
                .set_announcement(true).perform();
          }
          id(ui_sounds).stop();
          id(g_sound_priority) = 0;
          id(script_clear_trip_soundtrack).execute();

  - id: script_sound_apply
    then:
      - lambda: |-
          id(g_sound_volume) = std::clamp(id(g_sound_volume), 0.0f, 1.0f);
          const bool silent = id(g_sound_muted) || id(g_sound_volume) <= 0.0f;
          auto call = id(ui_sound_player).make_call();
          call.set_volume(silent ? 0.0f : id(g_sound_volume));
          // Override the player's independently restored mute state as well.
          call.set_command(silent ? media_player::MEDIA_PLAYER_COMMAND_MUTE
                                  : media_player::MEDIA_PLAYER_COMMAND_UNMUTE);
          call.perform();
          // Digital zero is immediate; stop also discards buffered/queued effects.
          if (silent) {
            id(tab5_speaker).set_volume(0.0f);
            id(script_sound_stop).execute();
          }
          lv_label_set_text_fmt(id(lbl_sound_value), "%d%%",
              static_cast<int>(std::lround(id(g_sound_volume) * 100.0f)));
          lv_label_set_text(id(lbl_sound_mute), id(g_sound_muted) ? "음소거: 켜짐" : "음소거: 꺼짐");
          lv_label_set_text(id(lbl_sound_status), id(g_sound_muted) ? "ALL SOUNDS / MUTED"
              : silent ? "ALL SOUNDS / VOLUME ZERO" : "ALL SOUNDS / ENABLED");
          lv_obj_set_style_bg_color(id(btn_sound_mute), lv_color_hex(id(g_sound_muted)
              ? ${tab5_color_alert_warning} : ${tab5_color_button_bg}), LV_PART_MAIN);
          lv_obj_set_style_bg_opa(id(btn_sound_mute), id(g_sound_muted) ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_MAIN);

  - id: script_sound_links
    then:
      - lambda: |-
          const uint32_t now = esphome::millis();
          const bool gps_receiving = id(fn_gps_receiving)(esphome::millis_64());
          const bool fix = gps_receiving && id(g_gps_latest_fix);
          const bool wifi_connected = id(tab5_wifi).is_connected();
          const bool ble_connected = id(obd_client).connected();
          // Keep all three indicators visible, including when there is no link.
          const auto set_link_icon = [](lv_obj_t *widget, image::Image *source, uint32_t color) {
            auto *icon = source->get_lv_image_dsc();
            if (lv_image_get_src(widget) != icon) lv_image_set_src(widget, icon);
            const auto recolor = lv_color_hex(color);
            if (!lv_color_eq(lv_obj_get_style_image_recolor(widget, LV_PART_MAIN), recolor)) {
              lv_obj_set_style_image_recolor(widget, recolor, LV_PART_MAIN);
            }
          };
          set_link_icon(id(lbl_wifi), wifi_connected ? id(img_wifi) : id(img_wifi_off),
              wifi_connected ? ${tab5_color_accent} : ${tab5_color_link_off});
          set_link_icon(id(lbl_bluetooth), ble_connected ? id(img_bluetooth) : id(img_bluetooth_off),
              ble_connected ? ${tab5_color_accent} : ${tab5_color_link_off});
          set_link_icon(id(lbl_satellite), fix ? id(img_satellite)
              : gps_receiving ? id(img_gps_question) : id(img_gps_searching),
              fix ? ${tab5_color_accent} : gps_receiving ? ${tab5_color_link_search} : ${tab5_color_link_off});

          const bool connected[] = {wifi_connected, ble_connected, fix};
          const bool enabled = !id(g_sound_muted) &&
              id(g_sound_volume) > 0.0f && !id(g_updating);
          for (unsigned link = 0; link < 3; ++link) {
            const int cue = id(fn_sound_link)(link, connected[link], now, enabled,
                                            id(g_sound_ready) && !id(ui_sounds).is_playing());
            if (cue >= 0) id(script_sound_play).execute(cue);
          }

  - id: script_sound_play
    parameters:
      cue: int
    then:
      - lambda: |-
          if ((!id(g_sound_ready) && cue != 0) || id(g_sound_muted) || id(g_sound_volume) <= 0.0f ||
              id(g_updating) || cue < 0 || cue > 15) return;
          // Cue priority / busy window / enqueue=false replacement live in ui_sound (see the ui_sound: block).
          ui_sound::Cue *const cues[] = {id(cue_boot), id(cue_menu_open), id(cue_menu_close), id(cue_click),
              id(cue_success), id(cue_warning), id(cue_danger), id(cue_failure), id(cue_notice),
              id(cue_wifi_connected), id(cue_wifi_disconnected), id(cue_bluetooth_connected),
              id(cue_bluetooth_disconnected), id(cue_gps_connected), id(cue_gps_disconnected),
              id(cue_auto_ota_tick)};
          // The boot cue plays before ui_sound.start. Each OTA tick can replace the
          // previous one if the player is still busy, while vehicle alerts take priority.
          const bool force = cue == 0 || (cues[cue] == id(cue_auto_ota_tick) && id(g_sound_priority) <= 2);
          const auto result = id(ui_sounds).play(cues[cue], force);
          if (!ui_sound::played(result)) return;
          id(script_clear_trip_soundtrack).execute();
          id(g_sound_priority) = cues[cue]->priority;
          if (cue == 5 || cue == 6) id(fn_sound_alert)("played", 0, cue == 6 ? 2 : 1, esphome::millis());

  - id: script_clear_trip_soundtrack
    then:
      - lambda: |-
          if (!id(g_trip_soundtrack_playing)) return;
          id(g_trip_soundtrack_playing) = false;
          id(ui_sounds).set_max_busy(${ui_sound_max_busy_ms});

  - id: script_sync_trip_soundtrack
    then:
      - lambda: |-
          const bool trip_visible = id(g_logs_visible) && id(g_service_tab) == 2 && id(fn_service_allowed)();
          const auto &notes = id(g_trip_view_notes);
          const bool show = trip_visible &&
              std::any_of(notes.begin(), notes.end(), [](uint16_t pitch) { return pitch != 0; });
          const bool silent = id(g_sound_muted) || id(g_sound_volume) <= 0.0f;
          const bool stationary = id(obd_client).connected() &&
              id(fn_sample_live)(10, id(car_speed).state, 5000) == 0.0f;
          const bool allowed = show && stationary && id(g_sound_ready) && !silent &&
              !id(g_notice_active) && !id(g_ota_ui_active) && !id(g_updating);
          if (id(g_trip_soundtrack_playing)) {
            if (!allowed || esphome::millis() - id(g_trip_soundtrack_started_at) >= ${trip_soundtrack_max_busy_ms})
              id(script_sound_stop).execute();
            else if (!id(ui_sounds).is_playing()) id(script_clear_trip_soundtrack).execute();
          }
          auto *button = id(btn_trip_soundtrack);
          if (lv_obj_is_hidden(button) == show) lv_obj_set_hidden(button, !show);
          if (!show) return;
          const bool busy = !id(g_trip_soundtrack_playing) && id(g_sound_priority) >= 2 && id(ui_sounds).is_playing();
          const bool disabled = !allowed || busy;
          if (lv_obj_has_state(button, LV_STATE_DISABLED) != disabled) {
            if (disabled) lv_obj_add_state(button, LV_STATE_DISABLED);
            else lv_obj_remove_state(button, LV_STATE_DISABLED);
          }
          const char *text = silent ? "사운드트랙 음소거" : !stationary ? "정차 중 재생" : busy ? "재생 중" :
              id(g_trip_soundtrack_playing) ? "사운드트랙 정지" : "사운드트랙 재생";
          auto *label = id(lbl_trip_soundtrack);
          if (std::strcmp(lv_label_get_text(label), text) != 0) lv_label_set_text(label, text);

  - id: script_toggle_trip_soundtrack
    then:
      - lambda: |-
          id(script_sync_trip_soundtrack).execute();
          auto *button = id(btn_trip_soundtrack);
          if (lv_obj_is_hidden(button) || lv_obj_has_state(button, LV_STATE_DISABLED)) return;
          if (id(g_trip_soundtrack_playing)) {
            id(script_sound_stop).execute();
            id(script_sync_trip_soundtrack).execute();
            return;
          }
          const auto &notes = id(g_trip_view_notes);
          constexpr uint32_t duration_ms = ${trip_soundtrack_notes} * ${trip_soundtrack_note_ms};
          constexpr size_t note_frames = ${trip_soundtrack_rate} * ${trip_soundtrack_note_ms} / 1000;
          constexpr size_t wav_size = 44 + 2 * note_frames * ${trip_soundtrack_notes};
          struct Track {
            std::array<uint16_t, ${trip_soundtrack_notes}> notes{};
            audio::AudioFile file{nullptr, 0, audio::AudioFileType::WAV};
            ui_sound::Cue cue{&file, 2, 0, duration_ms + 120};
          };
          // The audio worker can retain a file after stop is queued. Keep each WAV immutable.
          static std::array<Track, 2> tracks;
          Track *track = nullptr;
          for (auto &entry : tracks) {
            if (entry.file.data && entry.notes == notes) {
              track = &entry;
              break;
            }
            if (!entry.file.data && !track) track = &entry;
          }
          if (!track) return;
          if (!track->file.data) {
            auto *wav = RAMAllocator<uint8_t>(RAMAllocator<uint8_t>::ALLOC_EXTERNAL).allocate(wav_size);
            if (!wav) {
              ESP_LOGW("trip", "Could not allocate soundtrack audio in PSRAM");
              return;
            }
            id(fn_write_trip_soundtrack_wav)(wav, notes);
            track->notes = notes;
            track->file.data = wav;
            track->file.length = wav_size;
          }
          if (!ui_sound::played(id(ui_sounds).play(&track->cue))) return;
          id(ui_sounds).set_max_busy(${trip_soundtrack_max_busy_ms});
          id(g_sound_priority) = track->cue.priority;
          id(g_trip_soundtrack_started_at) = track->cue.last_start_ms;
          id(g_trip_soundtrack_playing) = true;
          id(script_sync_trip_soundtrack).execute();

  - id: script_trip_replay
    parameters:
      request: int  # 0: tick, 1: reveal a loaded trip, 2: play/stop.
    then:
      - lambda: |-
          enum class Phase { IDLE, REVEAL, PLAY };
          static Phase phase = Phase::IDLE;
          static uint32_t started_at = 0;
          static bool soundtrack_owned = false;
          static uint32_t soundtrack_started_at = 0;
          static uint32_t displayed_second = UINT32_MAX;
          constexpr int chart_x = 80;
          constexpr int chart_width = 718;
          constexpr uint32_t reveal_ms = 560;
          constexpr uint32_t play_ms = ${trip_soundtrack_notes} * ${trip_soundtrack_note_ms};

          auto *button = id(btn_trip_replay);
          auto *cover = id(obj_trip_chart_cover);
          auto *cursor = id(obj_trip_chart_cursor);
          auto *reading = id(lbl_trip_replay_reading);
          const bool visible = id(g_logs_visible) && id(g_service_tab) == 2 && id(fn_service_allowed)();
          const bool loaded = visible && id(g_trip_replay_available) && !id(g_trip_in_progress);
          const bool allowed = loaded && !id(g_notice_active) && !id(g_ota_ui_active) &&
              !id(g_updating) && lv_obj_is_hidden(id(obj_restart_popup));
          if (lv_obj_is_hidden(button) == loaded) lv_obj_set_hidden(button, !loaded);
          if (lv_obj_has_state(button, LV_STATE_DISABLED) == allowed) {
            if (allowed) lv_obj_remove_state(button, LV_STATE_DISABLED);
            else lv_obj_add_state(button, LV_STATE_DISABLED);
          }
          const auto finish = [&](bool interrupted) {
            const bool was_playing = phase == Phase::PLAY;
            phase = Phase::IDLE;
            lv_obj_set_hidden(cover, true);
            lv_obj_set_hidden(cursor, true);
            lv_obj_set_hidden(reading, true);
            if (was_playing) lv_label_set_text_static(id(lbl_trip_replay), "기록 재생");
            if (was_playing && loaded) lv_label_set_text_static(id(lbl_service_status), "> LAST TRIP LOADED");
            if (interrupted && soundtrack_owned && id(g_trip_soundtrack_playing) &&
                soundtrack_started_at == id(g_trip_soundtrack_started_at)) {
              id(script_sound_stop).execute();
              id(script_sync_trip_soundtrack).execute();
            }
            soundtrack_owned = false;
          };
          if (!allowed) {
            if (phase != Phase::IDLE) finish(true);
            return;
          }

          const uint32_t now = esphome::millis();
          if (request == 1) {
            if (phase != Phase::IDLE) finish(true);
            phase = Phase::REVEAL;
            started_at = now;
            lv_label_set_text_static(id(lbl_service_status), "> LAST TRIP LOADED");
            lv_obj_set_pos(cover, chart_x, 5);
            lv_obj_set_width(cover, chart_width);
            lv_obj_move_foreground(cover);
            lv_obj_set_hidden(cover, false);
          } else if (request == 2) {
            if (phase == Phase::PLAY) {
              finish(true);
              return;
            }
            if (phase == Phase::REVEAL) finish(false);
            phase = Phase::PLAY;
            id(script_sync_trip_soundtrack).execute();
            const bool already_playing = id(g_trip_soundtrack_playing);
            if (!already_playing) id(script_toggle_trip_soundtrack).execute();
            soundtrack_owned = !already_playing && id(g_trip_soundtrack_playing);
            soundtrack_started_at = id(g_trip_soundtrack_started_at);
            started_at = esphome::millis();
            if (id(g_trip_soundtrack_playing) && started_at - soundtrack_started_at < play_ms)
              started_at = soundtrack_started_at;
            displayed_second = UINT32_MAX;
            lv_label_set_text_static(id(lbl_trip_replay), "재생 정지");
            lv_label_set_text_static(id(lbl_service_status), "> REPLAYING LAST TRIP");
            lv_obj_move_foreground(cursor);
            lv_obj_set_hidden(cursor, false);
            lv_obj_set_hidden(reading, false);
          }
          if (phase == Phase::IDLE) return;

          const uint32_t elapsed_ms = esphome::millis() - started_at;
          if (phase == Phase::REVEAL) {
            if (elapsed_ms >= reveal_ms) {
              finish(false);
            } else {
              const int x = chart_width * elapsed_ms / reveal_ms;
              lv_obj_set_x(cover, chart_x + x);
              lv_obj_set_width(cover, chart_width - x);
            }
            return;
          }
          // Keep the final reading visible briefly after the cursor reaches the end.
          if (elapsed_ms >= play_ms + 480) {
            finish(false);
            return;
          }
          const uint32_t position = std::min(elapsed_ms, play_ms);
          lv_obj_set_x(cursor, chart_x + (chart_width - 2) * position / play_ms);
          const uint32_t trip_s = static_cast<uint32_t>(id(g_trip_report)[1]);
          const uint32_t at = static_cast<uint64_t>(trip_s) * position / play_ms;
          if (at == displayed_second) return;
          displayed_second = at;

          const auto &history = id(g_trip_history);
          const auto &sample_s = id(g_trip_history_sample_s);
          const uint32_t step_s = id(g_trip_history_step_s);
          const size_t buckets = step_s ? std::min<size_t>(history.size(), at / step_s + 1) : 0;
          char values[3][12] = {"--", "--", "--"};
          for (size_t channel = 0; channel < std::size(values); ++channel) {
            for (size_t i = buckets; i > 0; --i) {
              const uint16_t value = history[i - 1][channel];
              if (value == UINT16_MAX || sample_s[i - 1][channel] > at) continue;
              snprintf(values[channel], sizeof(values[channel]), "%d°", value - 100);
              break;
            }
          }
          lv_label_set_text_fmt(reading, "%02u:%02u:%02u  냉각수 %s / 엔진 %s / 미션 %s",
              static_cast<unsigned>(at / 3600), static_cast<unsigned>(at / 60 % 60),
              static_cast<unsigned>(at % 60), values[0], values[2], values[1]);

  - id: script_render_speed
    parameters:
      speed: float
    then:
      - lambda: |-
          const bool valid = std::isfinite(speed);
          if (!valid) id(script_update_acceleration).execute(NAN);
          id(g_dashboard_samples)[10] = valid ? esphome::millis() : 0;
          const auto color = id(fn_state_color)(valid ? speed : NAN, 10);
          char text[12] = "--";
          if (valid) snprintf(text, sizeof(text), "%d", static_cast<int>(speed));
          id(script_update_sensor_text).execute(id(lbl_speed), text, color, 10, 0);
          auto *bar = id(bar_speed);
          lv_obj_set_style_bg_opa(bar, valid ? LV_OPA_COVER : LV_OPA_40, LV_PART_MAIN);
          lv_obj_set_style_bg_color(bar,
              valid && speed <= 110.0f ? lv_color_hex(${tab5_color_accent}) : color,
              LV_PART_INDICATOR);
          if (valid) {
            fx::set_value(bar, std::trunc(speed),
                {.transition = speed < lv_bar_get_value(bar) ? id(fx_bar_165) : id(fx_bar_220)});
          } else {
            fx::set_value(bar, NAN, {.instant = true});
          }
          id(script_sync_service_ui).execute();

  - id: script_update_acceleration
    parameters:
      speed: float
    then:
      - lambda: |-
          const uint32_t now = esphome::millis();
          auto &previous = id(g_acceleration_previous_speed);
          auto &previous_ms = id(g_acceleration_previous_ms);
          auto &sampled_at = id(g_acceleration_sample_ms);
          if (!id(obd_client).connected() || !std::isfinite(speed)) {
            previous = NAN;
            previous_ms = sampled_at = 0;
            id(car_acceleration).publish_state(NAN);
            return;
          }
          const uint32_t elapsed = now - previous_ms;
          if (!std::isfinite(previous) || elapsed >= 5000) {
            // The first reading, including after a gap/reconnect, is a baseline only.
            previous = speed;
            previous_ms = now;
            sampled_at = 0;
            id(car_acceleration).publish_state(NAN);
            return;
          }
          if (elapsed == 0) return;
          const float acceleration = (speed - previous) * 1000.0f / elapsed;
          previous = speed;
          previous_ms = now;
          sampled_at = now;
          id(car_acceleration).publish_state(acceleration);

  - id: script_refresh_engine_dependents
    then:
      - lambda: |-
          const float rpm = id(fn_sample_live)(8, id(engine_rpm).state, 8000);
          const float measured_voltage = id(fn_sample_live)(7, id(car_battery).state, 35000);
          const float voltage = measured_voltage > 5.0f ? measured_voltage : NAN;
          const bool engine_on = rpm >= 400.0f;
          if (std::isfinite(rpm) && std::isfinite(voltage) && engine_on && voltage < 12.8f) {
            if (id(alt_low_since_ms) == 0) id(alt_low_since_ms) = esphome::millis();
          } else {
            id(alt_low_since_ms) = 0;
          }
          if (std::isfinite(rpm) && !engine_on) {
            if (id(engine_off_since_ms) == 0) id(engine_off_since_ms) = std::max<uint32_t>(esphome::millis(), 1);
          } else {
            id(engine_off_since_ms) = 0;
          }

          float soc = NAN;
          if (std::isfinite(rpm) && std::isfinite(voltage)) {
            if (engine_on) soc = (voltage - 12.8f) / 2.2f * 100.0f;
            else if (voltage <= 12.7f) soc = (voltage - 11.7f) * 100.0f;
            else if (voltage <= 13.5f) soc = 100.0f;
            else soc = 100.0f + (voltage - 13.5f) * 50.0f;
            soc = std::clamp(soc, 0.0f, 120.0f);
          }
          id(car_battery_soc).publish_state(soc);

          const struct {
            int mode;
            lv_obj_t *label;
            lv_obj_t *icon;
            float value;
            int decimals;
          } dependents[] = {
            {7, id(lbl_car_battery), id(widget_img_battery), voltage, 1},
            {14, id(lbl_oil_pressure), id(widget_img_oil_pressure),
                id(fn_sample_live)(14, id(engine_oil_pressure).state, 10000), 0},
            {5, id(lbl_engine_coolant_temperature), id(widget_img_coolant),
                id(fn_sample_live)(5, id(engine_coolant_temperature).state, 35000), 0},
            {18, id(lbl_transmission_temperature), id(widget_img_trans_temp),
                id(fn_sample_live)(18, id(transmission_temperature).state, 35000), 0},
          };
          // Redraw when a dependency changes/expires without making old measurements fresh.
          for (const auto &item : dependents) {
            const auto color = id(fn_state_color)(item.value, item.mode);
            id(script_render_scan_status).execute(item.mode, color, item.label, false);
            id(fn_icon_accent)(item.icon, color, item.mode, false);
            id(script_update_sensor_text).execute(item.label,
                id(fn_readout_text)(item.value, item.decimals), color, item.mode, 0);
          }

  - id: script_render_tpms
    then:
      - lambda: |-
          const uint32_t now = esphome::millis();
          const bool connected = id(obd_client).connected();
          constexpr float low_kpa = ${tpms_low_kpa};
          const struct {
            lv_obj_t *marker;
            lv_obj_t *label;
            float pressure;
          } tires[] = {
            {id(obj_tire_front_left), id(lbl_tpms_front_left), id(tire_pressure_front_left).state},
            {id(obj_tire_front_right), id(lbl_tpms_front_right), id(tire_pressure_front_right).state},
            {id(obj_tire_rear_left), id(lbl_tpms_rear_left), id(tire_pressure_rear_left).state},
            {id(obj_tire_rear_right), id(lbl_tpms_rear_right), id(tire_pressure_rear_right).state},
          };
          const uint8_t previous_low_tires = id(g_tpms_low_tires);
          uint8_t low_tires = 0;
          for (size_t i = 0; i < id(g_tpms_samples).size(); ++i) {
            const auto &tire = tires[i];
            const uint32_t sampled_at = id(g_tpms_samples)[i];
            const uint8_t bit = 1u << i;
            const bool was_low = (previous_low_tires & bit) != 0;
            const bool valid = connected && sampled_at != 0 && now - sampled_at < 75000 &&
                tire.pressure >= 0.0f && tire.pressure <= 600.0f;
            const bool low = valid && tire.pressure < low_kpa + (was_low ? 10.0f : 0.0f);
            if (low) low_tires |= bit;
            const bool show = low || id(g_tpms_show_all) || id(g_vehicle_scan_tpms);
            if (show) {
              char text[16] = "-- kPa";
              if (valid) snprintf(text, sizeof(text), "%.0f kPa", tire.pressure);
              lv_label_set_text(tire.label, text);
              lv_obj_set_style_text_color(tire.label, lv_color_hex(low
                  ? ${tab5_color_status_warm} : ${tab5_color_text_muted}), LV_PART_MAIN);
              lv_obj_set_hidden(tire.label, false);
            } else {
              lv_obj_set_hidden(tire.label, true);
            }
            if (low != was_low) {
              lv_obj_set_style_bg_color(tire.marker, lv_color_hex(low
                  ? ${tab5_color_status_warm} : ${tab5_color_text_inactive}), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(tire.marker, low ? LV_OPA_COVER : LV_OPA_30, LV_PART_MAIN);
            }
          }
          id(g_tpms_low_tires) = low_tires;

  - id: script_boot_vehicle_scan
    mode: single
    parameters:
      started_at: uint32_t
    then:
      - if:
          condition:
            lambda: 'return ${boot_vehicle_scan_max_ms}u > 0 && !id(g_boot_obd_received);'
          then:
            - logger.log: { level: DEBUG, tag: vehicle_scan, format: "Waiting for first OBD sample" }
            - while:
                condition:
                  lambda: |-
                    return !id(g_boot_obd_received) &&
                        esphome::millis() - started_at < ${boot_vehicle_scan_max_ms}u;
                then:
                  - if:
                      condition:
                        lambda: |-
                          return id(g_notice_active) || id(g_logs_visible) || id(g_ota_ui_active) ||
                              id(g_updating) || !lv_obj_is_hidden(id(obj_jaalee_detail));
                      then:
                        - script.execute: script_clear_vehicle_scan
                        - wait_until:
                            condition:
                              lambda: 'return id(g_boot_obd_received);'
                            timeout: !lambda |-
                              const uint32_t max_ms = ${boot_vehicle_scan_max_ms}u;
                              const uint32_t elapsed = std::min(esphome::millis() - started_at, max_ms);
                              return std::clamp(max_ms - elapsed, uint32_t{1}, uint32_t{${vehicle_scan_sweep_ms}});
                      else:
                        - script.execute: script_start_vehicle_scan_sweep
                        # Recheck the first sample and timeout after the visible sweep finishes.
                        - delay: !lambda return ${vehicle_scan_sweep_ms}u;
            - script.execute: script_clear_vehicle_scan
            - lambda: |-
                ESP_LOGD("vehicle_scan", "%s after %u ms",
                         id(g_boot_obd_received) ? "First OBD sample received" : "OBD wait timed out",
                         static_cast<unsigned>(esphome::millis() - started_at));

  - id: script_tick_vehicle_scan
    then:
      - lambda: |-
          static bool moved_since_stop = false;
          static uint32_t stopped_at = 0;
          static float stopped_selector = NAN;
          const float speed = id(fn_sample_live)(10, id(car_speed).state, 5000);
          if (id(obd_client).connected() && speed > 0.0f) moved_since_stop = true;
          // Once started, let the scan finish its sweep and completion display.
          if (id(script_vehicle_scan).is_running()) {
            moved_since_stop = false;
            stopped_at = 0;
            return;
          }
          const bool allowed = id(fn_vehicle_scan_allowed)();
          const float rpm = id(fn_sample_live)(8, id(engine_rpm).state, 8000);
          if (!moved_since_stop || !allowed || !(rpm >= 400.0f)) {
            stopped_at = 0;
            return;
          }
          const uint32_t now = esphome::millis();
          const float selector = id(prnd_status_alt).state;  // `allowed` checked the latest selector reading.
          if (!stopped_at || stopped_selector != selector) {
            stopped_at = now;
            stopped_selector = selector;
          }
          const uint32_t hold_ms = selector == 18.0f ? 2000 : 500;
          if (now - stopped_at < hold_ms) return;
          // Consume this stop even during cooldown: wait for movement before trying again.
          moved_since_stop = false;
          stopped_at = 0;
          const uint32_t started_at = id(g_vehicle_scan_started_at);
          if (started_at && now - started_at < ${vehicle_scan_cooldown_ms}u) return;
          id(script_vehicle_scan).execute();

  - id: script_start_vehicle_scan_sweep
    then:
      - lambda: |-
          auto *beam = id(obj_vehicle_scan_beam);
          fx::set_x(beam, 138, {.instant = true});
          lv_obj_set_hidden(beam, false);
          lv_label_set_text(id(lbl_vehicle_scan_status), "[ SCANNING ]");
          lv_obj_set_hidden(id(lbl_vehicle_scan_status), false);
          fx::set_x(beam, 738, {.transition = id(fx_vehicle_scan_sweep)});

  - id: script_vehicle_scan
    mode: single
    then:
      - lambda: id(g_vehicle_scan_started_at) = std::max<uint32_t>(esphome::millis(), 1);
      - script.execute: script_start_vehicle_scan_sweep
      - script.execute: { id: script_vehicle_scan_markers, phase: 0 }
      # Reveal TPMS at the same point in the sweep as before.
      - delay: !lambda return ${vehicle_scan_sweep_ms}u * 760u / 1250u;
      - lambda: |-
          id(g_vehicle_scan_tpms) = true;
          id(script_render_tpms).execute();
      - delay: !lambda return ${vehicle_scan_sweep_ms}u - (${vehicle_scan_sweep_ms}u * 760u / 1250u);
      - script.execute: { id: script_vehicle_scan_markers, phase: 2 }
      - lambda: |-
          lv_obj_set_hidden(id(obj_vehicle_scan_beam), true);
          lv_label_set_text(id(lbl_vehicle_scan_status), "[ SCAN COMPLETE ]");
      - script.execute: { id: script_sound_play, cue: 3 }
      - delay: 820ms
      - script.execute: script_clear_vehicle_scan

  - id: script_clear_vehicle_scan
    then:
      - script.execute: { id: script_vehicle_scan_markers, phase: 3 }
      - lambda: |-
          fx::stop(id(obj_vehicle_scan_beam));
          lv_obj_set_hidden(id(obj_vehicle_scan_beam), true);
          lv_obj_set_hidden(id(lbl_vehicle_scan_status), true);
          if (id(g_vehicle_scan_tpms)) {
            id(g_vehicle_scan_tpms) = false;
            id(script_render_tpms).execute();
          }

  - id: script_vehicle_scan_markers
    parameters:
      phase: int  # 0: start, 1: marker tick, 2: finish, 3: clear.
    then:
      - lambda: |-
          auto *overlay = id(obj_vehicle_scan_markers);
          if (phase == 3) {
            id(g_vehicle_scan_markers_active) = false;
            lv_obj_set_hidden(overlay, true);
            return;
          }
          // Body-side endpoints of the leader routes, relative to obj_vehicle_scan.
          // Order the result cells by the position where the beam reaches each endpoint.
          const struct {
            int x, y, mode;
            sensor::Sensor *sensor;
            uint32_t max_age;
            bool requires_obd;
          } sensors[] = {
            {119, 138, 5, id(engine_coolant_temperature), 35000, true},
            {162, 76, 17, id(intake_air_temperature), 35000, true},
            {170, 206, 7, id(car_battery), 35000, true},
            {191, 159, 14, id(engine_oil_pressure), 10000, true},
            {229, 131, 26, id(engine_oil_temperature), 35000, true},
            {277, 122, 18, id(transmission_temperature), 35000, true},
            {462, 40, 13, id(id_scd40_co2), 15000, false},
            {462, 235, 12, id(id_sgp30_tvoc), 8000, false},
            {505, 104, 2, id(id_cabin_temperature), 300000, false},
            {505, 174, 3, id(id_cabin_humidity), 300000, false},
            {731, 112, 15, id(id_bed_temperature), 300000, false},
            {731, 164, 16, id(id_bed_humidity), 300000, false},
          };
          static struct Indicator {
            lv_obj_t *marker = nullptr;
            lv_obj_t *cell = nullptr;
            uint32_t lit_at = 0;
            bool crossed = false;
            bool lit = false;
          } indicators[std::size(sensors)];
          constexpr uint32_t marker_duration_ms = 310;
          if (phase == 0) {
            const auto make_square = [&](int x, int y, int size, bool marker) {
              auto *obj = lv_obj_create(overlay);
              if (!obj) return obj;
              lv_obj_remove_style_all(obj);
              lv_obj_set_clickable(obj, false);
              lv_obj_set_scrollable(obj, false);
              lv_obj_set_pos(obj, x, y);
              lv_obj_set_size(obj, size, size);
              lv_obj_set_style_bg_color(obj, lv_color_hex(${tab5_color_accent}), LV_PART_MAIN);
              lv_obj_set_style_radius(obj, marker ? 2 : 0, LV_PART_MAIN);
              if (marker) {
                lv_obj_set_style_bg_opa(obj, LV_OPA_COVER, LV_PART_MAIN);
              } else {
                lv_obj_set_style_border_width(obj, 1, LV_PART_MAIN);
                lv_obj_set_style_border_color(obj, lv_color_hex(${tab5_color_text_muted}), LV_PART_MAIN);
              }
              return obj;
            };
            for (size_t i = 0; i < std::size(sensors); ++i) {
              auto &item = indicators[i];
              const auto &source = sensors[i];
              if (!item.marker) item.marker = make_square(source.x - 4, source.y - 4, 9, true);
              if (!item.cell) item.cell = make_square(574 + i * 11, 3, 8, false);
              item.crossed = item.lit = false;
              if (item.marker) lv_obj_set_hidden(item.marker, true);
              if (item.cell) lv_obj_set_style_bg_opa(item.cell, LV_OPA_TRANSP, LV_PART_MAIN);
            }
            lv_obj_set_hidden(overlay, false);
            id(g_vehicle_scan_markers_active) = true;
          }

          const uint32_t now = esphome::millis();
          // Read the animated style position directly, before the next LVGL layout pass.
          const int beam_x = lv_obj_get_style_x(id(obj_vehicle_scan_beam), LV_PART_MAIN);
          const bool connected = id(obd_client).connected();
          for (size_t i = 0; i < std::size(sensors); ++i) {
            auto &item = indicators[i];
            const auto &source = sensors[i];
            if (!item.crossed && (phase == 2 || source.x <= beam_x)) {
              item.crossed = true;
              item.lit = (!source.requires_obd || connected) &&
                  std::isfinite(id(fn_sample_live)(source.mode, source.sensor->state, source.max_age));
              if (item.lit) {
                item.lit_at = now;
                if (item.cell) lv_obj_set_style_bg_opa(item.cell, LV_OPA_COVER, LV_PART_MAIN);
                if (item.marker) lv_obj_set_hidden(item.marker, false);
              }
            }
            if (item.lit && now - item.lit_at >= marker_duration_ms) {
              if (item.marker) lv_obj_set_hidden(item.marker, true);
              item.lit = false;
            }
          }

  - id: script_render_prnd
    parameters:
      position: string
    then:
      - lambda: |-
          auto *label = id(lbl_prnd);
          if (position == lv_label_get_text(label)) return;
          const char *positions = "PRNDL";
          const char *slot = position.size() == 1 ? std::strchr(positions, position[0]) : nullptr;
          auto *selection = id(obj_prnd_selection);
          // A new selection ends the previous confirmation flash; a move in flight is retargeted from where it is.
          fx::stop(selection, id(fx_prnd_confirm));
          fx::stop(id(obj_prnd_confirm));
          if (slot) {
            // Hidden means the first selection: it appears in place (fx moves visible widgets only).
            const bool appearing = lv_obj_is_hidden(selection);
            fx::set_x(selection, 43 * (slot - positions));
            lv_obj_set_hidden(selection, false);
            // The dark bar flashes once the move has ended (its effect starts after the move time).
            if (!appearing) fx::play(id(obj_prnd_confirm), id(fx_prnd_bar));
          } else {
            fx::stop(selection);
            lv_obj_set_hidden(selection, true);
          }
          lv_label_set_text(label, position.c_str());
          fx::stop(id(lbl_gear));
          if (!position.empty() && position[0] != '-') fx::play(label, id(fx_prnd_pulse));
          else fx::stop(label);
          id(script_render_gear).execute(false);

  - id: script_render_gear
    parameters:
      animate: bool
    then:
      - lambda: |-
          auto *label = id(lbl_gear);
          const char position = lv_label_get_text(id(lbl_prnd))[0];
          const float gear = id(g_dashboard_gear);
          const bool valid = (position == 'D' || position == 'L') &&
                             std::isfinite(gear) && gear >= 1.0f && gear < 100.0f;
          char text[4] = "-";
          if (valid) snprintf(text, sizeof(text), "%d", static_cast<int>(gear));
          const char *previous = lv_label_get_text(label);
          const bool changed = std::strcmp(previous, text) != 0;
          if (animate && !changed) return;
          const int last = std::atoi(previous);
          fx::stop(label);
          if (!changed) return;
          // The digit rolls in from below when the gear grows and from above when it shrinks.
          if (animate && valid && last) fx::set_text(label, text);
          else lv_label_set_text(label, text);

  - id: script_render_pose
    then:
      - lambda: |-
          const struct {
            lv_obj_t *shape;
            lv_obj_t *value;
            lv_obj_t *calibrated;
            lv_obj_t *range;
            float angle;
            float direction;
            float offset;
          } axes[] = {
            {id(obj_pitch_shape), id(lbl_pitch_value), id(lbl_pitch_calibrated), id(lbl_pitch_range), id(id_compass).pitch(), ${tab5_pitch_direction}, id(id_compass).pitch_offset()},
            {id(obj_roll_shape), id(lbl_roll_value), id(lbl_roll_calibrated), id(lbl_roll_range), id(id_compass).roll(), ${tab5_roll_direction}, id(id_compass).roll_offset()},
          };
          char posture[48];
          if (std::isfinite(axes[0].angle) && std::isfinite(axes[1].angle)) {
            snprintf(posture, sizeof(posture), "P %+.1f° / R %+.1f°",
                     axes[0].angle * axes[0].direction + 0.0f, axes[1].angle * axes[1].direction + 0.0f);
          } else {
            snprintf(posture, sizeof(posture), "P -- / R --");
          }
          if (std::strcmp(lv_label_get_text(id(lbl_setup_attitude)), posture) != 0) {
            lv_label_set_text(id(lbl_setup_attitude), posture);
          }
          static uint8_t levels[2]{};
          size_t axis_index = 0;
          for (const auto &axis : axes) {
            auto &level = levels[axis_index++];
            const bool valid = std::isfinite(axis.angle);
            const int32_t target = valid ? std::lround(std::clamp(axis.angle, -25.0f, 25.0f) * 10.0f) : 0;
            lv_obj_set_style_opa(axis.shape, valid ? LV_OPA_COVER : LV_OPA_30, LV_PART_MAIN);
            const float magnitude = std::abs(axis.angle);
            if (std::abs(axis.offset) > 0.0001f) lv_obj_set_hidden(axis.calibrated, false);
            else lv_obj_set_hidden(axis.calibrated, true);
            if (valid && magnitude > 25.0f) lv_obj_set_hidden(axis.range, false);
            else lv_obj_set_hidden(axis.range, true);
            // Enter each band at its configured angle; recover 1 degree below it.
            if (!valid) level = 0;
            else if (magnitude >= ${tab5_tilt_hot_deg}) level = 2;
            else if (level == 2 && magnitude >= ${tab5_tilt_hot_deg} - 1.0f) level = 2;
            else if (magnitude >= ${tab5_tilt_warm_deg}) level = 1;
            else if (level >= 1 && magnitude >= ${tab5_tilt_warm_deg} - 1.0f) level = 1;
            else level = 0;
            const auto color = lv_color_hex(!valid ? ${tab5_color_text_muted}
                : level == 2 ? ${tab5_color_status_hot}
                : level == 1 ? ${tab5_color_status_warm}
                : ${tab5_color_accent});
            lv_obj_set_style_text_color(axis.value, color, LV_PART_MAIN);
            const bool tinted = valid && level > 0;
            for (uint32_t i = 0; i < lv_obj_get_child_count(axis.shape); ++i) {
              auto *part = lv_obj_get_child(axis.shape, i);
              // Preserve the quieter trim at small angles; tint the whole vehicle when inclined.
              if (lv_obj_check_type(part, &lv_line_class)) {
                const bool detail = lv_obj_get_style_line_width(part, LV_PART_MAIN) == 1;
                lv_obj_set_style_line_color(part, !tinted && detail
                    ? lv_color_hex(${tab5_color_text_inactive}) : color, LV_PART_MAIN);
              } else if (lv_obj_get_style_border_width(part, LV_PART_MAIN) > 0) {
                const bool hub = lv_obj_get_style_border_width(part, LV_PART_MAIN) == 1;
                lv_obj_set_style_border_color(part, !tinted && hub
                    ? lv_color_hex(${tab5_color_text_inactive}) : color, LV_PART_MAIN);
              }
            }
            // An unreadable angle levels at once; a readable one glides.
            if (valid) {
              fx::set_rotation(axis.shape, target / 10.0f);
            } else {
              fx::set_rotation(axis.shape, 0, {.instant = true});
            }
          }

  - id: script_speed_expire
    mode: restart
    then:
      # Keep the UI fresh even if BLE is connected and the ECU stops replying.
      - delay: 5s
      - lambda: id(script_render_speed).execute(NAN);

  - id: script_dashboard_watchdog
    parameters:
      install: bool
      disconnect: bool
    then:
      - lambda: |-
          constexpr uint32_t jaalee_timeout_ms = 300000;
          const struct {
            int mode;
            lv_obj_t *label;
            lv_obj_t *icon;
            lv_obj_t *bar;
            uint32_t timeout;
            bool obd;
          } readouts[] = {
            {2, id(lbl_cabin_temperature), id(widget_img_cabin_temp), nullptr, jaalee_timeout_ms, false},
            {3, id(lbl_cabin_humidity), id(widget_img_cabin_humidity), nullptr, jaalee_timeout_ms, false},
            {5, id(lbl_engine_coolant_temperature), id(widget_img_coolant), nullptr, 35000, true},
            {6, id(lbl_fuel_level), id(widget_img_fuel), id(bar_fuel), 100000, true},
            {7, id(lbl_car_battery), id(widget_img_battery), nullptr, 35000, true},
            {8, id(lbl_engine_rpm_left), id(widget_img_rpm), id(bar_engine_rpm), 8000, true},
            {9, id(lbl_engine_load_left), id(widget_img_load), id(bar_engine_load), 8000, true},
            {12, id(lbl_cabin_tvoc), id(widget_img_cabin_tvoc), nullptr, 8000, false},
            {13, id(lbl_cabin_co2), id(widget_img_cabin_co2), nullptr, 15000, false},
            {14, id(lbl_oil_pressure), id(widget_img_oil_pressure), nullptr, 10000, true},
            {15, id(lbl_bed_temperature), id(widget_img_bed_temp), nullptr, jaalee_timeout_ms, false},
            {16, id(lbl_bed_humidity), id(widget_img_bed_humidity), nullptr, jaalee_timeout_ms, false},
            {17, id(lbl_intake_temp_display), id(widget_img_intake), nullptr, 35000, true},
            {18, id(lbl_transmission_temperature), id(widget_img_trans_temp), nullptr, 35000, true},
            {19, id(lbl_trip_distance), id(widget_img_trip), nullptr, 100000, true},
            {20, id(lbl_battery_soc), id(widget_img_battery_soc), id(bar_battery_soc), 35000, true},
            {24, id(lbl_tcc_slip), id(widget_img_tcc_slip), id(bar_tcc_slip), 3000, true},
            {26, id(lbl_oil_temperature), id(widget_img_oil_temperature), nullptr, 35000, true},
          };
          if (install) {
            // A published update state is a completed response, even if its value did not change.
            const auto sync_update = []() {
              const auto state = id(ota_update).state;
              if (state != update::UPDATE_STATE_AVAILABLE && state != update::UPDATE_STATE_NO_UPDATE) return;
              id(g_checking) = false;
              id(script_set_update_available).execute(id(ota_update).update_info.latest_version,
                  state == update::UPDATE_STATE_AVAILABLE);
            };
            id(ota_update).add_on_state_callback(sync_update);
            sync_update();
            // The C6 install runs inside one blocking perform() call (no progress callbacks):
            // INSTALLING opens the shared update overlay, the following state reports the result.
            id(c6_update).add_on_state_callback([]() {
              static update::UpdateState last = update::UPDATE_STATE_UNKNOWN;
              const auto state = id(c6_update).state;
              if (state == update::UPDATE_STATE_INSTALLING && last != state) {
                id(script_c6_ota_begin).execute();
              } else if (last == update::UPDATE_STATE_INSTALLING && state != last) {
                if (state == update::UPDATE_STATE_NO_UPDATE && !id(c6_update).status_has_error()) {
                  id(script_c6_ota_done).execute();
                } else {
                  id(script_ota_failed).execute("C6 update failed. Check log.");
                }
              }
              last = state;
              id(script_c6_update_label).execute();
            });
            id(script_c6_update_label).execute();
            esphome::sensor::Sensor *const tire_sensors[] = {
              id(tire_pressure_front_left), id(tire_pressure_front_right),
              id(tire_pressure_rear_left), id(tire_pressure_rear_right),
            };
            for (size_t i = 0; i < id(g_tpms_samples).size(); ++i) {
              tire_sensors[i]->add_on_state_callback([i](float value) {
                id(g_tpms_samples)[i] = std::isfinite(value) ? esphome::millis() : 0;
              });
            }
            const auto focus = +[](lv_event_t *event) {
              const auto mode = static_cast<int>(reinterpret_cast<intptr_t>(lv_event_get_user_data(event)));
              id(script_render_scan_status).execute(mode, lv_color_t{}, nullptr, true);
              const bool bed = mode == 15 || mode == 16;
              if ((!bed && mode != 2 && mode != 3) || !id(fn_service_allowed)()) return;
              auto *detail = id(obj_jaalee_detail);
              if (!lv_obj_is_hidden(detail) && id(g_jaalee_detail_bed) == bed) {
                id(script_jaalee_detail).stop();
                fx::set_visible(detail, false);
                return;
              }
              id(script_jaalee_detail).execute(bed);
            };
            for (const auto &readout : readouts) {
              if (readout.mode == 19) continue;
              auto *card = lv_obj_get_parent(readout.label);
              lv_obj_set_clickable(card, true);
              lv_obj_add_event_cb(card, focus, LV_EVENT_CLICKED,
                                  reinterpret_cast<void *>(static_cast<intptr_t>(readout.mode)));
            }
            return;
          }

          auto &samples = id(g_dashboard_samples);
          if (disconnect) {
            id(alt_low_since_ms) = 0;
            id(engine_off_since_ms) = 0;
            id(g_ambient_sample_ms) = 0;
            id(g_warmup_last_runtime) = -1.0f;
            id(g_warmup_completed).fill(false);
            samples[24] = samples[25] = 0;
            id(g_tcc_slip_warning_at) = 0;
            id(g_tpms_samples).fill(0);
          }
          const uint32_t now = esphome::millis();
          const auto expired = [&](int mode, uint32_t timeout) {
            return samples[mode] != 0 && now - samples[mode] >= timeout;
          };
          for (const auto &readout : readouts) {
            if (samples[readout.mode] == 0) continue;
            if (!(disconnect && readout.obd) && !expired(readout.mode, readout.timeout)) continue;
            if (readout.bar) {
              id(script_render_gauge).execute(readout.label, readout.bar, readout.icon, NAN, readout.mode, 0, false);
            } else {
              id(script_render_readout).execute(readout.label, readout.icon, NAN, readout.mode, 0, 0);
            }
          }
          if (disconnect || expired(11, 20000)) samples[11] = 0;
          if (disconnect || expired(21, 8000)) {
            samples[21] = 0;
            id(g_dashboard_gear) = NAN;
            id(script_render_gear).execute(false);
          }
          if (disconnect || expired(22, 8000)) {
            samples[22] = 0;
            id(script_render_prnd).execute("-");
          }
          id(script_refresh_engine_dependents).execute();

  # Boot terminal sequence, keyed to boot_mechanical_terminal.wav. Hit times (ms from WAV start)
  # were measured from its waveform: 77 click, 415 latch, 1191/1684/2140 drive seeks, 2820 final.
  # Between hits the log is typed; each hit stamps a result, reveals part of the vehicle identity
  # (title decode, trim badge, trim name, powertrain) and steps the segmented progress bar.
  # Only small label areas change per frame, so it stays smooth at full resolution.
  - id: script_boot_typing
    then:
      - lambda: |-
          // Typed lines and decodes run in lvgl_fx (force: the fx is not ready during boot); the timer starts each
          // one at its start time, keeping the same quantization as before.
          struct Run { lv_obj_t *label; const char *text; uint16_t start; fx::TransitionRef transition; };
          static Run runs[8];
          static uint32_t t0, fired, begun;
          static lv_timer_t *timer = nullptr;

          runs[0] = {id(lbl_boot_header), "MOBILE SERVICE TERMINAL", 100, id(fx_type_13)};
          runs[1] = {id(lbl_boot_row1), "01  >  WAKE DISPLAY", 700, id(fx_type_22)};
          runs[2] = {id(lbl_boot_row2), "02  >  PREPARE INPUT", 1260, id(fx_type_18)};
          runs[3] = {id(lbl_boot_row3), "03  >  LOAD INSTRUMENTS", 1740, id(fx_type_15)};
          runs[4] = {id(lbl_boot_row4), "04  >  DISPLAY READY", 2240, id(fx_type_20)};
          runs[5] = {id(lbl_splash_title), "${splash_title}", 415, id(fx_decode_40)};
          runs[6] = {id(lbl_boot_trim), "${splash_trim}", 1684, id(fx_decode_26)};
          runs[7] = {id(lbl_boot_power), "${splash_powertrain}", 2140, id(fx_decode_28)};
          for (auto &run : runs) {
            fx::stop(run.label);
            lv_label_set_text(run.label, "");
          }
          fired = begun = 0;
          if (timer != nullptr) lv_timer_delete(timer);
          t0 = lv_tick_get();

          timer = lv_timer_create(+[](lv_timer_t *self) {
            const int32_t e = int32_t(lv_tick_elaps(t0)) - ${boot_sync_offset_ms};
            if (e < 0) return;
            lv_obj_t *cursor = id(obj_boot_cursor);
            const lv_color_t accent = lv_color_hex(${tab5_color_accent});
            const lv_color_t ink = lv_color_hex(${tab5_color_background});
            // Inverse video (accent block, background-colored text) or plain text.
            auto inverse = [](lv_obj_t *obj, bool on, lv_color_t block, lv_color_t text) {
              lv_obj_set_style_bg_color(obj, block, LV_PART_MAIN);
              lv_obj_set_style_bg_opa(obj, on ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_set_style_text_color(obj, text, LV_PART_MAIN);
            };

            // Hits.
            struct Stamp { int16_t at; uint8_t progress; int8_t action; };
            static const Stamp kStamps[] = {
                {77, 0, -1}, {415, 10, -2}, {1191, 30, 0}, {1684, 50, 1}, {2140, 80, 2}, {2820, 100, 3}};
            static int16_t ok_at[4];
            static int prog_from, prog_to, prog_shown;
            static int32_t prog_at;
            lv_obj_t *const oks[] = {id(lbl_boot_ok1), id(lbl_boot_ok2), id(lbl_boot_ok3), id(lbl_boot_ok4)};
            if (fired == 0) {
              prog_from = prog_to = prog_shown = 0;
              prog_at = 0;
            }
            for (size_t i = 0; i < std::size(kStamps); i++) {
              const Stamp &s = kStamps[i];
              if (e < s.at || (fired & (1u << i))) continue;
              fired |= 1u << i;
              if (s.action == -1) {
                lv_obj_set_hidden(id(obj_boot_frame), false);
              } else if (s.action == -2) {
                lv_obj_set_hidden(id(lbl_boot_version), false);
              } else {
                lv_obj_set_hidden(oks[s.action], false);
                ok_at[s.action] = s.at;
              }
              if (s.action == 0) {
                // Trim badge lands as an outline, then fills (see badge stamp below).
                lv_obj_t *badge = id(obj_boot_badge);
                lv_obj_set_hidden(badge, false);
                lv_obj_update_layout(badge);
                lv_obj_set_x(id(lbl_boot_trim), lv_obj_get_x(badge) + lv_obj_get_width(badge) + 18);
              }
              if (s.action == 3) {
                lv_obj_t *row = id(lbl_boot_row4);
                inverse(row, true, accent, ink);
                lv_obj_set_style_pad_hor(row, 6, LV_PART_MAIN);
                lv_obj_set_x(row, lv_obj_get_x(row) - 6);
              }
              prog_from = prog_shown;
              prog_to = s.progress;
              prog_at = s.at;
            }

            // Stamps flash in inverse for 140 ms, then settle.
            static int8_t ok_mode[4] = {-1, -1, -1, -1};
            for (int i = 0; i < 4; i++) {
              if (!(fired & (1u << (i + 2)))) continue;
              const int8_t mode = e - ok_at[i] < 140 ? 1 : 0;
              if (mode == ok_mode[i]) continue;
              ok_mode[i] = mode;
              const lv_color_t settled = i == 3 ? accent : lv_color_hex(${tab5_color_text_secondary});
              inverse(oks[i], mode == 1, accent, mode == 1 ? ink : settled);
              lv_obj_set_style_pad_hor(oks[i], mode == 1 ? 4 : 0, LV_PART_MAIN);
            }

            // Badge: outline for 70 ms after its hit, then solid.
            static int8_t badge_mode = -1;
            if (fired & (1u << 2)) {
              const int8_t mode = e - 1191 < 70 ? 0 : 1;
              if (mode != badge_mode) {
                badge_mode = mode;
                inverse(id(obj_boot_badge), mode == 1, accent, accent);
                lv_obj_set_style_text_color(id(lbl_boot_badge), mode == 1 ? ink : accent, LV_PART_MAIN);
              }
            }

            // Segmented progress: one 10% segment snaps on every 45 ms toward the target.
            const int segs = std::min<int32_t>((e - prog_at) / 45 + 1, 10);
            const int pct = std::min(prog_to, prog_from + (prog_to > prog_from ? segs * 10 : 0));
            if (pct != prog_shown) {
              prog_shown = pct;
              lv_bar_set_value(id(bar_splash_progress), pct, LV_ANIM_OFF);
              lv_label_set_text_fmt(id(lbl_splash_percent), "%03d%%", pct);
            }

            // Title underline sweeps out after the latch.
            static int32_t rule_shown = 0;
            const int32_t rule = std::clamp<int32_t>((e - 415) * 476 / 160, 0, 476);
            if (rule != rule_shown) lv_obj_set_width(id(obj_boot_title_rule), rule_shown = rule);

            // Start each typed line / decode at its time. The label text is the partial text while it runs,
            // so a line is still typing while it differs from its final text.
            size_t active = 0;
            bool typing = false;
            for (size_t i = 0; i < std::size(runs); i++) {
              const Run &run = runs[i];
              if (e < run.start) continue;
              if (!(begun & (1u << i))) {
                begun |= 1u << i;
                fx::set_text(run.label, run.text, {.transition = run.transition, .force = true});
              }
              if (i < 5) {
                active = i;
                typing = strcmp(lv_label_get_text(run.label), run.text) != 0;
              }
            }

            // Block cursor follows the line being typed; solid while typing, blinking while waiting.
            if (fired & (1u << 5)) {
              lv_obj_set_hidden(cursor, true);
            } else {
              lv_obj_t *label = runs[active].label;
              const lv_font_t *font = lv_obj_get_style_text_font(label, LV_PART_MAIN);
              lv_point_t size;
              lv_text_get_size(&size, lv_label_get_text(label), font,
                               lv_obj_get_style_text_letter_space(label, LV_PART_MAIN), 0, LV_COORD_MAX,
                               LV_TEXT_FLAG_NONE);
              const int32_t x = lv_obj_get_x(label) + size.x + (size.x > 0 ? 4 : 0);
              const int32_t y = lv_obj_get_y(label) + 2;
              const int32_t w = lv_font_get_glyph_width(font, 'M', 'M');
              const int32_t h = lv_font_get_line_height(font) - 4;
              static int32_t geometry[4] = {-1, -1, -1, -1};
              if (geometry[0] != x || geometry[1] != y) lv_obj_set_pos(cursor, geometry[0] = x, geometry[1] = y);
              if (geometry[2] != w || geometry[3] != h) lv_obj_set_size(cursor, geometry[2] = w, geometry[3] = h);
              const bool on = typing || (e / 265) % 2 == 0;
              if (on == lv_obj_is_hidden(cursor)) {
                if (on) lv_obj_set_hidden(cursor, false);
                else lv_obj_set_hidden(cursor, true);
              }
            }

            if (e >= 3300) {
              lv_timer_delete(self);
              timer = nullptr;
            }
          }, 15, nullptr);

