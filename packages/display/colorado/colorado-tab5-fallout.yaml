    type: float
    initial_value: 'NAN'
  - id: g_dashboard_samples
    type: "std::array<uint32_t, 27>"
    initial_value: 'std::array<uint32_t, 27>{}'
  - id: g_acceleration_previous_speed
    type: float
    initial_value: 'NAN'
  - id: g_acceleration_previous_ms
    type: uint32_t
    initial_value: '0'
  - id: g_acceleration_sample_ms
    type: uint32_t
    initial_value: '0'
  - id: g_tcc_slip_warning_at
    type: uint32_t
    initial_value: '0'
  - id: g_tpms_samples
    type: "std::array<uint32_t, 4>"
    initial_value: 'std::array<uint32_t, 4>{}'
  - id: g_tpms_show_all
    type: bool
    initial_value: 'false'
  - id: g_tpms_low_tires
    type: uint8_t
    initial_value: '0'
  # ── 발전기 저전압 지속시간 추적 (RVC 연비모드 오탐 방지: 순간전압이 아닌 지속시간으로 실고장 판정)
  - id: alt_low_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # ── 시동 OFF 경과시간 추적 (정지 직후 표면전하로 13.5V를 넘는 과전압 오탐 방지)
  - id: engine_off_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: fn_battery_rested
    type: "bool (*)()"
    initial_value: |-
      +[]() -> bool {
        const uint32_t since = id(engine_off_since_ms);
        return since != 0 && esphome::millis() - since >= ${battery_rest_settle_s} * 1000UL;
      }
  # ── OTA 업데이트 상태 추적 ──
  - id: g_latest_version
    type: std::string
    initial_value: '""'
  - id: g_update_available
    type: bool
    initial_value: 'false'
  - id: g_update_alert_dismissed
    type: bool
    initial_value: 'false'
  # 현재 표시 중인 팝업이 차량 경고가 아닌 업데이트 안내인지 (닫기 클릭 시 어느 dismiss 플래그를 세울지 판단)
  - id: g_alert_is_update
    type: bool
    initial_value: 'false'
  - id: g_updating
    type: bool
    initial_value: 'false'
  - id: g_ota_ui_active
    type: bool
    initial_value: 'false'
  - id: g_ota_backlight_was_on
    type: bool
    initial_value: 'true'
  - id: g_ota_backlight_brightness
    type: float
    initial_value: '0.4f'
  - id: g_ota_lvgl_was_paused
    type: bool
    initial_value: 'false'
  # 수동 "업데이트 확인" 진행 중 여부 (버튼 중복 클릭/중복 요청 방지)
  - id: g_checking
    type: bool
    initial_value: 'false'
  - id: fn_sample_live
    type: "float (*)(int, float, uint32_t)"
    initial_value: |-
      +[](int mode, float value, uint32_t timeout) -> float {
        if (mode < 0 || mode >= 27 || !std::isfinite(value)) return NAN;
        const uint32_t sampled_at = id(g_dashboard_samples)[mode];
        return sampled_at && esphome::millis() - sampled_at < timeout ? value : NAN;
      }
  - id: fn_service_allowed
    type: "bool (*)()"
    initial_value: |-
      +[]() {
        // Allow access before the first speed sample. A known moving speed still locks the menu,
        // including when that last reading is stale or BLE has disconnected.
        const float speed = id(car_speed).state;
        return !std::isfinite(speed) || speed == 0.0f;
      }
  - id: g_ambient_sample_ms
    type: uint32_t
    initial_value: '0'
  - id: g_warmup_last_runtime
    type: float
    initial_value: '-1.0f'
  - id: g_warmup_completed
    type: "std::array<bool, 2>"
    initial_value: 'std::array<bool, 2>{}'
  - id: fn_warmup_grace_s
    type: "float (*)(float, int)"
    initial_value: |-
      +[](float ambient, int mode) -> float {
        const float base = mode == 5 ? ${coolant_warmup_base_s} : ${transmission_warmup_base_s};
        const float maximum = mode == 5 ? ${coolant_warmup_max_s} : ${transmission_warmup_max_s};
        // Missing / stale / implausible ambient uses the longest grace period.
        if (!std::isfinite(ambient) || ambient < -40.0f || ambient > 60.0f) return maximum;
        const float extension = std::clamp(
            (${warmup_ambient_reference_c} - ambient) / ${warmup_ambient_span_c}, 0.0f, 1.0f);
        return base + (maximum - base) * extension;
      }
  - id: fn_warmup_phase
    type: "int (*)(int)"
    initial_value: |-
      +[](int mode) -> int {
        // 0 = unknown / engine off; 1 = warm-up display window; 2 = window elapsed.
        // These phases are display timing only, never a driving-readiness verdict.
        if (mode != 5 && mode != 18) return 0;
        const float rt = id(fn_sample_live)(11, id(engine_run_time).state, 20000);
        const float rpm = id(fn_sample_live)(8, id(engine_rpm).state, 8000);
        if (!std::isfinite(rt) || rt < 0.0f || !(rpm >= 400.0f)) return 0;
        const size_t index = mode == 5 ? 0 : 1;
        if (id(g_warmup_completed)[index]) return 2;
        const uint32_t sampled_at = id(g_ambient_sample_ms);
        const float ambient = sampled_at && esphome::millis() - sampled_at < 90000
            ? id(ambient_air_temperature).state : NAN;
        if (rt < id(fn_warmup_grace_s)(ambient, mode)) return 1;
        // Do not re-enter warm-up when ambient changes or its sample expires.
        id(g_warmup_completed)[index] = true;
        return 2;
      }
  - id: fn_readout_text
    type: "std::string (*)(float, int)"
    initial_value: |-
      +[](float value, int decimals) -> std::string {
        if (!std::isfinite(value)) return "--";
        char text[16];
        snprintf(text, sizeof(text), "%.*f", decimals, value);
        return text;
      }
  # ── 계기판 상태 색상 ──
  - id: fn_state_color
    type: "std::function<lv_color_t(float, int)>"
    initial_value: |-
      [](float val, int mode) -> lv_color_t {
         const auto unavailable   = lv_color_hex(${tab5_color_text_muted});
         const auto cold    = lv_color_hex(${tab5_color_status_cold});
         const auto cool    = lv_color_hex(${tab5_color_status_cool});
         const auto normal  = lv_color_hex(${tab5_color_text_primary});
         const auto active  = lv_color_hex(${tab5_color_accent});
         const auto danger  = lv_color_hex(${tab5_color_status_hot});
         const auto warning = lv_color_hex(${tab5_color_status_warm});

         const auto classify = [&](float val) -> lv_color_t {
           if (!std::isfinite(val)) return unavailable;
  
           if (mode == 1 || mode == 2) { // 실내 온도
             if (val < 10)  return cold;
             else if (val < 18) return cool;
             else if (val <= 26) return normal;
             else if (val <= 31) return warning;
             return danger;
           } else if (mode == 3) { // 실내 습도
             if (val < 25) return lv_color_hex(${tab5_color_humidity_very_dry});
             else if (val < 40) return lv_color_hex(${tab5_color_humidity_dry});
             else if (val <= 60) return normal;
             else if (val <= 75) return lv_color_hex(${tab5_color_humidity_humid});
             return lv_color_hex(${tab5_color_humidity_very_humid});
           } else if (mode == 15) { // 적재함 온도
             if (val < 0)  return cold;
             else if (val < 10) return cool;
             else if (val <= 30) return normal;
             else if (val <= 40) return warning;
             return danger;
           } else if (mode == 16) { // 적재함 습도
             if (val < 15) return lv_color_hex(${tab5_color_humidity_very_dry});
             else if (val < 30) return lv_color_hex(${tab5_color_humidity_dry});
             else if (val <= 70) return normal;
             else if (val <= 85) return lv_color_hex(${tab5_color_humidity_humid});
             return lv_color_hex(${tab5_color_humidity_very_humid});
           } else if (mode == 5) { // 냉각수
             if (val < 60) {
               // 외기온에 따른 유예시간 이후 저온 정보만 표시 (고장 판정 아님).
               return id(fn_warmup_phase)(mode) == 2 ? cold : normal;
             }
             else if (val < 95) return normal;
             else if (val < 110) return warning;
             return danger;
           } else if (mode == 6) { // 연료
             if (val > 30) return active;
             else if (val > 15) return warning;
             return danger;
           } else if (mode == 7 || mode == 20) { // 전압과 충전율/잔량 카드의 공통 기준
             const bool is_soc = mode == 20;
             const float voltage = is_soc ? id(fn_sample_live)(7, id(car_battery).state, 35000) : val;
             if (isnan(voltage) || voltage <= 5.0f) return unavailable;
             const auto normal_color = is_soc ? active : normal;
             const float rpm = id(fn_sample_live)(8, id(engine_rpm).state, 8000);
             if (!std::isfinite(rpm)) return unavailable;
             const bool engine_on = rpm >= 400.0f;
             if (engine_on) {
               if (voltage < 12.8f) {
                 // RVC 연비모드의 순간 저전압과 3분 이상 지속되는 미충전을 구분한다.
                 const bool sustained = id(alt_low_since_ms) != 0 &&
                                        esphome::millis() - id(alt_low_since_ms) >= 180000;
                 return sustained ? danger : warning;
               }
               if (voltage < 13.2f) return warning;
               if (voltage <= 14.85f) return normal_color;
               return voltage <= 15.0f ? warning : danger;
             }
             if (voltage < 11.8f) return danger;
             if (voltage < 12.0f) return warning;
             // Surface charge after shutdown is not an overvoltage fault.
             return voltage <= 13.5f || !id(fn_battery_rested)() ? normal_color : danger;
           } else if (mode == 8) { // RPM
             if (val > 3500) return danger;
             else if (val > 2500) return warning;
             return active;
           } else if (mode == 9) { // 엔진 부하 %
             if (val > 95) return danger;
             else if (val > 75) return warning;
             return active;
           } else if (mode == 10) { // Speed (분리 수정)
             if (val > 120) return danger;
             else if (val > 110) return warning;
             else if (val > 100) return active;
             return normal;
           } else if (mode == 11) { // 운행시간 (초)
             if (val < 3600) return normal;
             if (val < 7200) return warning;
             return danger;
           } else if (mode == 12) { // TVOC — 경고 팝업 기준(3333=환기 필요)과 일치, 팝업이 red를 안 쓰므로 카드도 orange까지만
             if (val > 3333) return warning;
             return normal;
           } else if (mode == 13) { // CO2 — 경고 팝업 기준과 일치 (1500=졸음 주의, 2500=졸음 경고)
             if (val > 2500) return danger;
             else if (val > 1500) return warning;
             return normal;
           } else if (mode == 14) { // 오일 압력 (kPa)
             const float rpm = id(fn_sample_live)(8, id(engine_rpm).state, 8000);
             if (!(rpm >= 400.0f)) return unavailable;
             const bool above_idle = rpm >= 1000.0f;
             const float low_kpa = above_idle ? ${oil_pressure_low_above_idle_kpa}f : ${oil_pressure_low_idle_kpa}f;
             const float warn_kpa = above_idle ? ${oil_pressure_warn_above_idle_kpa}f : ${oil_pressure_warn_idle_kpa}f;
             if (val < low_kpa || val > ${oil_pressure_high_kpa}f) return danger;
             if (val < warn_kpa) return warning;
             return active;
           } else if (mode == 17) { // 흡기온도 — 엔진룸 흡기 공기 기준
             if (val <= 45) return normal;
             else if (val <= 60) return warning;
             return danger;
           } else if (mode == 18) { // Colorado 3.6L / 8L45 sump temperature.
             if (val < ${transmission_warmup_reference_c}) {
               // User-selected display reference; NOT a minimum operating temperature.
               // Cool is an early warm-up hint only; never flag persistent low TFT.
               return id(fn_warmup_phase)(mode) == 1 ? cool : normal;
             }
             else if (val <= ${transmission_temperature_warn_c}) return normal;
             else if (val <= ${transmission_temperature_hot_c}) return warning;
             return danger;
           } else if (mode == 24) { // TCC slip: large slip alone is normal when unlocked.
             const uint32_t warned_at = id(g_tcc_slip_warning_at);
             return warned_at && esphome::millis() - warned_at < 10000 ? warning : active;
           } else if (mode == 26) { // Calculated engine oil temperature (configurable UI limits).
             if (val < ${oil_temperature_cold_c}) return cold;
             if (val < ${oil_temperature_cool_c}) return cool;
             if (val < ${oil_temperature_warn_c}) return normal;
             if (val < ${oil_temperature_hot_c}) return warning;
             return danger;
           } else if (mode == 19) { // 운행거리 (km)
             if (val <= 150) return normal;
             else if (val <= 300) return warning;
             return danger;
           }
           return normal;
         };
         const auto next = classify(val);
         // Share the stabilized color between readouts, icons and diagram leaders.
         // Warnings escalate immediately; recovery and low-temperature transitions get 1 degree of slack.
         const bool stabilize = mode == 1 || mode == 2 || mode == 5 || mode == 15 ||
                                mode == 17 || mode == 18 || mode == 26;
         if (!stabilize) return next;
         static lv_color_t previous[27]{};
         static bool seen[27]{};
         if (!std::isfinite(val)) {
           seen[mode] = false;
           return unavailable;
         }
         if (seen[mode] && !lv_color_eq(next, previous[mode])) {
           const bool escalation = lv_color_eq(next, danger) ||
               (lv_color_eq(next, warning) && !lv_color_eq(previous[mode], danger));
           // End the transmission warm-up hint exactly at its display reference.
           const bool warmup_reached = mode == 18 && val >= ${transmission_warmup_reference_c} &&
               lv_color_eq(previous[mode], cool) && lv_color_eq(next, normal);
           if (!escalation && !warmup_reached && (lv_color_eq(classify(val - 1.0f), previous[mode]) ||
                               lv_color_eq(classify(val + 1.0f), previous[mode]))) {
             return previous[mode];
           }
         }
         seen[mode] = true;
         previous[mode] = next;
         return next;
      }

