ble_client:
  - mac_address: ${mac_vlinker}
    id: obd_client
    on_connect:
      then:
        - lambda: id(tab5_motion_visible)(id(lbl_bluetooth), true, 165);
        - lambda: id(script_logs).execute("OBD BLE Connected");
    on_disconnect:
      then:
        - lambda: id(tab5_motion_visible)(id(lbl_bluetooth), false, 120);
        - script.stop: script_speed_expire
        - lambda: id(script_render_speed).execute(NAN);
        - lambda: |-
            id(g_dashboard_gear) = NAN;
            id(script_render_prnd).execute("-");
        - lambda: id(script_logs).execute("OBD BLE Disconnected");

ble_elm327:
  id: obd_elm
  ble_client_id: obd_client
  service_uuid: "18F0"
  rx_char_uuid: "2AF0"
  tx_char_uuid: "2AF1"
  init_commands:
    - "ATSP6"
    #- "ATCRA 7E8"
  tx_delay: 0

