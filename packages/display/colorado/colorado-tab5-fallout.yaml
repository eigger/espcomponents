            - button:
                <<: &service_tab { <<: *neutral_button, align: left_mid, height: 48, pad_all: 0, radius: 0, border_width: 0, shadow_width: 0, bg_opa: TRANSP, hidden: true }
                id: btn_service_trip_tab
                x: 300
                width: 120
                on_click:
                  - lambda: |-
                      if (!id(g_logs_visible) || !id(fn_service_allowed)() || id(g_service_tab) == 2) return;
                      id(script_sound_play).execute(3);
                      id(script_select_service_tab).execute(2);
                widgets:
                  - label: { id: lbl_service_trip_tab, align: center, text: "TRIP", text_font: font_terminal_boot, text_color: "${tab5_color_accent}" }
            - button:
                <<: *service_tab
                id: btn_service_setup_tab
                x: 436
                width: 156
