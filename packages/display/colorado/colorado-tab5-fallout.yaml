interval:
  # ── 경고 팝업 제어 (1초 주기) ──
  - interval: 1s
    then:
      - script.execute:
          id: script_dashboard_watchdog
          install: false
          disconnect: false
      - script.execute: script_sync_service_ui
      - script.execute: script_render_tpms
      - lambda: |-
          constexpr uint32_t warning = ${tab5_color_alert_warning};
          constexpr uint32_t danger = ${tab5_color_alert_danger};
          constexpr uint32_t notice = ${tab5_color_alert_notice};
          std::string msg;
          uint32_t color_hex = warning;
          const auto set_alert = [&](const char *text, uint32_t color) {
            msg = text;
            color_hex = color;
          };

          const auto live = [&](int mode, float value) {
            return id(g_dashboard_samples)[mode] != 0 ? value : NAN;
          };
          const float bat = live(7, id(car_battery).state);
          const float rpm = live(8, id(engine_rpm).state);
          const float coolant = live(5, id(engine_coolant_temperature).state);
          const float transmission = live(18, id(transmission_temperature).state);
          const float oil = live(14, id(engine_oil_pressure).state);
          const float oil_low_kpa = rpm >= 1000.0f ? ${oil_pressure_low_above_idle_kpa}f : ${oil_pressure_low_idle_kpa}f;
          const float speed = live(10, id(car_speed).state);
          const float co2 = live(13, id(id_scd40_co2).state);
          const float tvoc = live(12, id(id_sgp30_tvoc).state);
          const float acceleration = live(10, id(car_acceleration).state);
          const float load = live(9, id(engine_load).state);
          const float fuel = live(6, id(fuel_level).state);
          const bool engine_on = rpm >= 400.0f;
          const bool bat_valid = std::isfinite(rpm) && bat > 5.0f;
          const uint32_t now = esphome::millis();
          const bool connected = id(obd_client).connected();
          const uint32_t last_slip = id(g_dashboard_samples)[24];
          const uint32_t tcc_warning_at = id(g_tcc_slip_warning_at);
          const bool tcc_warning = connected && speed >= 60.0f &&
              last_slip != 0 && now - last_slip < 3000 &&
              tcc_warning_at != 0 && now - tcc_warning_at < 10000;
          const bool tcc_valid = connected && last_slip != 0 && now - last_slip < 3000 &&
              std::isfinite(id(transmission_tcc_slip).state);
          const float slip = tcc_valid ? id(transmission_tcc_slip).state : NAN;
          const auto slip_color = lv_color_hex(!tcc_valid ? ${tab5_color_text_muted}
              : tcc_warning ? ${tab5_color_status_warm} : ${tab5_color_accent});
          id(script_update_sensor_text).execute(id(lbl_tcc_slip), id(fn_readout_text)(slip, 0), slip_color, 24, 0);
          id(tab5_motion_bar)(id(bar_tcc_slip), tcc_valid ? std::min(std::fabs(slip), 300.0f) : NAN, 165);
          lv_obj_set_style_bg_color(id(bar_tcc_slip), slip_color, LV_PART_INDICATOR);
          id(tab5_motion_icon)(id(widget_img_tcc_slip), slip_color, 24, false);
          id(script_render_scan_status).execute(24, lv_color_hex(tcc_warning
              ? ${tab5_color_status_warm} : ${tab5_color_text_inactive}), id(lbl_tcc_slip), false);

          const uint8_t low_tires = id(g_tpms_low_tires);

          if (coolant > 110) {
            set_alert("엔진 과열!", danger);
          } else if (transmission > 130) {
            set_alert("변속기 과열!", danger);
          } else if (engine_on && (oil < oil_low_kpa || oil > ${oil_pressure_high_kpa}f)) {
            set_alert("오일 압력 위험!", danger);
          } else if (speed > 120) {
            set_alert("과속 위험!", danger);
          } else if (speed > 110) {
            set_alert("과속 주의!", warning);
          } else if (co2 > 2500) {
            set_alert("졸음 경고!", danger);
          } else if (co2 > 1500) {
            set_alert("졸음 주의!", warning);
          } else if (tvoc > 5000) {
            set_alert("가스 주의!", warning);
          } else if (tvoc > 3333) {
            set_alert("환기 필요!", warning);
          } else if (acceleration > 9.0) {
            set_alert("급가속!", danger);
          } else if (acceleration < -9.0) {
            set_alert("급감속!", danger);
          } else if (load > 95) {
            set_alert("엔진 과부하!", warning);
          } else if (!isnan(id(id_tab5_internal_temperature).state) && id(id_tab5_internal_temperature).state > 70) {
            set_alert("장치 과열!", danger);
          } else if (bat_valid && engine_on && bat < 12.8f && id(alt_low_since_ms) != 0 && (esphome::millis() - id(alt_low_since_ms) >= 180000)) {
            set_alert("발전기 미충전!", danger);
          } else if (bat_valid && engine_on && bat > 15.0f) {
            set_alert("배터리 과충전!", danger);
          } else if (bat_valid && !engine_on && bat < 11.8f) {
            set_alert("배터리 방전 위험!", danger);
          } else if (bat_valid && !engine_on && bat > 13.5f) {
            set_alert("시동전 전압 이상!", danger);
          } else if (bat_valid && engine_on && bat < 13.2f) {
            set_alert("충전전압 낮음!", warning);
          } else if (bat_valid && engine_on && bat > 14.85f) {
            set_alert("충전전압 높음!", warning);
          } else if (bat_valid && !engine_on && bat < 12.0f) {
            set_alert("배터리 전압 낮음!", warning);
          } else if (fuel < 8) {
            set_alert("연료 부족 (주유 시급)!", danger);
          } else if (fuel < 15) {
            set_alert("주유 필요!", warning);
          } else if (id(parking_info).has_state() && id(parking_info).state.length() > 0 && id(parking_info).state != "unknown" && id(parking_info).state != "off") {
            msg = id(parking_info).state;
            color_hex = notice;
          }

          if (low_tires && color_hex != danger) {
            const char *positions[] = {"앞왼쪽", "앞오른쪽", "뒤왼쪽", "뒤오른쪽"};
            msg = "타이어 저압";
            color_hex = warning;
            for (size_t i = 0; i < id(g_tpms_samples).size(); ++i) {
              if (low_tires & (1u << i)) {
                msg += " ";
                msg += positions[i];
              }
            }
          }

          const bool car_alert = !msg.empty();
          // 새 차량 경고 또는 주차 안내가 들어오면 다시 표시한다.
          static std::string last_car_msg = "";
          if (msg != last_car_msg) {
            if (car_alert) {
              id(alert_dismissed) = false;
            }
            last_car_msg = msg;
          }

          if (!car_alert) id(alert_dismissed) = false;
          const bool show_popup = car_alert && !id(alert_dismissed);
          const bool urgent = show_popup && color_hex != notice;
          id(tab5_motion_notice_active) = urgent;
          const char *level = color_hex == danger ? "경고" : color_hex == notice ? "안내" : "주의";

          static std::string last_logged_msg = "";
          if (msg != last_logged_msg) {
            if (!msg.empty()) {
              id(script_logs).execute("ALERT: " + msg);
            } else {
              id(script_logs).execute("ALERT: Cleared");
            }
            last_logged_msg = msg;
          }

          auto *popup = id(popup_alert);
          if (!show_popup) {
            id(tab5_motion_visible)(popup, false, 0);
            return;
          }

          const bool reopening = lv_obj_has_flag(popup, LV_OBJ_FLAG_HIDDEN);
          const auto color = lv_color_hex(color_hex);
          if (!reopening && msg == lv_label_get_text(id(lbl_alert_msg)) &&
              std::strcmp(level, lv_label_get_text(id(lbl_alert_title))) == 0 &&
              lv_color_eq(color, lv_obj_get_style_bg_color(popup, LV_PART_MAIN))) return;

          lv_label_set_text(id(lbl_alert_title), level);
          lv_label_set_text(id(lbl_alert_msg), msg.c_str());
          lv_obj_set_style_bg_color(popup, color, LV_PART_MAIN);
          id(tab5_motion_visible)(popup, true, urgent ? 0 : 185);
          if (urgent) {
            id(tab5_motion_fade)(popup, LV_OPA_COVER, LV_OPA_COVER, 0);
            id(tab5_motion_outline)(popup, 200);
          }

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
      icon: mdi:ip-outline
  - platform: template
    name: "Time"
    internal: true
    update_interval: 1s
    lambda: |-
      char buf[20];
      auto time = id(sntp_time).now();
      sprintf(buf, "%02d:%02d", time.hour, time.minute);
      return std::string(buf);
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_time
            text: !lambda return x;
  - platform: template
    name: "Date"
    internal: true
    update_interval: 1s
    lambda: |-
      char buf[20];
      auto time = id(sntp_time).now();
      int weekday = time.day_of_week - 1;
      const char* weekdays[] = {"일", "월", "화", "수", "목", "금", "토"};
      sprintf(buf, "%02d월 %02d일 (%s)", time.month, time.day_of_month, weekdays[weekday]);
      return std::string(buf);
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_date
            text: !lambda return x;
  - platform: template
    name: "Manufacturer Data"
    id: manufacturer_data
    icon: "mdi:package-variant-closed"
    internal: true
  - platform: template
    name: "Parking Info"
    id: parking_info
    icon: "mdi:car"
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x.length() > 0 && x != "unknown" && x != "off") {
              id(alert_dismissed) = false;
            }
            //id(ws_parking_info).publish_state(x);
#  - platform: ws_bridge
#    id: ws_parking_info
#    unique_id: parking_info
#    name: "Parking Info"
#    icon: "mdi:car"

  - platform: template
    name: "Template Engine Run Time"
    internal: true
    update_interval: 1s
    lambda: |-
      if (id(g_dashboard_samples)[11] == 0 || !std::isfinite(id(engine_run_time).state)) {
        return std::string("--:--");
      }
      char buf[20];
      int seconds = (int)id(engine_run_time).state;
      int minutes = seconds / 60;
      int hours = minutes / 60;
      if (hours > 0) sprintf(buf, "%d:%02d:%02d", hours, minutes % 60, seconds % 60);
      else sprintf(buf, "%02d:%02d", minutes, seconds % 60);
      return std::string(buf);
    on_value:
      then:
        - lambda: |-
            const auto color = id(fn_state_color)(x == "--:--" ? NAN : id(engine_run_time).state, 11);
            id(script_update_sensor_text).execute(id(lbl_engine_run_time), x, color, 11, 0);
            id(tab5_motion_icon)(id(widget_img_timer), color, 11, false);
  - platform: ble_elm327
    last_error:
      name: "ELM327 Last Error"
      id: id_elm_last_error

# Focus Drive dashboard, 1280 × 720 after rotation.
lvgl:
  id: lvgl_ui
  animations:
    - id: anim_crt_beam
      duration: 170ms
      timing: ease_in_out
      widgets:
        - id: obj_splash_crt
          min_width: { from: 2, to: 1120 }
          opa: { from: 0%, to: 85% }
    - id: anim_crt_raster
      duration: 250ms
      timing: ease_in_out
      widgets:
        - id: obj_splash_crt
          min_height: { from: 2, to: 550 }
          opa: { from: 85%, to: 0% }
    - id: anim_splash_terminal
      start_delay: 60ms
      duration: 390ms
      timing: ease_in_out
      widgets:
        - id: obj_splash_terminal
          translate_y: { from: 9, to: 0 }
          opa: { from: 0%, to: 100% }
    - id: anim_crt_scan
      start_delay: 170ms
      duration: 650ms
      widgets:
        - id: obj_splash_scan
          translate_y: { from: 0, to: 504 }
          opa: { from: 85%, to: 0% }

  top_layer:
    widgets:
      # ── 재시작 팝업 백드롭 ──
      - obj:
          id: obj_restart_backdrop
          hidden: true
          align: center
          width: 1280
          height: 720
          bg_color: "${tab5_color_shadow}"
          bg_opa: 50%
          border_width: 0
          radius: 0
          clickable: true

      # ── 재시작 팝업 모달 ──
      - obj:
          id: obj_restart_popup
          hidden: true
          align: center
          width: 520
          height: 310
          bg_color: "${tab5_color_card_bg}"
          border_width: 1
          border_color: "${tab5_color_card_border}"
          radius: 16
          pad_all: 20
          shadow_width: 30
          shadow_color: "${tab5_color_shadow}"
          shadow_opa: 50%
          widgets:
            - label:
                text: "시스템 재시작"
                align: top_mid
                y: 10
                text_color: "${tab5_color_accent}"
                text_font: notosans35
            - label:
                text: "시스템을 재시작하시겠습니까?"
                align: center
                y: -10
                text_color: "${tab5_color_text_primary}"
                text_font: notosans30
            - button:
                id: btn_restart_yes
                align: bottom_left
                x: 30
                y: -10
                width: 190
                height: 65
                <<: *danger_button
                on_click:
                  then:
                    - if:
                        condition:
                          lambda: 'return id(fn_service_allowed)();'
                        then:
                          - switch.turn_on: sw_restart
                widgets:
                  - label:
                      text: "예"
                      align: center
                      text_color: "${tab5_color_text_primary}"
                      text_font: notosans30
            - button:
                id: btn_restart_no
                align: bottom_right
                x: -30
                y: -10
                width: 190
                height: 65
                <<: *neutral_button
                on_click:
                  then:
                    - lambda: |-
                        id(tab5_motion_visible)(id(obj_restart_backdrop), false, 0);
                        id(tab5_motion_visible)(id(obj_restart_popup), false, 0);
                widgets:
                  - label:
                      text: "아니오"
                      align: center
                      text_color: "${tab5_color_text_primary}"
                      text_font: notosans30

      # ── 상단 헤더 (경고는 헤더 내부 최상단 레이어) ──
      - obj:
          id: obj_header
          hidden: true
          bg_color: "${tab5_color_panel_bg}"
          border_width: 0
          border_color: "${tab5_color_card_border}"
          align: top_mid
          pad_all: 0
          width: 1280
          height: 72
          x: 0
          y: 0
          widgets:
            - button:
                id: btn_logs_toggle
