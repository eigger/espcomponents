globals:
  - id: g_sound_volume
    type: float
    restore_value: yes
    initial_value: '0.4f'
  - id: g_sound_muted
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: g_sound_ready
    type: bool
    initial_value: 'false'
  - id: g_sound_started
    type: uint32_t
    initial_value: '0'
  - id: g_sound_duration
    type: uint32_t
    initial_value: '0'
  - id: g_sound_priority
    type: int
    initial_value: '0'
  - id: g_sound_popup_key
    type: int
    initial_value: '-1'
  # Per-link debounce and short, state-aware notification queue.
  # Links: 0 = Wi-Fi, 1 = OBD BLE, 2 = fresh GPS position fix.
  - id: fn_sound_link
    type: "int (*)(unsigned, bool, uint32_t, bool, bool)"
    initial_value: |-
      +[](unsigned link, bool connected, uint32_t now, bool enabled, bool can_play) -> int {
        struct Link {
          int stable = -1;
          int candidate = -1;
          int pending = -1;
          uint32_t changed = 0;
          uint32_t queued = 0;
        };
        static std::array<Link, 3> links{};
        if (link >= links.size()) return -1;
        auto &state = links[link];
        const int observed = connected ? 1 : 0;
        if (state.candidate != observed) {
          state.candidate = observed;
          state.changed = now;
          state.pending = -1;  // Never announce a connection that has already changed.
        }
        const uint32_t debounce = link == 2 ? 3000 : 750;
        if (state.stable != observed && now - state.changed >= debounce) {
          const int previous = state.stable;
          state.stable = observed;
          if (enabled && (previous >= 0 || connected)) {
            state.pending = observed;
            state.queued = now;
          }
        }
        // Muting/OTA updates the baseline without replaying old events later.
        if (!enabled || (state.pending >= 0 && now - state.queued > 5000))
          state.pending = -1;
        if (!can_play || state.pending < 0) return -1;
        const int cue = 9 + static_cast<int>(link) * 2 + (state.pending ? 0 : 1);
        state.pending = -1;
        return cue;
      }
  # Captureless function pointer keeps alert state local without an external header.
  - id: fn_sound_alert
    type: "int (*)(const char *, unsigned, uint8_t, uint32_t)"
    initial_value: |-
      +[](const char *operation, unsigned key, uint8_t severity, uint32_t now) -> int {
        // All state stays inside this YAML function; no custom include is needed.
        class SoundAlerts {
         public:
          constexpr void begin() { for (auto &s : states_) { s.seen = false; s.observed = 0; } }
          constexpr void observe(unsigned key, uint8_t severity, uint32_t now) {
            if (key >= states_.size()) return;
            auto &s = states_[key];
            if (!s.active) { s = {}; s.active = true; }
            if (severity > s.observed) s.observed = severity;
            s.seen = true;
            s.last_seen = now;
          }
          constexpr void end(uint32_t now) {
            for (auto &s : states_) {
              if (s.seen) {
                // A brief danger/caution oscillation must not restart the sound each poll.
                // Only a previously unseen severity in this active episode bypasses cooldown.
                if (s.observed > s.peak_severity) {
                  s.acknowledged = false; s.played = false; s.peak_severity = s.observed;
                }
                s.severity = s.observed;
              } else if (s.active && uint32_t(now - s.last_seen) >= 5000) s = {};
            }
          }
          constexpr int pending(uint32_t now) const {
            int best = -1;
            for (unsigned i = 0; i < states_.size(); ++i) {
              const auto &s = states_[i];
              const uint32_t interval = s.severity >= 2 ? 20000 : 60000;
              if (!s.active || !s.seen || s.acknowledged ||
                  (s.played && uint32_t(now - s.last_played) < interval)) continue;
              if (best < 0 || s.severity > states_[best].severity ||
                  (s.severity == states_[best].severity && !s.played && states_[best].played)) best = i;
            }
            return best;
          }
          constexpr uint8_t severity(unsigned key) const { return key < states_.size() ? states_[key].severity : 0; }
          // One sound covers all currently pending conditions of equal/lower severity.
          // This avoids a sequence of redundant alarms when several sensors warn at once.
          constexpr void played(uint8_t severity, uint32_t now) {
            for (auto &s : states_) if (s.active && s.seen && s.severity <= severity) {
              s.played = true; s.last_played = now;
            }
          }
          constexpr void acknowledge(unsigned key) { if (key < states_.size()) states_[key].acknowledged = true; }
         private:
          struct State {
            bool active{false}, seen{false}, played{false}, acknowledged{false};
            uint8_t severity{0}, observed{0}, peak_severity{0};
            uint32_t last_seen{0}, last_played{0};
          };
          std::array<State, 32> states_{};
        };
        static SoundAlerts alerts;
        if (std::strcmp(operation, "begin") == 0) alerts.begin();
        else if (std::strcmp(operation, "observe") == 0) alerts.observe(key, severity, now);
        else if (std::strcmp(operation, "end") == 0) alerts.end(now);
        else if (std::strcmp(operation, "pending") == 0) return alerts.pending(now);
        else if (std::strcmp(operation, "severity") == 0) return alerts.severity(key);
        else if (std::strcmp(operation, "played") == 0) alerts.played(severity, now);
        else if (std::strcmp(operation, "acknowledge") == 0) alerts.acknowledge(key);
        else return -1;
        return 0;
      }
  - id: alert_dismissed
    type: bool
    initial_value: 'false'
  - id: g_logs
    type: std::vector<std::string>
    restore_value: no
    initial_value: ''
  - id: g_initial_odometer
    type: float
    initial_value: '-1.0'
  - id: g_roll_offset
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_pitch_offset
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_logs_visible
    type: bool
    initial_value: 'false'
  - id: g_service_setup
    type: bool
    initial_value: 'false'
  - id: g_log_unread
    type: uint32_t
    initial_value: '0'
  - id: g_log_highlight_pending
    type: bool
    initial_value: 'false'
  - id: g_jaalee_last_seen
    type: "std::array<uint32_t, 2>"
    initial_value: 'std::array<uint32_t, 2>{}'
  - id: g_jaalee_detail_bed
    type: bool
    initial_value: 'false'
  - id: g_dashboard_gear
    type: float
    initial_value: 'NAN'
  - id: g_dashboard_samples
    type: "std::array<uint32_t, 27>"
    initial_value: 'std::array<uint32_t, 27>{}'
  - id: g_acceleration_previous_speed
    type: float
    initial_value: 'NAN'
  - id: g_acceleration_previous_ms
    type: uint32_t
    initial_value: '0'
  - id: g_acceleration_sample_ms
    type: uint32_t
    initial_value: '0'
  - id: g_tcc_slip_warning_at
    type: uint32_t
    initial_value: '0'
  - id: g_tpms_samples
    type: "std::array<uint32_t, 4>"
    initial_value: 'std::array<uint32_t, 4>{}'
  - id: g_tpms_show_all
    type: bool
    initial_value: 'false'
  - id: g_tpms_low_tires
    type: uint8_t
    initial_value: '0'
  # ── 발전기 저전압 지속시간 추적 (RVC 연비모드 오탐 방지: 순간전압이 아닌 지속시간으로 실고장 판정)
  - id: alt_low_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # ── OTA 업데이트 상태 추적 ──
  - id: g_latest_version
    type: std::string
    initial_value: '""'
  - id: g_update_available
    type: bool
    initial_value: 'false'
  - id: g_update_alert_dismissed
    type: bool
    initial_value: 'false'
  # 현재 표시 중인 팝업이 차량 경고가 아닌 업데이트 안내인지 (닫기 클릭 시 어느 dismiss 플래그를 세울지 판단)
  - id: g_alert_is_update
    type: bool
    initial_value: 'false'
  - id: g_updating
    type: bool
    initial_value: 'false'
  - id: g_ota_ui_active
    type: bool
    initial_value: 'false'
  - id: g_ota_backlight_was_on
    type: bool
    initial_value: 'true'
  - id: g_ota_backlight_brightness
    type: float
    initial_value: '0.4f'
  - id: g_ota_lvgl_was_paused
    type: bool
    initial_value: 'false'
  # 수동 "업데이트 확인" 진행 중 여부 (버튼 중복 클릭/중복 요청 방지)
  - id: g_checking
    type: bool
    initial_value: 'false'
  - id: fn_sample_live
    type: "float (*)(int, float, uint32_t)"
    initial_value: |-
      +[](int mode, float value, uint32_t timeout) -> float {
        if (mode < 0 || mode >= 27 || !std::isfinite(value)) return NAN;
        const uint32_t sampled_at = id(g_dashboard_samples)[mode];
        return sampled_at && esphome::millis() - sampled_at < timeout ? value : NAN;
      }
  - id: fn_service_allowed
    type: "bool (*)()"
    initial_value: |-
      +[]() {
        // Allow access before the first speed sample. A known moving speed still locks the menu,
        // including when that last reading is stale or BLE has disconnected.
        const float speed = id(car_speed).state;
        return !std::isfinite(speed) || speed == 0.0f;
      }
  - id: g_ambient_sample_ms
    type: uint32_t
    initial_value: '0'
  - id: g_warmup_last_runtime
    type: float
    initial_value: '-1.0f'
  - id: g_warmup_completed
    type: "std::array<bool, 2>"
    initial_value: 'std::array<bool, 2>{}'
  - id: fn_warmup_grace_s
    type: "float (*)(float, int)"
    initial_value: |-
      +[](float ambient, int mode) -> float {
        const float base = mode == 5 ? ${coolant_warmup_base_s} : ${transmission_warmup_base_s};
        const float maximum = mode == 5 ? ${coolant_warmup_max_s} : ${transmission_warmup_max_s};
        // Missing / stale / implausible ambient uses the longest grace period.
        if (!std::isfinite(ambient) || ambient < -40.0f || ambient > 60.0f) return maximum;
        const float extension = std::clamp(
            (${warmup_ambient_reference_c} - ambient) / ${warmup_ambient_span_c}, 0.0f, 1.0f);
        return base + (maximum - base) * extension;
      }
  - id: fn_warmup_phase
    type: "int (*)(int)"
    initial_value: |-
      +[](int mode) -> int {
        // 0 = unknown / engine off; 1 = warm-up display window; 2 = window elapsed.
        // These phases are display timing only, never a driving-readiness verdict.
        if (mode != 5 && mode != 18) return 0;
        const float rt = id(fn_sample_live)(11, id(engine_run_time).state, 20000);
        const float rpm = id(fn_sample_live)(8, id(engine_rpm).state, 8000);
        if (!std::isfinite(rt) || rt < 0.0f || !(rpm >= 400.0f)) return 0;
        const size_t index = mode == 5 ? 0 : 1;
        if (id(g_warmup_completed)[index]) return 2;
        const uint32_t sampled_at = id(g_ambient_sample_ms);
        const float ambient = sampled_at && esphome::millis() - sampled_at < 90000
            ? id(ambient_air_temperature).state : NAN;
        if (rt < id(fn_warmup_grace_s)(ambient, mode)) return 1;
        // Do not re-enter warm-up when ambient changes or its sample expires.
        id(g_warmup_completed)[index] = true;
        return 2;
      }
  - id: fn_readout_text
    type: "std::string (*)(float, int)"
    initial_value: |-
      +[](float value, int decimals) -> std::string {
        if (!std::isfinite(value)) return "--";
        char text[16];
        snprintf(text, sizeof(text), "%.*f", decimals, value);
        return text;
      }
  # ── 계기판 상태 색상 ──
  - id: fn_state_color
    type: "std::function<lv_color_t(float, int)>"
    initial_value: |-
      [](float val, int mode) -> lv_color_t {
         const auto unavailable   = lv_color_hex(${tab5_color_text_muted});
         const auto cold    = lv_color_hex(${tab5_color_status_cold});
         const auto cool    = lv_color_hex(${tab5_color_status_cool});
         const auto normal  = lv_color_hex(${tab5_color_text_primary});
         const auto active  = lv_color_hex(${tab5_color_accent});
         const auto danger  = lv_color_hex(${tab5_color_status_hot});
         const auto warning = lv_color_hex(${tab5_color_status_warm});

         const auto classify = [&](float val) -> lv_color_t {
           if (!std::isfinite(val)) return unavailable;

           if (mode == 1 || mode == 2) { // 실내 온도
             if (val < 10)  return cold;
             else if (val < 18) return cool;
             else if (val <= 26) return normal;
             else if (val <= 31) return warning;
             return danger;
           } else if (mode == 3) { // 실내 습도
             if (val < 25) return danger;
             else if (val < 40) return warning;
             else if (val <= 60) return normal;
             else if (val <= 75) return cool;
             return cold;
           } else if (mode == 15) { // 적재함 온도
             if (val < 0)  return cold;
             else if (val < 10) return cool;
             else if (val <= 30) return normal;
             else if (val <= 40) return warning;
             return danger;
           } else if (mode == 16) { // 적재함 습도
             if (val < 15) return danger;
             else if (val < 30) return warning;
             else if (val <= 70) return normal;
             else if (val <= 85) return cool;
             return cold;
           } else if (mode == 5) { // 냉각수
             if (val < 60) {
               // 외기온에 따른 유예시간 이후 저온 정보만 표시 (고장 판정 아님).
               return id(fn_warmup_phase)(mode) == 2 ? cold : normal;
             }
             else if (val < 95) return normal;
             else if (val < 110) return warning;
             return danger;
           } else if (mode == 6) { // 연료
             if (val > 30) return active;
             else if (val > 15) return warning;
             return danger;
           } else if (mode == 7 || mode == 20) { // 전압과 충전율/잔량 카드의 공통 기준
             const bool is_soc = mode == 20;
             const float voltage = is_soc ? id(fn_sample_live)(7, id(car_battery).state, 35000) : val;
             if (isnan(voltage) || voltage <= 5.0f) return unavailable;
             const auto normal_color = is_soc ? active : normal;
             const float rpm = id(fn_sample_live)(8, id(engine_rpm).state, 8000);
             if (!std::isfinite(rpm)) return unavailable;
             const bool engine_on = rpm >= 400.0f;
             if (engine_on) {
               if (voltage < 12.8f) {
                 // RVC 연비모드의 순간 저전압과 3분 이상 지속되는 미충전을 구분한다.
                 const bool sustained = id(alt_low_since_ms) != 0 &&
                                        esphome::millis() - id(alt_low_since_ms) >= 180000;
                 return sustained ? danger : warning;
               }
               if (voltage < 13.2f) return warning;
               if (voltage <= 14.85f) return normal_color;
               return voltage <= 15.0f ? warning : danger;
             }
             if (voltage < 11.8f) return danger;
             if (voltage < 12.0f) return warning;
             return voltage <= 13.5f ? normal_color : danger;
           } else if (mode == 8) { // RPM
             if (val > 3500) return danger;
             else if (val > 2500) return warning;
             return active;
           } else if (mode == 9) { // 엔진 부하 %
             if (val > 95) return danger;
             else if (val > 75) return warning;
             return active;
           } else if (mode == 10) { // Speed (분리 수정)
             if (val > 120) return danger;
             else if (val > 110) return warning;
             else if (val > 100) return active;
             return normal;
           } else if (mode == 11) { // 운행시간 (초)
             if (val < 3600) return normal;
             if (val < 7200) return warning;
             return danger;
           } else if (mode == 12) { // TVOC — 경고 팝업 기준(3333=환기 필요)과 일치, 팝업이 red를 안 쓰므로 카드도 orange까지만
             if (val > 3333) return warning;
             return normal;
           } else if (mode == 13) { // CO2 — 경고 팝업 기준과 일치 (1500=졸음 주의, 2500=졸음 경고)
             if (val > 2500) return danger;
             else if (val > 1500) return warning;
             return normal;
           } else if (mode == 14) { // 오일 압력 (kPa)
             const float rpm = id(fn_sample_live)(8, id(engine_rpm).state, 8000);
             if (!(rpm >= 400.0f)) return unavailable;
             const bool above_idle = rpm >= 1000.0f;
             const float low_kpa = above_idle ? ${oil_pressure_low_above_idle_kpa}f : ${oil_pressure_low_idle_kpa}f;
             const float warn_kpa = above_idle ? ${oil_pressure_warn_above_idle_kpa}f : ${oil_pressure_warn_idle_kpa}f;
             if (val < low_kpa || val > ${oil_pressure_high_kpa}f) return danger;
             if (val < warn_kpa) return warning;
             return active;
           } else if (mode == 17) { // 흡기온도 — 엔진룸 흡기 공기 기준
             if (val <= 45) return normal;
             else if (val <= 60) return warning;
             return danger;
           } else if (mode == 18) { // Colorado 3.6L / 8L45 sump temperature.
             if (val < ${transmission_warmup_reference_c}) {
               // User-selected display reference; NOT a minimum operating temperature.
               // Cool is an early warm-up hint only; never flag persistent low TFT.
               return id(fn_warmup_phase)(mode) == 1 ? cool : normal;
             }
             else if (val <= ${transmission_temperature_warn_c}) return normal;
             else if (val <= ${transmission_temperature_hot_c}) return warning;
             return danger;
           } else if (mode == 24) { // TCC slip: large slip alone is normal when unlocked.
             const uint32_t warned_at = id(g_tcc_slip_warning_at);
             return warned_at && esphome::millis() - warned_at < 10000 ? warning : active;
           } else if (mode == 26) { // Calculated engine oil temperature (configurable UI limits).
             if (val < ${oil_temperature_cold_c}) return cold;
             if (val < ${oil_temperature_cool_c}) return cool;
             if (val < ${oil_temperature_warn_c}) return normal;
             if (val < ${oil_temperature_hot_c}) return warning;
             return danger;
           } else if (mode == 19) { // 운행거리 (km)
             if (val <= 150) return normal;
             else if (val <= 300) return warning;
             return danger;
           }
           return normal;
         };
         const auto next = classify(val);
         // Share the stabilized color between readouts, icons and diagram leaders.
         // Warnings escalate immediately; recovery and low-temperature transitions get 1 degree of slack.
         const bool stabilize = mode == 1 || mode == 2 || mode == 5 || mode == 15 ||
                                mode == 17 || mode == 18 || mode == 26;
         if (!stabilize) return next;
         static lv_color_t previous[27]{};
         static bool seen[27]{};
         if (!std::isfinite(val)) {
           seen[mode] = false;
           return unavailable;
         }
         if (seen[mode] && !lv_color_eq(next, previous[mode])) {
           const bool escalation = lv_color_eq(next, danger) ||
               (lv_color_eq(next, warning) && !lv_color_eq(previous[mode], danger));
           // End the transmission warm-up hint exactly at its display reference.
           const bool warmup_reached = mode == 18 && val >= ${transmission_warmup_reference_c} &&
               lv_color_eq(previous[mode], cool) && lv_color_eq(next, normal);
           if (!escalation && !warmup_reached && (lv_color_eq(classify(val - 1.0f), previous[mode]) ||
                               lv_color_eq(classify(val + 1.0f), previous[mode]))) {
             return previous[mode];
           }
         }
         seen[mode] = true;
         previous[mode] = next;
         return next;
      }

binary_sensor:
  - platform: gpio
    id: id_gps_pps
    name: "GPS PPS"
    pin:
      number: GPIO16
      mode:
        input: true
        pulldown: true
    internal: true

sensor:
  - platform: jaalee_jht
    mac_address: ${mac_cabin_jht}
    temperature:
      id: "id_cabin_temperature"
      name: "Cabin Temperature"
      internal: true
      on_value:
        then:
          - lambda: |-
              if (std::isfinite(x)) id(g_jaalee_last_seen)[0] = esphome::millis();
              id(script_render_readout).execute(id(lbl_cabin_temperature), id(widget_img_cabin_temp), x, 2, 1, 155);
    humidity:
      id: "id_cabin_humidity"
      name: "Cabin Humidity"
      internal: true
      on_value:
        then:
          - lambda: id(script_render_readout).execute(id(lbl_cabin_humidity), id(widget_img_cabin_humidity), x, 3, 1, 155);
    battery_level:
      id: "id_cabin_battery_level"
      name: "Cabin Battery Level"
      internal: true
  - platform: jaalee_jht
    mac_address: ${mac_bed_jht}
    temperature:
      id: "id_bed_temperature"
      name: "Bed Temperature"
      internal: true
      on_value:
        then:
          - lambda: |-
              if (std::isfinite(x)) id(g_jaalee_last_seen)[1] = esphome::millis();
              id(script_render_readout).execute(id(lbl_bed_temperature), id(widget_img_bed_temp), x, 15, 1, 155);
    humidity:
      id: "id_bed_humidity"
      name: "Bed Humidity"
      internal: true
      on_value:
        then:
          - lambda: id(script_render_readout).execute(id(lbl_bed_humidity), id(widget_img_bed_humidity), x, 16, 1, 155);
    battery_level:
      id: "id_bed_battery_level"
      name: "Bed Battery Level"
      internal: true
  - platform: ble_elm327
    reconnect_count:
      name: "ELM327 Reconnects"
      id: id_elm_reconnect_count
    timeout_count:
      name: "ELM327 Timeouts"
      id: id_elm_timeouts
    error_count:
      name: "ELM327 Error Responses"
      id: id_elm_error_responses
    no_data_count:
      name: "ELM327 NO DATA Responses"
      id: id_elm_no_data_responses
    write_failure_count:
      name: "ELM327 Write Failures"
      id: id_elm_write_failures
    response_time:
      name: "ELM327 Response Time"
      id: id_elm_response_time
  - platform: ble_elm327
    id: "engine_run_time"
    # Restore functional OBD addressing and automatic receive filtering after TPMS.
    pre_commands: &obd_default_pre_commands ["ATSH 7DF", "ATCRA"]
    name: "Engine Run Time"
    preset: run_time
    update_interval: 5s
    internal: true
    on_value:
      then:
        - lambda: |-
            const bool valid = std::isfinite(x) && x >= 0.0f;
            id(g_dashboard_samples)[11] = valid ? esphome::millis() : 0;
            if (valid) {
              if (x < id(g_warmup_last_runtime) || x == 0.0f) id(g_warmup_completed).fill(false);
              id(g_warmup_last_runtime) = x;
            }
  - platform: ble_elm327
    id: "engine_coolant_temperature"
    pre_commands: *obd_default_pre_commands
    name: "Engine Coolant Temperature"
    preset: coolant_temp
    update_interval: 10s
    internal: true
    on_value:
      then:
        - lambda: id(script_render_readout).execute(id(lbl_engine_coolant_temperature), id(widget_img_coolant), x, 5, 0, 0);
  - platform: ble_elm327
    id: "fuel_level"
    pre_commands: *obd_default_pre_commands
    name: "Fuel Level"
    preset: fuel_level
    update_interval: 30s
    internal: true
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - delta: 0.5
    on_raw_value:
      then:
        - lambda: |-
            // A valid response can be suppressed by the delta filter.
            if (std::isfinite(x) && std::isfinite(id(fuel_level).state)) {
              if (id(g_dashboard_samples)[6] == 0) {
                id(script_render_gauge).execute(id(lbl_fuel_level), id(bar_fuel), id(widget_img_fuel),
                                                id(fuel_level).state, 6, 400, false);
              } else {
                id(g_dashboard_samples)[6] = esphome::millis();
              }
            }
    on_value:
      then:
        - lambda: |-
            id(script_render_gauge).execute(id(lbl_fuel_level), id(bar_fuel), id(widget_img_fuel), x, 6, 400, false);
  - platform: ble_elm327
    id: "gm_fuel_level_liters"
    pre_commands: *obd_default_pre_commands
    name: "Fuel Level Liters"
    preset: gm_fuel_level_liters
    update_interval: 30s
    internal: true
  - platform: ble_elm327
    id: "throttle"
    pre_commands: *obd_default_pre_commands
    name: "Throttle Position"
    preset: throttle
    update_interval: 1s
    internal: true
    on_value:
      - lambda: 'id(g_dashboard_samples)[25] = std::isfinite(x) ? esphome::millis() : 0;'
  - platform: ble_elm327
    id: "intake_air_temperature"
    pre_commands: *obd_default_pre_commands
    name: "Intake Air Temperature"
    preset: intake_air_temp
    update_interval: 10s
    internal: true
    on_value:
      then:
        - lambda: id(script_render_readout).execute(id(lbl_intake_temp_display), id(widget_img_intake), x, 17, 0, 0);
  - platform: ble_elm327
    id: "ambient_air_temperature"
    pre_commands: *obd_default_pre_commands
    name: "Ambient Air Temperature"
    preset: ambient_temp
    update_interval: 30s
    internal: true
    on_value:
      then:
        - lambda: |-
            id(g_ambient_sample_ms) = std::isfinite(x) && x >= -40.0f && x <= 60.0f
                ? esphome::millis() : 0;
  - platform: ble_elm327
    id: "car_battery"
    pre_commands: *obd_default_pre_commands
    name: "Car Battery"
    preset: battery_voltage
    update_interval: 10s
    internal: true
    on_value:
      then:
        - lambda: |-
            id(script_render_readout).execute(id(lbl_car_battery), id(widget_img_battery),
                                              x <= 5.0f ? NAN : x, 7, 1, 0);
        - script.execute: script_refresh_engine_dependents

  - platform: template
    id: "car_battery_soc"
    name: "Car Battery SOC"
    icon: mdi:battery-charging
    unit_of_measurement: "%"
    state_class: "measurement"
    accuracy_decimals: 0
    internal: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            const float rpm = id(fn_sample_live)(8, id(engine_rpm).state, 8000);
            const bool engine_on = rpm >= 400.0f;
            const char *title = !std::isfinite(rpm) ? "배터리" : engine_on ? "충전율" : "잔량";
            const bool changed = std::strcmp(lv_label_get_text(id(lbl_battery_title)), title) != 0;
            if (changed) lv_label_set_text(id(lbl_battery_title), title);
            id(script_render_gauge).execute(id(lbl_battery_soc), id(bar_battery_soc), id(widget_img_battery_soc),
                                            x, 20, 375, changed && engine_on);
            // A derived value must retain the voltage sample's age, not this redraw's time.
            id(g_dashboard_samples)[20] = std::isfinite(x) ? id(g_dashboard_samples)[7] : 0;
  - platform: ble_elm327
    id: "engine_rpm"
    pre_commands: *obd_default_pre_commands
    name: "Engine RPM"
    preset: rpm
    update_interval: 1s
    internal: true
    on_value:
      then:
        - lambda: |-
            id(script_render_gauge).execute(id(lbl_engine_rpm_left), id(bar_engine_rpm), id(widget_img_rpm), x, 8, 200, false);
        - script.execute: script_refresh_engine_dependents
  - platform: ble_elm327
    id: "engine_load"
    pre_commands: *obd_default_pre_commands
    name: "Engine Load"
    preset: engine_load
    update_interval: 1s
    internal: true
    on_value:
      then:
        - lambda: |-
            id(script_render_gauge).execute(id(lbl_engine_load_left), id(bar_engine_load), id(widget_img_load), x, 9, 220, false);
  - platform: ble_elm327
    id: "car_speed"
    pre_commands: *obd_default_pre_commands
    name: "Car Speed"
    preset: speed
    update_interval: 1s
    internal: true
    filters:
      - lambda: |-
          if (x >= 255) return {};
          return x;
    on_value:
      then:
        - lambda: |-
            if (!id(obd_client).connected()) return;
            id(script_render_speed).execute(x);
            if (std::isfinite(x)) id(script_speed_expire).execute();
            else id(script_speed_expire).stop();
        - lambda: id(script_update_acceleration).execute(x);

  - platform: template
    id: "car_acceleration"
    name: "Car Acceleration"
    icon: mdi:speedometer
    state_class: "measurement"
    unit_of_measurement: km/h/s
    update_interval: never
    internal: true

  - platform: ble_elm327
    id: "odometer"
    pre_commands: *obd_default_pre_commands
    name: "Odometer"
    preset: odometer
    update_interval: 30s
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!isnan(x) && x > 0) {
              if (id(g_initial_odometer) < 0) {
                id(g_initial_odometer) = x;
              }
              float trip = x - id(g_initial_odometer);
              id(trip_distance).publish_state(trip);
            }
  - platform: template
    id: "trip_distance"
    name: "Trip Distance"
    icon: mdi:map-marker-distance
    state_class: "measurement"
    unit_of_measurement: "km"
    device_class: "distance"
    accuracy_decimals: 0
    internal: true
    update_interval: never
    on_value:
      then:
        - lambda: id(script_render_readout).execute(id(lbl_trip_distance), id(widget_img_trip), x, 19, 0, 0);

  - platform: ble_elm327
    id: "gear_position"
    pre_commands: *obd_default_pre_commands
    name: "Gear Position"
    preset: gm_current_gear
    update_interval: 1s
    internal: true
    on_value:
      then:
        - lambda: |-
            id(g_dashboard_gear) = x;
            id(g_dashboard_samples)[21] = std::isfinite(x) ? esphome::millis() : 0;
            id(script_render_gear).execute(true);

  - platform: ble_elm327
    id: "prnd_status_alt"
    pre_commands: *obd_default_pre_commands
    name: "PRND Status"
    preset: gm_prnd_status_alt
    update_interval: 1s
    internal: true
    on_value:
      then:
        - lambda: |-
            const char *text = "-";
            id(g_dashboard_samples)[22] = std::isfinite(x) ? esphome::millis() : 0;
            if (std::isfinite(x)) {
              switch ((int)x) {
                case 8: text = "P"; break;
                case 7: text = "R"; break;
                case 6: text = "N"; break;
                case 18: text = "D"; break;
                default: text = "L"; break;
              }
            }
            id(script_render_prnd).execute(text);

  - platform: ble_elm327
    id: "actual_torque"
    pre_commands: *obd_default_pre_commands
    name: "Actual Torque"
    preset: actual_torque
    update_interval: 10s
    internal: true

