    size: 22
    glyphs: "냉각수오일온도미션실내적재함흡기전압력습COTV2"
  - file: "gfonts://Noto+Sans+KR"
    id: font_dashboard_gauge_label
    bpp: 4
    size: 24
    glyphs: "RPM엔진부하TC SLI배터리충전율잔량연료"
