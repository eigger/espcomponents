          if (!available) return;
          const char *chart_end = live ? "현재" : "종료";
          if (std::strcmp(lv_label_get_text(id(lbl_trip_chart_end)), chart_end) != 0)
            lv_label_set_text(id(lbl_trip_chart_end), chart_end);
          const uint32_t ended_at = id(g_live_trip_ended_at);
          const float elapsed = live
              ? ((ended_at ? ended_at : esphome::millis()) - id(g_live_trip_started_at)) / 1000.0f
              : saved_elapsed;
          char text[48];
          const auto seconds = static_cast<unsigned>(elapsed);
          snprintf(text, sizeof(text), "%02u:%02u:%02u", seconds / 3600, (seconds / 60) % 60, seconds % 60);
          lv_label_set_text(id(lbl_report_duration), text);
          id(script_render_trip_distance).execute(km, elapsed);
          if (std::isfinite(min_voltage) && std::isfinite(max_voltage)) {
            snprintf(text, sizeof(text), "%.1f - %.1f V", min_voltage, max_voltage);
          } else {
            snprintf(text, sizeof(text), "-- V");
          }
          lv_label_set_text(id(lbl_report_voltage), text);
          const auto set_peak = [&](lv_obj_t *label, const char *name, float peak) {
            char caption[64];
            if (std::isfinite(peak)) {
              snprintf(caption, sizeof(caption), "%s 최고 %.0f °C", name, peak);
            } else {
              snprintf(caption, sizeof(caption), "%s 최고 --", name);
            }
            lv_label_set_text(label, caption);
          };
          set_peak(id(lbl_report_coolant), "냉각수", coolant);
          set_peak(id(lbl_report_engine_oil), "엔진오일", engine_oil);
          set_peak(id(lbl_report_transmission), "미션오일", transmission);
          const struct { lv_obj_t *label; const char *prefix; const char *unit; } ranges[] = {
            {id(lbl_trip_cabin_temp), "실내 ", " °C"},
            {id(lbl_trip_bed_temp), "적재함 ", " °C"},
            {id(lbl_trip_cabin_humidity), "실내 ", "%"},
            {id(lbl_trip_bed_humidity), "적재함 ", "%"},
            {id(lbl_trip_co2), "", " ppm"},
            {id(lbl_trip_tvoc), "", " ppb"},
          };
          const auto &environment_ranges = live ? id(g_live_trip_environment_ranges) : id(g_trip_environment_ranges);
          for (size_t i = 0; i < std::size(ranges); ++i) {
            const auto &[low, high] = environment_ranges[i];
            const auto &range = ranges[i];
            if (low != UINT16_MAX && high != UINT16_MAX) {
              snprintf(text, sizeof(text), "%s%d–%d%s", range.prefix, low - 100, high - 100, range.unit);
            } else {
              snprintf(text, sizeof(text), "%s--%s", range.prefix, range.unit);
            }
            lv_label_set_text(range.label, text);
          }
          id(script_render_trip_charts).execute(seconds);
          id(g_trip_replay_available) = !live && seconds > 0 && !lv_obj_is_hidden(id(obj_trip_chart));
          if (id(g_trip_replay_available)) id(script_trip_replay).execute(1);

  - id: script_render_trip_charts
    parameters:
      elapsed_s: uint32_t
    then:
      - lambda: |-
          constexpr uint16_t missing = UINT16_MAX;
          const bool live = id(g_trip_in_progress);
          const auto &history = live ? id(g_live_trip_history) : id(g_trip_history);
          const auto &sample_s = live ? id(g_live_trip_history_sample_s) : id(g_trip_history_sample_s);
          const uint32_t step_s = live ? id(g_live_trip_step_s) : id(g_trip_history_step_s);
          const size_t bucket_count = step_s ? std::min<size_t>(history.size(), elapsed_s / step_s + 1) : 0;
          const struct {
            lv_obj_t *parent;
            size_t first;
            size_t count;
            bool powertrain;
            std::array<uint32_t, 3> colors;
          } plots[] = {
            {id(obj_trip_chart), 0, 3, true, {${tab5_color_accent}, ${tab5_color_status_warm}, ${tab5_color_status_cold}}},
            {id(obj_trip_env_temp), 3, 2, false, {${tab5_color_accent}, ${tab5_color_status_cold}}},
            {id(obj_trip_env_humidity), 5, 2, false, {${tab5_color_accent}, ${tab5_color_status_cold}}},
            {id(obj_trip_env_co2), 7, 1, false, {${tab5_color_accent}}},
            {id(obj_trip_env_tvoc), 8, 1, false, {${tab5_color_status_warm}}},
          };
          static struct {
            lv_obj_t *chart;
            std::array<lv_chart_series_t *, 3> series;
          } widgets[std::size(plots)]{};

          for (size_t index = 0; index < std::size(plots); ++index) {
            const auto &plot = plots[index];
            auto &widget = widgets[index];
            int low = UINT16_MAX, high = -100;
            for (size_t i = 0; i < bucket_count; ++i) {
              for (size_t channel = 0; channel < plot.count; ++channel) {
                const size_t sensor = plot.first + channel;
                const uint16_t value = history[i][sensor];
                if (value == missing || sample_s[i][sensor] > elapsed_s) continue;
                low = std::min(low, value - 100);
                high = std::max(high, value - 100);
              }
            }
            const bool available = low <= high;
            if (!available) {
              lv_obj_set_hidden(plot.parent, true);
              if (plot.powertrain) lv_obj_set_hidden(id(lbl_trip_chart_empty), false);
              continue;
            }
            if (plot.powertrain) {
              low = static_cast<int>(std::floor(low / 10.0f)) * 10 - 5;
              high = static_cast<int>(std::ceil(high / 10.0f)) * 10 + 5;
              char label[20];
              snprintf(label, sizeof(label), "%d °C", high);
              lv_label_set_text(id(lbl_trip_chart_max), label);
              snprintf(label, sizeof(label), "%d °C", low);
              lv_label_set_text(id(lbl_trip_chart_min), label);
            } else {
              const int margin = std::max(1, (high - low) / 8);
              low -= margin;
              high += margin;
            }

            auto *&chart = widget.chart;
            if (chart == nullptr) {
              chart = lv_chart_create(plot.parent);
              if (chart == nullptr) {
                lv_obj_set_hidden(plot.parent, true);
                if (plot.powertrain) lv_obj_set_hidden(id(lbl_trip_chart_empty), false);
                continue;
              }
              lv_obj_set_pos(chart, plot.powertrain ? 80 : 0, plot.powertrain ? 5 : 0);
              lv_obj_set_size(chart, plot.powertrain ? 718 : 268, plot.powertrain ? 128 : 38);
              lv_obj_set_clickable(chart, false);
              lv_obj_set_scrollable(chart, false);
              lv_obj_set_style_pad_all(chart, 0, LV_PART_MAIN);
              lv_obj_set_style_radius(chart, 0, LV_PART_MAIN);
              lv_obj_set_style_border_width(chart, plot.powertrain ? 1 : 0, LV_PART_MAIN);
              lv_obj_set_style_border_color(chart, lv_color_hex(${tab5_color_card_border}), LV_PART_MAIN);
              lv_obj_set_style_bg_color(chart, lv_color_hex(${tab5_color_background}), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(chart, plot.powertrain ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_set_style_line_color(chart, lv_color_hex(${tab5_color_card_border}), LV_PART_MAIN);
              lv_obj_set_style_line_width(chart, 1, LV_PART_MAIN);
              lv_obj_set_style_line_width(chart, 2, LV_PART_ITEMS);
              const int dot = plot.powertrain ? 5 : 3;
              lv_obj_set_style_size(chart, dot, dot, LV_PART_INDICATOR);
              lv_chart_set_type(chart, LV_CHART_TYPE_SCATTER);
              lv_chart_set_div_line_count(chart, plot.powertrain ? 5 : 4, plot.powertrain ? 7 : 5);
              lv_chart_set_point_count(chart, history.size() * 2);
            }
            lv_chart_set_axis_range(chart, LV_CHART_AXIS_PRIMARY_X, 0, std::max<uint32_t>(1, elapsed_s));
            lv_chart_set_axis_range(chart, LV_CHART_AXIS_PRIMARY_Y, low, high);
            bool plotted = false;
            for (size_t channel = 0; channel < plot.count; ++channel) {
              auto *&series = widget.series[channel];
              if (series == nullptr)
                series = lv_chart_add_series(chart, lv_color_hex(plot.colors[channel]), LV_CHART_AXIS_PRIMARY_Y);
              if (series == nullptr) continue;
              auto *x = lv_chart_get_series_x_array(chart, series);
              auto *y = lv_chart_get_series_y_array(chart, series);
              if (x == nullptr || y == nullptr) continue;
              const size_t sensor = plot.first + channel;
              int32_t held = LV_CHART_POINT_NONE;
              size_t point = 0;
              for (size_t i = 0; i < bucket_count; ++i) {
                const uint16_t value = history[i][sensor];
                const uint32_t at = sample_s[i][sensor];
                if (value == missing || at > elapsed_s) continue;
                // Draw the old value up to the time of the next retained measurement.
                if (point != 0) {
                  x[point] = at;
                  y[point++] = held;
                }
                held = value - 100;
                x[point] = at;
                y[point++] = held;
              }
              if (point != 0) {
                x[point] = elapsed_s;
                y[point++] = held;
                plotted = true;
              }
              std::fill(y + point, y + 2 * history.size(), LV_CHART_POINT_NONE);
            }
            lv_obj_set_hidden(plot.parent, !plotted);
            if (plot.powertrain) lv_obj_set_hidden(id(lbl_trip_chart_empty), plotted);
            if (plotted) lv_chart_refresh(chart);
          }

  - id: script_open_update_menu
    then:
      - lambda: |-
          if (!id(fn_service_allowed)()) return;
          id(g_update_alert_dismissed) = true;
          id(script_set_service_visible).execute(true, 0);
          id(script_sound_play).execute(1);

  - id: script_render_service_info
    then:
      - lambda: |-
          if (!id(g_logs_visible) || id(g_service_tab) != 3) return;
          auto set_text = [](lv_obj_t *label, const char *text) {
            if (std::strcmp(lv_label_get_text(label), text) != 0) lv_label_set_text(label, text);
          };
          char text[128];
          auto *compass = id(id_compass);
          const uint32_t accel_at = id(g_info_accel_at);
          const bool accel_recent = accel_at != 0 && esphome::millis() - accel_at <= 1500;
          const std::array<float, 3> accel{id(id_bmi270_accel_x).state, id(id_bmi270_accel_y).state,
                                           id(id_bmi270_accel_z).state};
          const bool accel_valid = std::all_of(accel.begin(), accel.end(), [](float value) { return std::isfinite(value); });
          const char *attitude = "BMI270 값 수신";
          if (id(tab5_imu).is_failed()) attitude = "BMI270 초기화 실패";
          else if (accel_at == 0) attitude = "BMI270 수신 대기";
          else if (!accel_recent) attitude = "BMI270 수신 끊김";
          else if (!accel_valid) attitude = "BMI270 무효 샘플";
          else if (!compass->pose_valid()) attitude = "자세 신호 대기";
          set_text(id(lbl_info_attitude_status), attitude);
          if (accel_recent && accel_valid) {
            snprintf(text, sizeof(text), "X %+.2f / Y %+.2f / Z %+.2f g", accel[0], accel[1], accel[2]);
            set_text(id(lbl_info_accel), text);
          } else {
            set_text(id(lbl_info_accel), "X -- / Y -- / Z -- g");
          }

          auto &gps = id(id_gps).get_tiny_gps();
          char satellites[12] = "--";
          char hdop[16] = "--";
          if (gps.satellites.age() <= 3000 && std::isfinite(id(id_gps_satellites).state))
            snprintf(satellites, sizeof(satellites), "%.0f", id(id_gps_satellites).state);
          if (gps.hdop.age() <= 3000 && std::isfinite(id(id_gps_hdop).state))
            snprintf(hdop, sizeof(hdop), "%.1f", id(id_gps_hdop).state);
          const bool gps_fix = id(fn_gps_receiving)(esphome::millis_64()) && id(g_gps_latest_fix);
          snprintf(text, sizeof(text), "%s / 위성 %s / HDOP %s",
                   gps_fix ? "GPS 위치 수신" : "GPS 위치 대기", satellites, hdop);
          set_text(id(lbl_info_gps_quality), text);
          if (compass->has_fix() && std::isfinite(compass->speed_kmh())) {
            snprintf(text, sizeof(text), "GPS 속도 %.1f km/h", compass->speed_kmh());
            set_text(id(lbl_info_gps_speed), text);
          } else {
            set_text(id(lbl_info_gps_speed), "GPS 속도 -- km/h");
          }

          const bool ecu_recent = std::isfinite(id(fn_sample_live)(8, id(engine_rpm).state, 5000)) ||
              std::isfinite(id(fn_sample_live)(10, id(car_speed).state, 5000));
          set_text(id(lbl_info_obd_status), !id(obd_client).connected() ? "BLE 연결 대기" :
                   ecu_recent ? "BLE 연결됨 / ECU 값 수신" : "BLE 연결됨 / ECU 응답 대기");
          const float counts[]{id(id_info_obd_timeouts).state, id(id_info_obd_no_data).state, id(id_info_obd_errors).state};
          char count_text[3][16] = {"--", "--", "--"};
          for (size_t index = 0; index < std::size(counts); ++index) {
            if (std::isfinite(counts[index]))
              snprintf(count_text[index], sizeof(count_text[index]), "%.0f", counts[index]);
          }
          snprintf(text, sizeof(text), "TIMEOUT %s / NO DATA %s / ERROR %s", count_text[0], count_text[1], count_text[2]);
          set_text(id(lbl_info_obd_counts), text);

          auto *wifi = id(tab5_wifi);
          if (wifi->is_connected()) {
            std::array<char, esphome::wifi::SSID_BUFFER_SIZE> ssid{};
            const char *network_name = wifi->wifi_ssid_to(ssid);
            snprintf(text, sizeof(text), "Wi-Fi 연결됨 / %s", network_name != nullptr && *network_name ? network_name : "--");
            set_text(id(lbl_info_wifi_status), text);
            char ip[network::IP_ADDRESS_BUFFER_SIZE] = "--";
            for (const auto &address : wifi->get_ip_addresses()) {
              if (address.is_set() && address.is_ip4()) {
                address.str_to(ip);
                break;
              }
            }
            snprintf(text, sizeof(text), "IP %s / RSSI %d dBm", ip, static_cast<int>(wifi->wifi_rssi()));
            set_text(id(lbl_info_wifi_address), text);
          } else {
            set_text(id(lbl_info_wifi_status), "Wi-Fi 연결 대기");
            set_text(id(lbl_info_wifi_address), "IP -- / RSSI --");
          }
          const auto &wifi_error = id(g_info_wifi_error);
          if (wifi_error[0] != '\0') {
            snprintf(text, sizeof(text), "최근 오류: %s", wifi_error.data());
            set_text(id(lbl_info_wifi_error), text);
          } else {
            set_text(id(lbl_info_wifi_error), "최근 오류 기록 없음");
          }

  - id: script_select_service_tab
    parameters:
      tab: int
    then:
      - lambda: |-
          if (!id(g_logs_visible) || !id(fn_service_allowed)() || tab < 0 || tab > 3) return;
          id(g_service_tab) = tab;
          id(script_sync_trip_soundtrack).execute();
          const struct {
            lv_obj_t *button;
            lv_obj_t *label;
            lv_obj_t *panel;
            const char *text;
            const char *selected;
            const char *title;
            const char *subtitle;
            const char *status;
          } tabs[] = {
            {id(btn_service_setup_tab), id(lbl_service_setup_tab), id(obj_service_setup),
                "SETUP", "[ SETUP ]", "SYSTEM SETUP", "시스템 설정", "> READY / SYSTEM SETUP"},
            {id(btn_service_log_tab), id(lbl_service_log_tab), id(obj_service_logs),
                "LOG", "[ LOG ]", "SYSTEM JOURNAL", "시스템 로그", "> READY / EVENT LOG"},
            {id(btn_service_trip_tab), id(lbl_service_trip_tab), id(obj_service_trip),
                "TRIP", "[ TRIP ]", "TRIP REPORT", "운행 리포트", ""},
            {id(btn_service_info_tab), id(lbl_service_info_tab), id(obj_service_info),
                "INFO", "[ INFO ]", "SYSTEM INFO", "시스템 정보", ""},
          };
          for (int index = 0; index < static_cast<int>(std::size(tabs)); ++index) {
            const auto &item = tabs[index];
            const bool active = index == tab;
            lv_obj_set_hidden(item.panel, !active);
            lv_label_set_text(item.label, active ? item.selected : item.text);
            lv_obj_set_style_bg_color(item.button, lv_color_hex(${tab5_color_accent}), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(item.button, active ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_MAIN);
            lv_obj_set_style_text_color(item.label, lv_color_hex(active
                ? ${tab5_color_background} : ${tab5_color_accent}), LV_PART_MAIN);
          }
          lv_label_set_text(id(lbl_service_title), tabs[tab].title);
          lv_label_set_text(id(lbl_service_subtitle), tabs[tab].subtitle);
          lv_label_set_text(id(lbl_service_status), tabs[tab].status);
          const bool trip = tab == 2;
          lv_obj_set_hidden(id(lbl_service_kicker), trip);
          lv_obj_set_y(id(lbl_service_title), trip ? 18 : 52);
          lv_obj_set_y(id(lbl_service_subtitle), trip ? 30 : 64);
          lv_obj_set_y(id(line_service_heading)->obj, trip ? 75 : 118);
          if (tab == 1) id(script_refresh_logs).execute(true, false);
          else if (tab == 2) id(script_render_trip_report).execute();
          else if (tab == 3) id(script_render_service_info).execute();
          else {
            lv_label_set_text_fmt(id(lbl_backlight_value), "%d%%",
                static_cast<int>(std::lround(id(backlight).remote_values.get_brightness() * 100.0f)));
            id(script_sound_apply).execute();
            lv_slider_set_value(id(slider_sound_volume),
                static_cast<int>(std::lround(id(g_sound_volume) * 100.0f)), LV_ANIM_OFF);
            lv_slider_set_value(id(slider_backlight),
                std::clamp(static_cast<int>(std::lround(id(backlight).remote_values.get_brightness() * 100.0f)), 10, 100), LV_ANIM_OFF);
          }

  - id: script_set_service_visible
    parameters:
      show: bool
      tab: int
    then:
      - lambda: |-
          if (show && !id(fn_service_allowed)()) return;
          id(g_logs_visible) = show;
          // g_logs_visible suppresses motion, so the journal's own fade is forced.
          fx::set_visible(id(obj_log), show, {.force = true});
          lv_obj_set_hidden(id(btn_service_log_tab), !show);
          lv_obj_set_hidden(id(btn_service_setup_tab), !show);
          lv_obj_set_hidden(id(btn_service_trip_tab), !show);
          lv_obj_set_hidden(id(btn_service_info_tab), !show);
          lv_label_set_text(id(lbl_menu_toggle), show ? "BACK" : "MENU");
          if (show) {
            fx::set_visible(id(obj_jaalee_detail), false);
            id(script_select_service_tab).execute(tab);
          } else {
            fx::set_visible(id(obj_restart_backdrop), false);
            fx::set_visible(id(obj_restart_popup), false);
            id(script_sync_trip_soundtrack).execute();
          }

  - id: script_sync_service_ui
    then:
      - lambda: |-
          const bool allowed = id(fn_service_allowed)();
          auto *menu = id(btn_logs_toggle);
          if (allowed) {
            lv_obj_remove_state(menu, LV_STATE_DISABLED);
          } else {
            lv_obj_add_state(menu, LV_STATE_DISABLED);
            if (id(g_logs_visible)) id(script_set_service_visible).execute(false, 0);
            if (id(g_alert_is_update)) fx::set_visible(id(popup_alert), false);
            fx::set_visible(id(obj_jaalee_detail), false);
          }

          lv_obj_set_hidden(id(lbl_update_badge), id(g_logs_visible) || !id(g_update_available));

  - id: script_jaalee_detail
    mode: restart
    parameters:
      bed: bool
    then:
      - lambda: |-
          id(g_jaalee_detail_bed) = bed;
          const uint32_t last = id(g_jaalee_last_seen)[bed ? 1 : 0];
          const float battery = bed ? id(id_bed_battery_level).state : id(id_cabin_battery_level).state;
          lv_label_set_text(id(lbl_jaalee_name), bed ? "적재함 Jaalee" : "실내 Jaalee");
          if (battery >= 0.0f && battery <= 100.0f) {
            lv_label_set_text_fmt(id(lbl_jaalee_battery), "배터리 %u%%", static_cast<unsigned>(std::lround(battery)));
          } else {
            lv_label_set_text(id(lbl_jaalee_battery), "배터리 --");
          }
          if (last == 0) {
            lv_label_set_text(id(lbl_jaalee_age), "수신 기록 없음");
          } else {
            const uint32_t seconds = (esphome::millis() - last) / 1000;
            lv_label_set_text_fmt(id(lbl_jaalee_age), seconds < 60 ? "마지막 수신 %u초 전" : "마지막 수신 %u분 전",
                                  static_cast<unsigned>(seconds < 60 ? seconds : seconds / 60));
          }
          fx::set_visible(id(obj_jaalee_detail), true);
      - delay: 4s
      - lambda: fx::set_visible(id(obj_jaalee_detail), false);

  - id: script_logs
    parameters:
      log: string
    then:
      - lambda: |-
          auto &logs = id(g_logs);
          const auto time = id(sntp_time).now();
          char timestamp[16];
          snprintf(timestamp, sizeof(timestamp), "[%02d:%02d:%02d] ", time.hour, time.minute, time.second);
          const char *tag = "[INFO] ";
          if (log.starts_with("Wifi ") || log.starts_with("OBD BLE ") || log.starts_with("ws_bridge ") ||
              log == "NTP Time Synced") {
            tag = "[LINK] ";
          } else if (log.starts_with("Pitch") || log.starts_with("Roll") || log.starts_with("Jaalee ")) {
            tag = "[SENS] ";
          } else if (id(g_notice_active) && log.starts_with("ALERT: ") && log != "ALERT: Dismissed") {
            tag = "[WARN] ";
          }
          size_t length = std::min(log.size(), 127 - std::strlen(timestamp));
          // Keep the existing message limit without cutting a UTF-8 character in half.
          while (length > 0 && length < log.size() &&
                 (static_cast<unsigned char>(log[length]) & 0xC0) == 0x80) {
            --length;
          }
          logs.emplace_back(std::string(timestamp) + tag + log.substr(0, length));
          if (logs.size() > 50) logs.erase(logs.begin());
          if (id(g_logs_visible)) {
            ++id(g_log_unread);
            id(script_refresh_logs).execute(false, false);
          }

  - id: script_refresh_logs
    parameters:
      follow: bool
      animate: bool
    then:
      - lambda: |-
          if (!id(g_logs_visible) || id(g_service_tab) != 1) return;
          auto &unread = id(g_log_unread);
          if (!follow && unread == 0) return;
          auto *view = id(obj_log_scroll);
          auto *latest_button = id(lbl_log_latest_button);
          if (!follow && (lv_obj_is_scrolling(view) || lv_obj_get_scroll_bottom(view) > 8)) {
            lv_label_set_text(id(lbl_log_follow), "FOLLOW: HOLD");
            // Keep the displayed snapshot stable even if the oldest buffered row was evicted.
            if (unread > 99) lv_label_set_text(latest_button, "새 로그 99+");
            else lv_label_set_text_fmt(latest_button, "새 로그 +%u", static_cast<unsigned>(unread));
            return;
          }
          unread = 0;
          lv_label_set_text(id(lbl_log_follow), "FOLLOW: ON");
          if (follow) id(g_log_highlight_pending) = false;
          lv_label_set_text(latest_button, "> 최근으로");

          const auto &logs = id(g_logs);
          std::string text;
          for (size_t i = 0; i + 1 < logs.size(); ++i) {
            if (!text.empty()) text += '\n';
            char number[16];
            snprintf(number, sizeof(number), "%03u  ", static_cast<unsigned>(i + 1));
            text += number;
            text += logs[i];
          }
          lv_label_set_text(id(lbl_log_text), text.c_str());
          lv_obj_set_hidden(id(lbl_log_text), text.empty());
          auto *latest = id(lbl_log_latest_entry);
          if (logs.empty()) lv_label_set_text(latest, "아직 기록이 없습니다.");
          else lv_label_set_text_fmt(latest, "%03u  %s", static_cast<unsigned>(logs.size()), logs.back().c_str());
          lv_label_set_text_fmt(id(lbl_log_count), "BUFFER %03u / 050", static_cast<unsigned>(logs.size()));

          lv_obj_update_layout(view);
          const int32_t bottom = lv_obj_get_scroll_bottom(view);
          const bool scroll_animated = animate && bottom > 0;
          if (scroll_animated) id(g_log_highlight_pending) = true;
          lv_obj_scroll_to_y(view, lv_obj_get_scroll_y(view) + bottom, scroll_animated ? LV_ANIM_ON : LV_ANIM_OFF);
          if (animate && !scroll_animated) fx::play(latest, id(fx_glow_260));
  - id: script_render_update_button
    parameters:
      button: lv_obj_t*
      label: lv_obj_t*
      caption: string
      color: uint32_t
      available: bool
    then:
      - lambda: |-
          lv_label_set_text(label, caption.c_str());
          lv_obj_set_style_text_color(label,
              lv_color_hex(available ? ${tab5_color_background} : color), LV_PART_MAIN);
          lv_obj_set_style_bg_color(button,
              lv_color_hex(available ? ${tab5_color_accent} : ${tab5_color_button_bg}), LV_PART_MAIN);
          lv_obj_set_style_bg_opa(button, available ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_bg_opa(button, LV_OPA_COVER, LV_STATE_PRESSED);
          lv_obj_set_style_bg_color(button,
              lv_color_hex(available ? ${tab5_color_status_ok} : ${tab5_color_button_pressed}), LV_STATE_PRESSED);

  - id: script_check_update
    # Single mode keeps manual checks serialized until success, error or timeout.
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: |-
                id(g_checking) = true;
                id(ota_update).status_clear_error();
                id(script_render_update_button).execute(id(btn_menu_update), id(lbl_btn_menu_update),
                    "버전 확인 중...", ${tab5_color_text_muted}, false);
                id(script_logs).execute("Checking for update...");
            - update.check: ota_update
            - wait_until:
                condition:
                  lambda: 'return !id(g_checking) || id(ota_update).status_has_error();'
                timeout: 65s
            - lambda: |-
                if (!id(g_checking)) return;
                id(script_update_check_failed).execute(id(ota_update).status_has_error()
                    ? "확인 실패" : "응답 지연");
          else:
            - script.execute:
                id: script_update_check_failed
                reason: "연결 없음"

  - id: script_update_check_failed
    parameters:
      reason: string
    then:
      - lambda: |-
          id(g_checking) = false;
          const bool available = id(ota_update).state == update::UPDATE_STATE_AVAILABLE;
          id(script_render_update_button).execute(id(btn_menu_update), id(lbl_btn_menu_update),
              available ? "업데이트 가능" : reason, ${tab5_color_status_warm}, available);
          id(script_logs).execute("Update check failed: " + reason);
          id(script_sound_play).execute(7);

  - id: script_set_update_available
    parameters:
      latest_ver: string
      available: bool
    then:
      - lambda: |-
          if (available && (!id(g_update_available) || latest_ver != id(g_latest_version)) &&
              id(fn_service_allowed)()) id(script_sound_play).execute(8);
          if (latest_ver != id(g_latest_version)) {
            id(g_update_alert_dismissed) = false;
          }
          id(g_latest_version) = latest_ver;
          id(g_update_available) = available;
          const bool latest = id(ota_update).state == update::UPDATE_STATE_NO_UPDATE;
          id(script_render_update_button).execute(id(btn_menu_update), id(lbl_btn_menu_update),
              available ? "업데이트 가능" : latest ? "최신 버전" : "버전 확인",
              latest ? ${tab5_color_status_ok} : ${tab5_color_text_primary}, available);
          if (available) id(script_logs).execute("Update Available: " + latest_ver);
  - id: script_tick_auto_ota
    then:
      - lambda: |-
          auto *popup = id(obj_auto_ota_popup);
          const bool visible = !lv_obj_is_hidden(popup);
          const auto &updater = *id(ota_update);
          const auto &version = updater.update_info.latest_version;
          const auto &handled = id(g_auto_ota_handled_versions);
          const float speed = id(fn_sample_live)(10, id(car_speed).state, 5000);
          const bool eligible = id(g_auto_ota_enabled) && fx::is_ready() &&
              !id(g_updating) && !id(g_ota_ui_active) && !id(g_checking) &&
              !id(script_boot_vehicle_scan).is_running() && !id(script_c6_check).is_running() &&
              lv_obj_is_hidden(id(obj_restart_popup)) &&
              id(backlight).current_values.is_on() && id(backlight).remote_values.is_on() &&
              !id(lvgl_ui).is_paused() && id(tab5_wifi).is_connected() &&
              (!std::isfinite(speed) || speed == 0.0f) &&
              updater.state == update::UPDATE_STATE_AVAILABLE && !updater.status_has_error() &&
              !version.empty() && std::find(handled.begin(), handled.end(), version) == handled.end();
          if (!eligible) {
            if (visible) lv_obj_set_hidden(popup, true);
            return;
          }

          constexpr uint32_t countdown_ms = 5000;
          constexpr uint32_t max_tick_gap_ms = 1000;
          static uint32_t last_tick = 0;
          static unsigned seconds_shown = 0;
          const uint32_t now = esphome::millis();
          // A blocked main loop also blocks touch, so restart the window after a stall.
          if (!visible || id(g_auto_ota_popup_version) != version || now - last_tick > max_tick_gap_ms) {
            id(g_auto_ota_popup_version) = version;
            seconds_shown = countdown_ms / 1000;
            lv_label_set_text_fmt(id(lbl_auto_ota_version), "새 버전 %s", version.c_str());
            lv_label_set_text_fmt(id(lbl_auto_ota_countdown), "%u", seconds_shown);
            lv_bar_set_value(id(bar_auto_ota_countdown), 100, LV_ANIM_OFF);
            lv_obj_move_foreground(popup);
            lv_obj_set_hidden(popup, false);
            lv_refr_now(nullptr);
            last_tick = id(g_auto_ota_popup_started) = esphome::millis();
            id(script_sound_play).execute(15);
            return;
          }

          last_tick = now;
          const uint32_t elapsed = now - id(g_auto_ota_popup_started);
          // Allow the LVGL input loop to handle the final tap before handing off to OTA.
          if (elapsed >= countdown_ms && seconds_shown == 0) {
            // A failed automatic attempt also waits for a manual retry or the next boot.
            id(g_auto_ota_handled_versions).push_back(version);
            lv_obj_set_hidden(popup, true);
            id(script_perform_update).execute(true);
            return;
          }
          const uint32_t remaining_ms = countdown_ms - std::min(elapsed, countdown_ms);
          lv_bar_set_value(id(bar_auto_ota_countdown), remaining_ms * 100 / countdown_ms, LV_ANIM_OFF);
          const unsigned remaining = (remaining_ms + 999) / 1000;
          if (remaining != seconds_shown) {
            seconds_shown = remaining;
            lv_label_set_text_fmt(id(lbl_auto_ota_countdown), "%u", seconds_shown);
            if (remaining > 0) id(script_sound_play).execute(15);
          }

  - id: script_ota_refresh
    then:
      - lambda: |-
          // OTA blocks the application loop. Update light outputs and render here,
          // rather than waiting for the ordinary LVGL/component loops to resume.
          id(backlight).loop();
          id(lvgl_ui).loop();
          lv_refr_now(nullptr);
          App.feed_wdt();

  - id: script_ota_prepare
    then:
      - lambda: |-
          lv_obj_set_hidden(id(obj_auto_ota_popup), true);
          if (!id(g_ota_ui_active)) {
            id(g_ota_backlight_was_on) = id(backlight).remote_values.is_on();
            id(g_ota_backlight_brightness) = id(backlight).remote_values.get_brightness();
            id(g_ota_lvgl_was_paused) = id(lvgl_ui).is_paused();
          }
          id(g_ota_ui_active) = true;
          id(g_updating) = true;
          id(script_sound_stop).execute();
          id(lvgl_ui).set_paused(false, false);
          auto light = id(backlight).turn_on();
          light.set_brightness(id(g_ota_backlight_was_on)
              ? std::max(id(g_ota_backlight_brightness), 0.1f) : 0.4f);
          light.set_transition_length(0);
          light.perform();
          lv_label_set_text(id(lbl_ota_title), "FIRMWARE UPDATE");
          lv_obj_set_style_text_color(id(lbl_ota_title), lv_color_hex(${tab5_color_accent}), LV_PART_MAIN);
          lv_label_set_text(id(lbl_ota_phase), "INITIALIZING LINK...");
          lv_label_set_text(id(lbl_ota_percent), "0%");
          lv_label_set_text(id(lbl_ota_hint), "DO NOT INTERRUPT POWER.");
          lv_bar_set_value(id(bar_ota_progress), 0, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(bar_ota_progress), lv_color_hex(${tab5_color_accent}), LV_PART_INDICATOR);
          lv_obj_set_hidden(id(btn_ota_close), true);
          lv_obj_set_hidden(id(obj_ota_overlay), false);
          lv_obj_move_foreground(id(obj_ota_overlay));
      - script.execute: script_ota_refresh

  - id: script_ota_failed
    parameters:
      reason: string
    then:
      # Cancel the pending fallback timer so a failed attempt can be retried immediately.
      - script.stop: script_perform_update
      - lambda: |-
          id(g_updating) = false;
          id(script_sound_play).execute(7);
          id(script_logs).execute(reason);
          lv_label_set_text(id(lbl_ota_title), "UPDATE FAILED");
          lv_obj_set_style_text_color(id(lbl_ota_title), lv_color_hex(${tab5_color_status_hot}), LV_PART_MAIN);
          lv_label_set_text(id(lbl_ota_phase), reason.c_str());
          lv_label_set_text(id(lbl_ota_hint), "LINK ERROR // RETURN AND RETRY");
          lv_obj_set_style_bg_color(id(bar_ota_progress), lv_color_hex(${tab5_color_status_hot}), LV_PART_INDICATOR);
          lv_obj_set_hidden(id(btn_ota_close), false);
          auto light = id(backlight).turn_on();
          light.set_brightness(id(g_ota_backlight_was_on)
              ? std::max(id(g_ota_backlight_brightness), 0.1f) : 0.4f);
          light.set_transition_length(0);
          light.perform();
      - script.execute:
          id: script_set_update_available
          latest_ver: !lambda 'return id(g_latest_version);'
          available: !lambda 'return id(g_update_available);'
      - script.execute: script_ota_refresh

  - id: script_ota_close
    then:
      - lambda: |-
          if (id(g_updating) || !id(g_ota_ui_active)) return;
          lv_obj_set_hidden(id(obj_ota_overlay), true);
          lv_refr_now(nullptr);
          auto light = id(backlight).make_call();
          light.set_state(id(g_ota_backlight_was_on));
          light.set_brightness(id(g_ota_backlight_brightness));
          light.set_transition_length(0);
          light.perform();
          id(backlight).loop();
          id(lvgl_ui).set_paused(id(g_ota_lvgl_was_paused), false);
          id(g_ota_ui_active) = false;

  # ESP32-C6 co-processor update. Reuses the firmware update overlay.
  - id: script_c6_check
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: |-
                id(script_render_update_button).execute(id(btn_c6_update), id(lbl_btn_c6_update),
                    "버전 확인 중...", ${tab5_color_text_muted}, false);
                id(script_logs).execute("Checking C6 firmware...");
            # Let the label draw before the manifest request blocks the loop.
            - delay: 50ms
            - update.check: c6_update
            - script.execute: script_c6_update_label
            - lambda: |-
                if (id(c6_update).status_has_error()) {
                  id(script_sound_play).execute(7);
                }
          else:
            - lambda: |-
                id(script_render_update_button).execute(id(btn_c6_update), id(lbl_btn_c6_update),
                    "연결 없음", ${tab5_color_status_warm}, false);
                id(script_sound_play).execute(7);

  - id: script_c6_perform
    then:
      - if:
          condition:
            lambda: 'return id(c6_update).state == update::UPDATE_STATE_AVAILABLE;'
          then:
            - lambda: id(script_logs).execute("C6 Update Triggered...");
            - update.perform: c6_update
          else:
            - script.execute: script_c6_update_label

  - id: script_c6_update_label
    then:
      - lambda: |-
          const auto &u = *id(c6_update);
          const bool available = u.state == update::UPDATE_STATE_AVAILABLE;
          const auto &current = u.update_info.current_version;
          lv_label_set_text_fmt(id(lbl_c6_curr_ver), "현재 %s",
              current.empty() || current == "unknown" ? "--" : current.c_str());
          const bool failed = u.status_has_error();
          const bool latest = u.state == update::UPDATE_STATE_NO_UPDATE;
          const bool installing = u.state == update::UPDATE_STATE_INSTALLING;
          const char *caption = available ? "업데이트 가능" : failed ? "확인 실패" :
              installing ? "업데이트 중..." : latest ? "최신 버전" : "버전 확인";
          const uint32_t color = failed ? ${tab5_color_status_warm} : installing ? ${tab5_color_text_muted} :
              latest ? ${tab5_color_status_ok} : ${tab5_color_text_primary};
          id(script_render_update_button).execute(id(btn_c6_update), id(lbl_btn_c6_update),
              caption, color, available);

  - id: script_c6_ota_begin
    then:
      - script.execute: script_ota_prepare
      - lambda: |-
          lv_label_set_text(id(lbl_ota_title), "CO-PROCESSOR UPDATE");
          lv_label_set_text(id(lbl_ota_phase), "DOWNLOADING + WRITING ESP32-C6...");
          lv_label_set_text(id(lbl_ota_percent), "C6");
          lv_label_set_text(id(lbl_ota_hint), "WI-FI / BLE PAUSED. DO NOT INTERRUPT POWER.");
          // No progress is reported during the install; show a full dim bar instead.
          lv_bar_set_value(id(bar_ota_progress), 100, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(bar_ota_progress), lv_color_hex(${tab5_color_gauge_track}), LV_PART_INDICATOR);
          id(script_logs).execute("C6 update started: " + id(c6_update).update_info.latest_version);
      - script.execute: script_ota_refresh

  - id: script_c6_ota_done
    then:
      - lambda: |-
          lv_obj_set_style_bg_color(id(bar_ota_progress), lv_color_hex(${tab5_color_accent}), LV_PART_INDICATOR);
          lv_label_set_text(id(lbl_ota_percent), "100%");
          lv_label_set_text(id(lbl_ota_phase), "C6 COMPLETE // RESTARTING...");
          lv_label_set_text(id(lbl_ota_hint), "SYSTEM RESTART IN PROGRESS...");
          id(script_logs).execute("C6 update complete; restarting");
      - script.execute: script_ota_refresh

  - id: script_perform_update
    parameters:
      automatic: bool
    then:
      - if:
          condition:
            lambda: 'return id(ota_update).state == update::UPDATE_STATE_AVAILABLE;'
          then:
            - lambda: id(script_logs).execute("OTA Update Triggered...");
            - script.execute: script_ota_prepare
            # The automatic path has just rechecked the vehicle state and refreshed the display.
            - if:
                condition:
                  lambda: 'return !automatic;'
                then:
                  - delay: 100ms
            - update.perform: ota_update
            # The fallback can run only after the blocking flash call returns.
            # Normal failures are handled immediately by on_error/on_abort below.
            - delay: 90s
            - if:
                condition:
                  lambda: 'return id(g_updating);'
                then:
                  - script.execute:
                      id: script_ota_failed
                      reason: "OTA did not complete. Retry."
          else:
            - lambda: id(script_logs).execute("OTA update is no longer available");
            - script.execute:
                id: script_set_update_available
                latest_ver: !lambda 'return id(g_latest_version);'
                available: !lambda 'return id(ota_update).state == update::UPDATE_STATE_AVAILABLE;'

# Extend the stable OTA ID generated by the external OTA tool.
# Keep lifecycle/UI callbacks outside its regenerated package.
ota:
  - id: !extend ota_http
    on_begin:
      then:
        - script.execute: script_ota_prepare
        - lambda: lv_label_set_text(id(lbl_ota_phase), "CONNECTING TO UPDATE HOST...");
        - script.execute: script_ota_refresh
    on_progress:
      then:
        - lambda: |-
            if (!std::isfinite(x)) return;
            const int progress = static_cast<int>(std::clamp(x, 0.0f, 100.0f));
            lv_bar_set_value(id(bar_ota_progress), progress, LV_ANIM_OFF);
            lv_label_set_text_fmt(id(lbl_ota_percent), "%d%%", progress);
            // 100% transferred still needs checksum/finalization; it is not success yet.
            lv_label_set_text(id(lbl_ota_phase), progress < 100 ? "WRITING FIRMWARE..." : "VERIFYING INTEGRITY...");
        - script.execute: script_ota_refresh
    on_end:
      then:
        - script.stop: script_perform_update
        - lambda: |-
            lv_bar_set_value(id(bar_ota_progress), 100, LV_ANIM_OFF);
            lv_label_set_text(id(lbl_ota_percent), "100%");
            lv_label_set_text(id(lbl_ota_phase), "COMPLETE // RESTARTING...");
            lv_label_set_text(id(lbl_ota_hint), "SYSTEM RESTART IN PROGRESS...");
            id(script_logs).execute("OTA update complete; restarting");
        - script.execute: script_ota_refresh
    on_error:
      then:
        - lambda: |-
            char reason[48];
            snprintf(reason, sizeof(reason), "OTA failed (0x%02X)", static_cast<unsigned>(x));
            id(script_ota_failed).execute(reason);
    on_abort:
      then:
        - script.execute:
            id: script_ota_failed
            reason: "OTA update aborted"


packages:
  esphome_ota:
    substitutions:
      ota_base_url: !secret esphome_ota_base_url
      ota_slug: !secret esphome_ota_cfg_example_device
    esphome:
      project:
        name: "local.esp-colorado-tab5"
        version: "261124.1"
    http_request:
      timeout: 60s

    ota:
      - platform: http_request
        id: ota_http

    safe_mode:

    update:
      - platform: http_request
        id: ota_update
        ota_id: ota_http
        name: "Firmware"
        source: "${ota_base_url}/local/esphome_ota/${ota_slug}.json"
        update_interval: 6h
