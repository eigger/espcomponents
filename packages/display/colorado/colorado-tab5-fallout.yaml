uart:
#  - id: uart_pm25
#    rx_pin: GPIO7
#    tx_pin: GPIO6
#    baud_rate: 9600
  - id: uart_gps
    rx_pin: GPIO51
    tx_pin: GPIO47
    baud_rate: 38400

gps:
  id: id_gps
  uart_id: uart_gps
  update_interval: 2s
  latitude:
    name: "GPS Latitude"
    id: id_gps_latitude
    internal: true
  longitude:
    name: "GPS Longitude"
    id: id_gps_longitude
    internal: true
  altitude:
    name: "GPS Altitude"
    id: id_gps_altitude
    internal: true
  speed:
    name: "GPS Speed"
    id: id_gps_speed
    internal: true
  satellites:
    name: "GPS Satellites"
    id: id_gps_satellites
    internal: true
    on_value:
      then:
        - lambda: id(tab5_motion_visible)(id(lbl_satellite), x >= 4, 165);
  hdop:
    name: "GPS HDOP"
    id: id_gps_hdop
    internal: true

globals:
  - id: alert_dismissed
    type: bool
    initial_value: 'false'
  - id: g_logs
    type: std::vector<std::string>
    restore_value: no
    initial_value: ''
  - id: g_initial_odometer
    type: float
    initial_value: '-1.0'
  - id: g_roll_offset
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_pitch_offset
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_logs_visible
    type: bool
    initial_value: 'false'
  - id: g_dashboard_gear
    type: float
    initial_value: 'NAN'
  # ── 발전기 저전압 지속시간 추적 (RVC 연비모드 오탐 방지: 순간전압이 아닌 지속시간으로 실고장 판정)
  - id: alt_low_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: fn_readout_text
    type: "std::string (*)(float, int)"
    initial_value: |-
      +[](float value, int decimals) -> std::string {
        if (!std::isfinite(value)) return "--";
        char text[16];
        snprintf(text, sizeof(text), "%.*f", decimals, value);
        return text;
      }
  # ── 계기판 상태 색상 ──
  - id: fn_state_color
    type: "std::function<lv_color_t(float, int)>"
    initial_value: |-
      [](float val, int mode) -> lv_color_t {
         const auto unavailable   = lv_color_hex(${tab5_color_text_muted});
         const auto cold    = lv_color_hex(${tab5_color_status_cold});
         const auto cool    = lv_color_hex(${tab5_color_status_cool});
         const auto normal  = lv_color_hex(${tab5_color_text_primary});
         const auto active  = lv_color_hex(${tab5_color_accent});
         const auto danger  = lv_color_hex(${tab5_color_status_hot});
         const auto warning = lv_color_hex(${tab5_color_status_warm});

         if (isnan(val)) return unavailable;

         if (mode == 1 || mode == 2) { // 실내 온도
           if (val < 10)  return cold;
           else if (val < 18) return cool;
           else if (val <= 26) return normal;
           else if (val <= 31) return warning;
           return danger;
         } else if (mode == 3) { // 실내 습도
           if (val < 25) return danger;
           else if (val < 40) return warning;
           else if (val <= 60) return normal;
           else if (val <= 75) return cool;
           return cold;
         } else if (mode == 15) { // 적재함 온도
           if (val < 0)  return cold;
           else if (val < 10) return cool;
           else if (val <= 30) return normal;
           else if (val <= 40) return warning;
           return danger;
         } else if (mode == 16) { // 적재함 습도
           if (val < 15) return danger;
           else if (val < 30) return warning;
           else if (val <= 70) return normal;
           else if (val <= 85) return cool;
           return cold;
         } else if (mode == 5) { // 냉각수
           if (val < 60) {
             // 워밍업 10분 이후 지속 저온만 냉온 표시
             float rt = id(engine_run_time).state;
             return (!isnan(rt) && rt >= 600) ? cold : normal;
           }
           else if (val < 95) return normal;
           else if (val < 110) return warning;
           return danger;
         } else if (mode == 6) { // 연료
           if (val > 30) return active;
           else if (val > 15) return warning;
           return danger;
         } else if (mode == 7 || mode == 20) { // 전압과 충전율/잔량 카드의 공통 기준
           const bool is_soc = mode == 20;
           const float voltage = is_soc ? id(car_battery).state : val;
           if (isnan(voltage) || voltage <= 5.0f) return unavailable;
           const auto normal_color = is_soc ? active : normal;
           const bool engine_on = id(engine_rpm).state >= 400.0f;
           if (engine_on) {
             if (voltage < 12.8f) {
               // RVC 연비모드의 순간 저전압과 3분 이상 지속되는 미충전을 구분한다.
               const bool sustained = id(alt_low_since_ms) != 0 &&
                                      esphome::millis() - id(alt_low_since_ms) >= 180000;
               return sustained ? danger : warning;
             }
             if (voltage < 13.2f) return warning;
             if (voltage <= 14.85f) return normal_color;
             return voltage <= 15.0f ? warning : danger;
           }
           if (voltage < 11.8f) return danger;
           if (voltage < 12.0f) return warning;
           return voltage <= 13.5f ? normal_color : danger;
         } else if (mode == 8) { // RPM
           if (val > 3500) return danger;
           else if (val > 2500) return warning;
           return active;
         } else if (mode == 9) { // 엔진 부하 %
           if (val > 95) return danger;
           else if (val > 75) return warning;
           return active;
         } else if (mode == 10) { // Speed (분리 수정)
           if (val > 120) return danger;
           else if (val > 110) return warning;
           else if (val > 100) return active;
           return normal;
         } else if (mode == 11) { // 운행시간 (초)
           if (val < 3600) return normal;
           if (val < 7200) return warning;
           return danger;
         } else if (mode == 12) { // TVOC — 경고 팝업 기준(3333=환기 필요)과 일치, 팝업이 red를 안 쓰므로 카드도 orange까지만
           if (val > 3333) return warning;
           return normal;
         } else if (mode == 13) { // CO2 — 경고 팝업 기준과 일치 (1500=졸음 주의, 2500=졸음 경고)
           if (val > 2500) return danger;
           else if (val > 1500) return warning;
           return normal;
         } else if (mode == 14) { // 오일 압력 (3.6L V6 공회전 15~25 PSI, 주행 40~60 PSI)
           bool engine_on = !isnan(id(engine_rpm).state) && id(engine_rpm).state >= 400.0f;
           if (!engine_on) return unavailable;
           float rpm = id(engine_rpm).state;
           if (rpm >= 1000.0f) {
             if (val < 18 || val > 80) return danger;
             else if (val < 25) return warning;
             return active;
           } else {
             if (val < 10 || val > 80) return danger;
             else if (val < 15) return warning;
             return active;
           }
         } else if (mode == 17) { // 흡기온도 — 엔진룸 흡기 공기 기준
           if (val <= 45) return normal;
           else if (val <= 60) return warning;
           return danger;
         } else if (mode == 18) { // 변속기(미션) 오일 온도 — 냉각수보다 정상 운용범위 높음
           if (val < 50) {
             // 워밍업 15분 이후 지속 저온만 냉온 표시
             float rt = id(engine_run_time).state;
             return (!isnan(rt) && rt >= 900) ? cold : normal;
           }
           else if (val <= 110) return normal;
           else if (val <= 130) return warning;
           return danger;
         } else if (mode == 19) { // 운행거리 (km)
           if (val <= 150) return normal;
           else if (val <= 300) return warning;
           return danger;
         }
         return normal;
      }

binary_sensor:
  - platform: gpio
    id: id_gps_pps
    name: "GPS PPS"
    pin:
      number: GPIO16
      mode:
        input: true
        pulldown: true
    internal: true

sensor:
  - platform: jaalee_jht
    mac_address: ${mac_cabin_jht}
    temperature:
      id: "id_cabin_temperature"
      name: "Cabin Temperature"
      internal: true
      on_value:
        then:
          - lambda: id(script_render_readout).execute(id(lbl_cabin_temperature), id(widget_img_cabin_temp), x, 2, 1, 155);
    humidity:
      id: "id_cabin_humidity"
      name: "Cabin Humidity"
      internal: true
      on_value:
        then:
          - lambda: id(script_render_readout).execute(id(lbl_cabin_humidity), id(widget_img_cabin_humidity), x, 3, 1, 155);
    battery_level:
      id: "id_cabin_battery_level"
      name: "Cabin Battery Level"
      internal: true
  - platform: jaalee_jht
    mac_address: ${mac_bed_jht}
    temperature:
      id: "id_bed_temperature"
      name: "Bed Temperature"
      internal: true
      on_value:
        then:
          - lambda: id(script_render_readout).execute(id(lbl_bed_temperature), id(widget_img_bed_temp), x, 15, 1, 155);
    humidity:
      id: "id_bed_humidity"
      name: "Bed Humidity"
      internal: true
      on_value:
        then:
          - lambda: id(script_render_readout).execute(id(lbl_bed_humidity), id(widget_img_bed_humidity), x, 16, 1, 155);
    battery_level:
      id: "id_bed_battery_level"
      name: "Bed Battery Level"
      internal: true
  - platform: ble_elm327
    reconnect_count:
      name: "ELM327 Reconnects"
      id: id_elm_reconnect_count
    timeout_count:
      name: "ELM327 Timeouts"
      id: id_elm_timeouts
    error_count:
      name: "ELM327 Error Responses"
      id: id_elm_error_responses
    no_data_count:
      name: "ELM327 NO DATA Responses"
      id: id_elm_no_data_responses
    write_failure_count:
      name: "ELM327 Write Failures"
      id: id_elm_write_failures
    response_time:
      name: "ELM327 Response Time"
      id: id_elm_response_time
  - platform: ble_elm327
    id: "engine_run_time"
    name: "Engine Run Time"
    preset: run_time
    update_interval: 5s
    internal: true
  - platform: ble_elm327
    id: "engine_coolant_temperature"
    name: "Engine Coolant Temperature"
    preset: coolant_temp
    update_interval: 10s
    internal: true
    on_value:
      then:
        - lambda: |-
            id(script_render_readout).execute(id(lbl_engine_coolant_temperature), id(widget_img_coolant), x, 5, 0, 0);
            const bool hot = std::isfinite(x) && x > 110.0f;
            id(tab5_motion_visible)(id(obj_scan_hood_hot), hot, 150);
            lv_obj_set_style_bg_color(id(obj_scan_engine_node),
                lv_color_hex(hot ? ${tab5_color_status_hot} : ${tab5_color_accent}), LV_PART_MAIN);
  - platform: ble_elm327
    id: "fuel_level"
    name: "Fuel Level"
    preset: fuel_level
    update_interval: 30s
    internal: true
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - delta: 0.5
    on_value:
      then:
        - lambda: |-
            id(script_render_gauge).execute(id(lbl_fuel_level), id(bar_fuel), id(widget_img_fuel), x, 6, 400, false);
  - platform: ble_elm327
    id: "gm_fuel_level_liters"
    name: "Fuel Level Liters"
    preset: gm_fuel_level_liters
    update_interval: 30s
    internal: true
  - platform: ble_elm327
    id: "throttle"
    name: "Throttle Position"
    preset: throttle
    update_interval: 1s
    internal: true
  - platform: ble_elm327
    id: "intake_air_temperature"
    name: "Intake Air Temperature"
    preset: intake_air_temp
    update_interval: 10s
    internal: true
    on_value:
      then:
