                  - label: { x: 28, y: 166, text: "설치 후 기기 재시작", text_font: font_service_text, text_color: "${tab5_color_text_muted}" }
                  - line: { <<: *ota_rule, x: 443, y: 71, points: ["0, 0", "0, 120"] }
                  - label: { x: 458, y: 74, width: 137, text_align: CENTER, id: lbl_auto_ota_countdown, text_font: font_ota_countdown, text_color: "${tab5_color_accent}", text: "5" }
                  - label: { x: 458, y: 164, width: 137, text_align: CENTER, text: "초 후 설치", text_font: font_service_text, text_color: "${tab5_color_text_secondary}" }
