script:
  - id: script_render_speed
    parameters:
      speed: float
    then:
      - lambda: |-
          const bool valid = std::isfinite(speed);
          const auto color = id(fn_state_color)(valid ? speed : NAN, 10);
          char text[12] = "--";
          if (valid) snprintf(text, sizeof(text), "%d", static_cast<int>(speed));
          id(tab5_motion_label_value)(id(lbl_speed), text, 0);
          lv_obj_set_style_text_color(id(lbl_speed), color, LV_PART_MAIN);
          auto *bar = id(bar_speed);
          lv_obj_set_style_bg_opa(bar, valid ? LV_OPA_COVER : LV_OPA_40, LV_PART_MAIN);
          lv_obj_set_style_bg_color(bar,
              valid && speed <= 110.0f ? lv_color_hex(${tab5_color_accent}) : color,
              LV_PART_INDICATOR);
          id(tab5_motion_bar)(bar, valid ? speed : NAN, speed < lv_bar_get_value(bar) ? 165 : 220);

  - id: script_render_prnd
    parameters:
      position: string
    then:
      - lambda: |-
          auto *label = id(lbl_prnd);
          if (position == lv_label_get_text(label)) return;
          const char *positions = "PRNDL";
          const char *slot = position.size() == 1 ? std::strchr(positions, position[0]) : nullptr;
          auto *selection = id(obj_prnd_selection);
          if (slot) {
            lv_obj_set_x(selection, 43 * (slot - positions));
            lv_obj_remove_flag(selection, LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(selection, LV_OBJ_FLAG_HIDDEN);
          }
          id(tab5_motion_prnd)(label, id(lbl_gear), position.c_str());
          id(script_render_gear).execute(false);

  - id: script_render_gear
    parameters:
      animate: bool
    then:
      - lambda: |-
          auto *label = id(lbl_gear);
          const char position = lv_label_get_text(id(lbl_prnd))[0];
          const float gear = id(g_dashboard_gear);
          const bool valid = (position == 'D' || position == 'L') &&
                             std::isfinite(gear) && gear >= 1.0f && gear < 100.0f;
          char text[4] = "-";
          if (valid) snprintf(text, sizeof(text), "%d", static_cast<int>(gear));
          const char *previous = lv_label_get_text(label);
          const bool changed = std::strcmp(previous, text) != 0;
          if (animate && !changed) return;
          const int last = std::atoi(previous);
          const auto slide = +[](void *obj, int32_t offset) {
            lv_obj_set_style_translate_y(static_cast<lv_obj_t *>(obj), offset, LV_PART_MAIN);
          };
          lv_anim_delete(label, slide);
          slide(label, 0);
          if (!changed) return;
          lv_label_set_text(label, text);
          if (!animate || !valid || !last || id(tab5_motion_notice_active) ||
              !lv_obj_has_flag(id(obj_splash), LV_OBJ_FLAG_HIDDEN) || id(g_logs_visible)) return;
          lv_anim_t motion;
          lv_anim_init(&motion);
          lv_anim_set_var(&motion, label);
          lv_anim_set_exec_cb(&motion, slide);
          lv_anim_set_values(&motion, gear > last ? 14 : -14, 0);
          lv_anim_set_duration(&motion, 140);
          lv_anim_set_path_cb(&motion, lv_anim_path_ease_out);
          lv_anim_start(&motion);

  - id: script_render_pose
    then:
      - lambda: |-
          auto *dot = id(obj_pose_dot);
          const float pitch = id(id_device_pitch).state;
          const float roll = id(id_device_roll).state;
          const auto move_x = +[](void *obj, int32_t offset) {
            lv_obj_set_style_translate_x(static_cast<lv_obj_t *>(obj), offset, LV_PART_MAIN);
          };
          const auto move_y = +[](void *obj, int32_t offset) {
            lv_obj_set_style_translate_y(static_cast<lv_obj_t *>(obj), offset, LV_PART_MAIN);
          };
          if (!std::isfinite(pitch) || !std::isfinite(roll)) {
            lv_anim_delete(dot, move_x);
            lv_anim_delete(dot, move_y);
            lv_obj_add_flag(dot, LV_OBJ_FLAG_HIDDEN);
            return;
          }
          const bool immediate = lv_obj_has_flag(dot, LV_OBJ_FLAG_HIDDEN) ||
                                 !lv_obj_has_flag(id(obj_splash), LV_OBJ_FLAG_HIDDEN);
          const auto follow = [&](lv_anim_exec_xcb_t apply, int32_t from, int32_t target) {
            const auto *active = lv_anim_get(dot, apply);
            if (!immediate && ((active && active->end_value == target) || (!active && from == target))) return;
            lv_anim_delete(dot, apply);
            if (immediate || from == target) {
              apply(dot, target);
              return;
            }
            lv_anim_t motion;
            lv_anim_init(&motion);
            lv_anim_set_var(&motion, dot);
            lv_anim_set_exec_cb(&motion, apply);
            lv_anim_set_values(&motion, from, target);
            lv_anim_set_duration(&motion, 165);
            lv_anim_set_path_cb(&motion, lv_anim_path_ease_out);
            lv_anim_start(&motion);
          };
          follow(move_x, lv_obj_get_style_translate_x(dot, LV_PART_MAIN), std::lround(-1.65f * std::clamp(pitch, -20.0f, 20.0f)));
          follow(move_y, lv_obj_get_style_translate_y(dot, LV_PART_MAIN), std::lround(1.20f * std::clamp(roll, -20.0f, 20.0f)));
          lv_obj_remove_flag(dot, LV_OBJ_FLAG_HIDDEN);

  - id: script_speed_expire
    mode: restart
    then:
      # Keep the UI fresh even if BLE is connected and the ECU stops replying.
      - delay: 5s
      - lambda: id(script_render_speed).execute(NAN);

  - id: script_splash_stage
    parameters:
      progress: int
      row: lv_obj_t*
    then:
      - lvgl.bar.update:
          id: bar_splash_progress
          value: !lambda return progress;
      - lambda: |-
          lv_label_set_text_fmt(id(lbl_splash_percent), "%03d%%", progress);
          lv_obj_remove_flag(row, LV_OBJ_FLAG_HIDDEN);
          lv_obj_update_layout(row);
          const int32_t text_width = lv_obj_get_width(lv_obj_get_child(row, 0));
          lv_anim_t reveal;
          lv_anim_init(&reveal);
          lv_anim_set_var(&reveal, row);
          lv_anim_set_exec_cb(&reveal, +[](void *obj, int32_t width) {
            lv_obj_set_width(static_cast<lv_obj_t *>(obj), width);
          });
          lv_anim_set_values(&reveal, 1, text_width + 2);
          lv_anim_set_duration(&reveal, 300);
          lv_anim_start(&reveal);

  - id: script_render_readout
    parameters:
      label: lv_obj_t*
      icon: lv_obj_t*
      value: float
      color_mode: int
      decimals: int
      fade_ms: uint32_t
    then:
      - lambda: |-
          const auto color = id(fn_state_color)(value, color_mode);
          const auto text = id(fn_readout_text)(value, decimals);
          lv_obj_set_style_text_color(label, color, LV_PART_MAIN);
          const bool accented = id(tab5_motion_icon)(icon, color, color_mode, false);
          id(tab5_motion_label_value)(label, text.c_str(), accented ? 0 : fade_ms);

  - id: script_render_gauge
    parameters:
      label: lv_obj_t*
      bar: lv_obj_t*
      icon: lv_obj_t*
      value: float
      color_mode: int
      duration: uint32_t
      force_accent: bool
    then:
      - lambda: |-
          const auto color = id(fn_state_color)(value, color_mode);
          const auto text = id(fn_readout_text)(value, 0);
          lv_obj_set_style_text_color(label, color, LV_PART_MAIN);
          id(tab5_motion_label_value)(label, text.c_str(), 0);
          id(tab5_motion_bar)(bar, value, duration);
          lv_obj_set_style_bg_color(bar, color, LV_PART_INDICATOR);
          id(tab5_motion_icon)(icon, color, color_mode, force_accent);

  - id: script_calibrate_tilt
    parameters:
      offset: float*
      angle: float
      button: lv_obj_t*
      axis: string
    then:
      - lambda: |-
          if (std::abs(*offset) > 0.0001f) {
            *offset = 0.0f;
            id(script_logs).execute(axis + " calibration cleared");
          } else {
            if (isnan(angle)) return;
            *offset = angle;
            char value[20];
            snprintf(value, sizeof(value), "%+.1f°", angle);
            id(script_logs).execute(axis + " calibrated to " + value);
          }
          id(tab5_motion_outline)(button, 205);

  - id: script_logs
    parameters:
      log: string
    then:
      - lambda: |-
          auto &logs = id(g_logs);
          const auto time = id(sntp_time).now();
          char timestamp[16];
          snprintf(timestamp, sizeof(timestamp), "[%02d:%02d:%02d] ", time.hour, time.minute, time.second);
          size_t length = std::min(log.size(), 127 - std::strlen(timestamp));
          // Preserve the log's byte limit without cutting a UTF-8 character in half.
          while (length > 0 && length < log.size() &&
                 (static_cast<unsigned char>(log[length]) & 0xC0) == 0x80) {
            --length;
          }
          logs.emplace_back(std::string(timestamp) + log.substr(0, length));
          if (logs.size() > 50) logs.erase(logs.begin());
      - lvgl.textarea.update:
          id: textarea_log
          text: !lambda |-
            std::string str;
            for (const auto &line : id(g_logs)) {
              str += line;
              if (!line.ends_with("\r\n")) str += "\r\n";
            }
            return str;
packages:
  tab5_common:
    url: https://github.com/eigger/espcomponents.git
    file: packages/display/tab5_common.yaml
    ref: master
    refresh: 0s
