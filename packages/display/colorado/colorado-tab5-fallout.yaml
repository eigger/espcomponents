  - platform: template
    name: "Roll"
    id: id_device_roll
    icon: "mdi:rotate-left"
    unit_of_measurement: "°"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 200ms
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    lambda: |-
      const uint32_t last_sample = id(g_dashboard_samples)[23];
      if (!last_sample || esphome::millis() - last_sample >= 3000) return NAN;
      float ax = id(id_bmi270_accel_x).state;
      float ay = id(id_bmi270_accel_y).state;
      float az = id(id_bmi270_accel_z).state;
      if (isnan(ax) || isnan(ay) || isnan(az)) return NAN;
      float raw = atan2(-ay, sqrt(ax*ax + az*az)) * 180.0f / (float)M_PI;
      return raw - id(g_roll_offset);
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_roll_value
            text: &tilt_text !lambda |-
              if (isnan(x)) return std::string("--");
              char buf[12]; snprintf(buf, sizeof(buf), "%+.1f°", x); return std::string(buf);
        - script.execute: script_render_pose

