                  id: lbl_jaalee_age
                  x: 12
                  y: 39
                  text: "수신 기록 없음"
                  text_font: notosans20
                  text_color: "${tab5_color_text_primary}"

        # Service content: shared 28px margins, 592px columns and 40px gutter.
        - obj:
            id: obj_log
            <<: *terminal_panel
            align: top_left
            y: 72
            width: 1280
            height: 648
            hidden: true
            clickable: true
            bg_color: "${tab5_color_background}"
            bg_opa: COVER
            widgets:
              - label: { <<: &service_kicker { <<: *terminal_heading, text_font: font_terminal_boot, text_color: "${tab5_color_text_muted}", text_letter_space: 1 }, x: 28, y: 20, text: "ROBCO INDUSTRIES (TM) TERMLINK PROTOCOL" }
              - label: { <<: *terminal_heading, id: lbl_service_title, x: 28, y: 52, text: "SYSTEM JOURNAL", text_font: font_service_title, text_color: "${tab5_color_accent}" }
              - label: { <<: *terminal_heading, id: lbl_service_subtitle, x: 420, y: 64, text: "시스템 로그", text_font: font_service_text }
              - line: { <<: &service_rule { <<: *terminal_line, line_color: "${tab5_color_accent}", line_width: 2 }, x: 28, y: 118, points: ["0, 10", "0, 0", "1223, 0", "1223, 10"] }
              - obj:
                  <<: *terminal_panel
                  id: obj_service_logs
                  x: 28
                  y: 136
                  width: 1224
                  height: 464
                  widgets:
                    - label: { <<: &log_column { <<: *terminal_heading, y: 0, text_font: font_service_text }, x: 12, text: "SEQ" }
                    - label: { <<: *log_column, x: 67, text: "TIME" }
                    - label: { <<: *log_column, x: 188, text: "TYPE" }
                    - label: { <<: *log_column, x: 265, text: "EVENT / MESSAGE" }
                    - line: { <<: *terminal_line, y: 32, points: ["0, 0", "1223, 0"] }
                    - obj:
                        <<: *terminal_panel
                        id: obj_log_scroll
                        x: 0
                        y: 36
                        width: 1224
                        height: 352
                        pad_all: 12
                        pad_right: 20
                        bg_color: "${tab5_color_background}"
                        bg_opa: COVER
                        bg_image_tiled: true
                        bg_image_opa: 4%
                        bg_image_recolor: "${tab5_color_accent}"
                        bg_image_recolor_opa: COVER
                        clickable: true
                        scrollable: true
                        scroll_dir: VER
                        scrollbar_mode: AUTO
                        layout: { type: flex, flex_flow: COLUMN, pad_row: 6 }
                        scrollbar: { bg_color: "${tab5_color_card_border}", bg_opa: COVER, width: 5, radius: 0 }
                        on_boot:
                          - lambda: |-
                              constexpr int width = 1224;
                              constexpr int height = 64;
                              static constexpr auto pixels = [] {
                                constexpr int stride = width / 8;
                                std::array<uint8_t, stride * height> mask{};
                                for (int row = 0; row < height; row += 4) {
                                  std::fill_n(mask.begin() + row * stride, stride, 0xFF);
                                }
                                return mask;
                              }();
                              static image::Image scanlines(pixels.data(), width, height, image::IMAGE_TYPE_BINARY,
                                                           image::TRANSPARENCY_OPAQUE);
                              lv_obj_set_style_bg_image_src(id(obj_log_scroll), scanlines.get_lv_image_dsc(), LV_PART_MAIN);
                        on_scroll_end:
                          - delay: 1ms
                          - lambda: |-
                              auto *view = id(obj_log_scroll);
                              if (!id(g_logs_visible) || id(g_service_setup) || lv_obj_is_scrolling(view)) return;
                              if (lv_obj_get_scroll_bottom(view) > 8) {
                                lv_label_set_text(id(lbl_log_follow), "FOLLOW: HOLD");
                                return;
                              }
                              lv_label_set_text(id(lbl_log_follow), "FOLLOW: ON");
                              id(script_refresh_logs).execute(false, false);
                              if (!id(g_log_highlight_pending)) return;
                              id(g_log_highlight_pending) = false;
                              id(tab5_motion_outline)(id(lbl_log_latest_entry), 260);
                        widgets:
                          - label:
                              <<: &log_entry
                                width: 100%
                                long_mode: WRAP
                                text_font: font_service_text
                                text_color: "${tab5_color_text_secondary}"
                                text_line_space: 4
                              id: lbl_log_text
                              hidden: true
                          - label:
                              <<: *log_entry
                              id: lbl_log_latest_entry
                              text: "아직 기록이 없습니다."
                              bg_color: "${tab5_color_accent}"
                              bg_opa: COVER
                              text_color: "${tab5_color_background}"
                              radius: 0
                              outline_width: 2
                              outline_color: "${tab5_color_accent}"
                              outline_opa: TRANSP
                    - line: { <<: *terminal_line, y: 404, points: ["0, 0", "1223, 0"] }
                    - label: { <<: *log_column, id: lbl_log_count, x: 0, y: 420, width: 240, text: "BUFFER 000 / 050" }
                    - label: { <<: *log_column, id: lbl_log_follow, x: 300, y: 420, text: "FOLLOW: ON" }
                    - button:
                        <<: &menu_button { <<: *neutral_button, align: top_left, height: 48, pad_all: 0, radius: 0, shadow_width: 0, scrollable: false, border_width: 1, border_color: "${tab5_color_card_border}", bg_opa: TRANSP }
                        id: btn_log_latest
                        x: 844
                        y: 408
                        width: 180
                        on_click:
                          - script.execute: { id: script_sound_play, cue: 3 }
                          - script.execute: { id: script_refresh_logs, follow: true, animate: true }
                        widgets:
                          - label: { <<: &menu_button_label { align: center, text_font: font_service_text, text_color: "${tab5_color_accent}" }, id: lbl_log_latest_button, y: -4, text: "> 최근으로" }
                    - button:
                        <<: *menu_button
                        id: btn_clear_logs
                        x: 1044
                        y: 408
                        width: 180
                        on_click:
                          - lambda: |-
                              id(script_sound_play).execute(3);
                              id(g_logs).clear();
                              id(script_logs).execute("Logs cleared");
                              id(script_refresh_logs).execute(true, false);
                        widgets:
                          - label: { <<: *menu_button_label, y: -4, text: "> 로그 지우기" }
              - obj:
                  <<: *terminal_panel
                  id: obj_service_setup
                  x: 28
                  y: 136
                  width: 1224
                  height: 448
                  hidden: true
                  widgets:
                    - obj:
                        <<: &setup_cell { <<: *terminal_panel, width: 592, height: 136 }
                        x: 0
                        y: 0
                        widgets:
                          - label: { <<: &setup_kicker { <<: *service_kicker, text_color: "${tab5_color_accent}" }, text: "01 / DISPLAY" }
                          - label: { <<: &setup_heading { <<: *terminal_heading, y: 28, text_font: notosans25, text_color: "${tab5_color_text_primary}" }, text: "화면 밝기" }
                          - label: { <<: *setup_heading, id: lbl_backlight_value, align: top_right, y: 22, text: "40%", text_font: notosans35, text_color: "${tab5_color_accent}" }
                          - slider:
                              id: slider_backlight
                              x: 10
                              y: 78
                              width: 572
                              height: 16
                              min_value: 10
                              max_value: 100
                              value: 40
                              bg_color: "${tab5_color_gauge_track}"
                              bg_opa: COVER
                              indicator: { bg_color: "${tab5_color_accent}", radius: 0 }
                              knob: { bg_color: "${tab5_color_text_primary}", bg_opa: COVER, pad_all: 5 }
                              on_value:
                                then:
                                  - lvgl.label.update: { id: lbl_backlight_value, text: !lambda 'return std::to_string(static_cast<int>(x)) + "%";' }
                                  - light.control: { id: backlight, brightness: !lambda 'return x / 100.0f;' }
                          - label: { <<: &setup_note { <<: *terminal_heading, y: 104, text_font: font_service_text }, text: "10 / DIM" }
                          - label: { <<: *setup_note, align: top_right, text: "100 / BRIGHT" }
                          - line: { <<: &setup_rule { <<: *terminal_line, y: 135, points: ["0, 0", "591, 0"] } }
                    - obj:
                        <<: *setup_cell
                        x: 632
                        y: 0
                        widgets:
                          - label: { <<: *setup_kicker, text: "02 / AUDIO" }
                          - label: { <<: *setup_heading, text: "사운드 음량" }
                          - label: { <<: *setup_heading, id: lbl_sound_value, align: top_right, y: 22, text: "40%", text_font: notosans35, text_color: "${tab5_color_accent}" }
                          - slider:
                              id: slider_sound_volume
                              x: 10
                              y: 78
                              width: 572
                              height: 16
                              min_value: 0
                              max_value: 100
                              value: 40
                              bg_color: "${tab5_color_gauge_track}"
                              bg_opa: COVER
                              indicator: { bg_color: "${tab5_color_accent}", radius: 0 }
                              knob: { bg_color: "${tab5_color_text_primary}", bg_opa: COVER, pad_all: 5 }
                              on_value:
                                - lambda: |-
                                    id(g_sound_volume) = std::clamp(x / 100.0f, 0.0f, 1.0f);
                                    id(script_sound_apply).execute();
                              on_release:
                                - script.execute: { id: script_sound_play, cue: 3 }
                          - label: { <<: *setup_note, text: "0 / SILENT" }
                          - label: { <<: *setup_note, align: top_right, text: "100 / LOUD" }
                          - line: { <<: *setup_rule }
                    - obj:
                        <<: *setup_cell
                        x: 0
                        y: 156
                        widgets:
                          - label: { <<: *setup_kicker, text: "03 / CALIBRATION" }
                          - label: { <<: *setup_heading, text: "자세 보정" }
                          - label: { <<: *setup_note, y: 60, text: "PITCH / ROLL OFFSET" }
                          - button:
                              <<: &setup_action_button { <<: *menu_button, y: 90, width: 592, height: 42 }
                              id: btn_reset_calibration
                              on_click:
                                - lambda: |-
                                    if (!id(fn_service_allowed)()) return;
                                    id(script_confirm_tilt_zero).stop();
                                    id(g_pitch_offset) = 0.0f;
                                    id(g_roll_offset) = 0.0f;
                                    id(script_logs).execute("Pitch/Roll calibration reset");
                                    id(script_sound_play).execute(4);
                              widgets:
                                - label: { <<: &setup_action_label { <<: *menu_button_label, text_font: notosans20, text_align: CENTER, y: -2, clickable: false }, text: "> 기울기 보정 초기화" }
                          - line: { <<: *setup_rule }
                    - obj:
                        <<: *setup_cell
                        x: 0
                        y: 312
                        widgets:
                          - label: { <<: *setup_kicker, text: "05 / FIRMWARE" }
                          - label: { <<: &setup_version_caption { <<: *setup_note, y: 28 }, text: "현재 버전" }
                          - label: { <<: &menu_version { <<: *setup_version_caption, align: top_right, width: 360, text_align: RIGHT, long_mode: DOT, text_color: "${tab5_color_text_secondary}" }, id: lbl_menu_curr_ver, text: *version }
                          - label: { <<: *setup_version_caption, y: 58, text: "업데이트" }
                          - label: { <<: *menu_version, id: lbl_menu_latest_ver, y: 58, text: "미확인", text_color: "${tab5_color_text_muted}" }
                          - button:
                              <<: *setup_action_button
                              id: btn_menu_update
                              on_click:
                                - lambda: |-
                                    if (!id(fn_service_allowed)() || id(g_updating) || id(g_checking)) return;
                                    id(script_sound_play).execute(3);
                                    if (id(ota_update).state == update::UPDATE_STATE_AVAILABLE) {
                                      id(script_perform_update).execute();
                                    } else {
                                      id(script_check_update).execute();
                                    }
                              widgets:
                                - label: { <<: *setup_action_label, id: lbl_btn_menu_update, text: "> 업데이트 확인" }
                          - line: { <<: *setup_rule }
                    - obj:
                        <<: *setup_cell
                        x: 632
                        y: 312
                        widgets:
                          - label: { <<: *setup_kicker, text: "06 / SYSTEM" }
                          - label: { <<: *setup_heading, text: "시스템 재시작" }
                          - label: { <<: *setup_note, y: 60, text: "CONFIRM BEFORE RESTART" }
                          - button:
                              <<: *setup_action_button
                              id: btn_log_restart
                              pressed: { bg_color: "${tab5_color_danger_pressed}" }
                              on_click:
                                - lambda: |-
                                    if (!id(fn_service_allowed)()) return;
                                    id(script_sound_play).execute(3);
                                    id(tab5_motion_visible)(id(obj_restart_backdrop), true, 185);
                                    id(tab5_motion_visible)(id(obj_restart_popup), true, 185);
                              widgets:
                                - label: { <<: *setup_action_label, text: "> 시스템 재시작", text_color: "${tab5_color_status_hot}" }
                          - line: { <<: *setup_rule }
                    - obj:
                        <<: *setup_cell
                        x: 632
                        y: 156
                        widgets:
                          - label: { <<: *setup_kicker, text: "04 / SOUND CONTROL" }
                          - label: { <<: *setup_heading, text: "사운드 설정" }
                          - label: { <<: *setup_note, id: lbl_sound_status, y: 60, text: "ALL SOUNDS / ENABLED" }
                          - button:
                              <<: *setup_action_button
                              id: btn_sound_mute
                              width: 286
                              on_click:
                                - lambda: |-
                                    if (!id(fn_service_allowed)()) return;
                                    id(g_sound_muted) = !id(g_sound_muted);
                                    id(script_sound_apply).execute();
                                    if (!id(g_sound_muted)) id(script_sound_play).execute(3);
                              widgets:
                                - label: { <<: *setup_action_label, id: lbl_sound_mute, text: "음소거: 꺼짐" }
                          - button:
                              <<: *setup_action_button
                              id: btn_sound_test
                              x: 306
                              width: 286
                              on_click:
                                - lambda: |-
                                    if (id(fn_service_allowed)()) id(script_sound_play).execute(4);
                              widgets:
                                - label: { <<: *setup_action_label, text: "> 테스트 재생" }
                          - line: { <<: *setup_rule }
              - label: { <<: *service_kicker, id: lbl_service_status, x: 28, y: 604, text: "> READY / EVENT LOG" }


