                  - label: { x: 28, y: 17, text: "FIRMWARE / P4", text_font: font_terminal_boot, text_color: "${tab5_color_accent}" }
                  - label: { x: 28, y: 68, text: "본체 자동 업데이트", text_font: notosans35, text_color: "${tab5_color_text_primary}" }
