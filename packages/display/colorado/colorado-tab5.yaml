  - platform: ble_elm327
    id: "car_battery"
    name: "Car Battery"
    preset: battery_voltage
    update_interval: 10s
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_car_battery
            text: !lambda |-
              if (isnan(x) || x <= 5.0f) return std::string("--");
              char buf[10]; snprintf(buf, sizeof(buf), "%.1f", x); return std::string(buf);
            text_color: !lambda return id(fn_state_color)(x, 7);
        - lvgl.widget.update:
            id: widget_img_battery
            image_recolor: !lambda return id(fn_state_color)(x, 7);
        - lambda: |-
            if (isnan(x) || x <= 5.0f) {
              id(car_battery_soc).publish_state(NAN);
              return;
            }
            float soc = 0.0f;
            bool engine_on = !isnan(id(engine_rpm).state) && id(engine_rpm).state >= 400.0f;
            if (engine_on) {
              // 시동 중: 알터네이터 충전 강도/충전율 (12.8V ~ 14.8V -> 0% ~ 100%)
              if (x <= 12.8f) soc = 0.0f;
              else soc = (x - 12.8f) / 2.0f * 100.0f;
            } else {
              // 시동 전: 12V 배터리 자체 잔량 (11.7V ~ 12.7V -> 0% ~ 100%)
              if (x <= 11.7f) soc = 0.0f;
              else if (x <= 12.7f) soc = (x - 11.7f) / 1.0f * 100.0f;
              else if (x <= 13.5f) soc = 100.0f;
              else soc = 100.0f + (x - 13.5f) * 50.0f;
            }
            if (soc > 120.0f) soc = 120.0f;
            if (soc < 0.0f) soc = 0.0f;
            id(car_battery_soc).publish_state(soc);

