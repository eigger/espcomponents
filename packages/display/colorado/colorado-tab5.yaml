.helpers:
  ver: &version !lambda 'return std::string(ESPHOME_PROJECT_VERSION);'

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  # This config intentionally uses YAML anchors with per-instance key overrides
  # (e.g. gauge_bar's max_value, gauge_value's x, info_value's text_color), which
  # is valid YAML merge-key precedence but triggers ESPHome's merge_warnings.
  merge_warnings: false
  on_boot:
    - script.execute:
        id: script_logs
        log: *version
    - script.execute:
        id: script_splash_fade_in
    - lvgl.label.update:
        id: lbl_splash_status
        text: "Initializing systems..."
    - lvgl.bar.update:
        id: bar_splash_progress
        value: 15
    - delay: 1500ms
    - lvgl.label.update:
        id: lbl_splash_status
        text: "Connecting network..."
    - lvgl.bar.update:
        id: bar_splash_progress
        value: 45
    - delay: 1500ms
    - lvgl.label.update:
        id: lbl_splash_status
        text: "Loading dashboard..."
    - lvgl.bar.update:
        id: bar_splash_progress
        value: 80
    - delay: 900ms
    - lvgl.label.update:
        id: lbl_splash_status
        text: "Ready"
    - lvgl.bar.update:
        id: bar_splash_progress
        value: 100
    - delay: 500ms
    - script.execute:
        id: script_splash_fade_out
    - lvgl.widget.hide:
        id: obj_splash
    - lvgl.widget.show:
        id: obj_header
    - lvgl.page.show:
        id: main_page
        animation: FADE_IN
        time: 500ms
    - light.turn_on:
        id: backlight
        brightness: 40%

    
logger:
  level: DEBUG
  baud_rate: 921600

safe_mode:

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Seoul
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - lvgl.widget.show:
            id: lbl_date
        - lvgl.widget.show:
            id: lbl_time
        - lambda: id(script_logs).execute("NTP Time Synced");

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_LWIP_TCPIP_TASK_STACK_SIZE: "6144"
      CONFIG_LWIP_CHECK_THREAD_SAFETY: y
      CONFIG_LWIP_TCPIP_CORE_LOCKING: n


