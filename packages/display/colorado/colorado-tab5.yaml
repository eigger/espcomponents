ws_bridge:
  host: !secret ha_address
  port: 443
  ssl: true
  token: !secret ha_token
  gateway_id: "${name}"
  name: "${friendly_name}"
  model: "Tab5"
  manufacturer: "M5Stack"
  hw_version: *version
  keep_last_state_on_disconnect: true
  sync_entities: true
  on_connected:
    then:
      - lambda: |-
          id(script_logs).execute("ws_bridge Connected");
  on_disconnected:
    then:
      - lambda: id(script_logs).execute("ws_bridge Disconnected");
  trackers:
    - name: "${friendly_name} Tracker"
      unique_id: "${name}_tracker"
      latitude: !lambda 'return id(id_gps_latitude).state;'
      longitude: !lambda 'return id(id_gps_longitude).state;'
      gps_accuracy: !lambda |-
        float h = id(id_gps_hdop).state;
        return isnan(h) ? 10.0f : (h * 2.5f);
      update_interval: 10s
      icon: "mdi:crosshairs-gps"
  entities:
    - source_id: wifi_sig
    - source_id: fuel_level
    #- source_id: throttle
    - source_id: engine_rpm
    #- source_id: engine_load
    - source_id: car_speed
    #- source_id: car_acceleration
    #- source_id: gear_position
    #- source_id: prnd_status_alt
    #- source_id: actual_torque
    #- source_id: car_battery_soc
    - source_id: engine_oil_pressure
    - source_id: transmission_temperature
    - source_id: ambient_air_temperature
    - source_id: engine_coolant_temperature
    - source_id: car_battery
    - source_id: odometer
    - source_id: trip_distance
    - source_id: id_sgp30_eco2
    - source_id: id_sgp30_tvoc
    - source_id: id_scd40_co2
    - source_id: id_scd40_temperature
    - source_id: id_scd40_humidity
    - source_id: id_tab5_internal_temperature
    - source_id: id_cabin_temperature
    - source_id: id_cabin_humidity
    - source_id: id_cabin_battery_level
    - source_id: id_bed_temperature
    - source_id: id_bed_humidity
    - source_id: id_bed_battery_level
    - source_id: engine_run_time
    - source_id: gm_fuel_level_liters
    - source_id: ota_update
    # - source_id: id_pm1_0
    # - source_id: id_pm2_5
    # - source_id: id_pm10_0
    - source_id: id_gps_speed
    - source_id: id_gps_altitude
    - source_id: id_gps_satellites
    #- source_id: id_gps_hdop
    - source_id: id_gnss_bmp280_temperature
    - source_id: id_gnss_bmp280_pressure

# api:
#   batch_delay: 1s
#   reboot_timeout: 0s

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1

wifi:
  networks:
    - ssid: !secret colorado_wifi_ssid
      password: !secret colorado_wifi_password
      priority: 10
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 5

  power_save_mode: none
  reboot_timeout: 0s
  fast_connect: true
  on_connect:
    then:
      - lambda: id(script_logs).execute("Wifi Connected");
      - lvgl.widget.show:
          id: lbl_wifi
  on_disconnect:
    then:
      - lambda: id(script_logs).execute("Wifi Disconnected");
      - lvgl.widget.hide:
          id: lbl_wifi

external_components:
  - source: github://eigger/espcomponents
    components: [ jaalee_jht, ble_elm327, bmi270, ws_bridge ]
    refresh: always

