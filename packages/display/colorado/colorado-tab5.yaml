  - file: "gfonts://Noto+Sans+KR"
    glyphs: '#()_-+@*/:;?!,.0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz월화수목금토일머운행배터리냉각부하엔진과속주의졸음경고가스환기필요급감장치열유'
    id: notosans45
    size: 45
  - file: "gfonts://Noto+Sans+KR"
    glyphs: '#()_-+@*/:;?!,.0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz머'
