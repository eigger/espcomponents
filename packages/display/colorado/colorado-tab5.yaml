interval:
  # ── 경고 팝업 제어 (1초 주기)
  - interval: 1s
    then:
      - lambda: |-
          bool a = false;
          std::string msg = "";
          uint32_t color_hex = 0xD9720A;

          float bat = id(car_battery).state;
          float rpm = id(engine_rpm).state;
          bool engine_on = !isnan(rpm) && rpm >= 400.0f;
          bool bat_valid = !isnan(bat) && bat > 5.0f;

          if (!isnan(id(car_speed).state) && id(car_speed).state > 110) { msg = "과속 주의!"; a = true; color_hex = 0xA0190F; }
          else if (!isnan(id(id_scd40_co2).state) && id(id_scd40_co2).state > 2500) { msg = "졸음 경고!"; a = true; color_hex = 0xA0190F; }
          else if (!isnan(id(id_scd40_co2).state) && id(id_scd40_co2).state > 1500) { msg = "졸음 주의!"; a = true; color_hex = 0xD9720A; }
          else if (!isnan(id(id_sgp30_tvoc).state) && id(id_sgp30_tvoc).state > 5000) { msg = "가스 주의!"; a = true; color_hex = 0xD9720A; }
          else if (!isnan(id(id_sgp30_tvoc).state) && id(id_sgp30_tvoc).state > 3333) { msg = "환기 필요!"; a = true; color_hex = 0xD9720A; }
          else if (!isnan(id(car_acceleration).state) && id(car_acceleration).state > 9.0) { msg = "급가속!"; a = true; color_hex = 0xA0190F; }
          else if (!isnan(id(car_acceleration).state) && id(car_acceleration).state < -9.0) { msg = "급감속!"; a = true; color_hex = 0xA0190F; }
          else if (!isnan(id(engine_load).state) && id(engine_load).state > 95) { msg = "엔진 과부하!"; a = true; color_hex = 0xD9720A; }
          else if (!isnan(id(id_tab5_internal_temperature).state) && id(id_tab5_internal_temperature).state > 70) { msg = "장치 과열!"; a = true; color_hex = 0xA0190F; }
          else if (bat_valid && engine_on && bat < 12.8f) { msg = "발전기 미충전!"; a = true; color_hex = 0xA0190F; }
          else if (bat_valid && engine_on && bat > 15.0f) { msg = "배터리 과충전!"; a = true; color_hex = 0xA0190F; }
          else if (bat_valid && !engine_on && bat < 11.8f) { msg = "배터리 방전 위험!"; a = true; color_hex = 0xA0190F; }
          else if (bat_valid && !engine_on && bat > 13.5f) { msg = "시동전 전압 이상!"; a = true; color_hex = 0xA0190F; }
          else if (bat_valid && engine_on && bat < 13.2f) { msg = "충전전압 낮음!"; a = true; color_hex = 0xD9720A; }
          else if (bat_valid && engine_on && bat > 14.85f) { msg = "충전전압 높음!"; a = true; color_hex = 0xD9720A; }
          else if (bat_valid && !engine_on && bat < 12.0f) { msg = "배터리 전압 낮음!"; a = true; color_hex = 0xD9720A; }
          else if (!isnan(id(fuel_level).state) && id(fuel_level).state < 10) { msg = "주유 필요!"; a = true; color_hex = 0xD9720A; }
          else if (id(parking_info).has_state() && id(parking_info).state.length() > 0 && id(parking_info).state != "unknown" && id(parking_info).state != "off") {
            msg = id(parking_info).state;
            a = true;
            color_hex = 0x2864C8;
          }

          id(alert_active) = a;
          if (!a) id(alert_dismissed) = false;

          std::string level = "주의";
          if (color_hex == 0xA0190F) level = "경고";
          else if (color_hex == 0x2864C8) level = "안내";

          id(g_alert_msg) = msg;
          id(g_alert_color) = color_hex;
          id(g_alert_level) = level;

          static std::string last_logged_msg = "";
          if (msg != last_logged_msg) {
            if (!msg.empty()) {
              id(script_logs).execute("ALERT: " + msg);
            } else {
              id(script_logs).execute("ALERT: Cleared");
            }
            last_logged_msg = msg;
          }
      - if:
          condition:
            lambda: 'return id(alert_active) && !id(alert_dismissed);'
          then:
            - lvgl.widget.show:
                id: popup_alert
            - lvgl.label.update:
                id: lbl_alert_title
                text: !lambda 'return id(g_alert_level);'
            - lvgl.label.update:
                id: lbl_alert_msg
                text: !lambda 'return id(g_alert_msg);'
            - lvgl.widget.update:
                id: popup_alert
                bg_color: !lambda 'return lv_color_hex(id(g_alert_color));'
      - if:
          condition:
            lambda: 'return !id(alert_active) || id(alert_dismissed);'
          then:
            - lvgl.widget.hide:
                id: popup_alert


text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
      icon: mdi:ip-outline
  - platform: template
    name: "Time"
    internal: true
    update_interval: 1s
    lambda: |-
      char buf[20];
      auto time = id(sntp_time).now();
      sprintf(buf, "%02d:%02d", time.hour, time.minute);
      return std::string(buf);
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_time
            text: !lambda return x;
  - platform: template
    name: "Date"
    internal: true
    update_interval: 1s
    lambda: |-
      char buf[20];
      auto time = id(sntp_time).now();
      int weekday = time.day_of_week - 1;
      const char* weekdays[] = {"일", "월", "화", "수", "목", "금", "토"};
      sprintf(buf, "%02d월 %02d일 (%s)", time.month, time.day_of_month, weekdays[weekday]);
      return std::string(buf);
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_date
            text: !lambda return x;
  - platform: template
    name: "Manufacturer Data"
    id: manufacturer_data
    icon: "mdi:package-variant-closed"
    internal: true
  - platform: template
    name: "Parking Info"
    id: parking_info
    icon: "mdi:car"
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x.length() > 0 && x != "unknown" && x != "off") {
              id(alert_dismissed) = false;
            }
            //id(ws_parking_info).publish_state(x);
#  - platform: ws_bridge
#    id: ws_parking_info
#    unique_id: parking_info
#    name: "Parking Info"
#    icon: "mdi:car"

  - platform: template
    name: "Template Engine Run Time"
    internal: true
    update_interval: 1s
    lambda: |-
      if (isnan(id(engine_run_time).state)) return std::string("--:--");
      char buf[20];
      int seconds = (int)id(engine_run_time).state;
      int minutes = seconds / 60;
      int hours = minutes / 60;
      if (hours > 0) sprintf(buf, "%d:%02d:%02d", hours, minutes % 60, seconds % 60);
      else sprintf(buf, "%02d:%02d", minutes, seconds % 60);
      return std::string(buf);
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_engine_run_time
            text: !lambda return x;
            text_color: !lambda return id(fn_state_color)(id(engine_run_time).state, 11);
        - lvgl.widget.update:
            id: widget_img_timer
            image_recolor: !lambda return id(fn_state_color)(id(engine_run_time).state, 11);

touchscreen:
  - platform: gt911
    i2c_id: bsp_bus
    interrupt_pin: GPIO23
    update_interval: never
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280
    id: touch

esp_ldo:
  - voltage: 2.5V
    channel: 3

display:
  - platform: mipi_dsi
    dimensions:
      height: 1280
      width: 720
    model: M5Stack-Tab5
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms
    internal: true

# =================================================================
# LVGL - "Focus Drive" UI
# 레이아웃 (1280 x 720 after rotation):
#   ┌─────────────────── HEADER (72px) ───────────────────────────┐
#   │  [날짜]                [아이콘]              [시간]          │
#   ├─────────────────────────────────────────────────────────────┤
#   │  L: 연료 Arc  │  C: 속도(Hero) + RPM Arc  │  R: 운행+엔진  │
#   │    (w310)     │         (w660)             │    (w310)      │
#   │               │                            │                │
#   ├─────────────────────────────────────────────────────────────┤
#   │  BOTTOM STRIP (h=95): 실내온/습│실외온/습│외기│CO2│TVOC│탑5 │
#   └─────────────────────────────────────────────────────────────┘
# =================================================================
lvgl:
  byte_order: little_endian
  rotation: 270°
  top_layer:
    widgets:
      # ── 재시작 팝업 백드롭 ──
      - obj:
          id: obj_restart_backdrop
          hidden: true
          align: center
          width: 1280
          height: 720
          bg_color: 0x000000
          bg_opa: 50%
          border_width: 0
          radius: 0
          clickable: true

      # ── 재시작 팝업 모달 ──
      - obj:
          id: obj_restart_popup
          hidden: true
          align: center
          width: 520
          height: 310
          bg_color: 0x141C26
          border_width: 1
          border_color: 0x1E2A38
          radius: 16
          pad_all: 20
          shadow_width: 30
          shadow_color: 0x000000
          shadow_opa: 50%
          widgets:
            - label:
                text: "시스템 재시작"
                align: top_mid
                y: 10
                text_color: 0xF1C36C
                text_font: notosans35
            - label:
                text: "시스템을 재시작하시겠습니까?"
                align: center
                y: -10
                text_color: 0xFFFFFF
                text_font: notosans30
            - button:
                id: btn_restart_yes
                align: bottom_left
                x: 30
                y: -10
                width: 190
                height: 65
                bg_color: 0xC85850
                radius: 8
                border_width: 0
                on_click:
                  then:
                    - switch.turn_on: sw_restart
                widgets:
                  - label:
                      text: "예"
                      align: center
                      text_color: 0xFFFFFF
                      text_font: notosans30
            - button:
                id: btn_restart_no
                align: bottom_right
                x: -30
                y: -10
                width: 190
                height: 65
                bg_color: 0x2A3542
                radius: 8
                border_width: 0
                on_click:
                  then:
                    - lvgl.widget.hide:
                        id: obj_restart_backdrop
                    - lvgl.widget.hide:
                        id: obj_restart_popup
                widgets:
                  - label:
                      text: "아니오"
                      align: center
                      text_color: 0xFFFFFF
                      text_font: notosans30

      # ── 상단 헤더 (경고는 헤더 내부 최상단 레이어) ──
      - obj:
          id: obj_header
          hidden: true
          bg_color: 0x0D1117
          border_width: 0
          border_color: 0x1E2A38
          align: top_mid
          pad_all: 0
          width: 1280
          height: 72
          x: 0
          y: 0
          widgets:
            - button:
                id: btn_logs_toggle
                align: left_mid
                x: 8
                y: 0
                width: 68
                height: 48
                bg_opa: 0%
                border_width: 0
                pad_all: 0
                outline_width: 0
                shadow_width: 0
                shadow_opa: 0%
                on_click:
                  then:
                    - lambda: |-
                        id(g_logs_visible) = !id(g_logs_visible);
                    - if:
                        condition:
                          lambda: 'return id(g_logs_visible);'
                        then:
                          - lvgl.widget.show:
                              id: obj_log
                        else:
                          - lvgl.widget.hide:
                              id: obj_log
                widgets:
                  - obj:
                      align: left_mid
                      x: 6
                      y: 0
                      width: 14
                      height: 14
                      radius: 7
                      bg_color: 0xFF5F57
                      border_width: 0
                      pad_all: 0
                      clickable: false
                  - obj:
                      align: left_mid
                      x: 26
                      y: 0
                      width: 14
                      height: 14
                      radius: 7
                      bg_color: 0xFEBC2E
                      border_width: 0
                      pad_all: 0
                      clickable: false
                  - obj:
                      align: left_mid
                      x: 46
                      y: 0
                      width: 14
                      height: 14
                      radius: 7
                      bg_color: 0x28C840
                      border_width: 0
                      pad_all: 0
                      clickable: false
            - image:
                src: img_wifi
                id: lbl_wifi
                hidden: true
                image_recolor: 0xF1C36C
                image_recolor_opa: 100%
                align: left_mid
                x: 95
                y: 0
            - image:
                src: img_bluetooth
                id: lbl_bluetooth
                hidden: true
                image_recolor: 0xF1C36C
                image_recolor_opa: 100%
                align: left_mid
                x: 160
                y: 0
            - label:
                id: lbl_version
                text: *version
                align: left_mid
                x: 225
                y: 0
                text_color: 0x7F8EA3
                text_font: notosans20
            - label:
                id: lbl_date
                hidden: true
                text: ""
                align: right_mid
                x: -135
                y: 0
                text_color: 0xF1C36C
                text_font: notosans35
            - label:
                id: lbl_time
                hidden: true
                text: ""
                align: right_mid
                x: -10
                y: 0
                text_color: 0xE8EEF7
                text_font: notosans45
            - button:
                id: popup_alert
                hidden: true
                align: center
                width: SIZE_CONTENT
                min_width: 480
                height: 72
                bg_color: 0xA0190F
                bg_opa: COVER
                radius: 14
                border_width: 1
                border_color: 0xFFFFFF
                border_opa: 28%
                pad_all: 8
                shadow_width: 16
                shadow_offset_x: 0
                shadow_offset_y: 6
                shadow_spread: 0
                shadow_color: 0x000000
                shadow_opa: 42%
                outline_width: 0
                pressed:
                  shadow_width: 4
                  shadow_offset_y: 2
                  border_opa: 18%
                on_click:
                  then:
                    - lambda: |-
                        id(alert_dismissed) = true;
                        id(script_logs).execute("ALERT: Dismissed");
                    - lvgl.widget.hide:
                        id: popup_alert
                widgets:
                  - image:
                      id: widget_img_alert
                      src: img_alert
                      align: left_mid
                      x: 8
                      image_recolor: 0xFFFFFF
                      image_recolor_opa: 100%
                  - label:
                      id: lbl_alert_title
                      text: ""
                      align: left_mid
                      x: 56
                      y: 0
                      text_color: 0xFFFFFF
                      text_font: font_alert_title
                  - label:
                      id: lbl_alert_msg
                      text: ""
                      align: left_mid
                      x: 140
                      y: 0
                      text_color: 0xFFFFFF
                      text_font: font_alert_msg

      # ── 부팅 스플래시 (obj_splash_content: 페이드 + 스피너) ──
      - obj:
          id: obj_splash
          bg_color: 0x0B0F14
          border_width: 0
          pad_all: 0
          align: center
          width: 1280
          height: 720
          widgets:
            - obj:
                id: obj_splash_content
                align: center
                width: 1280
                height: 720
                bg_opa: 0%
                border_width: 0
                pad_all: 0
                clickable: false
                opa: 0%
                widgets:
                  - label: { text: "COLORADO", align: top_mid, y: 88, text_color: 0xE6EDF8, text_font: notosans100 }
                  - label: { text: "Z71", align: center, x: -118, y: -68, text_color: 0xB14639, text_font: notosans150 }
                  - label: { text: "MIDNIGHT", align: center, x: 148, y: -48, text_color: 0xB9C6D7, text_font: notosans45 }
                  - label: { text: "${number}", align: center, y: 128, text_color: 0xF1C36C, text_font: notosans70 }
                  - label: { id: lbl_splash_status, text: "Booting...", align: bottom_mid, y: -128, text_color: 0xA9B8CA, text_font: notosans30 }
                  - bar:
                      id: bar_splash_progress
                      align: bottom_mid
                      y: -78
                      width: 680
                      height: 16
                      min_value: 0
                      max_value: 100
                      value: 0
                      bg_color: 0x1E2A38
                      indicator: { bg_color: 0xF1C36C }
                      border_width: 0
                      radius: 8
                  - spinner:
                      align: bottom_mid
                      x: -378
                      y: -78
                      width: 28
                      height: 28
                      spin_time: 800ms
                      arc_length: 90deg
                      arc_width: 3
                      bg_color: 0x1E2A38
                      indicator:
                        arc_color: 0xF1C36C
                  - label: { text: *version, align: bottom_mid, y: -38, text_color: 0x7F8EA3, text_font: notosans30 }

  pages:
    # =============================================================
    # MAIN PAGE: Focus Drive (단일 페이지)
    # =============================================================
    - id: main_page
      bg_color: 0x0B0F14
      widgets:

        # ────────────────────────────────────────────────────────
        # 좌측 패널 (x=0, w=380): 연료 Arc 게이지
        # ────────────────────────────────────────────────────────
        - obj:
            align: top_left
            x: 0
            y: 72
            width: 370
            height: 553
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              # ── RPM 카드 (progress) ──
              - obj:
                  <<: &gauge_card
                    align: top_mid
                    width: 350
                    height: 100
                    bg_color: 0x141C26
                    radius: 12
                    border_width: 1
                    border_color: 0x1E2A38
                    pad_all: 0
