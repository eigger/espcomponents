                    - label:
                        <<: &gauge_unit
                          align: top_right
                          x: -15
                          y: 22
                          text_color: 0x7F8EA3
                          text_font: notosans20
                        text: ""
                    - bar:
                        <<: &gauge_bar
                          align: bottom_mid
                          x: 0
                          y: -12
                          width: 320
                          height: 18
                          min_value: 0
                          max_value: 100
                          value: 0
                          bg_color: 0x1A2536
                          bg_opa: COVER
                          indicator:
                            bg_color: 0xF1C36C
                            bg_opa: COVER
                          radius: 10
                        id: bar_engine_rpm
                        max_value: 8000

              # ── 엔진 부하 카드 (progress) ──
              - obj:
                  <<: *gauge_card
                  y: 116
                  widgets:
                    - image:
                        <<: *gauge_icon
                        id: widget_img_load
                        src: img_load
                    - label:
                        <<: *gauge_title
                        text: "엔진부하"
                    - label:
                        <<: *gauge_value
                        id: lbl_engine_load_left
                        text: "--"
                    - label:
                        <<: *gauge_unit
                        text: "%"
                    - bar:
                        <<: *gauge_bar
                        id: bar_engine_load

              # ── 엔진 오일 압력 카드 (progress) ──
              - obj:
                  <<: *gauge_card
                  y: 226
                  widgets:
                    - image:
                        <<: *gauge_icon
                        id: widget_img_oil_pressure
                        src: img_oil_pressure
                    - label:
                        <<: *gauge_title
                        text: "오일압력"
                    - label:
                        <<: *gauge_value
                        x: -55
                        id: lbl_oil_pressure
                        text: "--"
                    - label:
                        <<: *gauge_unit
                        text: "psi"
                    - bar:
                        <<: *gauge_bar
                        id: bar_oil_pressure

              # ── 연료 카드 (progress) ──
              - obj:
                  <<: *gauge_card
                  y: 336
                  widgets:
                    - image:
                        <<: *gauge_icon
                        id: widget_img_fuel
                        src: img_fuel
                    - label:
                        <<: *gauge_title
                        text: "연료"
                    - label:
                        <<: *gauge_value
                        id: lbl_fuel_level
                        text: "--"
                    - label:
                        <<: *gauge_unit
                        text: "%"
                    - bar:
                        <<: *gauge_bar
                        id: bar_fuel

              # ── 잔량/충전율 카드 (progress) ──
              - obj:
                  <<: *gauge_card
                  y: 446
                  widgets:
                    - image:
                        <<: *gauge_icon
                        id: widget_img_battery_soc
                        src: img_car_battery
                    - label:
                        <<: *gauge_title
                        id: lbl_battery_title
                        text: "잔량"
                    - label:
                        <<: *gauge_value
                        id: lbl_battery_soc
                        text: "--"
                    - label:
                        <<: *gauge_unit
                        text: "%"
                    - bar:
                        <<: *gauge_bar
                        id: bar_battery_soc

        # ────────────────────────────────────────────────────────
        # 중앙 패널 (화면 중앙 정렬, w=540): 속도 Hero + 속도 Arc
        # ────────────────────────────────────────────────────────
        - obj:
            align: top_mid
            x: 0
            y: 72
            width: 540
            height: 553
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              # 속도 Arc (외곽 링)
              - arc:
                  id: arc_speed
                  align: top_mid
                  x: 0
                  y: 5
                  width: 440
                  height: 440
                  arc_width: 12
                  bg_color: 0x1A2536
                  arc_color: 0x1A2536
                  indicator:
                    arc_color: 0xF1C36C
                    arc_width: 12
                  min_value: 0
                  max_value: 160
                  value: 0
                  start_angle: 150
                  end_angle: 30
                  clickable: false
                  pad_all: 0
                  widgets:
                    # 기어 단수 배지 (속도 위)
                    - obj:
                        align: center
                        x: 0
                        y: -150
                        width: 160
                        height: 110
                        radius: 43
                        bg_opa: 0%
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        widgets:
                          - label:
                              id: lbl_gear
                              text: "-"
                              align: center
                              x: 0
                              y: -5
                              text_color: 0xF1C36C
                              text_font: notosans70
                    # 기어 설명 라벨 (가운데 표시)
                    - label:
                        text: "GEAR"
                        align: center
                        x: 0
                        y: -112
                        text_color: 0x7F8EA3
                        text_font: notosans16
                    # 속도 (Hero)
                    - label:
                         id: lbl_speed
                         text: "0"
                         align: center
                         y: -40
                         text_color: 0xFFFFFF
                         text_font: notosans150
                    - label:
                        text: "km/h"
                        align: center
                        y: 60
                        text_color: 0x7F8EA3
                        text_font: notosans25
                    # PRND (속도 아래)
                    - label:
                        id: lbl_prnd
                        text: "-"
                        align: center
                        y: 130
                        text_color: 0xF1C36C
                        text_font: notosans70

              # ── 인클리노미터 (차량 실루엣 듀얼 뷰) ──
              - obj:
                  id: obj_inclinometer
                  align: bottom_mid
                  x: 0
                  y: -8
                  width: 520
                  height: 95
                  bg_opa: 0%
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  widgets:
                    # === PITCH (측면뷰) ===
                    - button:
                        <<: &tilt_button
                          width: 250
                          height: 95
                          bg_color: 0x141C26
                          radius: 12
                          border_width: 1
                          border_color: 0x1E2A38
                          pad_all: 0
                          outline_width: 0
                          shadow_width: 0
                          shadow_opa: 0%
                        id: btn_pitch
                        align: left_mid
                        x: 0
                        y: 0
                        on_click:
                          then:
                            - lambda: |-
                                if (std::abs(id(g_pitch_offset)) > 0.0001f) {
                                  id(g_pitch_offset) = 0.0f;
                                  id(script_logs).execute("Pitch calibration cleared");
                                } else {
                                  float v = id(id_device_pitch).state;
                                  if (!isnan(v)) {
                                    id(g_pitch_offset) = v;
                                    char buf[64];
                                    snprintf(buf, sizeof(buf), "Pitch calibrated to %+.1f°", v);
                                    id(script_logs).execute(buf);
                                  }
                                }
                        widgets:
                          - label:
                              id: lbl_pitch_title
                              text: "PITCH"
                              align: top_mid
                              y: 4
                              text_color: 0x7F8EA3
                              text_font: notosans20
                          - image:
                              id: img_pitch_icon
                              src: img_truck_side
                              align: left_mid
                              x: 15
                              y: 5
                              image_recolor: 0xF1C36C
                              image_recolor_opa: 100%
                              rotation: 0
                              antialias: true
                          - label:
                              id: lbl_pitch_value
                              text: "0.0°"
                              align: right_mid
                              x: -15
                              y: 5
                              text_color: 0xFFFFFF
                              text_font: notosans30
                    # === ROLL (정면뷰) ===
                    - button:
                        <<: *tilt_button
                        id: btn_roll
                        align: right_mid
                        x: 0
                        y: 0
                        on_click:
                          then:
                            - lambda: |-
                                if (std::abs(id(g_roll_offset)) > 0.0001f) {
                                  id(g_roll_offset) = 0.0f;
                                  id(script_logs).execute("Roll calibration cleared");
                                } else {
                                  float v = id(id_device_roll).state;
                                  if (!isnan(v)) {
                                    id(g_roll_offset) = v;
                                    char buf[64];
                                    snprintf(buf, sizeof(buf), "Roll calibrated to %+.1f°", v);
                                    id(script_logs).execute(buf);
                                  }
                                }
                        widgets:
                          - label:
                              id: lbl_roll_title
                              text: "ROLL"
                              align: top_mid
                              y: 4
                              text_color: 0x7F8EA3
                              text_font: notosans20
                          - image:
                              id: img_roll_icon
                              src: img_truck_front
                              align: left_mid
                              x: 15
                              y: 5
                              image_recolor: 0xF1C36C
                              image_recolor_opa: 100%
                              rotation: 0
                              antialias: true
                          - label:
                              id: lbl_roll_value
                              text: "0.0°"
                              align: right_mid
                              x: -15
                              y: 5
                              text_color: 0xFFFFFF
                              text_font: notosans30

        # ────────────────────────────────────────────────────────
        # 우측 패널 (x=910, w=370): 운행시간 + 엔진 데이터
        # ────────────────────────────────────────────────────────
        - obj:
            align: top_right
            x: 0
            y: 72
            width: 370
            height: 553
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              # ── 운행 시간 카드 (Primary) ──
              - obj:
                  <<: &info_card
                    align: top_mid
                    width: 350
                    height: 80
                    bg_color: 0x141C26
                    radius: 12
                    border_width: 1
                    border_color: 0x1E2A38
                    pad_all: 0
                  y: 10
                  widgets:
                    - image: { <<: &info_icon { align: left_mid, x: 10, image_recolor_opa: 100% }, id: widget_img_timer, src: img_timer, image_recolor: 0xF1C36C }
                    - label: { <<: &info_title { align: left_mid, x: 65, text_color: 0x7F8EA3, text_font: notosans30 }, text: "운행" }
                    - label: { <<: &info_value { align: right_mid, text_color: 0xF7FBFF, text_font: notosans45 }, id: lbl_engine_run_time, text: "", x: -15, text_color: 0x7F8EA3 }

              # ── 운행거리 카드 (신설) ──
              - obj:
                  <<: *info_card
                  y: 100
                  widgets:
                    - image: { <<: *info_icon, id: widget_img_trip, src: img_odometer, image_recolor: 0x7F8EA3 }
                    - label: { <<: *info_title, text: "운행거리" }
                    - label: { <<: *info_value, id: lbl_trip_distance, text: "--", x: -65 }
                    - label: { <<: &info_unit { align: right_mid, x: -15, text_color: 0x7F8EA3, text_font: notosans20 }, text: "km" }

              # ── 냉각수 온도 카드 ──
              - obj:
                  <<: *info_card
                  y: 190
                  widgets:
                    - image: { <<: *info_icon, id: widget_img_coolant, src: img_coolant, image_recolor: 0x7F8EA3 }
                    - label: { <<: *info_title, text: "냉각수" }
                    - label: { <<: *info_value, id: lbl_engine_coolant_temperature, text: "--", x: -48 }
                    - label: { <<: *info_unit, text: "°C" }

              # ── 미션 온도 카드 ──
              - obj:
                  <<: *info_card
                  y: 280
                  widgets:
                    - image: { <<: *info_icon, id: widget_img_trans_temp, src: img_oil_temp, image_recolor: 0x7F8EA3 }
                    - label: { <<: *info_title, text: "미션온도" }
                    - label: { <<: *info_value, id: lbl_transmission_temperature, text: "--", x: -48 }
                    - label: { <<: *info_unit, text: "°C" }

              # ── 흡기 온도 카드 ──
              - obj:
                  <<: *info_card
                  y: 370
                  widgets:
                    - image: { <<: *info_icon, id: widget_img_intake, src: img_thermometer_lines, image_recolor: 0x7F8EA3 }
                    - label: { <<: *info_title, text: "흡기온도" }
                    - label: { <<: *info_value, id: lbl_intake_temp_display, text: "--", x: -48 }
                    - label: { <<: *info_unit, text: "°C" }

              # ── 전압 카드 ──
              - obj:
                  <<: *info_card
                  y: 460
                  widgets:
                    - image: { <<: *info_icon, id: widget_img_battery, src: img_car_battery, image_recolor: 0x7F8EA3 }
                    - label: { <<: *info_title, text: "전압" }
                    - label: { <<: *info_value, id: lbl_car_battery, text: "--", x: -42 }
                    - label: { <<: *info_unit, text: "V" }


        # ────────────────────────────────────────────────────────
        # 하단 환경 스트립 (y=625, h=95)
        # 3개 카드: 실내 환경 | 적재함 환경 | 공기질
        # ────────────────────────────────────────────────────────
        - obj:
            align: bottom_left
            x: 0
            y: 0
            width: 1280
            height: 95
            bg_color: 0x0D1117
            border_width: 0
            border_color: 0x1E2A38
            pad_all: 0
            widgets:
              # 1. 실내 환경 (온습도 병합)
              - obj:
                  <<: &env_card
                    width: 406
                    height: 90
                    bg_color: 0x141C26
                    radius: 12
                    border_width: 1
                    border_color: 0x1E2A38
                    pad_all: 0
                  align: left_mid
                  x: 10
                  widgets:
                    - image: { <<: &env_icon { align: left_mid, y: -16, image_recolor: 0xF1C36C, image_recolor_opa: 100% }, id: widget_img_cabin_temp, src: img_thermometer_sm, x: 20 }
                    - label: { <<: &env_label { align: left_mid, y: -16, text_color: 0x7F8EA3, text_font: notosans25 }, text: "실내온도", x: 65 }
                    - label: { <<: &env_value { align: right_mid, y: 15, text_color: 0xFFFFFF, text_font: notosans30 }, id: lbl_cabin_temperature, text: "--", x: -250 }
                    - label: { <<: &env_unit { align: left_mid, y: 18, text_color: 0x7F8EA3, text_font: notosans16 }, text: "°C", x: 165 }
                    - image: { <<: *env_icon, id: widget_img_cabin_humidity, src: img_water_sm, x: 220 }
                    - label: { <<: *env_label, text: "실내습도", x: 265 }
                    - label: { <<: *env_value, id: lbl_cabin_humidity, text: "--", x: -50 }
                    - label: { <<: *env_unit, text: "%", x: 365 }
              # 2. 적재함 환경 (온습도 병합)
              - obj:
                  <<: *env_card
                  align: center
                  x: 0
                  widgets:
                    - image: { <<: *env_icon, id: widget_img_bed_temp, src: img_thermometer_sm, x: 20 }
                    - label: { <<: *env_label, text: "적재함온도", x: 65 }
                    - label: { <<: *env_value, id: lbl_bed_temperature, text: "--", x: -250 }
                    - label: { <<: *env_unit, text: "°C", x: 165 }
                    - image: { <<: *env_icon, id: widget_img_bed_humidity, src: img_water_sm, x: 220 }
                    - label: { <<: *env_label, text: "적재함습도", x: 265 }
                    - label: { <<: *env_value, id: lbl_bed_humidity, text: "--", x: -50 }
                    - label: { <<: *env_unit, text: "%", x: 365 }
              # 3. 공기질 (CO2, TVOC 병합)
              - obj:
                  <<: *env_card
                  align: right_mid
                  x: -10
                  widgets:
                    - image: { <<: *env_icon, id: widget_img_cabin_co2, src: img_co2_sm, x: 20 }
                    - label: { <<: *env_label, text: "CO2", x: 65 }
                    - label: { <<: *env_value, id: lbl_cabin_co2, text: "--", x: -250 }
                    - label: { <<: *env_unit, text: "ppm", x: 165 }
                    - image: { <<: *env_icon, id: widget_img_cabin_tvoc, src: img_tvoc_sm, x: 220 }
                    - label: { <<: *env_label, text: "TVOC", x: 265 }
                    - label: { <<: *env_value, id: lbl_cabin_tvoc, text: "--", x: -50 }
                    - label: { <<: *env_unit, text: "ppb", x: 365 }

        # 로그 (개발용, 숨김)
        - obj:
            id: obj_log
            hidden: true
            bg_color: 0x0D1117
            border_width: 0
            radius: 0
            align: top_left
            x: 0
            y: 72
            width: 1280
            height: 648
            pad_all: 0
            scrollbar_mode: "OFF"
            scrollable: false
            widgets:
              - textarea:
                  id: textarea_log
                  align: top_left
                  x: 0
                  y: 0
                  one_line: false
                  text_color: 0xD5DFED
                  text_font: notosans20
                  width: 1000
                  height: 100%
                  bg_color: 0x0D1117
                  border_width: 0
                  scrollbar_mode: "OFF"
                  scrollable: false
              - obj:
                  id: obj_log_menu_panel
                  align: top_right
                  x: 0
                  y: 0
                  width: 275
                  height: 100%
                  bg_color: 0x0D1117
                  border_width: 0
                  radius: 0
                  pad_all: 15
                  scrollbar_mode: "OFF"
                  scrollable: false
                  widgets:
                    - label:
                        text: "화면 밝기"
                        align: top_left
                        x: 10
                        y: 20
                        text_color: 0x7F8EA3
                        text_font: notosans30
                    - slider:
                        id: slider_backlight
                        align: top_mid
                        y: 75
                        width: 240
                        height: 20
                        min_value: 10
                        max_value: 100
                        value: 40
                        bg_color: 0x1A2536
                        bg_opa: COVER
                        indicator:
                          bg_color: 0xF1C36C
                          bg_opa: COVER
                        knob:
                          bg_color: 0xFFFFFF
                          bg_opa: COVER
                        on_value:
                          then:
                            - light.control:
                                id: backlight
                                brightness: !lambda 'return x / 100.0f;'
                    - button:
                        id: btn_reset_calibration
                        align: top_mid
                        y: 135
                        width: 250
                        height: 65
                        bg_color: 0x2A3542
                        radius: 8
                        border_width: 0
                        on_click:
                          then:
                            - lambda: |-
                                id(g_pitch_offset) = 0.0f;
                                id(g_roll_offset) = 0.0f;
                                id(script_logs).execute("Pitch/Roll calibration reset");
                        widgets:
                          - label:
                              text: "기울기 보정 초기화"
                              align: center
                              text_color: 0xFFFFFF
                              text_font: notosans30
                    - button:
                        id: btn_clear_logs
                        align: top_mid
                        y: 220
                        width: 250
                        height: 65
                        bg_color: 0x2A3542
                        radius: 8
                        border_width: 0
                        on_click:
                          then:
                            - lambda: |-
                                id(g_logs).clear();
                                id(script_logs).execute("Logs cleared");
                        widgets:
                          - label:
                              text: "로그 기록 지우기"
                              align: center
                              text_color: 0xFFFFFF
                              text_font: notosans30
                    - button:
                        id: btn_log_restart
                        align: bottom_mid
                        y: -20
                        width: 250
                        height: 65
                        bg_color: 0xC85850
                        radius: 8
                        border_width: 0
                        on_click:
                          then:
                            - lvgl.widget.show:
                                id: obj_restart_backdrop
                            - lvgl.widget.show:
                                id: obj_restart_popup
                        widgets:
                          - label:
                              text: "시스템 재시작"
                              align: center
                              text_color: 0xFFFFFF
                              text_font: notosans30

