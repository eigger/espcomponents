  - id: pi4ioe1
    i2c_id: bsp_bus
    address: 0x43
  - id: pi4ioe2
    i2c_id: bsp_bus
    address: 0x44

globals:
  - id: alert_dismissed
    type: bool
    initial_value: 'false'
  - id: alert_active
    type: bool
    initial_value: 'false'
  - id: g_logs
    type: std::vector<std::string>
    restore_value: no
    initial_value: ''
  - id: g_alert_msg
    type: std::string
    initial_value: '""'
  - id: g_alert_color
    type: uint32_t
    initial_value: '0'
  - id: g_alert_level
    type: std::string
    initial_value: '""'
  - id: g_initial_odometer
    type: float
    initial_value: '-1.0'
  - id: g_roll_offset
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_pitch_offset
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_logs_visible
    type: bool
    initial_value: 'false'
  # ── 텍스트 색상 함수 (버그 수정: mode 8/10 분리)
  - id: fn_state_color
    type: "std::function<lv_color_t(float, int)>"
    initial_value: |-
      [](float val, int mode) -> lv_color_t {
         lv_color_t c_gray   = lv_color_hex(0x7F8EA3);
         // 대시보드 톤(회청·골드 악센트)에 맞춘 뮤트 팔레트 — 순색 피함
         lv_color_t c_blue   = lv_color_hex(0x7A9DB8);
         lv_color_t c_white  = lv_color_hex(0xFFFFFF);
         lv_color_t c_yellow = lv_color_hex(0xF1C36C);
         lv_color_t c_red    = lv_color_hex(0xC85850);
         lv_color_t c_orange = lv_color_hex(0xD9A060);

         if (isnan(val)) return c_gray;

         if (mode == 1 || mode == 2) { // 일반/실내(캐빈) 온도 — 사람이 머무는 공간 쾌적 범위
           if (val < 12)  return c_blue;
           else if (val <= 28) return c_white;
           else if (val <= 32) return c_orange;
           return c_red;
         } else if (mode == 3) { // 실내(캐빈) 습도 — 40~60% 쾌적 기준 (건조=빨강, 습함=파랑)
           if (val < 30) return c_red;
           else if (val <= 65) return c_white;
           else if (val <= 80) return c_orange;
           return c_blue;
         } else if (mode == 15) { // 적재함 온도 — 캠핑장비 보관용, 실내보다 넓은 허용범위
           if (val < 0)  return c_blue;
           else if (val <= 35) return c_white;
           else if (val <= 40) return c_orange;
           return c_red;
         } else if (mode == 16) { // 적재함 습도 — 비가열 공간, 실내보다 넓은 허용범위 (건조=빨강, 습함=파랑)
           if (val < 20) return c_red;
           else if (val <= 85) return c_white;
           else if (val <= 95) return c_orange;
           return c_blue;
         } else if (mode == 5) { // 냉각수 / 미션 오일
           if (val < 60)  return c_blue;
           else if (val < 95) return c_white;
           else if (val < 110) return c_yellow;
           return c_red;
         } else if (mode == 6) { // 연료 (정상=골드, 예전 아크 F1C36C 와 통일)
           if (val > 30) return c_yellow;
           else if (val > 15) return c_orange;
           return c_red;
         } else if (mode == 7) { // 배터리
           if (val <= 5.0f) return c_gray; // 무효값/연결불가 (회색)
           bool engine_on = !isnan(id(engine_rpm).state) && id(engine_rpm).state >= 400.0f;
           if (engine_on) { // 시동 후 (발전기 동작 중)
             if (val < 12.8f) return c_red;         // 발전기 미충전
             else if (val < 13.2f) return c_orange; // 충전전압 낮음
             else if (val <= 14.85f) return c_white;  // 정상 충전 범위 (13.2V~14.8V)
             else if (val <= 15.0f) return c_orange; // 충전전압 높음
             return c_red;                          // 발전기 과충전
           } else { // 시동 전
             if (val < 11.8f) return c_red;         // 방전 위험
             else if (val < 12.0f) return c_orange; // 시동전 저전압
             else if (val <= 13.5f) return c_white;  // 정상 전압 (12.0V~13.5V)
             return c_red;                          // 시동전 전압 이상 (고전압)
           }
         } else if (mode == 8) { // RPM
           if (val > 3500) return c_red;
           else if (val > 2500) return c_orange;
           return c_yellow;
         } else if (mode == 9) { // 엔진 부하 %
           if (val > 95) return c_red;
           else if (val > 75) return c_orange;
           return c_yellow;
         } else if (mode == 10) { // Speed (분리 수정)
           if (val > 120) return c_red;
           else if (val > 100) return c_yellow;
           return c_white;
         } else if (mode == 11) { // 운행시간 (초): 10분 미만 파랑, 10분~1시간 흰, 1~2시간 주황, 2시간+ 빨강
           if (val < 600) return c_blue;
           if (val < 3600) return c_white;
           if (val < 7200) return c_orange;
           return c_red;
         } else if (mode == 12) { // TVOC — 경고 팝업 기준(3333=환기 필요)과 일치, 팝업이 red를 안 쓰므로 카드도 orange까지만
           if (val > 3333) return c_orange;
           return c_white;
         } else if (mode == 13) { // CO2 — 경고 팝업 기준과 일치 (1500=졸음 주의, 2500=졸음 경고)
           if (val > 2500) return c_red;
           else if (val > 1500) return c_orange;
           return c_white;
         } else if (mode == 14) { // 오일 압력
           if (val < 15 || val > 80) return c_red;
           return c_yellow;
         } else if (mode == 17) { // 흡기온도 — 엔진룸 흡기 공기 기준
           if (val < 0)  return c_blue;
           else if (val <= 45) return c_white;
           else if (val <= 60) return c_orange;
           return c_red;
         } else if (mode == 18) { // 변속기(미션) 오일 온도 — 냉각수보다 정상 운용범위 높음
           if (val < 60)  return c_blue;
           else if (val <= 110) return c_white;
           else if (val <= 130) return c_orange;
           return c_red;
         } else if (mode == 19) { // 운행거리(km): 50 미만 파랑, 50~150 흰색, 150~300 주황, 300+ 빨강 — 운행시간과 같은 피로도 축
           if (val < 50) return c_blue;
           else if (val <= 150) return c_white;
           else if (val <= 300) return c_orange;
           return c_red;
          } else if (mode == 20) { // 배터리 충전율(SOC) %
            if (val > 100) return c_red;          // 100% 초과: 과충전 (빨강)
            else if (val < 25) return c_red;     // 25% 미만: 충전율 심각 부족 (빨강)
            else if (val < 50) return c_orange;  // 25%~50%: 충전율 낮음 (주황)
            return c_yellow;                     // 일반 정상 범위 50%~100% (골드)
          }
         return c_white;
      }
switch:
  - platform: restart
    name: "Restart"
    id: sw_restart
  - platform: safe_mode
    name: "Restart Safemode"
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON
    internal: true
  - platform: gpio
    id: usb_5v_power
    name: "USB Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
    internal: true
  - platform: gpio
    id: quick_charge
    name: "Quick Charge"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 5
      inverted: true
    internal: true
  - platform: gpio
    id: charge_enable
    name: "Charge Enable"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 7
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: wifi_antenna_int_ext
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0
    internal: true
  - platform: gpio
    id: speaker_enable
    name: "Speaker Enable"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: external_5v_power
    name: "External 5V Power"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 2
    restore_mode: ALWAYS_ON
    internal: true
  #- platform: gpio
  #  id: pm25_sensor_enable
  #  name: "PM2.5 Sensor Enable"
  #  pin: GPIO48
  #  restore_mode: ALWAYS_ON
  #  internal: true

binary_sensor:
  # - platform: status
  #   name: "Status"

  - platform: gpio
    id: charging
    name: "Charging Status"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 6
      mode: INPUT_PULLDOWN
    internal: true
  - platform: gpio
    id: headphone_detect
    name: "Headphone Detect"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 7
    internal: true
  - platform: gpio
    id: id_gps_pps
    name: "GPS PPS"
    pin:
      number: GPIO16
      mode:
        input: true
        pulldown: true
    internal: true

select:
  - platform: template
    id: wifi_antenna_select
    name: "WiFi Antenna"
    options:
      - "Internal"
      - "External"
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: return i == 0;
          then:
            - switch.turn_off: wifi_antenna_int_ext
          else:
            - switch.turn_on: wifi_antenna_int_ext
    internal: true

sensor:
  - platform: uptime
    id: uptime_sec
    name: "System Uptime"
    update_interval: 1s
    internal: true


  - platform: wifi_signal
    name: "WiFi signal"
    icon: mdi:wifi-arrow-up-down
    update_interval: 60s
    internal: true
    id: wifi_sig
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15
  - platform: template
    name: "WiFi Quality"
    id: wifi_quality
    internal: true
    icon: "mdi:wifi"
    update_interval: 60s
    unit_of_measurement: '%'
    entity_category: "diagnostic"
    state_class: measurement
    accuracy_decimals: 0
    lambda: !lambda |-
      float dBm = id(wifi_sig).state;
      if (isnan(dBm)) return -1;
      if (dBm <= -100) return 0;
      if (dBm >= -50) return 100;
      return round(2 * (dBm + 100));
  - platform: ina226
    i2c_id: bsp_bus
    address: 0x41
    adc_averaging: 16
    max_current: 8.192A
    shunt_resistance: 0.005ohm
    bus_voltage:
      name: Battery Voltage
      internal: true
    current:
      name: Battery Current
      internal: true
  - platform: internal_temperature
    name: "Internal Temperature"
    id: "id_tab5_internal_temperature"
    internal: true
    update_interval: 5min
    filters:
      - filter_out: nan
      - heartbeat: 15s
      - sliding_window_moving_average:
          window_size: 30
          send_every: 1
          send_first_at: 1
  - platform: jaalee_jht
    mac_address: ${mac_cabin_jht}
    temperature:
      id: "id_cabin_temperature"
      name: "Cabin Temperature"
      internal: true
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_cabin_temperature
              text: !lambda |-
                if (isnan(x)) return std::string("--");
                char buf[10]; snprintf(buf, sizeof(buf), "%.1f", x); return std::string(buf);
              text_color: !lambda return id(fn_state_color)(x, 2);
          - lvgl.widget.update:
              id: widget_img_cabin_temp
              image_recolor: !lambda return id(fn_state_color)(x, 2);
    humidity:
      id: "id_cabin_humidity"
      name: "Cabin Humidity"
      internal: true
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_cabin_humidity
              text: !lambda |-
                if (isnan(x)) return std::string("--");
                char buf[10]; snprintf(buf, sizeof(buf), "%.1f", x); return std::string(buf);
              text_color: !lambda return id(fn_state_color)(x, 3);
