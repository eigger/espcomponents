ble_client:
  - mac_address: ${mac_vlinker}
    id: obd_client
    on_connect:
      then:
        - lvgl.widget.show:
            id: lbl_bluetooth
        - lambda: id(script_logs).execute("OBD BLE Connected");
    on_disconnect:
      then:
        - lvgl.widget.hide:
            id: lbl_bluetooth
        - lambda: id(script_logs).execute("OBD BLE Disconnected");

ble_elm327:
  id: obd_elm
  ble_client_id: obd_client
  service_uuid: "18F0"
  rx_char_uuid: "2AF0"
  tx_char_uuid: "2AF1"
  init_commands:
    - "ATSP6"
  tx_delay: 50

psram:
  mode: hex
  speed: 200MHz

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz
    scan: false
  - id: ext_bus
    sda: GPIO53
    scl: GPIO54
    scan: false

